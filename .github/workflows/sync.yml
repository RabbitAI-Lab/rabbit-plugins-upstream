name: Sync upstream skills

on:
  schedule:
    # 每天 UTC 07:23（北京时间 15:23），避开整点
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "同步哪个来源"
        type: choice
        options: [all, clawhub, skills-sh, hermes]
        default: all
      max_items:
        description: "本轮每个来源最多处理的 skill 数"
        default: "3000"
      enum_pages:
        description: "ClawHub 枚举页数（all=全量，默认每日40页/周一全量）"
        default: ""

permissions:
  contents: write
  pull-requests: write

env:
  SYNC_MAX_ITEMS: ${{ inputs.max_items || '3000' }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  sync:
    # 三个来源并行：状态文件（sync-state/<source>.json）、内容目录（skills/<source>/）、
    # 索引（index/<source>.json）与 PR 分支（sync/<source>/<date>）均按源隔离，互不冲突。
    strategy:
      fail-fast: false
      matrix:
        source: [clawhub, skills-sh, hermes]
    concurrency:
      group: sync-upstream-${{ matrix.source }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SOURCE_SELECTED: ${{ github.event_name == 'schedule' || inputs.source == 'all' || inputs.source == matrix.source }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure enumeration depth
        # ClawHub 枚举按最近活跃排序：每周一全量枚举（覆盖下架删除与深层变更），
        # 其余日子只看最新 40 页（约 4000 条，覆盖每日 3000 条更新额度）
        run: |
          PAGES="${{ inputs.enum_pages }}"
          if [ -z "$PAGES" ]; then
            if [ "$(date -u +%u)" = "1" ]; then PAGES=all; else PAGES=40; fi
          fi
          echo "clawhub 枚举深度: $PAGES"
          if [ "$PAGES" != "all" ]; then
            echo "SYNC_ENUM_PAGES=$PAGES" >> "$GITHUB_ENV"
          fi

      - name: Sync ${{ matrix.source }}
        if: ${{ env.SOURCE_SELECTED == 'true' }}
        run: node scripts/sync-${{ matrix.source }}.mjs

      - name: Build index
        if: ${{ env.SOURCE_SELECTED == 'true' }}
        run: node scripts/build-index.mjs ${{ matrix.source }}

      - name: Create PR with changes
        if: ${{ env.SOURCE_SELECTED == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SRC: ${{ matrix.source }}
        run: |
          set -e
          if [ -z "$(git status --porcelain)" ]; then
            echo "无变更，不开 PR"
            exit 0
          fi
          DATE=$(date -u +%Y%m%d)
          BRANCH="sync/$SRC/$DATE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "sync($SRC): upstream skills $DATE"
          git push -f origin "$BRANCH"
          if gh pr view "$BRANCH" >/dev/null 2>&1; then
            echo "PR 已存在，已强推更新: $BRANCH"
          else
            STAT=$(git diff --stat main..."$BRANCH" | tail -5)
            gh pr create --base main --head "$BRANCH" \
              --title "sync($SRC): 上游更新 $DATE" \
              --body "自动同步 **$SRC** 上游 skills。

          ⚠️ skill 内容本质是 prompt 与脚本，合并前请审查变更。

          \`\`\`
          $STAT
          \`\`\`"
          fi
