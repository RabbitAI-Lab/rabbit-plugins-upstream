name: bid-dup-check
display_name: 标书查重专家
version: 1.1.0
author: 一线评标专家&ChesaraM
description: 标书查重与围串标风险初筛助手。当用户上传多份投标或招标文件需要检测文本雷同、关键信息（公司/电话/项目经理/造价师等）碰撞、文档属性一致、表格相似或两份文档差异比对时使用。基于大模型语义比对，输出含风险等级与定位的结构化检测报告，并支持导出 Word。适用于投标人自检与招标人初步筛查，不适用于评标委员会正式判定。
type: skill
triggers:
  - 检查这几份标书有没有雷同 / 抄袭
  - 这几份投标文件是不是串标 / 围标
  - 对比两份标书，标出增删改
  - 生成标书查重检测报告
feedback:
  channel: 微信公众号
  account: 一线评标专家
  note: 使用问题、误报反馈、实务建议，欢迎关注公众号「一线评标专家」留言交流
