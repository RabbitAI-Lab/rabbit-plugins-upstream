name: 创意策源引擎
version: 2.0.1
description: |
  多Agent并行辩论式创意决策引擎。
  输入模糊创意→三独立视角(建构/解构/数据锚定)并行分析
  →Critic+Defender交叉验证→20分制量化评分
  →可执行策划案+Skill双格式输出。
  5阶段流水线·3Agent并行·内置质量闭环·跨项目知识积累。
