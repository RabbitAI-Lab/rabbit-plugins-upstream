body: "## Propósito\nDefinir cuándo y cómo activar/desactivar el sandbox Docker para\
  \ coder, dev y security, y los modos válidos de aislamiento en OpenClaw.\n\n## Disparador\n\
  - Test de docker-compose nuevo, deploy de prerequisitos Magento, scripts destructivos\
  \ o auditoría de seguridad profunda\n- Necesidad de volver a producción (sandbox\
  \ off)\n\n## Procedimiento\n1. Identificar el caso de uso y el modo requerido:\n\
  \   - coder/dev (pruebas): modo `non-main`\n   - security (auditoría/pentest): modo\
  \ `all`\n   - operación normal: modo `off`\n2. Activar para dev/coder con el comando\
  \ jq que setea `sandbox.mode = \"non-main\"` en openclaw.json\n3. Activar para security\
  \ con el comando jq que setea `sandbox.mode = \"all\"`\n4. Reiniciar el gateway:\
  \ `systemctl --user restart openclaw-gateway.service`\n5. Verificar que el modo\
  \ quedó aplicado (config + status del gateway)\n6. Al terminar la tarea → desactivar\
  \ todo con el comando jq que setea `sandbox.mode = \"off\"` y reiniciar\n7. Registrar\
  \ en COMMS con STATUS: DONE\n\n## Validación\n- ✅ El archivo openclaw.json refleja\
  \ el modo esperado tras el jq\n- ✅ El gateway reinició sin errores\n- ✅ Al finalizar,\
  \ todos los agentes volvieron a `off` (producción)\n\n## Escalado\n- Si el gateway\
  \ no reinicia o la config queda corrupta → restaurar backup de openclaw.json y escalar\
  \ a main\n- Si un agente necesita sandbox y no está en la tabla de casos de uso\
  \ → preguntar a main antes de activar\n\n---\n*Fuente: ~/.openclaw/workspace/cumplimiento/politicas/SANDBOX_OPERATIONS.md*"
