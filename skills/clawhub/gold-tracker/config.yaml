# 黄金追踪配置文件
# 所有参数均可配置。新闻来源有意设计为灵活的 —— 智能体应广泛搜索当前市场驱动因素，
# 而不是局限于预定义的来源。

# ---- 数据源默认值（智能体可覆盖）----
data_sources:
  # 主要金价来源。智能体可补充其他来源。
  gold_price:
    url: "https://goldpricez.com"
    timeout: 15
    min_price_usd: 1000.0
    max_price_usd: 10000.0
  # 美元兑人民币汇率来源
  fx:
    url: "https://open.er-api.com/v6/latest/USD"
    timeout: 10
    min_usd_cny: 6.0
    max_usd_cny: 8.0

# ---- 缓存 ----
cache:
  ttl_seconds: 300   # 基础价格数据的缓存时间（5分钟）
  dir: ".cache"

# ---- 提醒配置 ----
alerts:
  threshold_pct: 1.0        # 基础阈值（%）
  min_threshold_pct: 0.5    # 动态阈值下限（%）
  max_threshold_pct: 3.0    # 动态阈值上限（%）
  cooldown_minutes: 30      # 同类提醒冷却时间（分钟）
  lookback_days: 7          # 计算动态阈值的回溯天数
  volatility_multiplier: 1.5 # 波动率乘数
  max_alerts_per_day: 10    # 每日最大提醒数
  auto_resolve_minutes: 1440 # 自动解决超时提醒（分钟）
  retention_days: 30        # 提醒记录保留天数

# ---- 输出 ----
output:
  timezone: "Asia/Shanghai"
  max_factors_per_analysis: 6
  min_factors_per_analysis: 2      # 每次分析至少给出 2 个因素，避免单点支撑
  max_push_bytes: 2000
  # 硬约束：违反任意一条 check_analysis.py 都会报错并阻止本次分析结束
  constraints:
    # impact 字段必须取以下值之一（大小写敏感）
    allowed_impacts:
      - bullish
      - bearish
      - mixed
      - neutral
      - slightly_bullish
      - slightly_bearish
    # 每个 key_factor 条目必须齐全的字段
    required_factor_fields:
      - factor
      - impact
      - reasoning
      - sources        # 每个 factor 必须显式列出支撑它的来源 URL
    # sources 校验规则
    sources:
      must_be_http_url: true        # 必须是 http(s):// 开头的合法 URL
      must_be_in_fetch_log: true    # 必须出现在 .cache/fetch_log.json 中（即 agent 真的 web_fetch 过）
      min_count_per_factor: 1       # 每个 factor 至少 1 条来源
      min_unique_domains: 2         # 整篇分析至少覆盖 2 个不同域名（防止单源依赖）
    # 禁止出现的措辞（命中即报错）
    forbidden_phrases:
      - "根据经验"
      - "众所周知"
      - "一般来说"
      - "通常情况下"
      - "据了解"
      - "据业内人士"
      - "显而易见"
    # 没有数据时必须使用的占位值（不能用空字符串、不能编造）
    no_data_marker: "no_data"

# ---- 验证规则 ----
validation:
  required_log_fields:
    - run_id
    - timestamp
    - price_data.gold.price_usd
    - key_factors
  required_state_fields:
    - date
    - current_price
    - last_update

# ---- 归档配置 ----
archive:
  retention_days: 365        # 归档数据保留天数
  auto_archive_hour: 23      # 自动归档时间（小时，本地时区）
  index_enabled: true        # 是否启用索引

# ---- 新闻搜索指南（灵活，非限制性）----
# 这些是搜索角度的示例。智能体应根据当前影响市场的因素进行调整。
news_search_hints:
  - "今日影响金价的因素"
  - "美联储政策 黄金"
  - "央行黄金储备"
  - "美元指数 DXY 黄金"
  - "地缘政治风险 黄金"
  - "通胀数据 CPI PCE 黄金"
  - "黄金ETF 资金流向"
  - "实际利率 黄金"
