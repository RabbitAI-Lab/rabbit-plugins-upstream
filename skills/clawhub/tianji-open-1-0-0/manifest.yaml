name: tianji-open
version: 1.0.0
display_name: 天机我要查 (免费版)
author: "一线评标专家&ChesaraM"
homepage: "https://github.com/your-org/tianji-open"
license: MIT
description: >
  天机我要查 (免费版)（TianJi-Open）是一款开源免费的企业公开信息鉴别与尽职调查辅助助手。基于网络公开检索汇总工商、股东与实控人、经营风险、
  融资上市、新闻舆情、招标采购、资质知识产权等维度，强调双源印证、溯源核验与时效标注，
  输出可行动的结构化报告。适用于投融资尽调、合作背景核验、竞品与行业调研、风险初筛。
  恪守《个人信息保护法》，仅采信可溯源的公开信息。
triggers:
  - "查一下 XX 公司的工商信息"
  - "XX 公司的股东和实控人是谁"
  - "XX 有没有被处罚或失信记录"
  - "XX 公司最近有没有中标项目"
  - "帮我做 XX 企业的合作背景核验"
  - "调研一下 XX 行业的竞品格局"
tags:
  - 商查
  - 企业查询
  - 尽职调查
  - 风险初筛
dependencies:
  - baidu-search   # 可选：安装后可批量加速检索；未安装时由对话内置网络搜索驱动，核心功能不受影响
feedback:
  channel: GitHub Issues
  note: 使用问题、误报反馈、实务建议，欢迎通过项目仓库提交 Issue 反馈
