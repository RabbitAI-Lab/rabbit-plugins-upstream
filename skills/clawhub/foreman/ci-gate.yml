# foreman hard gate template — copy into <repo>/.github/workflows/ and fill in the placeholders.
# Accepted degradation: when CI can't run a browser, comment out the dynamic block and
# let the task-level verification commands be the gate.
name: foreman-gate
on: [pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ── Task-level verification (every repo; list your persistent commands here) ──
      - name: task-level verification
        run: |
          # <your persistent verification commands, e.g. pnpm install && pnpm test>
          exit 1  # ← placeholder: fails on purpose until you configure real commands,
                  #   so an empty gate can never pass as green
      # ── Dynamic acceptance (only for CI that can run a browser) ──
      # A fresh run directory is what stops a crashed run from being judged
      # against the previous run's artifacts.
