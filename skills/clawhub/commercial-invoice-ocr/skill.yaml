name: commercial_invoice_ocr
version: 1.0.1
description: 调用 Scnet 在线 OCR 服务识别商业发票，提取发票号码、日期、金额、开具方、信用证、合同号及成交方式。需要上传本地图片/PDF 至 Scnet 云端处理。
author: SCNet
license: MIT
tags:
  - ocr
  - 文字提取
  - 商业发票识别
homepage: https://github.com/SCNet-sugon/commercial_invoice_ocr.git
required_env_vars:
  - SCNET_API_KEY
optional_env_vars:
  - SCNET_API_BASE
primary_credential: SCNET_API_KEY
dependencies:
  - python3
  - requests
