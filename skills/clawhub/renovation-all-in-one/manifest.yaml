# ============================================================
# Skill Manifest — 装修全能体 (Renovation All-in-One)
# 用于 ClawHub / WorkBuddy 技能市场发布元数据
# ============================================================

# 市场上的唯一标识（英文 slug，建议与显示名区分；不要带个人前缀）
slug: renovation-all-in-one

# 显示名称（中文）
name: 装修全能体

# 描述：与 SKILL.md 中 description 保持一致，市场列表/搜索直接展示
description: >-
  当用户询问家庭装修的空间布局、尺寸预留、开关插座高度、水路进水口预留、
  灯光色温/光束角、装修物料购买顺序，或施工流程、工艺标准、验收要点、常见避坑
  （拆改/水电/防水/吊顶/瓷砖/乳胶漆/卫浴/灯具智能/定制家具），或材料怎么选
  （主材辅材/板材/瓷砖/门窗/台面/五金）、质量通病怎么防、收房验房查什么、
  竣工怎么验，或装修预算怎么算、合同怎么签防增项、环保甲醛怎么控时使用。
  基于尤呢呢《装修常用数据手册》+《装修施工完全手册》+「00-家装参考文件」其余
  可读资料合成的结构化知识，提供可落地的数值、红线与避坑。施工流程已按
  「工艺流程/材料选型/材料验收/施工质量要点/施工质量通病防治/施工验收」六维结构化，
  v8 起深化为 12 步×6 维「师傅带徒弟」级细则。

# 版本（语义化，和 SKILL.md frontmatter 对齐）
version: 8.0.0

# 技能类型：domain = 领域知识型
type: domain

# 作者 / 维护者
author: younini
maintainer: younini
license: MIT

# 主页 / 发布渠道
homepage: https://clawhub.ai/
repository: https://clawhub.ai/

# 图标（相对路径，已转存为 PNG）
icon: _icon.png

# 触发入口文件
entry: SKILL.md

# 运行时依赖：纯知识型，无任何代码/外部请求/二进制依赖
runtime: node
dependencies:
  npm: []
  python: []
  system: []

# 标签（便于市场检索）
tags:
  - 装修
  - 施工
  - 验收
  - 避坑
  - 家居
  - 预算
  - 合同
  - 环保
  - 材料

# 兼容性说明
compatibility:
  workbuddy: ">=5.0.0"
  min_skill_api: "1.0"

# 安全声明：纯知识文档，无网络请求、无代码执行、无文件读写
safety:
  network: false
  code_execution: false
  file_access: false
  data_egress: false

# 发布备注
notes: >-
  这是 v8 的「师傅带徒弟」级深化版本，12 个施工阶段各含 6 维细则与里程碑验收门禁 G1–G9，
  可作为装修工作台施工流程底座。审核为低风险纯知识型，预计 1–3 个工作日通过。
