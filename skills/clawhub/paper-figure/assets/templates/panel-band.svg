<?xml version="1.0" encoding="UTF-8"?>
<!-- 面板标题片段：(a) 粗体 7pt + 标题 7pt，左上角对齐；副标题 6.5pt 灰色 -->
<svg xmlns="http://www.w3.org/2000/svg" width="60mm" height="10mm" viewBox="0 0 60 10">
  <title>面板标题模板</title>
  <g data-role="panel-headers">
    <text x="0" y="2.08" font-family="Arial, Helvetica, 'PingFang SC', sans-serif"
          font-size="2.4696" font-weight="bold" fill="#1a1a1a" text-anchor="start"
          data-role="panel-letter" data-font-pt="7">a</text>
    <text x="2.4" y="2.08" font-family="Arial, Helvetica, 'PingFang SC', sans-serif"
          font-size="2.4696" fill="#1a1a1a" text-anchor="start"
          data-role="panel-title" data-font-pt="7">输入编码与融合</text>
    <text x="0" y="6" font-family="Arial, Helvetica, 'PingFang SC', sans-serif"
          font-size="2.2932" fill="#5f5f5f" text-anchor="start"
          data-role="caption" data-font-pt="6.5">副标题：一句话说清这栏在干什么</text>
  </g>
</svg>
