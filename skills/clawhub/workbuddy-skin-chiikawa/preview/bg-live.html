<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>bg-live 预览 · workbuddy-skin</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f4f6fc; }
  body.dark { background: #080a18; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  .hud {
    position: fixed; left: 16px; bottom: 14px; z-index: 10;
    font: 12px/1.6 -apple-system, sans-serif;
    color: #888; user-select: none;
  }
  body.dark .hud { color: #aab; }
  .hud button {
    border: 1px solid currentColor; background: transparent; color: inherit;
    border-radius: 8px; padding: 3px 10px; cursor: pointer; font-size: 12px;
  }
  .hint {
    position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%);
    font: 300 28px -apple-system, sans-serif; letter-spacing: 0.1em;
    color: rgba(120, 120, 140, 0.5); pointer-events: none; text-align: center;
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="hint">移动鼠标 · 搅动粒子</div>
<div class="hud">
  <button id="theme">🌙 深色</button>
  <button id="pause">⏸ 暂停</button>
  bg-live.html · workbuddy-skin 交互壁纸预览
</div>
<script src="../src/bg-live.js"></script>
<script>
  const ctrl = window.__wbsLiveBgStart(document.getElementById('bg'));
  const themeBtn = document.getElementById('theme');
  const pauseBtn = document.getElementById('pause');
  themeBtn.onclick = () => {
    document.body.classList.toggle('dark');
    themeBtn.textContent = document.body.classList.contains('dark') ? '☀️ 浅色' : '🌙 深色';
  };
  pauseBtn.onclick = () => {
    if (ctrl.isRunning()) { ctrl.stop(); pauseBtn.textContent = '▶ 播放'; }
    else { ctrl.start(); pauseBtn.textContent = '⏸ 暂停'; }
  };
  setTimeout(() => document.querySelector('.hint').style.display = 'none', 4000);
</script>
</body>
</html>
