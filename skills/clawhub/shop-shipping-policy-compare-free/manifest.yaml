description: "在用户指定的 Easy WebBridge 浏览器环境中，只读核对 2–3 个公开配送或售后政策页，交付发货时效、适用地区、费用条件与缺失条款的可追溯对照表。适用于选店、运营核查与客服资料准备；页面条件无法归属店铺、相互矛盾或资料不全时明确标注，不推断运费、送达或交易结论。"
