name: selfmedia-interview-question-pack-cn
slug: selfmedia-interview-question-pack-cn
display_name: 采访问题与追问清单
description: 输入受访者公开资料、采访主题与时长，生成一份按叙事主线排列的中文采访问题、条件式追问和录制前素材核对点。适用于人物、品牌或专题对话；只依据用户提交的材料，不编造受访者观点。缺少公开资料、主题或时长时，清楚列出缺项并提供补充格式；长材料会要求分批处理。
version: 1.0.0
icon: icon-512.png
