<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>split · carrusel-formatos-f100k</title>
<!-- Fichas F01 (causa y consecuencia), F02 (pantalla dividida en serie) y F05 (cuadrícula editorial) -->
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,700;0,800;1,500;1,700&family=Montserrat:wght@800;900&display=block" rel="stylesheet">
<style>
  :root {
    --sans: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --titular: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
    --acento: #FFE14D;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #111; font-family: var(--sans); }
  .slide { width: 1080px; height: 1350px; position: relative; overflow: hidden; background: #000; margin: 0 0 24px; }
  .foto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .caja { position: absolute; overflow: hidden; display: flex; flex-direction: column; }
  em { font-style: italic; }
  u { text-decoration-thickness: 3px; text-underline-offset: 8px; }

  /* marca y swipe */
  .marca { position: absolute; top: 34px; left: 40px; z-index: 5; color: #fff; font: 600 26px var(--sans); letter-spacing: .02em; text-shadow: 0 1px 8px rgba(0,0,0,.6); }
  .swipe { position: absolute; top: 30px; right: 40px; z-index: 5; color: #fff; font: 600 24px var(--sans); border: 2px solid rgba(255,255,255,.85); border-radius: 30px; padding: 6px 18px; }

  /* ── PARTIDA: dos fotos apiladas ───────────────────────── */
  .mitad { position: absolute; left: 0; width: 1080px; height: 672px; overflow: hidden; }
  .mitad.arriba { top: 0; }
  .mitad.abajo { top: 678px; }
  .partida { background: #0b0b0b; }

  /* estilo fino (F01): texto blanco centrado en cada foto */
  .fino .frase { left: 60px; right: 60px; top: calc(50% - 130px); height: 260px; justify-content: center; text-align: center;
    color: #fff; font: 500 60px/1.15 var(--sans); letter-spacing: -.01em; text-shadow: 0 2px 14px rgba(0,0,0,.65), 0 0 2px rgba(0,0,0,.5); }

  .fino .frase.pos-arriba { top: 70px; }
  .fino .frase.pos-abajo { top: auto; bottom: 70px; }

  /* estilo titular (F02): mayúsculas pesadas sobre degradado, abajo en color de acento */
  .titular .velo { position: absolute; left: 0; right: 0; bottom: 0; height: 60%; background: linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,0)); }
  .titular .frase { left: 50px; right: 50px; bottom: 34px; height: 210px; justify-content: flex-end; text-align: center;
    color: #fff; font: 900 64px/1.05 var(--titular); text-transform: uppercase; letter-spacing: -.01em; }
  .titular .abajo .frase { color: var(--acento); }

  /* ── CUADRÍCULA (F05) ──────────────────────────────────── */
  .celda { position: absolute; width: 537px; height: 672px; overflow: hidden; }
  .celda.tl { left: 0; top: 0; } .celda.tr { left: 543px; top: 0; }
  .celda.bl { left: 0; top: 678px; } .celda.br { left: 543px; top: 678px; background: #000; }
  .etiqueta { position: absolute; top: 34px; left: 0; right: 0; text-align: center; z-index: 4; color: #fff; font: 700 28px var(--sans); text-shadow: 0 1px 8px rgba(0,0,0,.7); }
  .banda { left: 70px; right: 70px; top: 570px; height: 210px; z-index: 4; justify-content: center; text-align: center;
    color: #fff; font: 700 58px/1.1 var(--sans); letter-spacing: -.01em; text-shadow: 0 2px 16px rgba(0,0,0,.8), 0 0 3px rgba(0,0,0,.6); }
  .bloque { left: 583px; top: 800px; width: 460px; height: 510px; justify-content: flex-start; gap: .75em;
    color: #fff; font: 400 36px/1.3 var(--sans); }
  .bloque .n { font-weight: 400; }
  .bloque .i { font-style: italic; font-weight: 500; }
  .bloque .b { font-weight: 800; }

  /* portada / pregunta a sangre */
  .sangre .velo-arriba { position: absolute; left: 0; right: 0; top: 0; height: 55%; background: linear-gradient(to bottom, rgba(0,0,0,.55), rgba(0,0,0,0)); }
  .sangre .titulo { left: 80px; right: 80px; top: 150px; height: 360px; justify-content: center; text-align: center;
    color: #fff; font: 700 70px/1.12 var(--sans); text-shadow: 0 2px 18px rgba(0,0,0,.6); }
  .sangre .sub { left: 100px; right: 100px; top: 520px; height: 130px; justify-content: flex-start; text-align: center;
    color: #fff; font: 500 italic 42px/1.25 var(--sans); text-shadow: 0 2px 14px rgba(0,0,0,.6); }
  .sangre.izquierda .titulo, .sangre.izquierda .sub { text-align: left; left: 70px; right: 200px; }
</style>
</head>
<body>
<div id="carrusel"></div>
<script>
window.SPEC = /*__SPEC__*/null;
/*__COMUN__*/

function cabecera(spec, i) {
  let h = '';
  if (spec.handle) h += `<div class="marca">${esc(spec.handle)}</div>`;
  if (spec.swipe && i < spec.slides.length - 1) h += `<div class="swipe">desliza ›</div>`;
  return h;
}

function pintar(spec, cont) {
  if (spec.acento) document.documentElement.style.setProperty('--acento', spec.acento);
  cont.innerHTML = spec.slides.map((s, i) => {
    const estilo = s.estilo || spec.estilo || 'fino';
    const tipo = s.tipo || (spec.variante === 'cuadricula' ? 'habito' : 'partida');
    if (tipo === 'partida') {
      const mitad = (m, cls) => `<div class="mitad ${cls}">${foto(m.foto)}${estilo === 'titular' ? '<div class="velo"></div>' : ''}
        <div class="caja frase ${m.pos ? 'pos-' + m.pos : ''}" data-fit><div>${md(m.texto)}</div></div></div>`;
      return `<section class="slide partida ${estilo}">${mitad(s.arriba, 'arriba')}${mitad(s.abajo, 'abajo')}${cabecera(spec, i)}</section>`;
    }
    if (tipo === 'habito') {
      const f = s.fotos || [];
      const b = s.bloque || {};
      return `<section class="slide cuadricula">
        <div class="celda tl">${foto(f[0])}</div><div class="celda tr">${foto(f[1])}</div>
        <div class="celda bl">${foto(f[2])}</div><div class="celda br"></div>
        ${spec.etiqueta ? `<div class="etiqueta">${esc(spec.etiqueta)}</div>` : ''}
        <div class="caja banda" data-fit><div>${md(s.titulo)}</div></div>
        <div class="caja bloque" data-fit>
          ${b.normal ? `<div class="n">${md(b.normal)}</div>` : ''}
          ${b.italica ? `<div class="i">${md(b.italica)}</div>` : ''}
          ${b.negrita ? `<div class="b">${md(b.negrita)}</div>` : ''}
        </div></section>`;
    }
    // portada | pregunta: foto a sangre con texto arriba
    return `<section class="slide sangre ${s.alinear === 'izquierda' ? 'izquierda' : ''}">${foto(s.foto)}<div class="velo-arriba"></div>
      <div class="caja titulo" data-fit><div>${md(s.titulo)}</div></div>
      ${s.sub ? `<div class="caja sub" data-fit><div>${md(s.sub)}</div></div>` : ''}
      ${cabecera(spec, i)}</section>`;
  }).join('');
}

arrancar({ pintar, familias: ['Inter', 'Montserrat'] });
</script>
</body>
</html>
