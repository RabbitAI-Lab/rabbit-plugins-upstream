<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>papel · carrusel-formatos-f100k</title>
<!-- Fichas F04 (libreta), F06/F07 (hoja espiral) y F08 (agenda). Papel dibujado en CSS o foto de fondo (spec.fondo). -->
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Caveat:wght@600;700&family=Patrick+Hand&display=block" rel="stylesheet">
<style>
  :root {
    --mano: 'Kalam', 'Caveat', 'Comic Sans MS', cursive, sans-serif;
    --tinta: #2b2b2b;
    --rojo: #d8342c;
    --resaltador: #ffe066;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #111; }
  .slide { width: 1080px; height: 1350px; position: relative; overflow: hidden; margin: 0 0 24px; }
  .fondo-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hoja { position: absolute; }
  .contenido { position: absolute; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-start;
    font-family: var(--mano); color: var(--tinta); font-size: 60px; line-height: 1.25; }
  .centro .contenido { justify-content: center; text-align: center; }
  .centro .contenido ul { text-align: left; align-self: center; }

  mark { background: linear-gradient(transparent 12%, var(--resaltador) 12%, var(--resaltador) 88%, transparent 88%); color: inherit; padding: 0 .12em; border-radius: .15em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  u { text-decoration: underline; text-decoration-color: var(--rojo); text-decoration-thickness: .07em; text-underline-offset: .16em; }
  strong { font-weight: 700; }

  .b-titulo { font-size: 1.22em; line-height: 1.15; margin: 0 0 .45em; font-weight: 400; }
  .b-texto { font-size: .74em; margin: 0 0 .5em; }
  .b-nota { font-size: .74em; margin: .35em 0 .5em; }
  .b-lista, .b-check { font-size: .66em; margin: 0 0 .55em; padding: 0 0 0 1.1em; }
  .b-lista li, .b-check li { margin: 0 0 .12em; }
  .b-check { list-style: none; padding-left: 0; }
  .b-check li::before { content: '✓ '; }
  .b-grande { font-size: 1.7em; line-height: 1.05; margin: .15em 0 .3em; font-weight: 700; }
  .b-imagen { display: block; max-width: 70%; max-height: 5.5em; margin: .3em auto; object-fit: contain; }
  .b-espacio { height: .6em; }

  /* chuleta (F07): nodo central + filas unidas con líneas */
  .b-chuleta { display: flex; align-items: center; gap: 1.6em; font-size: .5em; position: relative; margin: .2em 0; }
  .b-chuleta .nodo { flex: none; border: .12em solid currentColor; border-radius: .35em; padding: .25em .5em; font-size: 1.7em; }
  .b-chuleta .filas { flex: 1; min-width: 0; }
  .b-chuleta .fila { white-space: nowrap; line-height: 1.32; }
  .b-chuleta .fila b { font-weight: 400; }
  .b-chuleta svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }

  .firma { position: absolute; font-family: var(--mano); opacity: .45; }

  /* ── LIBRETA (F04): libreta abierta sobre madera ───────── */
  .libreta { background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.05) 0 3px, transparent 3px 13px),
      linear-gradient(95deg, #7a4d31, #a26c45 28%, #8d5a39 55%, #b07a50 80%, #7a4d31); }
  .libreta .hoja { left: 80px; top: 70px; width: 920px; height: 1210px; background: #f3ede1; border-radius: 8px 18px 18px 8px;
    box-shadow: 0 40px 70px rgba(0,0,0,.45), inset 46px 0 40px -34px rgba(0,0,0,.30), inset -2px 0 0 rgba(0,0,0,.05); }
  .libreta .hoja::after { content: ''; position: absolute; left: -14px; top: 10px; bottom: 10px; width: 14px; border-radius: 8px 0 0 8px;
    background: repeating-linear-gradient(180deg, #e6dfd1 0 4px, #d8cfbe 4px 6px); }
  .libreta .contenido { left: 180px; top: 170px; width: 740px; height: 1010px; color: #262626; }
  .libreta .firma { left: 0; right: 0; bottom: 110px; text-align: center; font-size: 22px; color: #555; }

  /* ── HOJA ESPIRAL (F06/F07): cuaderno rayado con margen rojo ── */
  .espiral { background: #d9d4c8; }
  .espiral .hoja { left: 30px; top: 22px; width: 1026px; height: 1306px; background:
      repeating-linear-gradient(180deg, transparent 0 66px, #bcd0e8 66px 68px) 0 118px / 100% 100% no-repeat,
      #f8f6f0;
    border-radius: 4px 10px 10px 4px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .espiral .hoja::before { content: ''; position: absolute; left: 150px; top: 0; bottom: 0; width: 3px; background: #e58a8a; }
  .espiral .aro { position: absolute; left: 2px; width: 70px; height: 26px; border: 7px solid #8d8d8d; border-radius: 16px;
    border-right-color: #b5b5b5; box-shadow: inset 0 2px 2px rgba(255,255,255,.4); }
  .espiral .agujero { position: absolute; left: 50px; width: 22px; height: 22px; border-radius: 50%; background: #3a3a3a; }
  .espiral .contenido { left: 200px; top: 90px; width: 800px; height: 1170px; color: #1f3d91; }
  .espiral .firma { left: 78px; top: 900px; transform: rotate(-90deg); transform-origin: left top; font-size: 24px; color: #1f3d91; }

  /* ── AGENDA (F08): planner gris con pestañas ───────────── */
  .agenda { background: radial-gradient(ellipse at 40% 30%, #d7d7d2, #a9aaa5); }
  .agenda .hoja { left: 70px; top: 60px; width: 960px; height: 1250px; background:
      repeating-linear-gradient(180deg, transparent 0 84px, #bdbdb8 84px 86px) 0 250px / 100% 100% no-repeat,
      #e6e6e2;
    border-radius: 10px; box-shadow: 0 25px 50px rgba(0,0,0,.3); }
  .agenda .tabs { position: absolute; left: 40px; top: 30px; display: flex; gap: 0; }
  .agenda .tab { width: 170px; height: 90px; border: 3px solid #9a9a96; border-bottom: none; border-radius: 14px 14px 0 0;
    font: 34px 'Patrick Hand', sans-serif; color: #555; padding: 8px 18px; margin-right: -3px; background: #dcdcd8; }
  .agenda .marco { position: absolute; left: 40px; right: 40px; top: 117px; bottom: 40px; border: 3px solid #9a9a96; border-radius: 0 16px 16px 16px; }
  .agenda .contenido { left: 150px; top: 250px; width: 800px; height: 1000px; font-family: 'Patrick Hand', var(--mano); color: #2a2a2a; font-size: 84px; line-height: 1.3; }
  .agenda .firma { right: 110px; bottom: 90px; font-size: 22px; color: #555; }

  /* con foto de fondo: la hoja CSS se apaga y el texto usa spec.caja */
  .con-fondo .hoja, .con-fondo .aro, .con-fondo .agujero, .con-fondo .tabs, .con-fondo .marco { display: none; }
</style>
</head>
<body>
<div id="carrusel"></div>
<script>
window.SPEC = /*__SPEC__*/null;
/*__COMUN__*/

function bloque(b) {
  switch (b.tipo) {
    case 'titulo': return `<div class="b-titulo">${md(b.texto)}</div>`;
    case 'texto': return `<div class="b-texto">${md(b.texto)}</div>`;
    case 'nota': return `<div class="b-nota">${md(b.texto)}</div>`;
    case 'grande': return `<div class="b-grande">${md(b.texto)}</div>`;
    case 'lista': return `<ul class="b-lista">${b.items.map(x => `<li>${md(x)}</li>`).join('')}</ul>`;
    case 'check': return `<ul class="b-check">${b.items.map(x => `<li>${md(x)}</li>`).join('')}</ul>`;
    case 'imagen': return `<img class="b-imagen" src="${esc(b.src)}">`;
    case 'espacio': return `<div class="b-espacio"></div>`;
    case 'chuleta': return `<div class="b-chuleta"><div class="nodo">${md(b.centro)}</div>
      <div class="filas">${b.filas.map(([a, c]) => `<div class="fila"><b>${md(a)}</b> — ${md(c)}</div>`).join('')}</div><svg></svg></div>`;
    default: return `<div class="b-texto">${md(b.texto || '')}</div>`;
  }
}

function decoracion(variante) {
  if (variante === 'espiral') {
    let h = '';
    for (let y = 40; y < 1330; y += 64) h += `<div class="agujero" style="top:${y + 2}px"></div><div class="aro" style="top:${y}px"></div>`;
    return h;
  }
  if (variante === 'agenda') return `<div class="tabs"><div class="tab">D</div><div class="tab">M</div><div class="tab">A</div><div class="tab"></div></div>`;
  return '';
}

function pintar(spec, cont) {
  cont.innerHTML = spec.slides.map(s => {
    const v = s.variante || spec.variante || 'libreta';
    const fondo = s.fondo || spec.fondo;
    const caja = fondo && (s.caja || spec.caja);
    const estiloCaja = caja ? `style="left:${caja.x}px;top:${caja.y}px;width:${caja.w}px;height:${caja.h}px"` : '';
    return `<section class="slide ${v} ${s.alinear === 'centro' ? 'centro' : ''} ${fondo ? 'con-fondo' : ''}">
      ${fondo ? `<img class="fondo-img" src="${esc(fondo)}">` : ''}
      <div class="hoja">${v === 'agenda' ? '<div class="marco"></div>' : ''}</div>
      ${decoracion(v)}
      <div class="contenido" data-fit ${estiloCaja}>${(s.bloques || []).map(bloque).join('')}</div>
      ${spec.handle ? `<div class="firma">${esc(spec.handle)}</div>` : ''}
    </section>`;
  }).join('');
}

// Renglones: el texto de la hoja espiral y de la agenda tiene que CAER sobre las líneas, como escrito a mano.
// Antes el papel tenía un paso fijo (68 px / 86 px) y el autofit cambiaba el tamaño de la letra: nunca coincidían.
// Ahora se hace al revés: después del autofit se mide el interlineado del texto chico (P), todo el contenido se
// ajusta a múltiplos de P, cada bloque se corre hasta que su línea base cae en la rejilla y el papel se dibuja
// con ESE paso, pasando por esas líneas base.
const TINTA_RENGLON = { espiral: '#bcd0e8', agenda: '#bdbdb8' };
function renglones(slide, reporte, n) {
  const v = Object.keys(TINTA_RENGLON).find(k => slide.classList.contains(k));
  if (!v || slide.classList.contains('con-fondo')) return;
  const hoja = slide.querySelector('.hoja'), c = slide.querySelector('.contenido');
  const chicos = [...c.querySelectorAll('.fila, .b-texto, .b-nota, .b-lista li, .b-check li')];
  if (!chicos.length) return;
  const P = Math.round(parseFloat(getComputedStyle(chicos[0]).fontSize) * 1.34);
  chicos.forEach(e => { e.style.lineHeight = P + 'px'; e.style.marginTop = '0'; e.style.marginBottom = '0'; });
  c.querySelectorAll('.b-lista, .b-check, .b-chuleta .filas').forEach(e => { e.style.marginTop = '0'; e.style.marginBottom = '0'; });
  c.querySelectorAll('.b-titulo, .b-grande, .b-chuleta .nodo').forEach(e => {
    const k = Math.max(1, Math.ceil(parseFloat(getComputedStyle(e).fontSize) * 1.02 / P));
    e.style.lineHeight = (k * P) + 'px'; e.style.marginTop = '0'; e.style.marginBottom = '0';
  });
  // Un renglón en blanco entre bloques, como cuando se escribe a mano
  [...c.children].forEach((e, i) => { e.style.marginTop = i ? P + 'px' : '0'; e.style.marginBottom = '0'; });

  const base = el => {
    const sonda = document.createElement('span');
    sonda.style.cssText = 'display:inline-block;width:0;height:0;vertical-align:baseline';
    const destino = el.querySelector('li, .fila') || el;
    destino.insertBefore(sonda, destino.firstChild);
    const y = sonda.getBoundingClientRect().top;
    sonda.remove();
    return y;
  };
  const r0 = hoja.getBoundingClientRect();
  const bloques = [...c.children].filter(e => !e.classList.contains('b-imagen') && !e.classList.contains('b-espacio'));
  if (!bloques.length) return;
  const origen = base(bloques[0]);
  bloques.forEach(e => {
    if (e.classList.contains('b-chuleta')) return; // el nodo va centrado a propósito; sus filas sí se corrigen abajo
    const d = ((base(e) - origen) % P + P) % P;
    const corr = d > P / 2 ? P - d : -d;
    if (corr) { e.style.position = 'relative'; e.style.top = corr + 'px'; }
  });
  c.querySelectorAll('.b-chuleta .filas').forEach(f => {
    const d = ((base(f) - origen) % P + P) % P;
    const corr = d > P / 2 ? P - d : -d;
    if (corr) { f.style.position = 'relative'; f.style.top = corr + 'px'; }
  });

  // Líneas 3 px debajo de la línea base (las letras se apoyan; los rabitos de g, p, y cruzan)
  const y0 = origen - r0.top + 3;
  const primera = y0 - Math.floor((y0 - (v === 'agenda' ? 190 : 100)) / P) * P;
  hoja.style.background = `repeating-linear-gradient(180deg, ${TINTA_RENGLON[v]} 0 2px, transparent 2px ${P}px) 0 ${primera}px / 100% calc(100% - ${primera}px) no-repeat, ${v === 'agenda' ? '#e6e6e2' : '#f8f6f0'}`;

  if (desborda(c)) reporte.push({ tipo: 'no-cabe', slide: n, detalle: 'al ajustar el texto a los renglones ya no cabe: acorta' });
}

// Líneas de la chuleta: del nodo central a cada fila (se dibujan después del autofit)
function despues(spec, cont, reporte) {
  document.querySelectorAll('.slide').forEach((s, i) => renglones(s, reporte, i + 1));
  document.querySelectorAll('.b-chuleta').forEach(ch => {
    const r0 = ch.getBoundingClientRect();
    const nodo = ch.querySelector('.nodo').getBoundingClientRect();
    const x1 = nodo.right - r0.left + 4, y1 = nodo.top + nodo.height / 2 - r0.top;
    const color = getComputedStyle(ch).color;
    const lineas = [...ch.querySelectorAll('.fila')].map(f => {
      const r = f.getBoundingClientRect();
      const x2 = r.left - r0.left - 8, y2 = r.top + r.height / 2 - r0.top;
      const cx = x1 + (x2 - x1) * 0.55;
      return `<path d="M${x1},${y1} C${cx},${y1} ${cx},${y2} ${x2},${y2}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round"/>`;
    }).join('');
    ch.querySelector('svg').innerHTML = lineas;
  });
}

arrancar({ pintar, familias: ['Kalam', 'Caveat', 'Patrick Hand'], despues });
</script>
</body>
</html>
