<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Polaroid que se revela</title>
<style>
  html,body{margin:0;background:#141210;display:grid;place-items:center;height:100vh}
  canvas{height:100vh;width:auto;max-width:100vw}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ====================== LO QUE PUEDES CAMBIAR ======================
const FOTO = 'fotos/foto-4.jpg';                      // UNA foto real (ruta relativa a este archivo)
const PIE = 'la foto que trajiste';                   // se escribe a mano en la franja blanca (≤ 32 letras)
const FOCO = [.5, .3];                                // qué parte de la foto queda al centro (0..1): cara arriba ⇒ .3
const COLORES = {
  mesa: '#2e2622',     // el fondo
  luz: '255,214,160',  // el foco cálido sobre la mesa (r,g,b)
  tinta: '#1f2a44',    // el plumón del pie
};
// ===================================================================

const W = 1080, H = 1920, FPS = 30;
const T_FLASH = .15, T_SALE = .35, T_SACUDE = .95, T_REVELA = [.9, 3.0];
const T_ESCRIBE = 2.8, DUR_ESCRIBE = Math.max(.9, PIE.length / 16);
const DUR = +(T_ESCRIBE + DUR_ESCRIBE + 1.6).toFixed(2);
</script>
<script src="../nucleo/nucleo.js"></script>
<script>
cargarFotos([FOTO]);
let IMG = null;
window.LISTO.then(([im]) => { IMG = im; });

const MESA = (() => {                                  // madera oscura con vetas y un foco cálido
  const c = hacerPapel(COLORES.mesa, { fibras: false, viñeta: .55, semilla: 5 }), p = c.getContext('2d'), r = rng(21);
  p.strokeStyle = 'rgba(0,0,0,.18)'; p.lineWidth = 2;
  for (let y = 0; y < H; y += 26 + r() * 30) { p.beginPath(); p.moveTo(0, y);
    for (let x = 0; x <= W; x += 60) p.lineTo(x, y + Math.sin(x / 190 + y) * 6 + (r() - .5) * 3); p.stroke(); }
  const g = p.createRadialGradient(W / 2, 880, 60, W / 2, 880, 900);
  g.addColorStop(0, `rgba(${COLORES.luz},.28)`); g.addColorStop(1, `rgba(${COLORES.luz},0)`);
  p.fillStyle = g; p.fillRect(0, 0, W, H);
  return c;
})();

// medidas de una instantánea real: franja de abajo más ancha
const FW = 700, FH = 700, BORDE = 44, ABAJO = 190;
const PW = FW + 2 * BORDE, PH = FH + BORDE + ABAJO;
const CX = W / 2, CY = 285 + PH / 2 + 20;              // arriba libre 250 px; abajo termina antes de 1470

// quietud al final: todo movimiento se apaga antes de T_ESCRIBE
function pose(t) {
  const sale = easeOut(prog(t, T_SALE, T_SALE + .6));
  const y = CY + (1 - sale) * 1300;
  const amort = Math.exp(-3.2 * Math.max(0, t - T_SACUDE)) * (t > T_SACUDE ? 1 : 0);
  const giro = -.035 + Math.sin((t - T_SACUDE) * 19) * .09 * amort;   // la sacudida clásica
  const dx = Math.sin((t - T_SACUDE) * 19 + .6) * 38 * amort;
  return { x: CX + dx, y, rot: giro + (1 - sale) * .25 };
}

function polaroid(t) {
  const { x, y, rot } = pose(t);
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  // sombra suave
  ctx.save(); ctx.filter = 'blur(22px)'; ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(-PW / 2 + 22, -PH / 2 + 34, PW, PH); ctx.restore();
  // marco con papel mate y un poco de grano
  const g = ctx.createLinearGradient(0, -PH / 2, 0, PH / 2); g.addColorStop(0, '#fbf8f1'); g.addColorStop(1, '#eee8dc');
  ctx.fillStyle = g; ctx.fillRect(-PW / 2, -PH / 2, PW, PH);
  // la foto revelándose: de negro azulado a color pleno
  const k = ease(prog(t, T_REVELA[0], T_REVELA[1]));
  const fx = -FW / 2, fy = -PH / 2 + BORDE;
  ctx.fillStyle = '#10161c'; ctx.fillRect(fx, fy, FW, FH);
  if (IMG && k > 0) {
    ctx.save(); ctx.beginPath(); ctx.rect(fx, fy, FW, FH); ctx.clip();
    ctx.globalAlpha = clamp(k * 1.4);
    ctx.filter = `saturate(${lerp(.1, 1.08, k)}) contrast(${lerp(.55, 1.05, k)}) brightness(${lerp(.55, 1.02, k)}) sepia(${lerp(.5, .08, k)})`;
    fotoCover(IMG, fx, fy, FW, FH, FOCO[0], FOCO[1]);
    ctx.filter = 'none'; ctx.globalAlpha = 1;
    // velo químico azul-verde que se va de los bordes hacia el centro
    const v = ctx.createRadialGradient(0, fy + FH / 2, FW * .15 * (1 + k * 3), 0, fy + FH / 2, FW * .8);
    v.addColorStop(0, `rgba(30,60,70,${.55 * (1 - k)})`); v.addColorStop(1, `rgba(20,40,55,${.9 * (1 - k)})`);
    ctx.fillStyle = v; ctx.fillRect(fx, fy, FW, FH);
    // brillo del plástico de la foto
    const b = ctx.createLinearGradient(fx, fy, fx + FW, fy + FH);
    b.addColorStop(0, 'rgba(255,255,255,0)'); b.addColorStop(.45, 'rgba(255,255,255,0)'); b.addColorStop(.5, 'rgba(255,255,255,.10)'); b.addColorStop(.56, 'rgba(255,255,255,0)');
    ctx.fillStyle = b; ctx.fillRect(fx, fy, FW, FH);
    ctx.restore();
  }
  ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 2; ctx.strokeRect(fx, fy, FW, FH);
  // el pie escrito con plumón, letra por letra
  const p = prog(t, T_ESCRIBE, T_ESCRIBE + DUR_ESCRIBE);
  if (p > 0 && PIE) {
    const aj = autoajuste(PIE, LETRA_MANO, 400, FW - 20, 1, 70, 36);
    ctx.font = aj.font; ctx.fillStyle = COLORES.tinta; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    const tw = medir(PIE, aj.font), tx = -tw / 2, ty = PH / 2 - ABAJO / 2 + 6;
    ctx.save(); ctx.beginPath(); ctx.rect(tx - 10, ty - 80, (tw + 20) * p, 160); ctx.clip();
    ctx.rotate(-.012);
    ctx.fillText(PIE, tx + (vnoise(BOIL, 3) - .5) * 2, ty + (vnoise(3, BOIL) - .5) * 2);
    ctx.restore();
  }
  ctx.restore();
}

arrancar(frame => {
  const t = frame / FPS;
  BOIL = Math.floor(frame / 4);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none';
  // la cámara empuja un poquito hacia la foto mientras se revela
  const z = 1 + .06 * ease(prog(t, T_REVELA[0], DUR));
  ctx.translate(W / 2, CY); ctx.scale(z, z); ctx.translate(-W / 2, -CY);
  ctx.drawImage(MESA, 0, 0);
  polaroid(t);
  // flash del disparo
  const f = prog(t, 0, T_FLASH) < 1 ? 1 : 1 - prog(t, T_FLASH, T_FLASH + .35);
  if (f > 0) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = `rgba(255,252,240,${f * .95})`; ctx.fillRect(0, 0, W, H); }
});
</script>
</body>
</html>
