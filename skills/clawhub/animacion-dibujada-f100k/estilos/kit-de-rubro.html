<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Kit de rubro</title>
<style>
  html,body{margin:0;background:#141210;display:grid;place-items:center;height:100vh}
  canvas{height:100vh;width:auto;max-width:100vw}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ====================== LO QUE PUEDES CAMBIAR ======================
const RUBRO = 'pasteleria';                 // pasteleria | psicologo | dentista | restaurante | nutricionista | tienda-ropa | inmobiliario | makeup | fitness | centro-estetico | joyeria | veterinaria | generico
const TITULO = 'lo que pasa detrás de cada pedido';  // sale arriba en una tarjeta (≤ 50 letras, '' = sin título)
const OBJETOS = [];                          // [] = los 6 primeros del kit. O elige: ['pastel-pisos', 'horno', 'harina', …]
const ESTILO = 'vector';                     // 'vector' | 'pixel'
const PALETA = {};                           // opcional: pisa colores del kit, ej. { acento: '#c2456b' }
// ===================================================================
const W = 1080, H = 1920, FPS = 30;
const T_ESC = .5, T_TIT = .55, T_OBJ = 1.05, CADA = .32;
const N_OBJ = 6, DUR = +(T_OBJ + N_OBJ * CADA + .5 + 1.7).toFixed(2);
</script>
<script src="../nucleo/nucleo.js"></script>
<script src="../nucleo/objetos.js"></script>
<script src="../nucleo/kits/pasteleria.js"></script>
<script src="../nucleo/kits/psicologo.js"></script>
<script src="../nucleo/kits/dentista.js"></script>
<script src="../nucleo/kits/restaurante.js"></script>
<script src="../nucleo/kits/nutricionista.js"></script>
<script src="../nucleo/kits/tienda-ropa.js"></script>
<script src="../nucleo/kits/inmobiliario.js"></script>
<script src="../nucleo/kits/makeup.js"></script>
<script src="../nucleo/kits/fitness.js"></script>
<script src="../nucleo/kits/centro-estetico.js"></script>
<script src="../nucleo/kits/joyeria.js"></script>
<script src="../nucleo/kits/veterinaria.js"></script>
<script>
const KIT = kitDe(RUBRO), PAL = Object.assign({}, KIT.paleta, PALETA);
const LISTA = (OBJETOS.length ? OBJETOS : KIT.objetos).slice(0, N_OBJ);
// composición con la medida REAL de cada objeto (componerFila): nada se encima.
// Fila de atrás sobre el mostrador (la del centro, la más alta) y fila de adelante más chica.
const idx = (i) => LISTA[i] !== undefined ? i : -1;
const atras = [idx(1), idx(0), idx(2)].filter(i => i >= 0), adelante = [idx(3), idx(5), idx(4)].filter(i => i >= 0);
const TAM_ATRAS = { 0: 460, 1: 320, 2: 320 }, TAM_ADEL = { 3: 250, 4: 250, 5: 200 };
const ORDEN = [];
const fila1 = componerFila(atras.map(i => LISTA[i]), { tam: atras.map(i => TAM_ATRAS[i]), x0: 60, x1: W - 60, hueco: 34 });
fila1.forEach((c, k) => ORDEN.push({ n: c.nombre, i: atras[k], x: c.x, y: PISO_Y + 10, tam: c.tam, anim: atras[k] === 0 ? 'cae' : 'aparece' }));
// la fila de adelante se INTERCALA en los huecos de la de atrás (no tapa lo principal); la del centro va más chica y más adelante
const huecos = fila1.length >= 2 ? fila1.slice(1).map((c, k) => (c.x + fila1[k].x) / 2) : [W * .3, W * .7];
// al centro de adelante va el objeto MÁS ANGOSTO (no tapa al protagonista); los anchos van a los huecos de los lados
const porAncho = [...adelante].sort((a, b) => medidaObjeto(LISTA[a]).ancho - medidaObjeto(LISTA[b]).ancho);
const lugaresAdel = {};
if (porAncho.length === 3) { lugaresAdel[porAncho[0]] = W / 2; const [a, b] = porAncho.slice(1).sort((x, y) => x - y); lugaresAdel[a] = huecos[0] ?? W * .3; lugaresAdel[b] = huecos[huecos.length - 1] ?? W * .7; }
else [...porAncho].sort((x, y) => x - y).forEach((i, k) => { lugaresAdel[i] = huecos[k] ?? (k ? W * .7 : W * .3); });
adelante.forEach(i => {
  const m = medidaObjeto(LISTA[i]), tam = Math.min(TAM_ADEL[i], 300 / (m.ancho / 100));   // ninguno pasa de 300 px de ancho
  const centro = lugaresAdel[i] === W / 2, tt = centro ? tam * .82 : tam;
  ORDEN.push({ n: LISTA[i], i, x: lugaresAdel[i] - (m.izq + m.der) / 2 / 100 * tt, y: PISO_Y + (centro ? 150 : 110), tam: tt,
    anim: centro ? 'aparece' : lugaresAdel[i] < W / 2 ? 'entra-izq' : 'entra-der' });
});

function tarjeta(t) {
  if (!TITULO) return;
  const k = back(prog(t, T_TIT, T_TIT + .45)); if (k <= 0) return;
  const aj = autoajuste(TITULO, LETRA_LIMPIA, 800, 780, 3, 84, 48);
  const alto = aj.rs.length * aj.size * 1.16 + 96, y0 = 300, cx = W / 2;
  ctx.save(); ctx.translate(cx, y0 + alto / 2); ctx.scale(k, k); ctx.rotate(-.015); ctx.translate(-cx, -(y0 + alto / 2));
  ctx.fillStyle = 'rgba(0,0,0,.14)'; ctx.beginPath(); ctx.roundRect(cx - 440 + 12, y0 + 16, 880, alto, 34); ctx.fill();
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.roundRect(cx - 440, y0, 880, alto, 34); ctx.fill();
  ctx.lineWidth = 6; ctx.strokeStyle = PAL.tinta; ctx.stroke();
  // la píldora mide su texto: nombres largos («agente inmobiliario») ya no se cortan
  const pil = KIT.nombre.split(' /')[0].toUpperCase(); ctx.font = `800 26px ${LETRA_LIMPIA}`;
  const pw = Math.min(760, medir(pil, ctx.font) + 56);
  ctx.fillStyle = PAL.acento; ctx.beginPath(); ctx.roundRect(cx - pw / 2, y0 - 22, pw, 44, 22); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(pil, cx, y0 + 1);
  ctx.fillStyle = PAL.tinta; ctx.font = aj.font; ctx.textBaseline = 'alphabetic';
  aj.rs.forEach((r, i) => ctx.fillText(r, cx, y0 + 58 + aj.size * .85 + i * aj.size * 1.16));
  ctx.restore();
}

arrancar(frame => {
  const t = frame / FPS;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  // el escenario entra con un leve acercamiento
  const e = easeOut(prog(t, 0, T_ESC)), z = 1.06 - .06 * e;
  ctx.fillStyle = PAL.tinta; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = e; ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  escenario(KIT.escenario, t, { estilo: ESTILO, paleta: PAL });
  ctx.restore();
  ORDEN.forEach(o => dibujarObjeto(o.n, o.x, o.y, o.tam, { t: t - (T_OBJ + o.i * CADA), estilo: ESTILO, anim: o.anim, tinta: PAL.tinta }));
  tarjeta(t);   // encima: nada que cae la tapa
});
</script>
</body>
</html>
