<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Chat que vende</title>
<style>
  html,body{margin:0;background:#141210;display:grid;place-items:center;height:100vh}
  canvas{height:100vh;width:auto;max-width:100vw}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ====================== LO QUE PUEDES CAMBIAR ======================
// Los mensajes que llegan al celular, en orden. de: 'ella' (la clienta, izquierda) o 'tu' (derecha). Máx. 4, ≤ 45 letras c/u.
const MENSAJES = [
  { de: 'ella', txt: 'vi tu reel de ayer' },
  { de: 'ella', txt: '¿todavía tienes lugares?' },
  { de: 'tu',   txt: '¡sí! te paso el link' },
  { de: 'ella', txt: '¿cuánto cuesta? lo quiero' },
];
const NOMBRE = 'clienta nueva';                       // arriba del chat
const COLORES = {
  fondo: '#f3d9c4',    // detrás del celular
  celular: '#2a2630',  // el marco
  pantalla: '#fffaf2',
  ella: '#ece6f5',     // globo de la clienta
  tu: '#7b5cd6',       // tu globo
  tinta: '#2a2630',
};
// ===================================================================

const W = 1080, H = 1920, FPS = 30;
const T0 = .7, ESCRIBE = .55, PAUSA = .45;            // el celular entra; puntitos; respiro entre globos
const TIEMPOS = MENSAJES.map((m, i) => T0 + i * (ESCRIBE + PAUSA) + (m.de === 'ella' ? ESCRIBE : .15));
const DUR = +(TIEMPOS[TIEMPOS.length - 1] + 1.8).toFixed(2);
</script>
<script src="../nucleo/nucleo.js"></script>
<script>
const PAPEL = hacerPapel(COLORES.fondo, { fibras: false, viñeta: .18 });
const CEL = { x: 170, y: 290, w: 740, h: 1150 };      // dentro de la zona segura (250 arriba, 450 abajo)
const PANT = { x: CEL.x + 34, y: CEL.y + 120, w: CEL.w - 68, h: CEL.h - 190 };
const PAD = 34, ANCHO_GLOBO = PANT.w * .8;

// cada globo se mide una vez: renglones, alto, lado
// todos los globos con el MISMO tamaño de letra (el que le cabe al mensaje más largo)
const TAM = Math.min(...MENSAJES.map(m => autoajuste(m.txt, LETRA_LIMPIA, 600, ANCHO_GLOBO - 2 * PAD, 2, 50, 36).size));
const GLOBOS = MENSAJES.map(m => {
  const font = `600 ${TAM}px ${LETRA_LIMPIA}`, aj = { font, size: TAM, rs: renglones(m.txt, font, ANCHO_GLOBO - 2 * PAD) };
  if (aj.rs.length === 2) {                           // reparte parejo: nada de una palabra sola abajo
    const pal = m.txt.split(/\s+/); let mejor = null;
    for (let i = 1; i < pal.length; i++) { const x = pal.slice(0, i).join(' '), y = pal.slice(i).join(' ');
      const w = Math.max(medir(x, font), medir(y, font));
      if (w <= ANCHO_GLOBO - 2 * PAD && (!mejor || w < mejor.w)) mejor = { w, rs: [x, y] }; }
    if (mejor) aj.rs = mejor.rs;
  }
  const w = Math.max(...aj.rs.map(r => medir(r, font))) + 2 * PAD;
  return { ...m, aj, w, h: aj.rs.length * TAM * 1.25 + 2 * PAD - 8 };
});
const HUECO = 26;
const ALTO_TOTAL = GLOBOS.reduce((a, g) => a + g.h + HUECO, 0);

function celular(t) {
  const { x, y, w, h } = CEL;
  fill(roundRect(x + 18, y + 26, w, h, 80), 'rgba(40,20,20,.25)', { amp: 2 });
  fill(roundRect(x, y, w, h, 80), COLORES.celular, { amp: 1.5, seed: 3 });
  fill(roundRect(PANT.x, CEL.y + 34, PANT.w, h - 68, 52), COLORES.pantalla, { amp: 1.2, seed: 5 });
  fill(roundRect(x + w / 2 - 80, y + 44, 160, 34, 17), COLORES.celular, { amp: .8, seed: 7 });   // la isla
  // cabecera del chat
  fill(circle(PANT.x + 70, PANT.y + 10, 34), COLORES.tu, { amp: 1, seed: 8, alpha: .85 });
  ctx.save(); ctx.font = `700 40px ${LETRA_LIMPIA}`; ctx.fillStyle = COLORES.tinta; ctx.textBaseline = 'middle';
  ctx.fillText(NOMBRE, PANT.x + 122, PANT.y + 12); ctx.restore();
  ink(line(PANT.x + 20, PANT.y + 66, PANT.x + PANT.w - 20, PANT.y + 66), { w: 2.5, col: 'rgba(40,30,50,.25)', passes: 1, amp: 1 });
  ink(roundRect(x, y, w, h, 80), { closed: true, w: 4, col: 'rgba(0,0,0,.5)', passes: 1, amp: 1.2, seed: 3 });
}

function puntitos(x, y, t) {                          // «escribiendo…»
  fill(roundRect(x, y, 150, 84, 42), COLORES.ella, { amp: 1, seed: 40 });
  for (let k = 0; k < 3; k++) {
    const sube = Math.max(0, Math.sin(t * 12 - k * .9)) * 10;
    fill(circle(x + 42 + k * 33, y + 42 - sube, 10), 'rgba(60,50,80,.55)', { amp: .4, seed: 41 + k });
  }
}

function chat(t) {
  // cuánto han subido los globos: el último siempre queda abajo
  const visibles = GLOBOS.filter((g, i) => t >= TIEMPOS[i] - (g.de === 'ella' ? ESCRIBE : 0));
  const fondo = PANT.y + PANT.h - 40;
  let yAcum = 0; const pos = [];
  for (let i = 0; i < GLOBOS.length; i++) { pos.push(yAcum); yAcum += GLOBOS[i].h + HUECO; }
  // desplazamiento suave hacia el globo más nuevo
  let desp = 0;
  for (let i = 0; i < GLOBOS.length; i++) {
    const k = easeOut(prog(t, TIEMPOS[i] - (GLOBOS[i].de === 'ella' ? ESCRIBE : 0), TIEMPOS[i] - (GLOBOS[i].de === 'ella' ? ESCRIBE : 0) + .3));
    desp += k * (GLOBOS[i].h + HUECO);
  }
  ctx.save(); ctx.beginPath(); ctx.rect(PANT.x, PANT.y + 70, PANT.w, PANT.h - 70); ctx.clip();
  for (let i = 0; i < GLOBOS.length; i++) {
    const g = GLOBOS[i], ini = TIEMPOS[i] - (g.de === 'ella' ? ESCRIBE : 0);
    if (t < ini) break;
    const yTop = fondo - desp + pos[i];
    const izq = g.de === 'ella';
    const x = izq ? PANT.x + 28 : PANT.x + PANT.w - 28 - g.w;
    if (t < TIEMPOS[i]) { puntitos(x, yTop + (g.h - 84), t); continue; }
    const s = back(prog(t, TIEMPOS[i], TIEMPOS[i] + .32));
    const ox = izq ? x : x + g.w, oy = yTop + g.h;
    ctx.save(); ctx.translate(ox, oy); ctx.scale(s, s); ctx.translate(-ox, -oy);
    fill(roundRect(x, yTop, g.w, g.h, 40), izq ? COLORES.ella : COLORES.tu, { amp: 1.2, seed: 50 + i });
    ctx.font = g.aj.font; ctx.fillStyle = izq ? COLORES.tinta : '#ffffff'; ctx.textBaseline = 'alphabetic';
    g.aj.rs.forEach((r, j) => ctx.fillText(r, x + PAD, yTop + PAD + g.aj.size * .85 + j * g.aj.size * 1.25));
    ctx.restore();
  }
  ctx.restore();
}

arrancar(frame => {
  const t = frame / FPS;
  BOIL = Math.floor(frame / 4);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  ctx.drawImage(PAPEL, 0, 0);
  const entra = back(prog(t, 0, .6));
  const vibra = GLOBOS.some((g, i) => g.de === 'ella' && t > TIEMPOS[i] && t < TIEMPOS[i] + .18) ? Math.sin(t * 90) * 6 : 0;
  ctx.save(); ctx.translate(vibra, (1 - entra) * 1400); ctx.rotate(-.02 * (1 - entra));
  celular(t); chat(t);
  ctx.restore();
});
</script>
</body>
</html>
