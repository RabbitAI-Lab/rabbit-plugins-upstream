<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Texto cinético</title>
<style>
  html,body{margin:0;background:#141210;display:grid;place-items:center;height:100vh}
  canvas{height:100vh;width:auto;max-width:100vw}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ====================== LO QUE PUEDES CAMBIAR ======================
// La frase, tal cual se dice. La palabra clave va entre *asteriscos*: sale en su propio color, sobre una marca.
const TEXTO = 'si tuviera que llenar la agenda de una *pastelería*';
const ETIQUETA = '';                                  // píldora chiquita arriba del texto ('' = nada), p. ej. 'paso 1'
const ANIMACION = 'golpe';                            // 'golpe' (cada palabra cae con peso) | 'deslizar' (sube desde su renglón) | 'maquina' (letra por letra)
const COLORES = {
  fondo: '#ff9db0',     // color plano de fondo
  tinta: '#1d1a24',     // el texto
  marca: '#1d1a24',     // la caja detrás de la palabra clave
  acento: '#ffffff',    // la letra de la palabra clave
  formas: '#ffffff',    // las formas suaves del fondo (se ven muy tenues)
};
const QUIETO_AL_FINAL = 1.4;                          // segundos con todo el texto quieto antes de terminar
// ===================================================================

const W = 1080, H = 1920, FPS = 30;
// *tramo clave*: puede abarcar varias palabras; lo que está entre los asteriscos sale marcado
const PALABRAS = (() => { let dentro = false; return TEXTO.trim().split(/\s+/).map(p => {
  const abre = p.startsWith('*'), cierra = /\*[.,;:!?»]*$/.test(p) && (p.length > 1 || !abre);
  const clave = dentro || abre; if (abre) dentro = true; if (cierra) dentro = false;
  return { txt: p.replace(/\*/g, ''), clave }; }); })();
const LIMPIO = PALABRAS.map(p => p.txt).join(' ');
const T0 = .25;
const PASO = ANIMACION === 'maquina' ? 0 : Math.max(.09, Math.min(.2, 1.6 / PALABRAS.length));   // entre palabra y palabra
const LPS = 24;                                       // letras por segundo en 'maquina'
const T_FIN_TEXTO = ANIMACION === 'maquina' ? T0 + LIMPIO.length / LPS : T0 + (PALABRAS.length - 1) * PASO + .35;
const T_MARCA = T_FIN_TEXTO + .05;
const DUR = +(T_MARCA + .4 + QUIETO_AL_FINAL).toFixed(2);
</script>
<script src="../nucleo/nucleo.js"></script>
<script>
WOBBLE = .6;
const FONDO = (() => {                                 // color plano + grano sutil, pintado una vez
  const c = hacerPapel(COLORES.fondo, { fibras: false, viñeta: .12, semilla: 4 }), p = c.getContext('2d');
  p.globalAlpha = .07; p.fillStyle = COLORES.tinta;
  for (let y = 70; y < H; y += 60) for (let x = 70; x < W; x += 60) { p.beginPath(); p.arc(x, y, 2.2, 0, 7); p.fill(); }
  return c;
})();

// ---------- acomodo: renglones parejos, bloque centrado en la zona segura ----------
const ANCHO = 900;
const AJ = autoajuste(LIMPIO, LETRA_LIMPIA, 800, ANCHO, 5, 156, 64);
const ESP = medir(' ', AJ.font), INTER = AJ.size * 1.16;
const hayEtiqueta = !!ETIQUETA, ALTO_ET = hayEtiqueta ? 110 : 0;
const ALTO_BLOQUE = AJ.rs.length * INTER + ALTO_ET;
const CENTRO = (SEGURA.top + SEGURA.bottom) / 2;
const ARRIBA = CENTRO - ALTO_BLOQUE / 2 + ALTO_ET;
// cada palabra sabe su renglón, su x y a qué hora entra
let k = 0, letras = 0;
const PZ = [];
AJ.rs.forEach((r, i) => {
  const ps = r.split(' '), anchoR = medir(r, AJ.font); let x = W / 2 - anchoR / 2;
  ps.forEach(txt => { const pal = PALABRAS[k]; const w = medir(txt, AJ.font);
    PZ.push({ txt, clave: pal.clave, x, w, y: ARRIBA + i * INTER + AJ.size * .82, fila: i,
      t: ANIMACION === 'maquina' ? T0 + letras / LPS : T0 + k * PASO, letra0: letras });
    x += w + ESP; letras += txt.length + 1; k++; });
});
const CLAVES = PZ.filter(p => p.clave);

function formas(t) {                                   // dos círculos enormes que respiran y se detienen al final
  const q = ease(prog(t, 0, DUR - QUIETO_AL_FINAL));
  ctx.save(); ctx.globalAlpha = .12; ctx.fillStyle = COLORES.formas;
  ctx.beginPath(); ctx.arc(lerp(-80, 40, q), lerp(420, 380, q), 330, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(lerp(1180, 1060, q), lerp(1500, 1440, q), 420, 0, 7); ctx.fill();
  ctx.restore();
}

function etiqueta(t) {
  if (!hayEtiqueta) return;
  const e = back(prog(t, .05, .4)); if (e <= 0) return;
  ctx.save(); ctx.font = `700 40px ${LETRA_LIMPIA}`; const w = medir(ETIQUETA.toUpperCase(), ctx.font) + 64 + ETIQUETA.length * 3;
  const y = ARRIBA - ALTO_ET + 10; ctx.translate(W / 2, y + 30); ctx.scale(e, e);
  fill(roundRect(-w / 2, -32, w, 64, 32), COLORES.tinta, { amp: .6, seed: 3 });
  ctx.fillStyle = COLORES.fondo; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; if (ctx.letterSpacing !== undefined) ctx.letterSpacing = '3px';
  ctx.fillText(ETIQUETA.toUpperCase(), 0, 2); ctx.restore();
}

function marcas(t) {                                   // la caja de la palabra clave: se barre de izquierda a derecha
  const m = easeOut(prog(t, T_MARCA, T_MARCA + .35)); if (m <= 0) return;
  CLAVES.forEach((p, i) => {
    const pw = medir(p.txt.replace(/[.,;:!?»]+$/, ''), AJ.font);   // sin la puntuación final
    const pad = AJ.size * .16, x = p.x - pad, y = p.y - AJ.size * .9, w = (pw + 2 * pad) * m, h = AJ.size * 1.2;   // alcanza a cubrir p, g, y
    ctx.save(); ctx.translate(x, y + h / 2); ctx.rotate(-.018);
    fill(roundRect(0, -h / 2, Math.max(1, w), h, 14), COLORES.marca, { amp: 1.2, seed: 20 + i });
    ctx.restore();
  });
}

function palabras(t) {
  ctx.save(); ctx.font = AJ.font; ctx.textBaseline = 'alphabetic';
  const m = prog(t, T_MARCA + .1, T_MARCA + .3);
  for (const p of PZ) {
    const col = p.clave && m > 0 ? COLORES.acento : COLORES.tinta;
    if (ANIMACION === 'maquina') {
      const n = Math.floor((t - T0) * LPS) - p.letra0; if (n <= 0) continue;
      ctx.fillStyle = col; ctx.fillText(p.txt.slice(0, n), p.x, p.y);
      continue;
    }
    const e = prog(t, p.t, p.t + (ANIMACION === 'golpe' ? .28 : .42)); if (e <= 0) continue;
    ctx.save();
    if (ANIMACION === 'golpe') {                         // cada palabra brota con rebote; la clave cae desde grande (el golpe)
      const esc = p.clave ? lerp(2.1, 1, back(e)) : lerp(.35, 1, back(e));
      ctx.globalAlpha = clamp(e * 3);
      ctx.translate(p.x + p.w / 2, p.y - AJ.size * .3); ctx.scale(esc, esc); ctx.translate(-(p.x + p.w / 2), -(p.y - AJ.size * .3));
    } else {                                             // deslizar: sube desde debajo de su renglón, recortada
      ctx.beginPath(); ctx.rect(p.x - 20, p.y - AJ.size * 1.02, p.w + 40, AJ.size * 1.34); ctx.clip();
      ctx.translate(0, (1 - easeOut(e)) * AJ.size * 1.2);
    }
    const cuerpo = p.clave ? p.txt.replace(/[.,;:!?»]+$/, '') : p.txt, cola = p.txt.slice(cuerpo.length);
    if (ANIMACION === 'golpe') { const g = (hash2(p.x, p.y) - .5) * .16 * (1 - clamp(back(e))); ctx.translate(p.x + p.w / 2, p.y); ctx.rotate(g); ctx.translate(-(p.x + p.w / 2), -p.y); }
    if (!(p.clave && m > 0)) { ctx.save(); ctx.globalAlpha *= .16; ctx.fillStyle = COLORES.tinta; ctx.fillText(cuerpo, p.x + AJ.size * .045, p.y + AJ.size * .055); ctx.restore(); }   // sombra dura
    ctx.fillStyle = col; ctx.fillText(cuerpo, p.x, p.y);
    if (cola) { ctx.fillStyle = COLORES.tinta; ctx.fillText(cola, p.x + medir(cuerpo, AJ.font) + (p.clave ? AJ.size * .1 : 0), p.y); }
    ctx.restore();
  }
  // cursor de la máquina: late mientras escribe y se va al terminar
  if (ANIMACION === 'maquina' && t < T_FIN_TEXTO + .6) {
    const n = Math.max(0, Math.floor((t - T0) * LPS)); let ult = PZ[0], resto = 0;
    for (const p of PZ) if (n >= p.letra0) { ult = p; resto = Math.min(p.txt.length, n - p.letra0); }
    if (Math.floor(t * 3) % 2 === 0 || t < T_FIN_TEXTO) { ctx.fillStyle = COLORES.tinta;
      ctx.fillRect(ult.x + medir(ult.txt.slice(0, resto), AJ.font) + 6, ult.y - AJ.size * .78, AJ.size * .09, AJ.size * .92); }
  }
  ctx.restore();
}

function brillos(t) {                                  // 3 rayitas de «brillo» a mano junto a la primera palabra clave
  if (!CLAVES.length) return;
  const b = easeOut(prog(t, T_MARCA + .3, T_MARCA + .6)); if (b <= 0) return;
  const ult = CLAVES[CLAVES.length - 1], der = ult.x + medir(ult.txt.replace(/[.,;:!?»]+$/, ''), AJ.font) + AJ.size * .32;
  // a la derecha de la clave; si no cabe, a la izquierda (espejo); si tampoco, sobre la esquina de arriba de la caja
  const pri = CLAVES[0], izq = pri.x - AJ.size * .32;
  const lado = der + AJ.size * .5 < W - 30 ? 'der' : izq - AJ.size * .5 > 30 ? 'izq' : 'arriba';
  const cx = lado === 'der' ? der : lado === 'izq' ? izq : der - AJ.size * .5, cy = lado === 'izq' ? pri.y - AJ.size * .95 : lado === 'der' ? ult.y - AJ.size * .95 : ult.y - AJ.size * 1.02;
  const angs = lado === 'arriba' ? [[-2.0, .8], [-1.5, 1], [-1.0, .75]] : [[-.9, 1], [-.35, .8], [.2, .62]].map(([a, l]) => [lado === 'der' ? a : Math.PI - a, l]);
  angs.forEach(([a, l], i) => {
    const r0 = AJ.size * .16, r1 = AJ.size * (.16 + .34 * l);
    drawOn(resample([[cx + Math.cos(a) * r0, cy + Math.sin(a) * r0], [cx + Math.cos(a) * r1, cy + Math.sin(a) * r1]], 6), b, { w: AJ.size * .07, col: COLORES.marca, amp: 1, seed: 40 + i, passes: 1 });
  });
}

arrancar(frame => {
  const t = frame / FPS;
  BOIL = Math.floor(frame / 4);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  // golpe de cámara cuando cae la palabra clave (solo en 'golpe')
  const tc = CLAVES.length && ANIMACION === 'golpe' ? t - (CLAVES[0].t + .2) : -1;
  if (tc > 0 && tc < .3) { const a = (1 - tc / .3) * 9; ctx.translate(Math.sin(tc * 70) * a, Math.cos(tc * 55) * a); }
  ctx.drawImage(FONDO, 0, 0);
  formas(t);
  // acercamiento lentísimo mientras la frase se sostiene; frena en seco al final (el último cuadro queda quieto)
  const z = 1 + .035 * easeOut(prog(t, T_MARCA, DUR));
  ctx.translate(W / 2, CENTRO); ctx.scale(z, z); ctx.translate(-W / 2, -CENTRO);
  etiqueta(t);
  marcas(t);
  palabras(t);
  brillos(t);
});
</script>
</body>
</html>
