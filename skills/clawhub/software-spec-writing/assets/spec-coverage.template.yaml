# spec-coverage.yaml —— 涵蓋度常駐檔案（範本）
#
# status 五選一：confirmed | draft | tbd | n/a | missing
#   confirmed  使用者確認過，已寫入文件            → 必填 file
#   draft      已寫入文件但未確認                  → 必填 file、note（缺什麼）
#   tbd        知道需要但尚未決定，不寫入文件      → 必填 note（誰決定什麼）、owner
#   n/a        本專案不適用，不寫入文件            → 必填 note（理由）
#   missing    尚未討論過，不寫入文件              → 由 Agent 主動標記
#
# 規則：項目只改狀態、不刪除；只做增量更新、不重建。
#      變更項目代號需要人類授權，見 SKILL.md〈項目代號的變更〉。

