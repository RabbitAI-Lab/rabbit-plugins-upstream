interface:
  display_name: "MaybeAI Sheet CLI"
  short_description: "Inspect, import, edit, dashboard, template, and share MaybeAI spreadsheets"
  default_prompt: "Use $maybeai-sheet-cli with the mbs command to inspect workbook metadata, import local or remote-URL XLS/XLSX, CSV/TSV, and Google Sheet sources through Sheet or Base mode, natively copy Base-or-Sheet worksheets between workbooks, append selected worksheets into existing workbooks, safely replace worksheet data with mbs sheet update-data-keep-headers while retaining row 1 and formula columns, read or update ranges, work with excel-table and base-table data, preserve formulas, trace lineage, style worksheets, manage chart/image CRUD, orchestrate worksheet-level dashboards, export files, and manage sharing in MaybeAI. For full worksheet refreshes, run --dry-run first and --verify on execution; numeric-looking strings may normalize as Sheet values. For Base-backed field formatter/color/width/header metadata, use mbs base-table field list followed by native mbs base-table field update --table-id --field-id --verify; width persists as field.property.style.width, not views[*].field_widths. For automatic report polish, prefer mbs style beautify. Treat worksheet images as floating chart-like objects: use picture format JSON for position/size and verify with image list plus media check. For dashboard-first or chart-authoring workflows, use $sheet-dashboard."
