interface:
  display_name: "MaybeAI Sheet CLI"
  short_description: "Inspect, import, edit, dashboard, template, and share MaybeAI spreadsheets"
  default_prompt: "Use $maybeai-sheet-cli with the mbs command to inspect workbook metadata, import local or remote-URL XLS/XLSX, CSV/TSV, and Google Sheet sources through Sheet or Base mode, natively copy Base-or-Sheet worksheets between workbooks, append selected worksheets into existing workbooks, read or update worksheet ranges and table-shaped data, preserve formulas, trace lineage, style worksheets, manage chart/image CRUD, orchestrate worksheet-level dashboards, export files, and manage sharing in MaybeAI. For full worksheet refreshes, run --dry-run first and --verify on execution; numeric-looking strings may normalize as Sheet values. For Base-backed field metadata, use the documented `column` operations only when their public contract covers the requested property; otherwise report the capability gap instead of invoking a hidden compatibility command. For automatic report polish, prefer mbs worksheet beautify. Treat worksheet images as floating chart-like objects: use picture format JSON for position/size and verify with image list plus media check. For dashboard-first or chart-authoring workflows, use $sheet-dashboard."
