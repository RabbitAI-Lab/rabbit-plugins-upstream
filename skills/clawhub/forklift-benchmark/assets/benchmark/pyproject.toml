[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forklift-benchmark-v2"
version = "2.0.0"
description = "Forklift Embodied Intelligence Benchmark v2 — a 500-item evaluation suite for LLM/VLM agents operating counterbalance forklifts in industrial scenarios."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Forklift Embodied Intelligence Benchmark Authors" },
]
keywords = [
    "forklift",
    "embodied-ai",
    "benchmark",
    "logistics",
    "vlm",
    "llm",
    "safety",
    "evaluation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]
examples = [
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/forklift-benchmark/forklift-benchmark-v2"
Issues = "https://github.com/forklift-benchmark/forklift-benchmark-v2/issues"
Documentation = "https://github.com/forklift-benchmark/forklift-benchmark-v2/tree/main/docs"
Changelog = "https://github.com/forklift-benchmark/forklift-benchmark-v2/blob/main/CHANGELOG.md"

[project.scripts]
forklift-benchmark = "forklift_benchmark.cli:main"

[tool.setuptools]
packages = ["forklift_benchmark", "dsl", "generator", "validator", "scorer"]
include-package-data = true

[tool.setuptools.package-data]
forklift_benchmark = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]
