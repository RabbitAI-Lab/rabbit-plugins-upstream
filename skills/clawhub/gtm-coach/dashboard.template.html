<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GTM Coach dashboard</title>
  <style>
    :root {
      --bg: #0b1020;
      --bg2: #121a2e;
      --panel: #151d32;
      --line: rgba(255,255,255,.08);
      --text: #e8eef8;
      --muted: #8b9bb4;
      --violet: #8b5cf6;
      --cyan: #22d3ee;
      --good: #34d399;
      --warn: #fbbf24;
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body {
      font: 15px/1.5 "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      min-height: 100vh;
    }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 32px 20px 64px; }
    .banner {
      display: none;
      margin-bottom: 18px;
      padding: 12px 14px;
      border: 1px solid rgba(251,191,36,.35);
      background: rgba(251,191,36,.08);
      border-radius: 12px;
      color: #fde68a;
      font-size: 13px;
    }
    .banner.show { display: block; }
    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: auto auto auto;
      column-gap: 16px;
      row-gap: 0;
      margin-bottom: 28px;
      align-items: start;
    }
    .kicker {
      letter-spacing: .14em;
      text-transform: uppercase;
      font-size: 11px;
      color: var(--muted);
      font-weight: 700;
    }
    header > .kicker { grid-column: 1; grid-row: 1; }
    h1 { margin: 6px 0 0; font-size: 32px; letter-spacing: -.03em; }
    header > h1 { grid-column: 1; grid-row: 2; }
    .sub { color: var(--muted); margin-top: 6px; max-width: 52ch; }
    header > .sub { grid-column: 1; grid-row: 3; }
    .header-tools {
      grid-column: 2;
      grid-row: 3;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      align-self: start;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
    .share-row {
      display: none;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }
    .share-row.show { display: flex; }
    button, .ghost {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 14px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    button.primary { background: var(--violet); border-color: transparent; font-weight: 650; }
    button:hover, .ghost:hover { border-color: rgba(255,255,255,.2); }
    .hero {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 22px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        radial-gradient(1200px 280px at 10% -40%, rgba(139,92,246,.18), transparent 50%),
        var(--bg2);
      margin-bottom: 18px;
    }
    .ring-wrap { position: relative; width: 176px; height: 176px; margin: 0 auto; }
    .ring { width: 176px; height: 176px; display: block; }
    .ring-label {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      pointer-events: none; text-align: center;
    }
    .ring-label strong { display: block; font-size: 36px; letter-spacing: -.04em; }
    .ring-label span { color: var(--cyan); font-size: 13px; font-weight: 650; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
    .chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      color: var(--muted);
    }
    .chip.on { color: var(--text); border-color: rgba(139,92,246,.45); background: rgba(139,92,246,.12); }
    .stages { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 18px; }
    .stage {
      padding: 10px 8px;
      border-radius: 12px;
      border: 1px solid var(--line);
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      text-transform: capitalize;
    }
    .stage.done { color: var(--good); border-color: rgba(52,211,153,.25); }
    .stage.now {
      color: var(--text);
      border-color: rgba(34,211,238,.4);
      background: rgba(34,211,238,.08);
      font-weight: 700;
    }
    .grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 18px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px;
    }
    .card h2 { margin: 0 0 12px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .bet { font-size: 18px; letter-spacing: -.02em; margin: 0 0 12px; }
    dl { display: grid; grid-template-columns: 120px 1fr; gap: 8px 12px; margin: 0; }
    dt { color: var(--muted); font-size: 13px; }
    dd { margin: 0; }
    .tasks { list-style: none; padding: 0; margin: 0; }
    .tasks li {
      display: flex; gap: 10px; align-items: flex-start;
      padding: 10px 0;
      border-top: 1px solid var(--line);
    }
    .tasks li:first-child { border-top: 0; padding-top: 0; }
    .box {
      width: 16px; height: 16px; margin-top: 3px; border-radius: 4px;
      border: 1px solid var(--muted); flex: none;
    }
    .box.done { background: var(--good); border-color: var(--good); }
    .box.doing { background: var(--warn); border-color: var(--warn); }
    .dim { margin: 14px 0 0; }
    .dim-row { display: grid; grid-template-columns: 180px 1fr 40px; gap: 10px; align-items: center; margin: 10px 0; font-size: 13px; }
    .bar { height: 8px; background: rgba(255,255,255,.06); border-radius: 99px; overflow: hidden; }
    .bar > i { display: block; height: 100%; background: var(--violet); border-radius: 99px; }
    .miles { display: grid; gap: 8px; }
    .mile {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px;
    }
    .mile.done { border-color: rgba(52,211,153,.3); }
    .posts { display: grid; gap: 10px; }
    .post {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
      padding: 12px 14px;
      border-left: 2px solid var(--violet);
      background: rgba(255,255,255,.03);
      border-radius: 0 12px 12px 0;
    }
    .post-body { white-space: pre-wrap; }
    .post-tools { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .icon-btn {
      width: 32px; height: 32px; padding: 0; border-radius: 8px;
      display: grid; place-items: center; color: var(--muted);
      text-decoration: none; flex: none;
    }
    .icon-btn svg { width: 15px; height: 15px; }
    .icon-btn:hover { color: var(--text); border-color: rgba(255,255,255,.2); }
    .icon-btn.copied { color: var(--good); border-color: rgba(52,211,153,.4); }
    .bip-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .bip-head h2 { margin-bottom: 4px; }
    footer { margin-top: 28px; color: var(--muted); font-size: 12px; }
    footer a { color: var(--cyan); }
    .full { grid-column: 1 / -1; }
    .empty { color: var(--muted); }
    @media (max-width: 840px) {
      .hero, .grid { grid-template-columns: 1fr; }
      .stages { grid-template-columns: repeat(3, 1fr); }
      header { grid-template-columns: 1fr; }
      .header-tools { grid-column: 1; grid-row: 4; align-items: flex-start; margin-top: 12px; }
      .actions, .share-row { justify-content: flex-start; }
      .post { grid-template-columns: 1fr; }
    }
    @media print {
      body { background: #fff; color: #111; }
      .actions, .banner, .post-tools, .share-row { display: none !important; }
      .card, .hero { background: #fff; border-color: #ddd; }
      .sub, .kicker, dt, .stage, footer { color: #555; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="banner" class="banner">This is the skill template. Ask GTM Coach to generate <code>.gtm/dashboard.html</code> from your plan — demo data is shown below.</div>
    <header>
      <div class="kicker">GTM Coach · local board</div>
      <h1 id="productName">Project</h1>
      <p class="sub" id="oneLiner"></p>
      <div class="header-tools">
        <div class="actions">
          <button class="primary" id="copyMd">Copy scorecard Markdown</button>
          <button id="png">Download PNG card</button>
          <button id="print">Print / PDF</button>
        </div>
        <div class="share-row" id="shareRow">
          <span class="kicker">Share draft</span>
          <div class="post-tools js-share-all"></div>
        </div>
      </div>
    </header>

    <section class="hero">
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="10" />
          <circle id="arc" cx="60" cy="60" r="52" fill="none" stroke="#22d3ee" stroke-width="10" stroke-linecap="round" transform="rotate(-90 60 60)" />
        </svg>
        <div class="ring-label">
          <strong id="scoreTotal">0</strong>
          <span id="scoreLabel">GTM forming</span>
        </div>
      </div>
      <div>
        <div class="kicker" id="weekMeta"></div>
        <p id="constraint" class="bet"></p>
        <div class="chips" id="chips"></div>
        <div class="stages" id="stages"></div>
      </div>
    </section>

    <div class="grid">
      <section class="card">
        <h2>This week</h2>
        <p class="bet" id="bet"></p>
        <dl id="weekDl"></dl>
      </section>
      <section class="card">
        <h2>Tasks</h2>
        <ul class="tasks" id="tasks"></ul>
      </section>
      <section class="card">
        <h2>Readiness dimensions</h2>
        <div class="dim" id="dims"></div>
      </section>
      <section class="card">
        <h2>Milestones</h2>
        <div class="miles" id="miles"></div>
      </section>
      <section class="card full" id="bipCard" hidden>
        <div class="bip-head">
          <div>
            <h2>Build-in-Public draft</h2>
            <p class="sub" id="bipMeta"></p>
          </div>
          <div class="post-tools js-share-all"></div>
        </div>
        <div class="posts" id="posts"></div>
      </section>
    </div>
    <footer>
      <a href="https://www.nichestarter.ai/gtm-coach">nichestarter.ai/gtm-coach</a>
    </footer>
  </div>

  <script>
    window.GTM_DASHBOARD = "__FILL_FROM_PLAN__";
    window.GTM_DASHBOARD_DEMO = {
      generated_at: "2026-09-17",
      week: "2026-W38",
      product: {
        name: "Acme Invoice Reminders",
        one_liner: "Helps freelance bookkeepers get paid on time without becoming a collections desk.",
        icp: "Freelance bookkeepers chasing late invoices by hand",
        project_type: "MICRO_SAAS",
        url: null
      },
      strategy: {
        period: "validate",
        confirmed: true,
        evidence: "anecdote",
        primary_channel: "indiehackers",
        note: "Manual reminder workflow is the offer this week."
      },
      focus: "Two qualified conversations from one honest process post",
      constraint: "No qualified conversations yet — ICP is named, offer is still a manual reminder workflow.",
      this_week: {
        theme: "Name the job, then talk to two bookkeepers",
        bet: "Because bookkeepers already swap invoice-chasing stories in founder communities, one honest process post should produce 2 qualified conversations.",
        metric: "qualified conversations",
        target: "2",
        review_on: "2026-09-21",
        decision: "pending",
        waiting_on: "Publish the Indie Hackers process post",
        micro_tasks: [
          { id: "mt_1", title: "Confirm ICP wording with one bookkeeper", status: "done" },
          { id: "mt_2", title: "Write the process post from a real incident", status: "doing" },
          { id: "mt_3", title: "Ask two people for a 15-minute walkthrough", status: "todo" }
        ]
      },
      scorecard: {
        total: 62,
        label: "GTM in motion",
        dimensions: {
          picture_clarity: 80,
          evidence: 25,
          channel_commitment: 50,
          weekly_execution: 80,
          learning_loop: 75
        }
      },
      milestones: [
        { id: "picture_confirmed", label: "GTM picture confirmed", status: "done", done_at: "2026-09-17" },
        { id: "channel_committed", label: "Primary channel chosen", status: "done", done_at: "2026-09-17" },
        { id: "week_reviewed", label: "Weekly review closed", status: "todo", done_at: null },
        { id: "evidence_upgraded", label: "Evidence ladder moved up", status: "todo", done_at: null },
        { id: "replies_10", label: "10 community replies in 7 days", status: "todo", done_at: null }
      ],
      share: {
        signature_enabled: true,
        bip: {
          trigger: "picture_confirmed",
          channel: "x",
          posts: [
            "We finally wrote the GTM picture down: freelance bookkeepers who still chase late invoices by hand. The job is “get paid on time without becoming a collections desk.”",
            "What we are not claiming: no waitlist, no revenue, no “validated” score. Evidence is still anecdote. The weekly bet is two qualified conversations, not impressions.",
            "If you run a practice and invoice follow-up eats the week — how do you handle the awkward second reminder without souring the client?"
          ]
        }
      }
    };

    const STAGES = ["validate", "build", "cold_start", "launch", "promote", "monitor"];
    const DIMS = [
      ["picture_clarity", "Picture clarity"],
      ["evidence", "Evidence"],
      ["channel_commitment", "Channel commitment"],
      ["weekly_execution", "Weekly execution"],
      ["learning_loop", "Learning loop"]
    ];
    const isFilled = typeof window.GTM_DASHBOARD === "object" && window.GTM_DASHBOARD && window.GTM_DASHBOARD.product;
    const data = isFilled ? window.GTM_DASHBOARD : window.GTM_DASHBOARD_DEMO;
    if (!isFilled) document.getElementById("banner").classList.add("show");

    function esc(s) {
      return String(s == null || s === "" ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function dash(s, fallback) {
      const v = (s == null ? "" : String(s)).trim();
      return v ? esc(v) : '<span class="empty">' + (fallback || "Not set") + "</span>";
    }

    document.getElementById("productName").textContent = data.product.name || "Untitled project";
    document.getElementById("oneLiner").textContent = data.product.one_liner || "";
    document.getElementById("weekMeta").textContent = [data.week, "updated " + (data.generated_at || "")].filter(Boolean).join(" · ");
    document.getElementById("constraint").textContent = data.constraint || data.focus || "Confirm the GTM picture before scaling activity.";
    document.getElementById("scoreTotal").textContent = String(data.scorecard.total);
    document.getElementById("scoreLabel").textContent = data.scorecard.label || "GTM forming";

    const circ = 2 * Math.PI * 52;
    const arc = document.getElementById("arc");
    const pct = Math.max(0, Math.min(100, Number(data.scorecard.total) || 0)) / 100;
    arc.setAttribute("stroke-dasharray", circ.toFixed(2));
    arc.setAttribute("stroke-dashoffset", (circ * (1 - pct)).toFixed(2));

    const chips = [
      data.strategy.period,
      data.product.project_type,
      "evidence: " + data.strategy.evidence,
      "channel: " + data.strategy.primary_channel,
      data.strategy.confirmed ? "confirmed" : "awaiting confirm"
    ];
    document.getElementById("chips").innerHTML = chips.map((c, i) =>
      '<span class="chip' + (i === 0 || c === "confirmed" ? " on" : "") + '">' + esc(c) + "</span>"
    ).join("");

    const now = STAGES.indexOf(data.strategy.period);
    document.getElementById("stages").innerHTML = STAGES.map((id, i) => {
      const cls = i < now ? " done" : i === now ? " now" : "";
      return '<div class="stage' + cls + '">' + esc(id.split("_").join(" ")) + "</div>";
    }).join("");

    document.getElementById("bet").textContent = data.this_week.bet || data.focus || "No weekly bet yet.";
    const rows = [
      ["Theme", data.this_week.theme],
      ["Success", [data.this_week.metric, data.this_week.target].filter(Boolean).join(" · ")],
      ["Review", data.this_week.review_on],
      ["Decision", data.this_week.decision],
      ["Waiting on", data.this_week.waiting_on]
    ];
    document.getElementById("weekDl").innerHTML = rows.map(([k, v]) =>
      "<dt>" + k + "</dt><dd>" + dash(v) + "</dd>"
    ).join("");

    const tasks = data.this_week.micro_tasks || [];
    document.getElementById("tasks").innerHTML = tasks.length
      ? tasks.map((t) => '<li><span class="box ' + esc(t.status) + '"></span><span>' + esc(t.title) + "</span></li>").join("")
      : '<li class="empty">No micro-tasks this week.</li>';

    const dim = data.scorecard.dimensions || {};
    document.getElementById("dims").innerHTML = DIMS.map(([key, label]) => {
      const n = Math.max(0, Math.min(100, Number(dim[key]) || 0));
      return '<div class="dim-row"><span>' + label + '</span><div class="bar"><i style="width:' + n + '%"></i></div><strong>' + n + "</strong></div>";
    }).join("");

    document.getElementById("miles").innerHTML = (data.milestones || []).map((m) =>
      '<div class="mile' + (m.status === "done" ? " done" : "") + '"><span>' + esc(m.label) + "</span><span>" +
      esc(m.status === "done" ? (m.done_at || "done") : "todo") + "</span></div>"
    ).join("") || '<p class="empty">No milestones stored.</p>';

    const SIGNATURE = "Via gtm_coach by nichestarter.ai";
    const SHARE_URL = (data.product && data.product.url) || "https://www.nichestarter.ai/gtm-coach";

    function isSignatureLine(s) {
      return String(s || "").trim().replace(/^[\d.]+\s*/, "") === SIGNATURE;
    }
    function visiblePosts(list) {
      return (list || []).map(function (p) { return String(p || "").trim(); }).filter(function (p) { return p && !isSignatureLine(p); });
    }
    function withSignature(text) {
      const t = String(text || "").trim();
      if (!t) return SIGNATURE;
      if (t.indexOf(SIGNATURE) !== -1) return t;
      return t + "\n\n" + SIGNATURE;
    }
    function threadText(list) {
      return withSignature(list.map(function (p, i) { return (i + 1) + ". " + p; }).join("\n\n"));
    }
    const ICONS = {
      copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
      x: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.727-8.835L1.254 2.25H8.08l4.253 5.622L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>',
      linkedin: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-4.125 0 2.062 2.062 0 014.125 0zM7.119 20.452H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>',
      facebook: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5.02 3.66 9.18 8.44 9.94v-7.03H7.9v-2.91h2.54V9.84c0-2.5 1.49-3.89 3.78-3.89 1.09 0 2.24.2 2.24.2v2.47h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.44 2.91h-2.34V22c4.78-.76 8.44-4.92 8.44-9.94z"/></svg>',
      threads: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.3 11.27c-.12-2.37-1.42-3.72-3.6-3.8-1.5-.06-2.75.62-3.28 1.79l1.56.67c.32-.7 1.03-1.07 2.02-1.03 1.18.05 1.86.66 1.96 1.84-1.13-.19-2.34-.15-3.5.14-1.86.46-3.06 1.7-2.97 3.5.08 1.64 1.2 2.73 2.9 2.73 1.1 0 1.98-.42 2.63-1.25.48.35 1.04.6 1.7.77l.5-1.52a3.7 3.7 0 01-1.17-.62c.16-.37.25-.8.25-1.3v-.02zm-3.05 3.36c-.86 0-1.4-.5-1.44-1.22-.05-.9.66-1.48 2.2-1.86.62-.16 1.2-.24 1.73-.26-.14 1.86-1.08 3.34-2.49 3.34zM12.02 2C6.49 2 2 6.48 2 12s4.49 10 10.02 10C17.52 22 22 17.52 22 12S17.52 2 12.02 2zm.1 16.55c-1.9 0-3.33-.7-4.25-2.07l1.57-1.1c.62.92 1.58 1.38 2.76 1.38 2.32 0 3.9-1.5 4.18-4.02h-1.7c-.23 1.6-1.2 2.52-2.56 2.52z"/></svg>'
    };
    function toolBtn(act, i, label, icon) {
      return '<button type="button" class="icon-btn" data-act="' + act + '" data-i="' + i + '" title="' + label + '" aria-label="' + label + '">' + icon + "</button>";
    }
    function copyBtn(i) {
      return toolBtn("copy", i, "Copy draft", ICONS.copy);
    }
    function shareTools() {
      return copyBtn("all")
        + toolBtn("x", "all", "Share on X", ICONS.x)
        + toolBtn("linkedin", "all", "Copy and share on LinkedIn", ICONS.linkedin)
        + toolBtn("facebook", "all", "Copy and share on Facebook", ICONS.facebook)
        + toolBtn("threads", "all", "Share on Threads", ICONS.threads);
    }

    const bip = data.share && data.share.bip;
    const draftPosts = visiblePosts(bip && bip.posts);
    if (draftPosts.length) {
      document.getElementById("bipCard").hidden = false;
      document.getElementById("bipMeta").textContent = [bip.channel, bip.trigger].filter(Boolean).join(" · ") + " · founder publishes";
      document.querySelectorAll(".js-share-all").forEach(function (el) { el.innerHTML = shareTools(); });
      document.getElementById("shareRow").classList.add("show");
      document.getElementById("posts").innerHTML = draftPosts.map(function (p, i) {
        return '<div class="post"><div class="post-body"><strong>' + (i + 1) + ".</strong> " + esc(p) + '</div><div class="post-tools">' + copyBtn(i) + "</div></div>";
      }).join("");
    }

    function payloadFor(i) {
      if (String(i) === "all") return threadText(draftPosts);
      return withSignature(draftPosts[Number(i)] || "");
    }
    async function copyText(text) {
      await navigator.clipboard.writeText(text);
    }
    function openShare(act, text) {
      const enc = encodeURIComponent(text);
      const url = encodeURIComponent(SHARE_URL);
      const href = act === "x" ? "https://x.com/intent/tweet?text=" + enc
        : act === "threads" ? "https://www.threads.net/intent/post?text=" + enc
        : act === "linkedin" ? "https://www.linkedin.com/sharing/share-offsite/?url=" + url
        : "https://www.facebook.com/sharer/sharer.php?u=" + url + "&quote=" + enc;
      window.open(href, "_blank", "noopener,noreferrer");
    }
    async function onShareClick(btn) {
      const act = btn.getAttribute("data-act");
      const text = payloadFor(btn.getAttribute("data-i"));
      if (!text) return;
      if (act === "copy") {
        await copyText(text);
        btn.classList.add("copied");
        btn.title = "Copied";
        setTimeout(function () { btn.classList.remove("copied"); btn.title = "Copy draft"; }, 1400);
        return;
      }
      if (act === "linkedin" || act === "facebook") {
        await copyText(text);
        btn.classList.add("copied");
        setTimeout(function () { btn.classList.remove("copied"); }, 1400);
      }
      openShare(act, text);
    }
    document.getElementById("posts").addEventListener("click", function (e) {
      const btn = e.target.closest("[data-act]");
      if (btn) onShareClick(btn);
    });
    document.querySelectorAll(".js-share-all").forEach(function (el) {
      el.addEventListener("click", function (e) {
        const btn = e.target.closest("[data-act]");
        if (btn) onShareClick(btn);
      });
    });

    function scorecardMd() {
      const lines = DIMS.map(([key, label]) => "| " + label + " | " + (dim[key] || 0) + " |");
      return [
        "# GTM readiness — " + (data.product.name || "Project"),
        "",
        "**" + data.scorecard.total + "/100 · " + data.scorecard.label + "** · " +
          data.strategy.period + " · " + (data.product.icp || "ICP unset"),
        "",
        "| Dimension | Score |",
        "| --- | --- |",
        ...lines,
        "",
        "**This week:** " + (data.this_week.bet || data.focus || ""),
        "",
        "**Constraint:** " + (data.constraint || ""),
        "",
        "_Via gtm_coach by nichestarter.ai · " + (data.generated_at || "") + "_"
      ].join("\n");
    }

    function toast(btn, ok) {
      const prev = btn.textContent;
      btn.textContent = ok;
      setTimeout(() => { btn.textContent = prev; }, 1400);
    }

    document.getElementById("copyMd").onclick = async function () {
      await navigator.clipboard.writeText(scorecardMd());
      toast(this, "Copied");
    };
    document.getElementById("print").onclick = function () { window.print(); };

    document.getElementById("png").onclick = function () {
      const w = 1200, h = 630;
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#0b1020";
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#8b5cf6";
      ctx.fillRect(0, 0, 10, h);
      ctx.fillStyle = "#8b9bb4";
      ctx.font = "600 22px Segoe UI, sans-serif";
      ctx.fillText("GTM READINESS", 64, 78);
      ctx.fillStyle = "#e8eef8";
      ctx.font = "700 48px Segoe UI, sans-serif";
      ctx.fillText((data.product.name || "Project").slice(0, 42), 64, 140);
      ctx.fillStyle = "#22d3ee";
      ctx.font = "700 92px Segoe UI, sans-serif";
      ctx.fillText(String(data.scorecard.total) + "/100", 64, 250);
      ctx.fillStyle = "#e8eef8";
      ctx.font = "650 28px Segoe UI, sans-serif";
      ctx.fillText(data.scorecard.label, 64, 300);
      ctx.fillStyle = "#8b9bb4";
      ctx.font = "22px Segoe UI, sans-serif";
      ctx.fillText([data.strategy.period, data.product.icp || "ICP unset"].join(" · ").slice(0, 70), 64, 344);
      DIMS.forEach(function (pair, i) {
        const y = 400 + i * 34;
        const n = Math.max(0, Math.min(100, Number(dim[pair[0]]) || 0));
        ctx.fillStyle = "#8b9bb4";
        ctx.font = "18px Segoe UI, sans-serif";
        ctx.fillText(pair[1], 64, y);
        ctx.fillStyle = "rgba(255,255,255,.08)";
        ctx.fillRect(280, y - 14, 720, 10);
        ctx.fillStyle = "#8b5cf6";
        ctx.fillRect(280, y - 14, 7.2 * n, 10);
        ctx.fillStyle = "#e8eef8";
        ctx.fillText(String(n), 1020, y);
      });
      ctx.fillStyle = "#8b9bb4";
      ctx.font = "16px Segoe UI, sans-serif";
      ctx.fillText("Via gtm_coach by nichestarter.ai", 64, 600);
      const a = document.createElement("a");
      a.download = "gtm-scorecard.png";
      a.href = c.toDataURL("image/png");
      a.click();
    };
  </script>
</body>
</html>
