name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a finding in a dependency-less codebase still surfaces if the
    # querypacks change.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: python
          # The scripts are plain standard-library CLI tools; the default
          # query set plus security-extended is enough and keeps runtime short.
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:python'
