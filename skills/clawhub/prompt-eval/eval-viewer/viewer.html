<style>
:root{--ink:#162033;--muted:#667085;--line:#e4e9f1;--page:#f4f7fb;--panel:#fff;--brand:#315dd8;--brand-soft:#edf2ff;--green:#16794a;--green-soft:#eaf8f0;--amber:#a65e00;--amber-soft:#fff6e5;--red:#c22f3a;--red-soft:#fff0f1;--navy:#14213b;--shadow:0 1px 2px rgba(16,24,40,.03),0 8px 24px rgba(16,24,40,.055);--radius:12px}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.hidden{display:none!important}.topbar{background:linear-gradient(115deg,#0f1b33,#1d3871);color:#fff;padding:22px max(28px,calc((100vw - 1360px)/2));display:flex;justify-content:space-between;align-items:center;gap:20px}.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#b7c2dc;font-weight:750}.title{font-size:21px;font-weight:760;letter-spacing:-.015em}.phase{font-size:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.1);padding:5px 10px;border-radius:999px;white-space:nowrap}.shell{max-width:1360px;margin:auto;padding:28px}.overview{display:grid;grid-template-columns:2.15fr repeat(4,minmax(142px,1fr));gap:12px;margin-bottom:24px}.card,.overview-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.overview-card{min-height:108px;padding:17px}.overview-card.hero{background:linear-gradient(120deg,#244eab,#315dd8);color:#fff;border:0}.label,.k{font-size:12px;color:var(--muted);font-weight:750;display:flex;align-items:center;gap:6px}.hero .label,.hero .note{color:#dbe5ff}.number,.v{font-size:27px;font-weight:780;letter-spacing:-.035em;margin:4px 0}.note,.meta{font-size:12px;color:var(--muted)}.tabs{position:sticky;top:0;z-index:5;display:flex;gap:3px;background:var(--page);padding-top:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}.tab{border:0;background:transparent;color:var(--muted);font-weight:750;padding:12px 15px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap}.tab:hover{background:#edf2fa;color:var(--ink)}.tab.active{color:var(--brand);background:var(--panel);box-shadow:0 -1px 0 var(--line),1px 0 var(--line),-1px 0 var(--line)}.view{min-height:580px}.workspace{display:grid;grid-template-columns:310px minmax(0,1fr);gap:20px}.filters{padding:18px;border-bottom:1px solid var(--line)}.filters label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:9px 0 4px}.filters input,.filters select{width:100%;padding:9px 10px;border:1px solid #d8dfeb;background:#fbfcfe;border-radius:8px}.filters input:focus,.filters select:focus{outline:3px solid #dce7ff;border-color:var(--brand)}.quick,.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.chip,.toolbar button{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer}.chip.active,.toolbar button.active{background:var(--brand);border-color:var(--brand);color:#fff}.case-summary{padding:11px 15px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}.case-list{max-height:660px;overflow:auto}.case{border-left:3px solid transparent;padding:13px 15px;cursor:pointer;border-bottom:1px solid #f0f2f6}.case:hover{background:#f8faff}.case.active{background:#f0f4ff;border-left-color:var(--brand)}.case-top,.detail-head,.judge-top,.persona-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.case-id{font-weight:760}.case-desc{font-size:12px;color:var(--muted);margin:4px 0}.badge,.pill,.status{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:750}.badge{background:#f0f2f6;color:var(--muted)}.status.pass,.pill.good{background:var(--green-soft);color:var(--green)}.status.warn,.pill.warn{background:var(--amber-soft);color:var(--amber)}.status.bad,.pill.bad{background:var(--red-soft);color:var(--red)}.detail{padding:22px}.case-title{font-size:18px;font-weight:780}.desc{margin-top:6px;color:var(--muted)}.score-highlight{text-align:right}.score-highlight b{font-size:20px}.section{margin-top:14px;border:1px solid var(--line);border-radius:10px}.section summary{padding:12px 14px;font-weight:740;cursor:pointer}.section-body{padding:0 14px 14px}.code{margin:0;background:#101a2f;color:#e6edf9;border-radius:9px;padding:14px;white-space:pre-wrap;word-break:break-word;font:12px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace}.rubric{margin-top:14px}.score-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}.score-card{border:1px solid var(--line);border-radius:10px;padding:11px}.score-card.s1{border-left:3px solid var(--red)}.score-card.s2{border-left:3px solid var(--amber)}.score-card.s3{border-left:3px solid var(--green)}.score-card-head{display:flex;justify-content:space-between;font-weight:750}.feedback{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:10px}.feedback textarea{width:100%;min-height:72px;margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:9px}.subtabs{display:flex;gap:7px;border-bottom:1px solid var(--line);margin-bottom:18px}.subtab{border:0;background:transparent;color:var(--muted);font-weight:750;padding:9px 12px;cursor:pointer;border-bottom:2px solid transparent}.subtab.active{color:var(--brand);border-bottom-color:var(--brand)}.score-page{padding:25px}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0}.kpi{padding:16px;min-height:108px}.kpi.hero{color:#fff;background:linear-gradient(120deg,#244eab,#315dd8);border:0}.kpi.hero .k,.kpi.hero .note{color:#dbe5ff}.decision{border-radius:10px;padding:15px 16px;margin:18px 0;background:var(--brand-soft);border:1px solid #d7e0ff}.decision.bad{background:var(--red-soft);border-color:#f3c9cf}.decision.warn{background:var(--amber-soft);border-color:#f3d9a9}.decision h3{margin:0 0 5px;font-size:14px}.decision p{margin:4px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{padding:16px}.card h2,.card h3{margin:0 0 10px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th{text-align:left;background:#f7f9fc;color:var(--muted);font-size:12px;padding:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.table td{padding:10px;border-bottom:1px solid var(--line)}.clickable tbody tr{cursor:pointer}.clickable tbody tr:hover,.clickable tr.sel{background:var(--brand-soft)}.bar{height:8px;background:#edf0f5;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:var(--brand)}.bar.good span{background:var(--green)}.bar.warn span{background:var(--amber)}.bar.bad span{background:var(--red)}.dimension{margin:11px 0}.dimension-top{display:flex;justify-content:space-between;margin-bottom:5px;font-size:13px}.tip{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border:1px solid #aab7cf;border-radius:50%;color:#5c6c88;background:#fff;font-size:10px;font-weight:800;cursor:help;position:relative}.tip::after{content:attr(data-tip);position:absolute;z-index:20;top:calc(100% + 8px);left:50%;transform:translateX(-50%);width:min(250px,70vw);padding:9px 10px;border-radius:8px;background:#17233c;color:#fff;font:12px/1.45 Inter,system-ui;opacity:0;visibility:hidden;pointer-events:none}.tip:hover::after,.tip:focus::after{opacity:1;visibility:visible}.quota{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:16px}.check{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:12px;font-weight:700}.check.ok{background:var(--green-soft);border-color:#bfe6d1;color:var(--green)}.check.no{background:var(--red-soft);border-color:#f4c4c8;color:var(--red)}.kv{display:grid;grid-template-columns:140px 1fr;gap:7px 14px;font-size:13px}.kv dt{font-weight:700;color:var(--muted)}.kv dd{margin:0}.inferred{font-size:10px;color:var(--amber);font-weight:800;margin-left:5px}.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{padding:4px 9px;border:1px solid var(--line);border-radius:999px;font-size:12px}.personas{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:10px}.persona{padding:13px;border:1px solid var(--line);border-radius:11px}.persona.adversarial{border-left:3px solid var(--red)}.persona.neutral{border-left:3px solid var(--amber)}.persona.enthusiastic{border-left:3px solid var(--green)}.avatar{width:34px;height:34px;flex:0 0 34px;border-radius:50%;overflow:hidden}.persona-name{display:flex;gap:9px;align-items:center}.persona ul{margin:7px 0 0;padding-left:16px;font-size:12px;color:var(--muted)}.effect-list .case{border-left:3px solid transparent}.compare{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:15px 0}.side{border:1px solid var(--line);border-radius:10px;overflow:hidden}.side header{padding:9px 12px;background:#f5f7fb;font-weight:750;font-size:12px}.side.candidate header{background:var(--brand-soft);color:var(--brand)}.side pre{margin:0;min-height:120px;max-height:330px;overflow:auto;background:#101a2f;color:#e6edf9;padding:13px;white-space:pre-wrap;word-break:break-word;font:12px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace}.judges{max-height:500px;overflow:auto}.judge{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0}.judge.baseline{border-left:3px solid var(--red)}.judge.tie{border-left:3px solid var(--amber)}.judge.candidate{border-left:3px solid var(--green)}.blocker{margin-top:7px;padding:7px 9px;background:var(--red-soft);color:#8c1f28;border-radius:7px;font-size:12px}.banner{padding:12px 14px;background:var(--red-soft);color:var(--red);border:1px solid #f3c5ca;border-radius:10px;font-weight:700;margin-bottom:14px}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:980px){.overview{grid-template-columns:repeat(3,1fr)}.overview-card.hero{grid-column:span 3}.workspace{grid-template-columns:270px minmax(0,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:700px){.topbar{padding:16px}.shell{padding:16px}.overview{grid-template-columns:repeat(2,1fr)}.overview-card.hero{grid-column:span 2}.workspace{grid-template-columns:1fr}.case-list{max-height:360px}.compare{grid-template-columns:1fr}.kv{grid-template-columns:1fr;gap:3px}.kv dt{margin-top:8px}.score-page{padding:16px}}

<body><div class="app"><header class="topbar"><div><div class="eyebrow">Prompt evaluation workspace</div><div class="title" id="title">Prompt Evaluation</div></div><div class="phase" id="phase">TEST DESIGN</div></header><main class="shell"><section class="overview" id="overview"></section><nav class="tabs"><button class="tab active" data-view="scoring">Review Scoring</button><button class="tab" data-view="functional">Functional Case Review</button><button class="tab hidden" id="panel-tab" data-view="panel">Effect Profile &amp; Judge Panel</button><button class="tab hidden" id="effect-cases-tab" data-view="effectCases">Effect Case Review</button></nav><section class="view" id="functional-view"><div class="workspace"><aside class="card"><div class="filters"><label>Search</label><input id="search" placeholder="Case ID or description"><label>Category</label><select id="category"><option value="all">All categories</option></select><label>Score status</label><select id="quality"><option value="all">All cases</option><option value="bad">Bad cases</option><option value="warn">Needs review</option><option value="pass">Pass</option></select><div class="quick"><button class="chip active" data-quick="all">All</button><button class="chip" data-quick="bad">Bad cases</button><button class="chip" data-quick="safety">Safety</button></div></div><div class="case-summary" id="case-summary"></div><div class="case-list" id="case-list"></div></aside><article class="card detail" id="detail"></article></div></section><section class="view hidden" id="scoring-view"><article class="card score-page" id="scoring"></article></section><section class="view hidden" id="panel-view"><article class="card score-page" id="panel"></article></section><section class="view hidden" id="effectCases-view"><div class="workspace"><aside class="card"><div class="filters"><label>Search</label><input id="effect-search" placeholder="Case ID"><label>Case type</label><select id="effect-type"><option value="all">All case types</option></select><div class="toolbar"><button data-ef="all" class="active">All</button><button data-ef="lost">Candidate lost</button><button data-ef="divergent">High divergence</button><button data-ef="blockers">Has blockers</button></div></div><div class="case-summary" id="effect-summary"></div><div class="case-list effect-list" id="effect-list"></div></aside><article class="card detail" id="effect-detail"></article></div></section></main></div><script>
/*__EMBEDDED_DATA__*/
const DATA=EMBEDDED_DATA||{runs:[],benchmark:null,phase:'stage2'};const R=(DATA.runs||[]).filter(Boolean);const S={view:'scoring',filtered:[],selected:0,quick:'all',effectFilter:'all',effectSelected:0,scoreTab:'functional',personaFilter:'all',feedback:{}};const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');const phaseMap={stage2:'TEST DESIGN',stage3:'EXECUTION',stage5:'SCORING COMPLETE',stage6:'VALIDATION'};function tip(t){return`<button class="tip" type="button" data-tip="${esc(t)}" aria-label="Metric definition">?</button>`}function status(r){const x=Object.values(r.scores||{}).filter(v=>typeof v==='number');if(!x.length)return'pending';if(r.is_bad_case||x.some(v=>v===1))return'bad';if(x.some(v=>v===2))return'warn';return'pass'}function label(x){return{pass:'PASS',warn:'NEEDS REVIEW',bad:'BAD CASE',pending:'PENDING'}[x]}function pct(v){return`${Math.round(Number(v)||0)}%`}function avg(r){return r.avg_tp_score==null?'—':`${Number(r.avg_tp_score).toFixed(2)} / 3`}function rate(v){v=Number(v);return v>=60?'good':v>=50?'warn':'bad'}function effect(){return DATA.effect||null}function initial(){ $('title').textContent=DATA.title||'Prompt Evaluation';$('phase').textContent=phaseMap[DATA.phase]||String(DATA.phase||'').toUpperCase();if(effect()?.enabled){$('panel-tab').classList.remove('hidden');if(effect().stage==='results')$('effect-cases-tab').classList.remove('hidden')}buildFilters();renderOverview();bind();applyFilters();switchView('scoring')}function buildFilters(){[...new Set(R.map(x=>x.test_category).filter(Boolean))].sort().forEach(x=>$('category').insertAdjacentHTML('beforeend',`<option value="${esc(x)}">${esc(x)}</option>`));const E=effect();[...new Set((E?.case_rows||[]).map(x=>x.effect_case_type).filter(Boolean))].sort().forEach(x=>$('effect-type').insertAdjacentHTML('beforeend',`<option value="${esc(x)}">${esc(x)}</option>`))}function renderOverview(){const b=DATA.benchmark,total=R.length,scored=R.filter(x=>Object.keys(x.scores||{}).length).length,bad=R.filter(x=>status(x)==='bad').length,pass=b?.overall_pass_rate??(scored?Math.round(R.filter(x=>x.avg_tp_score>=2.5).length/scored*100):0),done=R.filter(x=>x.phase>='B'&&x.output!=null).length;$('overview').innerHTML=`<div class="overview-card hero"><div class="label">Evaluation health ${tip('Functional pass rate across scored cases. A case passes at 2.5 / 3 average TP score or above.')}</div><div class="number">${scored?pct(pass):'In progress'}</div><div class="note">${scored?`${scored} scored · ${bad} require attention`:`${done}/${total} cases executed`}</div></div><div class="overview-card"><div class="label">Test cases ${tip('Approved functional test cases in this run.')}</div><div class="number">${total}</div><div class="note">${done} executed</div></div><div class="overview-card"><div class="label">Pass rate ${tip('Share of scored cases with average TP score at least 2.5 / 3.')}</div><div class="number">${scored?pct(pass):'—'}</div><div class="note">Avg ≥ 2.5 / 3</div></div><div class="overview-card"><div class="label">Bad cases ${tip('Any TP equals 1, or normalized score is 50% or lower.')}</div><div class="number" style="color:${bad?'var(--red)':'var(--green)'}">${bad}</div><div class="note">Needs root-cause review</div></div><div class="overview-card"><div class="label">Safety failures ${tip('Safety-category cases with TP_safety scored 1.')}</div><div class="number" style="color:${b?.safety_failures?'var(--red)':'var(--green)'}">${b?.safety_failures??'—'}</div><div class="note">Release-blocking risk</div></div>`}function bind(){['search','category','quality'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',()=>{S.quick='all';applyFilters()}));document.querySelectorAll('[data-quick]').forEach(x=>x.addEventListener('click',()=>{S.quick=x.dataset.quick;applyFilters()}));document.querySelectorAll('[data-view]').forEach(x=>x.addEventListener('click',()=>switchView(x.dataset.view)));$('effect-search').addEventListener('input',renderEffectList);$('effect-type').addEventListener('change',renderEffectList);document.querySelectorAll('[data-ef]').forEach(x=>x.addEventListener('click',()=>{S.effectFilter=x.dataset.ef;S.effectSelected=0;renderEffectList()}))}function applyFilters(){const q=$('search').value.toLowerCase(),cat=$('category').value,quality=$('quality').value;S.filtered=R.filter(r=>{const z=status(r);return(!q||`${r.test_id} ${r.test_description}`.toLowerCase().includes(q))&&(cat==='all'||r.test_category===cat)&&(quality==='all'||z===quality)&&(S.quick!=='bad'||z==='bad')&&(S.quick!=='safety'||r.test_category==='safety')});S.selected=0;renderFunctionalList();renderFunctionalDetail()}function renderFunctionalList(){$('case-summary').textContent=`Showing ${S.filtered.length} of ${R.length} cases`;$('case-list').innerHTML=S.filtered.map((r,i)=>`<div class="case ${i===S.selected?'active':''}" data-fcase="${i}"><div class="case-top"><span class="case-id">${esc(r.test_id)}</span><span class="badge">${esc(r.test_category)}</span></div><div class="case-desc">${esc(r.test_description)}</div><span class="status ${status(r)}">${label(status(r))}${r.avg_tp_score!=null?` · ${Number(r.avg_tp_score).toFixed(2)}/3`:''}</span></div>`).join('')||'<div class="empty">No cases match.</div>';$('case-list').querySelectorAll('[data-fcase]').forEach(x=>x.addEventListener('click',()=>{S.selected=Number(x.dataset.fcase);renderFunctionalList();renderFunctionalDetail()}))}function renderFunctionalDetail(){const r=S.filtered[S.selected];if(!r){$('detail').innerHTML='<div class="empty">No case selected.</div>';return}const scores=Object.entries(r.scores||{}),total=r.total_score??scores.reduce((n,[,v])=>n+(Number(v)||0),0),max=scores.length*3,sp=r.score_pct??(max?Math.round(total/max*100):null),input=JSON.stringify(r.input||{},null,2),out=r.output==null?null:pretty(r.output);$('detail').innerHTML=`<div class="detail-head"><div><div class="case-title">${esc(r.test_id)}</div><div class="tags"><span class="badge">${esc(r.test_category)}</span><span class="badge">${esc(r.eval_type||'quantitative')}</span><span class="status ${status(r)}">${label(status(r))}</span></div><div class="desc">${esc(r.test_description)}</div></div><div class="score-highlight"><b>${avg(r)}</b><div class="meta">${sp==null?'Not scored':`${Math.round(Number(sp))}% · ${total}/${max} raw TP points`}</div></div></div><details class="section" open><summary>Input</summary><div class="section-body"><pre class="code">${esc(input)}</pre></div></details>${r.expected_behavior?`<section class="section"><div class="section-body"><b>Expected behavior</b><div class="desc">${esc(r.expected_behavior)}</div></div></section>`:''}<details class="section" open><summary>Model output</summary><div class="section-body">${out==null?'<div class="empty">No output returned.</div>':`<pre class="code">${esc(out)}</pre>`}</div></details>${scores.length?`<section class="rubric"><h3>Functional rubric</h3><div class="score-grid">${scores.sort((a,b)=>a[1]-b[1]).map(([tp,v])=>`<div class="score-card s${v}"><div class="score-card-head"><span>${esc(tp)}</span><span>${esc(v)} / 3</span></div><div class="meta">${esc(r.reasons?.[tp]||'No evaluator rationale recorded.')}</div></div>`).join('')}</div></section>`:''}<section class="feedback"><b>Reviewer notes</b><textarea id="note" placeholder="Add a human note."></textarea></section>`;const n=$('note');n.value=S.feedback[r.test_id]||'';n.addEventListener('input',()=>S.feedback[r.test_id]=n.value)}function pretty(v){if(typeof v!=='string')return JSON.stringify(v,null,2);try{return JSON.stringify(JSON.parse(v),null,2)}catch{return v}}function switchView(v){S.view=v;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===v));['functional','scoring','panel','effectCases'].forEach(x=>$(x+'-view').classList.toggle('hidden',x!==v));if(v==='scoring')renderScoring();if(v==='panel')renderPanel();if(v==='effectCases')renderEffectList()}function functionalDecision(b){if(!b)return['No functional score yet.','Run Step 5 to score functional outputs.',''];const safety=b.safety_failures||0,pass=b.overall_pass_rate||0,bad=b.bad_count||0;if(safety)return[`Functional score is ${pass}%, but ${safety} safety failure${safety>1?'s':''} blocks release.`,`Open Functional Case Review, filter Safety and Bad cases, then create P0 / C-series fixes.`,'bad'];if(pass<80)return[`Functional score is ${pass}%; core rule execution is not stable yet.`,`Open Functional Case Review, inspect Bad cases and weakest TPs before Step 6.`,'warn'];return[`Functional baseline is usable (${pass}% pass rate, ${bad} bad cases).`,`Review weak TPs, convert root causes into C-series fixes, then continue to Step 6.`,'']}function renderScoring(){const b=DATA.benchmark,E=effect();if(!S.scoreTab)S.scoreTab='functional';const tabs=`<div class="subtabs"><button class="subtab ${S.scoreTab==='functional'?'active':''}" data-score="functional">Functional score</button>${E?`<button class="subtab ${S.scoreTab==='effect'?'active':''}" data-score="effect">Effect score${E.stage==='design'?' · pending':''}</button>`:''}</div>`;$('scoring').innerHTML=`<h2>Scoring</h2><p class="meta">Decision summary first. Case evidence stays in the two Case Review pages.</p>${tabs}<div id="score-body"></div>`;$('scoring').querySelectorAll('[data-score]').forEach(x=>x.addEventListener('click',()=>{S.scoreTab=x.dataset.score;renderScoring()}));S.scoreTab==='effect'?renderEffectScore(E):renderFunctionalScore(b)}function renderFunctionalScore(b){const h=$('score-body');if(!b){h.innerHTML='<div class="empty">Functional score appears after Step 5.</div>';return}const all=R.filter(r=>r.avg_tp_score!=null),mean=all.length?(all.reduce((n,r)=>n+Number(r.avg_tp_score),0)/all.length).toFixed(2):'—',d=functionalDecision(b);const rows=(b.tps||[]).map(t=>`<tr data-tp="${esc(t.id)}"><td><b>${esc(t.id)}</b></td><td>${t.count}</td><td><b>${esc(t.avg)}</b> / 3</td><td>${t.dist?.['1']||0} / ${t.dist?.['2']||0} / ${t.dist?.['3']||0}</td><td>${pct(t.pass_rate)}</td><td>${esc(t.status)}</td></tr>`).join('');h.innerHTML=`<div class="kpis"><div class="card kpi hero"><div class="k">Overall pass rate ${tip('Share of scored cases with average TP score at least 2.5 / 3.')}</div><div class="v">${pct(b.overall_pass_rate)}</div><div class="note">Decision readiness</div></div><div class="card kpi"><div class="k">Average TP score ${tip('Mean of per-case average TP scores. Range: 1.00–3.00.')}</div><div class="v">${mean} / 3</div><div class="note">Functional quality center</div></div><div class="card kpi"><div class="k">Bad cases ${tip('Any TP equals 1, or normalized score is 50% or lower.')}</div><div class="v" style="color:${b.bad_count?'var(--red)':'var(--green)'}">${b.bad_count}</div><div class="note">Require root-cause review</div></div><div class="card kpi"><div class="k">Safety failures ${tip('Safety-category cases where TP_safety equals 1.')}</div><div class="v" style="color:${b.safety_failures?'var(--red)':'var(--green)'}">${b.safety_failures}</div><div class="note">Release-blocking risk</div></div></div><div class="decision ${d[2]}"><h3>Conclusion</h3><p>${esc(d[0])}</p><h3>Next step</h3><p>${esc(d[1])}</p></div><div class="card"><h3>TP scorecard</h3><div class="table-wrap"><table class="table clickable"><thead><tr><th>Test point</th><th>Cases</th><th>Average</th><th>1 / 2 / 3</th><th>Pass</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;h.querySelectorAll('[data-tp]').forEach(x=>x.addEventListener('click',()=>{switchView('functional');$('quality').value='all';S.quick='all';S.filtered=R.filter(r=>r.scores?.[x.dataset.tp]!=null).sort((a,b)=>(a.scores[x.dataset.tp]||0)-(b.scores[x.dataset.tp]||0));S.selected=0;renderFunctionalList();renderFunctionalDetail()}))}function adversarial(E){const s=(E?.segments||[]).find(x=>String(x.name).toLowerCase()==='adversarial');return esc(x.cluster_label)}</b> · ${esc(x.mention_count)}</span>`).join('')||'<span class="meta">No deal-breakers recorded.</span>';h.innerHTML=`${un?`<div class="banner">Validity: ${esc(E.validity||'UNVERIFIED')} — use as reference only; do not derive E-series changes.</div>`:''}<div class="kpis"><div class="card kpi hero"><div class="k">Overall win rate ${tip('Pairwise preference: candidate win = 1, tie = 0.5, baseline win = 0. 50% means no measured advantage.')}</div><div class="v">${esc(E.overall_win_rate)}%</div><div class="note">Candidate vs baseline</div></div><div class="card kpi"><div class="k">Adversarial win rate ${tip('Candidate win rate among skeptical personas. Below 50% means the prompt mainly works on readers already inclined to say yes.')}</div><div class="v">${a==null?'—':esc(a)+'%'}</div><div class="note">Hardest audience segment</div></div><div class="card kpi"><div class="k">Action rate ${tip('Share of judge decisions marked would_act = yes.')}</div><div class="v">${esc(E.action_rate)}%</div><div class="note">Closest proxy to success action</div></div><div class="card kpi"><div class="k">Validity ${tip('Decision-ready only when all calibration, divergence, position-bias and discrimination gates pass.')}</div><div class="v" style="color:${un?'var(--red)':'var(--green)'}">${esc(E.validity||'—')}</div><div class="note">Evidence permission</div></div></div><div class="decision ${d[2]}"><h3>Conclusion</h3><p>${esc(d[0])}</p><h3>Next step</h3><p>${esc(d[1])}</p></div><div class="grid2"><div class="card"><h3>Segment performance</h3>${segments||'<div class="empty">No segment data.</div>'}</div><div class="card"><h3>Top deal-breakers</h3><div class="tags">${db}</div><p class="meta">Open Effect Case Review to trace each blocker to cases and judge verdicts.</p><details><summary>Full validity method</summary><div class="meta">${(E.gates||[]).map(g=>`${esc(g.label)}: ${g.pass?'passed':'failed'}${g.value!=null?` (${esc(g.value)})`:''}`).join('<br>')||'No gate data.'}</div></details></div></div>`}function avatar(id,stance){let n=0;for(const c of String(id))n=(n*31+c.charCodeAt(0))>>>0;const p=stance==='adversarial'?['#ffe3e6','#c22f3a']:stance==='enthusiastic'?['#d8f5e5','#16794a']:['#fff0cf','#a65e00'];const a=4+(n%6),b=7+((n>>4)%7);return`<svg viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><circle cx="20" cy="20" r="20" fill="${p[0]}"/><circle cx="${a+8}" cy="${b+7}" r="7" fill="${p[1]}" opacity=".82"/><path d="M7 31c4-10 22-10 26 0" fill="${p[1]}" opacity=".7"/></svg>`}function renderPanel(){const E=effect(),h=$('panel');if(!E?.panel){h.innerHTML='<div class="empty">Effect mode is not enabled.</div>';return}const P=E.panel,pf=P.profile||{},inf=new Set(pf.inferred_fields||[]),mark=k=>inf.has(k)?'<span class="inferred">INFERRED</span>':'',checks=(P.checks||[]).map(c=>`<div class="check ${c.pass?'ok':'no'}"><span>${c.pass?'✓':'✕'} ${esc(c.label)}</span><b>${esc(c.value)}</b></div>`).join(''),tags=a=>(a||[]).map(x=>`<span class="tag">${esc(x.name)} <b>${x.count}</b>${x.pct!=null?` · ${x.pct}%`:''}</span>`).join(''),people=(P.personas||[]).filter(p=>S.personaFilter==='all'||p.stance===S.personaFilter||S.personaFilter==='core'&&p.is_core).map(p=>`<article class="persona ${esc(p.stance)}"><div class="persona-top"><div class="persona-name"><span class="avatar">${avatar(p.persona_id,p.stance)}</span><div><b>${esc(p.persona_id)} ${esc(p.label)}</b><div class="meta">${esc(p.decision_role||'—')} · ${esc(p.attention||'—')}${p.is_core?' · core screening':''}</div></div></div><span class="pill ${p.stance==='adversarial'?'bad':p.stance==='neutral'?'warn':'good'}">${esc(p.stance)}</span></div><div class="desc">${esc(p.current_situation||'')}</div><ul>${(p.what_they_care_about||[]).slice(0,1).map(x=>`<li>cares: ${esc(x)}</li>`).join('')}${(p.what_makes_them_bounce||[]).slice(0,1).map(x=>`<li>bounces: ${esc(x)}</li>`).join('')}</ul></article>`).join('');const cases=(P.cases||[]).map(c=>`<tr><td><b>${esc(c.case_id)}</b></td><td> ap(([k,l])=>`<button data-pfilter="${k}" class="${S.personaFilter===k?'active':''}">${l}</button>`).join('')}</div></div><div class="personas">${people||'<div class="empty">No persona matches.</div>'}</div></div><div class="card" style="margin-top:16px"><h3>Effect-case design · ${(P.cases||[]).length} cases</h3><div class="table-wrap"><table class="table"><thead><tr><th>Case</th><th>Type</th><th>Source</th><th>Visible</th><th>Persona scope</th></tr></thead><tbody>${cases}</tbody></table></div></div>`;h.querySelectorAll('[data-pfilter]').forEach(x=>x.addEventListener('click',()=>{S.personaFilter=x.dataset.pfilter;renderPanel()}))}function filteredEffect(){const E=effect(),q=$('effect-search').value.toLowerCase(),type=$('effect-type').value;return(E?.case_rows||[]).filter(c=>(!q||String(c.case_id).toLowerCase().includes(q))&&(type==='all'||c.effect_case_type===type)&&(S.effectFilter==='all'||S.effectFilter==='lost'&&c.win_rate<50||S.effectFilter==='divergent'&&c.divergence>=30||S.effectFilter==='blockers'&&(c.judgments||[]).some(j=>j.deal_breaker&&j.deal_breaker.toLowerCase()!=='none')))}function renderEffectList(){const rows=filteredEffect();S.effectSelected=Math.min(S.effectSelected,Math.max(rows.length-1,0));$('effect-summary').textContent=`Showing ${rows.length} effect cases`;$('effect-list').innerHTML=rows.map((c,i)=>`<div class="case ${i===S.effectSelected?'active':''}" data-ecase="${i}"><div class="case-top"><span class="case-id">${esc(c.case_id)}</span><span class="pill ${rate(c.win_rate)}">${esc(c.win_rate)}%</span></div><div class="case-desc">${esc(c.effect_case_type||'derived')} · action ${esc(c.action_rate)}%</div><span class="status ${c.win_rate<50?'bad':c.win_rate<60?'warn':'pass'}">${c.win_rate<50?'CANDIDATE LOST':'REVIEW'}</span></div>`).join('')||'<div class="empty">No effect cases match.</div>';$('effect-list').querySelectorAll('[data-ecase]').forEach(x=>x.addEventListener('click',()=>{S.effectSelected=Number(x.dataset.ecase);renderEffectList();rende
