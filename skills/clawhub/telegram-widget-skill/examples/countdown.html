<style>
body{margin:0;padding:12px 14px max(10px,env(safe-area-inset-bottom));text-align:center}
h3{margin:0 0 8px;font-size:1.05em}
.units{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.u{background:var(--tg-theme-secondary-bg-color);border-radius:10px;padding:8px 0 6px}
.n{font-size:1.6em;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.k{color:var(--tg-theme-hint-color);font-size:.75em;text-transform:uppercase;letter-spacing:.04em}
.when{color:var(--tg-theme-hint-color);font-size:.85em;margin-top:8px}
.live{font-size:1.4em;font-weight:700;color:var(--tg-theme-button-color);padding:14px 0}
</style>
<h3 id="title">Countdown</h3>
<div class="units" id="units">
<div class="u"><div class="n" id="d">-</div><div class="k">days</div></div>
<div class="u"><div class="n" id="h">-</div><div class="k">hours</div></div>
<div class="u"><div class="n" id="m">-</div><div class="k">min</div></div>
<div class="u"><div class="n" id="s">-</div><div class="k">sec</div></div>
</div>
<div class="live" id="live" hidden>It's live</div>
<div class="when" id="when"></div>
<script>
const TW = window.TelegramWidget;
const $ = (id) => document.getElementById(id);
let target = NaN, timer = 0;
function load() {
  let s = null;
  try { s = JSON.parse(TW && TW.chatData); } catch (e) {}
  if (!s || !s.at) return;
  target = Date.parse(s.at);
  $('title').textContent = s.t || 'Countdown';
  if (!isNaN(target)) {
    $('when').textContent = new Date(target).toLocaleString(navigator.language,
      {weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'});
  }
  if (s.done) $('live').textContent = s.done;
  tick();
}
function tick() {
  if (isNaN(target)) return;
  const left = Math.max(0, Math.floor((target - Date.now()) / 1000));
  const parts = {d: Math.floor(left / 86400), h: Math.floor(left / 3600) % 24, m: Math.floor(left / 60) % 60, s: left % 60};
  for (const k in parts) $(k).textContent = String(parts[k]).padStart(k === 'd' ? 1 : 2, '0');
  $('units').hidden = left === 0;
  $('live').hidden = left !== 0;
  clearTimeout(timer);
  if (left > 0) timer = setTimeout(tick, 1000 - (Date.now() % 1000));
}
if (TW) TW.onEvent('chatDataChanged', load);
load();
</script>
