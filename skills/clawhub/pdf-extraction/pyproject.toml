[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-extract-cli"
version = "1.0.0"
description = "Simple CLI to extract text/tables from PDFs with auto text vs OCR detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pdf-extraction" }]
dependencies = [
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pdf-extract = "pdf_extract.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pdf_extract*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
