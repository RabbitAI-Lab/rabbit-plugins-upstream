interface:
  display_name: "小说转推文分镜"
  short_description: "基于小说原文创作推广脚本与分镜，标注来源和用户意图"
  icon_small: "./assets/icon-512.png"
  icon_large: "./assets/icon-512.png"
  brand_color: "#D64B75"
  default_prompt: "使用 $novel-promo-storyboard 阅读这段小说并创作推广方案。保留原文事实，记录用户意图；未知内容列为待确认，不添加固定 CTA。"
policy:
  allow_implicit_invocation: true
