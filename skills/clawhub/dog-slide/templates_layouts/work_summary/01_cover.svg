<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="coverTopGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D02300;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A01A00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="coverBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F0EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="url(#coverBgGrad)" />
  <rect x="0" y="0" width="1280" height="8" fill="url(#coverTopGrad)" />
  <rect x="0" y="220" width="8" height="280" fill="#D02300" />
  <rect x="100" y="260" width="3" height="200" fill="#D02300" fill-opacity="0.3" />
  <text x="120" y="360" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="52" font-weight="bold" fill="#2D2D2D">{{TITLE}}</text>
  <text x="120" y="420" font-family="Microsoft YaHei, Arial, sans-serif" font-size="26" fill="#5A5A5A">{{SUBTITLE}}</text>
  <line x1="120" y1="460" x2="500" y2="460" stroke="#D02300" stroke-width="2" />
  <text x="120" y="530" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#2D2D2D">汇报人：{{AUTHOR}}</text>
  <text x="120" y="570" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#5A5A5A">{{ORGANIZATION}}</text>
  <text x="120" y="610" font-family="Arial, sans-serif" font-size="16" fill="#999999">{{DATE}}</text>
  <rect x="0" y="680" width="1280" height="40" fill="#A01A00" />
  <rect x="0" y="680" width="400" height="40" fill="#D02300" fill-opacity="0.6" />
</svg>
