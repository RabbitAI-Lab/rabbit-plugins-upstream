<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="chBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5B9BD5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E75B6;stop-opacity:1" />
    </linearGradient>
    <pattern id="chGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.06" />
    </pattern>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="url(#chBgGrad)" />
  <rect x="0" y="0" width="1280" height="720" fill="url(#chGrid)" />
  <text x="640" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="160" font-weight="bold" fill="#FFFFFF" fill-opacity="0.08">{{CHAPTER_NUM}}</text>
  <rect x="440" y="350" width="400" height="6" fill="#ED7D31" />
  <text x="640" y="420" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="48" font-weight="bold" fill="#FFFFFF">{{CHAPTER_TITLE}}</text>
  <text x="640" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#FFFFFF" fill-opacity="0.7">{{CHAPTER_TITLE_EN}}</text>
</svg>
