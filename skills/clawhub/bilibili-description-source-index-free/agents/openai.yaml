  short_description: "从指定视频简介提取公开资料链接、用途并记录可访问状态与缺项"
  default_prompt: "使用 $bilibili-description-source-index-free。请使用我指定的 browserId，整理这 1–3 个 B站视频简介中可见的作者资料链接、用途和访问状态；不可见或打不开要记录原因。"
