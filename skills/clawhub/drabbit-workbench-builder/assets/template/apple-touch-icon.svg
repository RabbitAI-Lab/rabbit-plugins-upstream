<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1720"/>
      <stop offset="100%" stop-color="#1A2432"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5EE7DF"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" rx="40" fill="url(#bg)"/>
  <!-- Subtle glow ring -->
  <rect x="4" y="4" width="184" height="184" rx="38" fill="none" stroke="rgba(94,231,223,0.25)" stroke-width="2"/>
  <!-- M letter -->
  <text x="96" y="132" text-anchor="middle" fill="url(#text-grad)" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="110" font-weight="700" letter-spacing="-4">M</text>
</svg>
