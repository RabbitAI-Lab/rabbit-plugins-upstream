# 运行环境要求
prerequisites:
  - exiftool 13.x（读写 EXIF/视频元数据）
  - Python 3.10+ 虚拟环境
  - Python 包：opencv-python, pillow, pillow-heif, numpy, openai-clip, torch（datum_convert.py 仅需标准库）
  - 外置盘/大容量空间（去重和移动需空间余量）

# 权限说明（供审核参考）
permissions:
  - Read：读取用户照片/视频文件夹
  - Bash：执行 exiftool、运行 scripts/ 下 Python 脚本
  - Write：可逆移动文件到子文件夹、写缓存/日志/报告（绝不直接删除原件）

# 局限性
limitations:
  - AVI/RIFF 容器写不进 GPS（格式硬限制，跳过）
  - ≥500MB 大文件相似检测只抽前 13 秒（整段解码不现实）
  - 行程表需用户自行从交通/消费记录构建（skill 提供方法，不代抓数据）
  - Apple Live Photo 的 ContentIdentifier 可能被 exiftool 写操作破坏，操作前需确认
  - 行程表推算的 GPS 是城市级坐标（非精确拍摄点），审计清单中与真实 GPS 区分标记
