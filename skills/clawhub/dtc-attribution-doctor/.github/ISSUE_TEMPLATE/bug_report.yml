name: Bug report
description: Report reproducible incorrect routing, analysis, or tooling behavior.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, account IDs, customer names, or raw API responses.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Describe the incorrect result using synthetic or redacted data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: scenario
    attributes:
      label: Scenario or plan
      placeholder: roas-decline-diagnosis
  - type: input
    id: model
    attributes:
      label: Agent and model
      placeholder: Codex / model name and version
  - type: textarea
    id: reproduction
    attributes:
      label: Redacted reproduction
      description: Include the prompt, date-window semantics, and synthetic fields needed to reproduce.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, customer data, account IDs, and raw production payloads.
          required: true

