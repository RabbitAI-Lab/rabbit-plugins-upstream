description: >-
  从中金所官网下载并解析会员持仓排名 XML，按“中信期货(代客)”与“全市场前20名会员合并”
  两维度统计股指期货(IF/IH/IC/IM)绝对持仓与净增对比，生成 HTML 报告。
  固化了 datatypeid 的正确字段映射（1=多单/2=空单/0=套利排除）与官方的
  “比上交易日增减”(varvolume) 净增口径，规避把套利当多单的经典错误。
triggers:
  - "统计今日股指持仓"
  - "跑一下中信期货(代客)净增"
  - "对比 8/10 和 8/7 的股指持仓"
  - "股指期货席位持仓统计"
  - "中金所持仓排名"
  - "机构主力股指期货净多空"
