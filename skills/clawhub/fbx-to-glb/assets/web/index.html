<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.184.0/examples/jsm/"
  }

</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ── State ──────────────────────────────────────────────────
let ajs = null;
let fbxBuffer = null;
let fbxFileName = '';
let glbData = null;
let glbBlob = null;
let modelGroup = null;

// ── DOM ────────────────────────────────────────────────────
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const fileInfo = document.getElementById('fileInfo');
const statName = document.getElementById('statName');
const statSize = document.getElementById('statSize');
const progress = document.getElementById('progress');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const btnConvert = document.getElementById('btnConvert');
const btnDownload = document.getElementById('btnDownload');
const modelStats = document.getElementById('modelStats');
const modelStatsContent = document.getElementById('modelStatsContent');
const engineDot = document.getElementById('engineDot');
const engineStatus = document.getElementById('engineStatus');
const viewerPlaceholder = document.getElementById('viewerPlaceholder');

// ── Three.js setup ─────────────────────────────────────────
const viewer = document.getElementById('viewer');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 2, 0.1, 100);
camera.position.set(3, 2, 5);
camera.lookAt(0, 0.8, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
viewer.appendChild(renderer.domElement);

// Lights
const ambient = new THREE.AmbientLight(0xffffff, 1.2);
scene.add(ambient);
const key = new THREE.DirectionalLight(0xffffff, 3);
key.position.set(5, 8, 5);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 50;
key.shadow.camera.left = -10;
key.shadow.camera.right = 10;
key.shadow.camera.top = 10;
key.shadow.camera.bottom = -10;
scene.add(key);
const fill = new THREE.DirectionalLight(0x8899cc, 1.5);
fill.position.set(-3, 2, -3);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffccaa, 2);
rim.position.set(0, 2, -5);
scene.add(rim);

// Ground shadow plane
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 20),
  new THREE.ShadowMaterial({ opacity: 0.3 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -2;
ground.receiveShadow = true;
scene.add(ground);

// Grid helper
const grid = new THREE.GridHelper(10, 10, 0x333355, 0x222244);
grid.position.y = -1.99;
scene.add(grid);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 0.8, 0);
controls.update();

// ── Resize ─────────────────────────────────────────────────
function resize() {
  const rect = viewer.getBoundingClientRect();
  renderer.setSize(rect.width, rect.height);
  camera.aspect = rect.width / Math.max(rect.height, 1);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// ── Render loop ────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// ── Helpers ────────────────────────────────────────────────
function formatSize(bytes) {
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1048576) return `${(bytes / 1024).toFixed(1)} KB`;
  return `${(bytes / 1048576).toFixed(1)} MB`;
}

function setProgress(pct, text) {
  progress.classList.add('show');
  progressFill.style.width = pct + '%';
  progressText.textContent = text;
}

function hideProgress() {
  progress.classList.remove('show');
  progressFill.style.width = '0%';
}

// ── FBX loading ────────────────────────────────────────────
function handleFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  if (ext !== 'fbx') {
    alert('请上传 .fbx 格式的文件');
    return;
  }
  if (file.size > 500 * 1024 * 1024) {
    alert('文件大小超过 500MB 限制');
    return;
  }

  fbxFileName = file.name;
  statName.textContent = file.name;
  statSize.textContent = formatSize(file.size);
  fileInfo.classList.add('show');

  const reader = new FileReader();
  reader.onload = (e) => {
    fbxBuffer = new Uint8Array(e.target.result);
    btnConvert.disabled = false;
    dropzone.classList.add('uploaded');
    dropzone.querySelector('p').textContent = `已加载: ${file.name}`;
    hideProgress();
    modelStats.classList.remove('show');
    btnDownload.classList.remove('show');
    glbData = null;
    glbBlob = null;
  };
  reader.readAsArrayBuffer(file);
}

dropzone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => {
  if (e.target.files.length > 0) handleFile(e.target.files[0]);
});

dropzone.addEventListener('dragover', (e) => {
  e.preventDefault();
  e.stopPropagation();
  e.dataTransfer.dropEffect = 'copy';
  dropzone.classList.add('drag');
});
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  e.stopPropagation();
  dropzone.classList.remove('drag');
  if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
});

// ── Conversion ─────────────────────────────────────────────
btnConvert.addEventListener('click', async () => {
  if (!fbxBuffer || !ajs) return;

  btnConvert.disabled = true;
  btnDownload.classList.remove('show');
  modelStats.classList.remove('show');
  setProgress(10, '正在解析 FBX...');

  try {
    await new Promise(r => setTimeout(r, 50));

    // Build FileList and convert
    setProgress(30, '正在转换 (Assimp 引擎)...');
    const fileList = new ajs.FileList();
    fileList.AddFile(fbxFileName, fbxBuffer);
    const result = ajs.ConvertFileList(fileList, 'glb2');

    if (!result.IsSuccess()) {
      const err = result.GetErrorCode();
      throw new Error(`转换失败: ${err}`);
    }
    if (result.FileCount() === 0) {
      throw new Error('转换未生成任何输出文件');
    }

    setProgress(80, '正在处理输出...');

    // Get GLB binary
    const resultFile = result.GetFile(0);
    const content = resultFile.GetContent();
    glbData = new Uint8Array(content);

    // Create blob for download
    glbBlob = new Blob([glbData], { type: 'model/gltf-binary' });

    setProgress(90, '正在加载预览...');

    // Load into Three.js for preview
    const url = URL.createObjectURL(glbBlob);
    const loader = new GLTFLoader();
    const gltf = await new Promise((resolve, reject) => {
      loader.load(url, resolve, undefined, reject);
    });
    URL.revokeObjectURL(url);

    // Replace preview model
    if (modelGroup) scene.remove(modelGroup);
    modelGroup = gltf.scene;

    // Auto-scale model to fit view
    const box = new THREE.Box3().setFromObject(modelGroup);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const scale = maxDim > 0 ? 3 / maxDim : 1;
    modelGroup.scale.setScalar(scale);
    modelGroup.position.sub(center).multiplyScalar(scale);

    // Enable shadows on all meshes
    modelGroup.traverse((node) => {
      if (node.isMesh) {
        node.castShadow = true;
        node.receiveShadow = true;
      }
    });

    scene.add(modelGroup);
    viewerPlaceholder.style.display = 'none';

    // Stats
    let vertexCount = 0, triCount = 0, meshCount = 0;
    modelGroup.traverse((node) => {
      if (node.isMesh) {
        meshCount++;
        const geom = node.geometry;
        if (geom.index) {
          vertexCount += geom.attributes.position.count;
          triCount += geom.index.count / 3;
        } else if (geom.attributes.position) {
          vertexCount += geom.attributes.position.count;
          triCount += geom.attributes.position.count / 3;
        }
      }
    });

    modelStatsContent.innerHTML = `
      网格数: <b>${meshCount}</b> &nbsp;|&nbsp;
      顶点: <b>${vertexCount.toLocaleString()}</b> &nbsp;|&nbsp;
      三角面: <b>${Math.round(triCount).toLocaleString()}</b> &nbsp;|&nbsp;
      GLB: <b>${formatSize(glbData.byteLength)}</b>
    `;
    modelStats.classList.add('show');
    btnDownload.classList.add('show');

    setProgress(100, '转换完成！');
    setTimeout(hideProgress, 2000);

  } catch (err) {
    setProgress(0, `错误: ${err.message}`);
    console.error(err);
  } finally {
    btnConvert.disabled = false;
  }
});

// ── Download ───────────────────────────────────────────────
btnDownload.addEventListener('click', () => {
  if (!glbBlob) return;
  const outName = fbxFileName.replace(/\.fbx$/i, '') + '.glb';
  const url = URL.createObjectURL(glbBlob);
  const a = document.createElement('a');
  a.href = url;
  a.download = outName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

// ── Keyboard shortcuts ─────────────────────────────────────
window.addEventListener('keydown', (e) => {
  if (e.key === 'f' || e.key === 'F') {
    if (modelGroup) {
      const box = new THREE.Box3().setFromObject(modelGroup);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const dist = maxDim * 1.5;
      camera.position.copy(center.clone().add(new THREE.Vector3(dist * 0.6, dist * 0.4, dist * 0.8)));
      controls.target.copy(center);
      controls.update();
    }
  }
  if (e.key === 'r' || e.key === 'R') {
    if (modelGroup) {
      const box = new THREE.Box3().setFromObject(modelGroup);
      const center = box.getCenter(new THREE.Vector3());
      camera.position.set(center.x + 3, center.y + 2, center.z + 5);
      controls.target.copy(center);
      controls.update();
    }
  }
});

// ── Init assimpjs ──────────────────────────────────────────
window.assimpjs().then((module) => {
  ajs = module;
  engineDot.className = 'dot ready';
  engineStatus.textContent = '引擎就绪 (Assimp WASM)';
  dropzone.querySelector('p').textContent = '拖拽 .fbx 文件到此处\n或点击选择文件';
}).catch((err) => {
  engineDot.className = 'dot';
  engineDot.style.background = 'var(--accent)';
  engineStatus.textContent = '引擎加载失败，请刷新重试';
  console.error('assimpjs init failed:', err);
});
</script>
