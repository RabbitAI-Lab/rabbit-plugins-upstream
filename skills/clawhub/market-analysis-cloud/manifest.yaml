name: market-analysis-cloud
version: 1.0.0
description: "A股每日行情研判（云端版）— 纯云端运行，不依赖桌面端MCP连接器。需预装 stock-price-query-mx、tecent-finance、eastmoney-mx-skills-suite、china-stock-data。"
category: finance
author: 类熊猿
platforms:
  - workbuddy
  - openclaw
keywords:
  - 股票
  - A股
  - 行情研判
  - 每日复盘
  - 股债性价比
  - ERP
  - 持仓诊断
dependencies:
  stock-price-query-mx:
    url: https://clawhub.ai/skills/stock-price-query-mx
    description: "A股/美股实时报价（腾讯财经 API，免费）"
  tecent-finance:
    url: https://clawhub.ai/skills/tecent-finance
    description: "腾讯财经 K线/估值数据（免费）"
  eastmoney-mx-skills-suite:
    url: https://clawhub.ai/kooui/skills/eastmoney-mx-skills-suite
    description: "东方财富妙想（诊股/PE/国债/新闻，需 MX_APIKEY）"
  china-stock-data:
    url: https://longxiaskill.com/skill/china-stock-data
    description: "通达信 K线/ATR/技术指标（多源自动降级）"
env_vars:
  - MX_APIKEY
