<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 背景圆 -->
  <rect rx="24" ry="24" width="200" height="200" fill="#efe9db"/>

  <!-- 瓶颈（细长） -->
  <path d="M88 48 L88 22 Q88 16, 92 14 L108 14 Q112 16, 112 22 L112 48 Z"
        fill="#5c9e6b"/>

  <!-- 瓶口外沿 -->
  <rect x="84" y="12" width="32" height="8" rx="3" fill="#3d6b4a"/>

  <!-- 瓶塞 -->
  <path d="M92 4 Q92 0, 100 0 Q108 0, 108 4 L108 12 L92 12 Z"
        fill="#c49a6c"/>
  <line x1="92" y1="8" x2="108" y2="8" stroke="#b08050" stroke-width="1" opacity="0.5"/>

  <!-- 瓶身（圆润流畅曲线） -->
  <path d="M88 48
           C72 60, 46 84, 44 110
           C42 136, 48 162, 60 174
           C72 186, 90 192, 100 192
           C110 192, 128 186, 140 174
           C152 162, 158 136, 156 110
           C154 84, 128 60, 112 48 Z"
        fill="#5c9e6b"/>

  <!-- 瓶身高光（左侧柔光） -->
  <path d="M80 56
           C68 68, 52 90, 50 112
           C48 134, 54 158, 64 170
           C68 176, 74 180, 78 182
           C72 172, 64 152, 62 130
           C60 108, 66 82, 80 56 Z"
        fill="#7dbf8a" opacity="0.45"/>

  <!-- 瓶身高光（小高光点） -->
  <ellipse cx="72" cy="110" rx="5" ry="14" fill="#9ed4a8" opacity="0.3" transform="rotate(-15 72 110)"/>

  <!-- 瓶身右侧透光 -->
  <path d="M140 110
           C142 132, 138 156, 130 170
           C126 178, 120 182, 116 184
           C124 174, 132 152, 134 128
           C134 110, 130 88, 120 72
           C128 80, 136 94, 140 110 Z"
        fill="#4a8a57" opacity="0.35"/>

  <!-- 瓶内灵蕴（底部） -->
  <ellipse cx="100" cy="148" rx="26" ry="24" fill="#3d7a4a" opacity="0.3"/>

  <!-- 灵光光点 -->
  <circle cx="90" cy="134" r="3.5" fill="#b5e8be" opacity="0.6"/>
  <circle cx="108" cy="150" r="3" fill="#b5e8be" opacity="0.5"/>
  <circle cx="96" cy="158" r="2.5" fill="#b5e8be" opacity="0.4"/>
  <circle cx="104" cy="130" r="2" fill="#b5e8be" opacity="0.35"/>
</svg>