interface:
  display_name: "KB Review / 知识库审查"
  short_description: "Review old personal knowledge assets with keep/delete/review/duplicates and Agent Asset decisions, with safe Trash and rollback. / 使用 keep/delete/review/duplicates 与 Agent Asset 决策审查旧个人知识资产，并安全执行 Trash 和 rollback。"
  default_prompt: >-
    EN: Review these historical knowledge assets with the kb-review rules. Produce keep.md, delete.md, review.md, duplicates.md, or equivalent Agent Asset decisions. Write every generated reason and human-readable note as English / Chinese, with English normative and first. Exclude KB-Review-*, legacy KB-Refactor-*, AI-Era-*, Archived, .obsidian, .trash, .Trash, .smart-env, attachment resources, and Markdown tagged archived. Treat PII as forbidden by default; for forbidden paths or tags, use only path, title, frontmatter, and existing review information without reading the body. Read safe bodies fully through 4096 tokens; above that, use only the first and last 1000 tokens and disclose sampling in the reason. Put exact body-hash duplicates in duplicates.md; for sensitive files, allow only byte-level exact duplicate checks. Delete and rollback are previews by default, require an explicit review_root, and move files only with --execute. Force-delete matches safe complete path components. Use the portable Trash adapter by default, with explicit macOS or trash-directory overrides, and support rollback from trash-execution-log.md. Generate read-only SecondBrain coverage only when explicitly requested. Read existing .agent.md frontmatter, summary, Insight, and Source Map only as evidence; never generate, modify, reorder, re-summarize, validate, or archive .agent.md. Record generate_asset only as a request for agent-readable-doc or a project adapter.
    ZH-CN: 按 kb-review 规则审查这些历史知识资产，输出 keep.md、delete.md、review.md、duplicates.md 或等价 Agent Asset 决策。每个生成的 reason 和人类可读 note 都使用英文 / 中文，英文为规范版本并置于前面。排除 KB-Review-*、旧版 KB-Refactor-*、AI-Era-*、Archived、.obsidian、.trash、.Trash、.smart-env、附件资源，以及带 archived tag 的 Markdown。默认禁止 PII；对命中 forbidden path 或 tag 的条目，只使用路径、标题、frontmatter 和已有 review 信息，不读取正文。安全正文不超过 4096 token 时全文读取；超过时只使用首尾各 1000 token，并在 reason 中说明采样。正文 hash 完全相同的文件写入 duplicates.md；敏感文件只允许 byte-level 精确重复检查。delete 与 rollback 默认仅预演，必须显式提供 review_root，且只有追加 --execute 才移动文件。force-delete 只匹配安全的完整路径组件。默认使用 portable Trash adapter，可显式选择 macOS 或覆盖 Trash 目录，并支持从 trash-execution-log.md 回退。仅在明确请求时生成只读 SecondBrain coverage。已有 .agent.md 的 frontmatter、summary、Insight 和 Source Map 仅作为只读证据；不得生成、修改、重排、重新摘要、验证或归档 .agent.md。generate_asset 只记录为交给 agent-readable-doc 或项目 adapter 的请求。
