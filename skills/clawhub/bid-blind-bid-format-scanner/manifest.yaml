changelog:
  - "1.0.0 正式发布：①scripts/scan_docx.py 确定性提取版面/页边距/字体字号/字形/行距/对齐/缩进/页码页眉页脚 + 文档元数据 + 全文身份扫描；②scripts/scan_pdf.py 最佳努力（页数/页面尺寸/元数据/全文身份，字体页边距标注不可靠）；③references/blind_bid_specs.md 提炼南阳/河北/贵州/内蒙古/济宁等多地真实暗标规范为通用标尺+差异对照+后果矩阵；④references/identity_patterns.md 暗示措辞启发式词典与安全改写；⑤四大能力（格式硬检/身份显形/篇幅裁剪/一键差异报告）；⑥护栏铁律（仅机械检查、不留存文件、以招标条款为准、风险分级）；⑦署名与公众号反馈脚注。"
