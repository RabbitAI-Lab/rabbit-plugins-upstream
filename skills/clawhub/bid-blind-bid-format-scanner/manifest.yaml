description: '服务于投标人：封标前对"暗标"部分（技术标/施工组织设计/技术方案）执行盲审格式化条款的机械合规扫描。确定性脚本提取 Word/PDF 页边距、字体、字号、行距、对齐、缩进、页码页眉页脚与文档元数据，逐条比对招标文件"暗标编制要求"，输出"要求 vs 现状"差异清单、风险等级（废标级/扣分零分级）与一键修订指令；同时扫描全文与文档属性是否残留投标人身份信息（名称/Logo/人员/业绩/暗示措辞）。仅做机械格式检查，不评价内容优劣。'
