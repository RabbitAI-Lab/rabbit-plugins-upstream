  "韩漫/网文体系":
    source: "Naver Webtoon/KakaoPage/Munpia"
    rules:
      - "条漫每4-6格为一屏，每屏结尾设视觉钩子 [director, analysis]"
      - "快节奏开场：3话定生死，第1话15秒内展示冲突 [webnovel, reader_eval]"
      - "付费模式：3章免费+每日1章+付费包月 [factory, management]"
      - "每章设1-2个可讨论话题+章末互动投票 [reader_eval, simulation]"
      - "修罗场结构：每4-6章安排，至少3方势力 [emotion, tension_calibrator]"
    engine_map: ["director", "analysis", "webnovel", "reader_eval", "factory", "management", "simulation", "emotion", "tension_calibrator"]

  # ===== platform =====
