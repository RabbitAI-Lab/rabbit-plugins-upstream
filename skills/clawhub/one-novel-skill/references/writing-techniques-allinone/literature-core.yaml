      - "标题七秒法则：数字/悬念/共鸣钩子 [analysis]"
      - "六种高转发情绪：至少覆盖2种 [emotion]"
      - "移动端黄金排版：段间距>行间距/每段2-4句/1500-3000字 [narration]"
    engine_map: ["reader_eval", "analysis", "emotion", "narration"]

  "数据驱动的写作优化":
    source: "网飞/字节跳动方法论/番茄小说数据"
    rules:
