      - "一石二鸟：每个信息点承担双重功能 [writer]"
      - "结尾反转或顿悟：最后一句改变一切 [plot]"
      - "严格遵循投稿字数上限 [management]"
    engine_map: ["narration", "writer", "plot", "management"]

