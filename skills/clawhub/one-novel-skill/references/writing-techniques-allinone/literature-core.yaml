      - "开篇期待阶梯完整性：是否暗示解决方案方向 [writer]"
      - "可解释留白占比<30%标记信息过载式留白 [analysis]"
    engine_map: ["reader_eval", "emotion", "writer", "analysis"]

  "跨类型融合创作":
