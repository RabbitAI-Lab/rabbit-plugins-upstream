      - "第一人称权威感：绑定具体案例/个人经历 [narration]"
      - "长回答结构化：每段≤100字，每500字视觉断点 [architecture]"
    engine_map: ["reader_eval", "analysis", "narration", "architecture"]

  "公众号爆款规律":
    source: "新榜/西瓜数据/公众号运营经验"
    rules:
