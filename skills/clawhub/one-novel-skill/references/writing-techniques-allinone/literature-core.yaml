  # ===== russian =====
  "俄国叙事理论":
    source: "普罗普《故事形态学》/巴赫金《陀思妥耶夫斯基诗学问题》/什克洛夫斯基"
    rules:
      - "普罗普31种叙事功能：加害→追寻→对决→战胜→婚礼五功能链不可缺失 [plot, analysis]"
      - "复调叙事：每个主要角色拥有独立的世界观和价值观体系 [character, logic]"
      - "陌生化技术：每5000字插入一次视角转换/名物化偏离/节奏中断 [development, style]"
      - "叙事功能倒置：有意识地调换2-3个功能相对位置 [logic, inspiration]"
      - "双声对话：角色表面说A但读者理解B，指向性双声是质量核心 [dialogue, human_lang]"
    engine_map: ["plot", "analysis", "character", "logic", "development", "style", "inspiration", "dialogue", "human_lang"]

  # ===== short-form =====
  "短篇结构":
    source: "海明威/雷蒙德·卡佛/爱伦·坡"
    rules:
      - "一个瞬间原则：只讲关键时刻/决定性选择/转折点 [plot]"
      - "五段式结构：引子:动荡:发展:高潮:余韵=1:2:3:2:1 [architecture]"
      - "冰山理论：只写水面八分之一，对话潜台词>直白心理 [narration]"
      - "结尾句让读者合上页面后久久回味 [style]"
    engine_map: ["plot", "architecture", "narration", "style"]

  "杂志投稿策略":
    source: "Duotrope/《Writer's Market》/国内投稿规范"
    rules:
      - "风格匹配度决定80%过稿率 [management]"
      - "国内不允许一稿多投，海外SFWA认证可SIMSUB [factory]"
      - "稿费阶梯：国内80-500+元/千字，海外$0.01-0.08+/word [development]"
      - "一次性发表权(First Serial Rights)是最常见版权条款 [consistency]"
    engine_map: ["management", "factory", "development", "consistency"]

  "短篇集编排艺术":
    source: "博尔赫斯/卡尔维诺/雷蒙德·卡佛"
    rules:
      - "首篇定调：选最具代表性作品 [reader_eval]"
      - "三幕编排：前1/3建立主题→中1/3深化→后1/3升华 [architecture]"
      - "沉重篇章之间安排插曲篇章 [tension_calibrator]"
      - "末篇留下回响，开放式结局或哲理升华最佳 [writer]"
    engine_map: ["reader_eval", "architecture", "tension_calibrator", "writer"]

  "中篇节奏控制":
    source: "斯蒂芬·金《肖申克》/海明威《老人与海》"
    rules:
      - "黄金长度2-3万字 [plot]"
      - "核心角色≤5人，重要配角≤3人 [character]"
      - "单主线+单副线，副线必须服务于主线 [architecture]"
      - "事件密度递进：前半每章1-2事件，后半2-3事件 [tension_calibrator]"
    engine_map: ["plot", "character", "architecture", "tension_calibrator"]

  "闪小说/微型小说":
    source: "Flash Fiction Online/Sudden Fiction系列"
    rules:
