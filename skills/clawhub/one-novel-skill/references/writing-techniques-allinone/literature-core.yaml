# literature-core.yaml
# L1 文献核心数据：每篇文献 3-5 条可执行规则 + 引擎映射
# 自动生成于 2026-06-08
# 注意：此为补充摘要，不替代 references/literature/ 下的原始文献

literature_core:

  # ===== audio =====
  "有声书/音频写作指南":
    source: "喜马拉雅FM/Audible/播客叙事学"
    rules:
      - "对话占比不低于50%，纯叙述段最长不超过150字 [narration, dialogue]"
      - "描写做听觉编码：优先动作+声音描写，避免三重形容词 [human_lang, description]"
      - "角色声纹设计：每3页切换对话时有独特语言习惯 [character, emotion]"
      - "章末声音钩子：未完成句/声音反转/节奏骤变 [tension_calibrator, emotion]"
      - "每集15-25分钟最优，前3集免费第4集解锁 [factory, management]"
    engine_map: ["narration", "dialogue", "human_lang", "description", "character", "emotion", "tension_calibrator", "factory", "management"]

  # ===== awards =====
  "茅盾文学奖叙事模式":
    source: "第十一届茅盾奖评论汇编"
    rules:
      - "以小见大：通过个人/家庭命运折射时代巨变 [plot]"
      - "现实主义主导，语言朴实有力，排斥华丽堆砌 [narration]"
      - "鲜明的道德关怀和社会批判意识 [analysis]"
      - "白描/留白/意象的中国叙事美学 [writer]"
    engine_map: ["plot", "narration", "analysis", "writer"]

  "雨果奖/星云奖趋势":
    source: "雨果奖官网/星云奖数据库/Locus Magazine"
    rules:
      - "多元化叙事趋势：非西方世界观/LGBTQ+角色比例上升 [reader_eval]"
      - "硬核科幻未死：科学是情节核心驱动力 [logic]"
      - "文学性要求提升，纯点子驱动但语言粗糙不占优势 [writer]"
      - "系列中间卷获奖可能性低，评委偏好完整叙事弧 [analysis]"
    engine_map: ["reader_eval", "logic", "writer", "analysis"]

  "类型文学奖":
    source: "银河奖评审委员会/全球华语科幻星云奖章程"
    rules:
      - "银河奖偏好硬科幻：技术设想原创性和科学合理性 [world]"
      - "星云奖(国内)注重文学性/可读性/市场影响力 [analysis]"
      - "短篇奖3000-15000字，获奖后行业曝光度更高 [plot]"
      - "类型融合加分：科幻+推理/奇幻+悬疑等跨界 [development]"
    engine_map: ["world", "analysis", "plot", "development"]

  # ===== business =====
  "写作商学/亚马逊自出版":
    source: "Amazon KDP/Kindle Unlimited/独立出版报告"
    rules:
      - "KU收入=总KENP占比×月收入池，前10%退出率最高需强钩子 [factory, simulation]"
      - "首卷$0.99引流，后续$4.99，系列3-5卷/间隔≤3个月 [management, development]"
      - "AMS广告ACoS控制在25-30%，新书首月投入预期收入15-20% [simulation, analysis]"
      - "定价$2.99-$9.99用70%版税率，反之用35% [factory, management]"
      - "书籍描述用Hook→Conflict→Stakes→Social Proof结构 [reader_eval, writer]"
    engine_map: ["factory", "simulation", "management", "development", "analysis", "reader_eval", "writer"]

  # ===== chinese =====
  "网络文学创作原理":
    source: "王祥 (2015)"
    rules:
      - "开篇3章检测读者期待匹配度>70% [webnovel]"
      - "每章至少1种欲望编码被触发 [emotion]"
      - "爽感层级分布≈10%:35%:35%:20% [reader_eval]"
      - "世界观可能性密度检测：读者可想象参与的活动方向数量 [world]"
    engine_map: ["webnovel", "emotion", "reader_eval", "world"]

  "网文成才21天":
    source: "起点中文网编辑团队 (2018)"
    rules:
      - "签约四要素：开篇张力/节奏掌控/更新稳定/题材风口 [webnovel]"
      - "书名分析：核心关键词+悬念/反差检测 [reader_eval]"
      - "大纲必须有因果分支，纯线性不达标 [outline]"
      - "连续2章无爽点事件时自动插入微爽点 [webnovel]"
    engine_map: ["webnovel", "reader_eval", "outline"]

  "别说你懂写网文":
    source: "千幻冰云 (2013)"
    rules:
      - "类型周期定位分析，标记过时或过早进场警告 [management]"
      - "四率诊断：追读/收藏/订阅/月票率关联分析 [analysis]"
      - "每章暴露信息不超过总信息池的15% [writer]"
      - "检测不少于3种商业化元素：升级/打脸/收集/养成等 [factory]"
    engine_map: ["management", "analysis", "writer", "factory"]

  "创意写作系列（中国创意写作教学体系）":
    source: "葛红兵 等 上海大学 (2012-2020)"
    rules:
      - "全书体裁一致性检查：叙事模式符合宣称题材 [literature]"
      - "所有引擎输出修改建议须遵循肯定→问题→可操作建议三步 [human_lang]"
      - "输出分解为对话/描写/叙事三个子技能评分 [writer]"
      - "多视角模拟批评：正面/中立/挑剔三种视角 [reader_eval]"
    engine_map: ["literature", "human_lang", "writer", "reader_eval"]

  "故事工坊":
    source: "许道军 (2015)"
    rules:
      - "故事梗概因果链检测：至少10个因果连接词 [plot]"
      - "激励事件三重门槛：不可逆性/连锁反应/象征意义 [outline]"
      - "每3-5章应有一个未解答的核心问题持续推进 [architecture]"
      - "意图-效果差距分析，偏差>30%标记 [reader_eval]"
    engine_map: ["plot", "outline", "architecture", "reader_eval"]

  "爽点心理学":
    source: "综合(多源) (2020)"
    rules:
      - "爽点类型检测，连续3章同类型自动建议交替 [emotion]"
      - "爽点节奏公式：压抑期:释放期:余韵期≈2:1:0.5 [webnovel]"
      - "关键打脸/逆袭场景检测见证者效应 [reader_eval]"
      - "基于压抑时长+事件权重+对比强度预测爽点强度 [simulation]"
    engine_map: ["emotion", "webnovel", "reader_eval", "simulation"]

  "黄金三章研究":
    source: "综合(起点大神+平台数据) (2021)"
    rules:
      - "三章功能定位：第一章钩子/第二章深化/第三章首轮爽点 [reader_eval]"
      - "12种开场钩子识别，前三章少于2种标记钩子不足 [analysis]"
      - "前三章设定信息占比<20% [style]"
      - "三章内修辞密度>30%标记用力过猛 [writer]"
    engine_map: ["reader_eval", "analysis", "style", "writer"]

  "追读率提升指南":
    source: "多平台数据交叉验证 (2022)"
    rules:
      - "断章位置检测：高潮前为优秀断章 [lstm_predictor]"
      - "每章续读动机≥2种：认知型/情感型/成就型 [webnovel]"
      - "第15-20章/50-60章检测弃书隐患 [simulation]"
      - "自动生成5个版本的双行结尾供作者选择 [writer]"
    engine_map: ["lstm_predictor", "webnovel", "simulation", "writer"]

  "网文商业逻辑":
    source: "多平台商业数据分析 (2022)"
    rules:
      - "IP潜力五维度评分：世界观独占性/角色记忆度/题材适配度/延展空间/梗密度 [factory]"
      - "免费/付费匹配检测：平台商业化逻辑一致性 [management]"
      - "3000铁粉可行性预测 [simulation]"
      - "世界观独占性：核心设定与头部作品相似度>80%标记独特度不足 [development]"
    engine_map: ["factory", "management", "simulation", "development"]

  "读者心理学":
    source: "行为心理学+平台大数据 (2022)"
    rules:
      - "每章结尾检测认知未完成状态（蔡格尼克效应） [psychology]"
      - "最后3章终末体验质量评分不得低于全书平均分 [reader_eval]"
      - "章节长度控制在6000-8000字 [webnovel]"
      - "前5章设计≥2个强烈情感绑定事件 [emotion]"
