core_rules:
  - "七大命名铁律: (1)字符规范(禁止繁体/字母/数字/符号) (2)易写易认(避免生僻字) (3)独特性(常见字+不常见组合) (4)寓意吉祥 (5)音律和谐 (6)传统相符 (7)避讳原则"
  - "书名策略: 核心关键词+悬念/反差, 平台适配(番茄要直白/起点要意境), 字符数4-6字最佳, A/B测试选出高CTR版本"
  - "章节名规则: 字数≤10字, 禁止重复, 简洁明了, 需体现本章核心冲突或转折, 含悬念钩子(疑问/反转/信息差), 建议随机组合防模板化"
  - "角色名: 东方按历史脉络(单双名/礼制避讳/五行八字)+现代规范(<=6字); 西方按语系差异(英/意/德/法等)+称呼规范; 配角名需区分度"
  - "道具名: 功能直观描述+文化意境+层级嵌套结构; 地名: 西方基于自然地理/人名纪念/宗教/方位功能后缀, 中国古代基于山水/方位/行政/祥瑞命名"

engine_map:
  - "reader_eval (书名吸引力/A/B测试)"
  - "character (角色名匹配度检测)"
  - "world (地名/道具名一致性)"
  - "consistency (命名风格统一性检测)"
  - "human_lang (字符规范/音律检测)"
