core_rules:
  - "强制顺序(Phase 0→5): 创作资料库→写作技能库→审查校验库→AI去痕库→写作要求库→铁律库, 六大库未全部建立不得开始正文写作"
  - "创作资料库: 题材背景资料+设定参考+同类作品分析+灵感素材+专业知识库(按genre-research-guide词条匹配)"
  - "写作技能库: 风格锚定+句式模板+词汇表(强动词/场景替换)+禁用词表+对话差异化模板"
  - "审查校验库: 审查清单(写前/写后/全卷三层)+6维一致性标准(设定/角色/剧情/风格/伏笔/逻辑)+节奏标准+质量门禁+平台适配标准"
  - "AI去痕库+写作要求库+铁律库: 29条去痕规则+AIGC检测值标准+平台写作要求+内容安全红线+32条创作铁律+违规自动检测"

engine_map:
  - "collector (创作资料库自动构建)"
  - "quality_baseline (审查校验库/质量门禁)"
  - "consistency (6维一致性检测)"
  - "human_lang (写作技能库/句式词汇模板)"
  - "management (六大库启用检查/写作中持续更新)"
