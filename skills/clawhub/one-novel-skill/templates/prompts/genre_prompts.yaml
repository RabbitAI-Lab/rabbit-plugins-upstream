# Genre-specific writing prompts — one-novel-skill
修仙: |-
  【修仙文要点】
  - 境界体系清晰（练气→筑基→金丹→元婴），每次突破有代价
  - 修炼资源（丹药/灵石/功法）驱动情节
  - 斗法描写要有层次感：起手式→招式碰撞→胜负揭晓
  - 宗门势力和派系斗争作为长线背景
  - 天道/因果/劫数元素增加深度
  - 反派不能无脑送，每次冲突都要有算计

悬疑: |-
  【悬疑文要点】
  - 开场必须埋下核心谜题（死者/失踪/怪事）
  - 线索分批释放，每章至少1个新线索+1个反转
  - 红鲱鱼（false lead）必须出现至少2次
  - 节奏控制：平静收集线索→突然发现→紧张追逐→短暂喘息→更大危机
  - 逻辑闭环：结尾要能回推所有关键线索
  - 每次揭秘带来更大的谜团

都市: |-
  【都市文要点】
  - 快节奏，前三章必出核心冲突/金手指
  - 社会阶层对抗（底层→中层→上层→顶层）
  - 日常生活细节增加真实感（房租/通勤/外卖）
  - 装逼打脸要有合理性，不被碾压
  - 人际关系网逐步展开
  - 每章至少1个爽点或反转

历史: |-
  【历史文要点】
  - 穿越后首章必须确认时代背景和身份
  - 利用现代知识改变历史进程，但不能过度开挂
  - 历史人物出场要做考据，不能OOC
  - 制度/技术/文化细节增加沉浸感
  - 政治斗争和军事描写要合理
  - 避免过度美化或丑化历史人物

言情: |-
  【言情文要点】
  - 感情线必须有障碍（身份差距/误会/第三者/家族反对）
  - 两人关系推进要有事件触发（不是一见钟情走到死）
  - 误会不能靠巧合解开，要靠人物主动选择
  - 配角感情线作为调剂但不能抢主线
  - 进度合理：前30%暧昧期，中40%波折期，后30%甜蜜/决裂
  - 虐点要痛在合理处，不为了虐而虐

科幻: |-
  【科幻文要点】
  - 科技设定要内恰（硬科幻要符合物理常识）
  - 科级想象不能太跳跃，要有迭代过程
  - 科幻框架下讲人的故事，不是技术说明书
  - 未来社会结构和伦理矛盾是核心
  - 外星文明/AI/超人类题材注意世界观极限
  - 避免为炫技而堆砌术语

游戏: |-
  【游戏文要点】
  - 游戏系统数值要自洽（等级/装备/技能）
  - 现实与游戏世界的互动是核心爽点
  - 副本/任务/Boss战设计要有层次
  - 玩家间的竞争和合作推动情节
  - 注意平衡「现实世界」和「游戏世界」的篇幅
  - 氪金/肝/攻略等游戏元素要真实
