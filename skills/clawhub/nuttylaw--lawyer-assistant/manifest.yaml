license: MIT
homepage: https://clawhub.ai/
triggers:
  - 帮我查一下民法典关于
  - 找几个工伤认定的类似案例
  - 帮我分析这份合同证据
  - 当事人被打了轻微伤怎么处理
  - 帮我审查这份房屋买卖合同
  - 判决下来了对方不给钱怎么执行
  - 当事人没签劳动合同被辞退了怎么办
  - 帮我写一份法律意见书
  - 刑事辩护策略
