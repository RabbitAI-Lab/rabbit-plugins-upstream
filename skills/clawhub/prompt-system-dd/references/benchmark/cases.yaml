# 产出回归基线需求集(R03)
#
# 用途:锁定"需求 → 组装产出"的映射。改原子后重跑本集,diff 快照,
#       人工确认变化后才更新基线。防止"改一个词悄悄影响所有档位产出"。
# 门禁:validate_skill.py validate_regression_baseline() (RB001-RB004)
# 快照:benchmark/snapshots/<id>.md,由组装流程生成后人工归档
#
# 字段说明:
#   id                  唯一编号,与快照文件名一致
#   level               期望基调(B1-B4)
#   domain              期望注入的域原子(stem),无域注入填 none
#   outputs             期望注入的输出原子(stem 列表)
#   requirement         固定的需求输入文本,**禁止随意改动**
#   expected_fingerprint 期望 DEPTH 指纹(9 位,组装顺序)
#   confirmed           快照是否已人工确认;未确认为 false 时门禁报 RB003

version: 1
fingerprint_slots: 9
cases:

  - id: case-01
    level: B1
    domain: hr
    outputs: [text-doc]
    requirement: "写一封互联网公司运营岗新员工的入职欢迎邮件,风格活泼年轻化,500字左右"
    expected_fingerprint: "1,1,1,1,1,1,1,1,1"
    confirmed: true
    boundary_precheck: none

  - id: case-02
    level: B1
    domain: marketing
    outputs: [text-doc]
    requirement: "写一条新品上市的朋友圈推广文案,面向25-35岁女性,50字以内"
    expected_fingerprint: "1,1,1,1,1,1,1,1,1"
    confirmed: true
    boundary_precheck: none

