<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Meta / Facebook 周期分析报告</title>
<script src="https://staticpn.siluzan.com/assets/slz/homeCDN/echarts.min.js"></script>
<style>
:root{--bg:#ffffff;--card:#ffffff;--text:#1f2937;--muted:#6b7280;--green:#15803d;--yellow:#a16207;--red:#b91c1c;--accent:#2563eb;--border:#e5e7eb;--head:#f9fafb}
html{scroll-behavior:smooth;scroll-padding-top:64px}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.75}
.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 80px}
section{margin-bottom:36px;scroll-margin-top:72px}
.hero{background:#fff;border-bottom:1px solid var(--border);border-radius:0;padding:8px 0 24px;margin-bottom:8px;box-shadow:none}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;border-radius:999px;padding:4px 12px;font-size:.78rem;font-weight:600;margin-bottom:12px}
.hero h1{margin:0 0 8px;font-size:1.85rem;font-weight:700;color:#111827}
.hero .sub{color:var(--muted);font-size:.95rem}
h2{display:flex;align-items:center;font-size:1.35rem;border-left:4px solid var(--accent);padding-left:12px;margin:32px 0 16px;color:#111827}
h3{display:flex;align-items:center;gap:6px;font-size:1.05rem;color:#374151;margin:20px 0 10px}
h3 .ico{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:22px;margin-bottom:16px;box-shadow:none}
.chart-box{position:relative;height:320px;margin:12px 0;background:#f8fafc;border:1px solid var(--border);border-radius:12px;padding:8px}
.chart-box.tall{height:380px}
.insight{font-size:.92rem;color:#374151;padding:16px 18px;background:var(--head);border-radius:8px;margin-top:12px;border:1px solid var(--border)}
.insight-block{margin-bottom:12px;padding-left:12px;border-left:3px solid #93c5fd}
.insight-block:last-child{margin-bottom:0;border-left-color:#86efac}
.ico{display:inline-block;vertical-align:-3px;flex-shrink:0}
h2 .ico{margin-right:8px;color:var(--accent)}
.nav a{display:inline-flex;align-items:center;gap:6px}
.ov-kpi .label{display:flex;align-items:center;gap:6px}
.ov-kpi .ico{color:#64748b}
.ov-kpi.feature .ico{color:#2563eb}
.ov-kpi.accent .ico{color:#7c3aed}
.ov-kpi.c-green{background:#f0fdf4;border-color:#bbf7d0}
.ov-kpi.c-green .ico{color:#059669}
.ov-kpi.c-amber{background:#fffbeb;border-color:#fde68a}
.ov-kpi.c-amber .ico{color:#d97706}
.nav a.active .ico{color:#fff}
.insight-label{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;margin-bottom:8px}
.insight-label.analysis{background:#eff6ff;color:#1d4ed8}
.insight-label.advice{background:#f0fdf4;color:#15803d}
.insight .insight-label{font-size:.78rem;font-weight:700;letter-spacing:.08em}
.q-card .q-head{display:flex;align-items:center;gap:8px}
.q-ico{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:#eff6ff;color:#2563eb}
.rec-card{position:relative;overflow:hidden}
.rec-card:before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:#2563eb}
.rec-card.t2:before{background:#16a34a}
.rec-card.t3:before{background:#ea580c}
.rec-num{display:flex;align-items:center;justify-content:center}
.rec-num .ico{color:inherit}
.insight ul{margin:0;padding-left:1.15em}
.insight li{margin:0 0 6px;line-height:1.65}
.insight li:last-child{margin-bottom:0}
table{width:100%;border-collapse:collapse;font-size:.88rem;background:#fff}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
th{color:#4b5563;font-weight:600;background:var(--head)}
tr:hover td{background:#f9fafb}
.footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:48px}
.rec-grid{display:grid;gap:16px}
@media(min-width:860px){.rec-grid{grid-template-columns:repeat(3,1fr)}}
.rec-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:22px 20px 18px;box-shadow:0 8px 24px rgba(15,23,42,.04);display:flex;flex-direction:column;min-height:100%}
.rec-card .rec-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.rec-num{flex:0 0 36px;width:36px;height:36px;border-radius:10px;background:#eff6ff;color:#1d4ed8;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:1rem}
.rec-card h4{margin:2px 0 0;font-size:1.02rem;color:#111827;line-height:1.4}
.rec-tag{display:inline-block;margin-top:6px;font-size:.7rem;font-weight:600;letter-spacing:.04em;color:#1d4ed8;background:#eff6ff;border-radius:999px;padding:2px 8px}
.rec-card.t2 .rec-num,.rec-card.t2 .rec-tag{background:#f0fdf4;color:#15803d}
.rec-card.t3 .rec-num,.rec-card.t3 .rec-tag{background:#fff7ed;color:#c2410c}
.rec-card ul{margin:0;padding:0;list-style:none}
.rec-card li{position:relative;padding:8px 0 8px 16px;border-top:1px solid #f1f5f9;font-size:.88rem;line-height:1.65;color:#374151}
.rec-card li:before{content:"";position:absolute;left:0;top:16px;width:6px;height:6px;border-radius:50%;background:#93c5fd}
.rec-card.t2 li:before{background:#86efac}
.rec-card.t3 li:before{background:#fdba74}
.nav-bar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);border-top:3px solid #1877f2;box-shadow:0 4px 16px rgba(15,23,42,.04)}
.nav{display:flex;flex-wrap:wrap;gap:8px;max-width:1100px;margin:0 auto;padding:10px 20px}
.nav a{color:#334155;font-size:.85rem;text-decoration:none;border:1px solid var(--border);background:#fff;padding:6px 12px;border-radius:999px}
.nav a:hover{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
.nav a.active{background:#2563eb;color:#fff;border-color:#2563eb}
.table-wrap{overflow-x:auto;margin:12px 0;background:#fff}
.table-wrap.excel{max-height:560px;overflow:auto;border:1px solid var(--border);border-radius:8px;background:#fff}
.table-wrap.excel table{margin:0}
.table-wrap.excel thead th{position:sticky;top:0;z-index:1;background:var(--head)}
table.data th,table.data td{white-space:nowrap;font-size:.8rem}
.blank{color:var(--muted)}
.four-q{display:grid;gap:14px;margin-top:16px}
@media(min-width:700px){.four-q{grid-template-columns:repeat(2,1fr)}}
.q-card{border:1px solid var(--border);border-radius:8px;padding:18px;background:var(--head)}
.q-card .q-title{font-size:1.05rem;font-weight:700;margin:0;color:#111827}
.q-card:nth-child(1){border-top:3px solid #10b981}
.q-card:nth-child(2){border-top:3px solid #2563eb}
.q-card:nth-child(3){border-top:3px solid #ea580c}
.q-card:nth-child(4){border-top:3px solid #7c3aed}
.q-card:nth-child(1) .q-ico{background:#ecfdf5;color:#059669}
.q-card:nth-child(2) .q-ico{background:#eff6ff;color:#2563eb}
.q-card:nth-child(3) .q-ico{background:#fff7ed;color:#ea580c}
.q-card:nth-child(4) .q-ico{background:#f5f3ff;color:#7c3aed}
.q-card .verdict{color:#1d4ed8;font-size:.9rem;margin-bottom:10px}
.q-card ul{margin:8px 0;padding-left:18px;font-size:.86rem;color:#374151}
.q-card .action{margin-top:12px;padding-top:10px;border-top:1px dashed var(--border);font-size:.86rem}
.q-card .action strong{color:var(--green)}
.ov-board{background:#fff;color:#111827;border:1px solid var(--border);border-radius:16px;padding:28px 28px 24px;margin-bottom:18px;box-shadow:0 8px 24px rgba(15,23,42,.04)}
.ov-board .ov-kicker{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:#2563eb;margin:0 0 18px}
.ov-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.ov-kpi{background:#f8fafc;border:1px solid var(--border);border-radius:14px;padding:18px 16px 16px}
.ov-kpi .label{font-size:.75rem;color:#6b7280;letter-spacing:.04em}
.ov-kpi .value{font-size:1.55rem;font-weight:700;margin-top:8px;line-height:1.2;letter-spacing:-.02em;word-break:break-word;color:#111827}
.ov-kpi.feature{background:#eff6ff;border-color:#bfdbfe}
.ov-kpi.feature .value{font-size:1.85rem;color:#0f172a}
.ov-kpi.accent .value{color:#1d4ed8}
.ov-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.ov-meta .ov-kpi .value{font-size:.95rem;font-weight:600;line-height:1.45;color:#334155}
@media(max-width:900px){.ov-kpis,.ov-meta{grid-template-columns:1fr 1fr}.ov-kpi.feature .value{font-size:1.5rem}}
@media(max-width:560px){.ov-kpis,.ov-meta{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="nav-bar">
  <div class="nav">
    <a href="#overview">账号总览</a>
    <a href="#daily">日趋势</a>
    <a href="#country">国家</a>
    <a href="#campaign">广告系列</a>
    <a href="#audience">受众</a>
    <a href="#recs">优化建议</a>
  </div>
</nav>
<div class="wrap">
<header class="hero">
  <div class="hero-badge">Facebook Ads · 周期复盘</div>
  <h1 id="heroTitle">Meta / Facebook 广告投放分析报告</h1>
  <p class="sub" id="heroSub"></p>
</header>
<section id="overview">
  <h2>一、账号总览</h2>
  <div class="ov-board">
    <p class="ov-kicker" id="ovKicker">Account Snapshot</p>
    <div class="ov-kpis" id="ovKpis"></div>
    <div class="ov-meta" id="ovMeta"></div>
  </div>
  <div class="card"><div class="four-q" id="fourQ"></div></div>
</section>
<section id="daily">
  <h2>二、分析 · 日趋势</h2>
  <div class="card">
    <div class="chart-box tall" id="chartDaily"></div>
    <div class="table-wrap excel" id="tableDaily"></div>
    <div class="insight" id="insightDaily"></div>
  </div>
</section>
<section id="country">
  <h2>三、分析 · 国家</h2>
  <div class="card">
    <div class="chart-box" id="chartCountry"></div>
    <div class="table-wrap excel" id="tableCountry"></div>
    <div class="insight" id="insightCountry"></div>
  </div>
</section>
<section id="campaign">
  <h2>广告系列</h2>
  <div class="card">
    <div class="table-wrap" id="tableCampaign"></div>
    <div class="insight" id="insightCampaign"></div>
  </div>
</section>
<section id="audience">
  <h2>四、分析 · 受众结构与线索质量</h2>
  <div class="card">
    <div class="chart-box" id="chartAudience"></div>
    <h3>受众数据</h3>
    <div class="table-wrap" id="tableAudience"></div>
    <div class="insight" id="insightAudience"></div>
  </div>
</section>
<section id="recs">
  <h2>五、下一步优化建议</h2>
  <div class="rec-grid" id="recGrid"></div>
</section>
<p class="footer" id="footer"></p>
</div>
<script>
window.__META_PERIOD_REPORT__ = window.__META_PERIOD_REPORT__ || null;
(function () {
  var data = window.__META_PERIOD_REPORT__;
  if (!data) {
    document.getElementById("heroSub").textContent = "未注入报告数据，请通过 facebook-analysis render 生成。";
    return;
  }
  var meta = data.meta || {};
  var kpis = data.kpis || {};
  var tables = data.tables || {};
  var charts = data.charts || {};
  var sections = data.sections || {};
  var currency = meta.currency || "USD";
  var moneyPrefix = currency === "USD" ? "$" : currency + " ";

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function isNum(v) { return typeof v === "number" && isFinite(v); }
  function fmtInt(v) {
    if (!isNum(v)) return "—";
    return Math.round(v).toLocaleString("en-US");
  }
  function fmtNum(v, digits) {
    if (!isNum(v)) return "—";
    return String(Number(v.toFixed(digits == null ? 2 : digits)));
  }
  function fmtMoney(v) {
    if (!isNum(v)) return "—";
    return moneyPrefix + fmtNum(v, 2);
  }
  function cell(v, kind) {
    if (kind === "int") return esc(fmtInt(v));
    if (kind === "money") return esc(isNum(v) ? moneyPrefix + fmtNum(v, 8).replace(/\.?0+$/, "") : "—");
    if (kind === "num") return esc(isNum(v) ? fmtNum(v, 8).replace(/\.?0+$/, "") : "—");
    return v ? esc(v) : '<span class="blank">—</span>';
  }
  function metricTds(row) {
    return [
      cell(row.reach, "int"),
      cell(row.impressions, "int"),
      cell(row.frequency, "num"),
      cell(row.attributionSetting),
      cell(row.resultType),
      cell(row.results, "int"),
      cell(row.spend, "money"),
      cell(row.costPerResult, "money"),
    ].map(function (td) { return "<td>" + td + "</td>"; }).join("");
  }
  function tableHtml(headers, rows, firstCell) {
    var thead = "<thead><tr>" + headers.map(function (h) { return "<th>" + esc(h) + "</th>"; }).join("") + "</tr></thead>";
    var tbody = "<tbody>" + rows.map(function (row) {
      return "<tr><td>" + esc(firstCell(row)) + "</td>" + metricTds(row) + "</tr>";
    }).join("") + "</tbody>";
    return '<table class="data">' + thead + tbody + "</table>";
  }
  function insightHtml(section) {
    var insight = (section && section.insight) || {};
    var analysis = Array.isArray(insight.analysis) ? insight.analysis : [];
    var advice = Array.isArray(insight.advice) ? insight.advice : [];
    if (!analysis.length && !advice.length) return "";
    var html = "";
    if (analysis.length) {
      html += '<div class="insight-block"><div class="insight-label analysis">分析</div><ul>' +
        analysis.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul></div>";
    }
    if (advice.length) {
      html += '<div class="insight-block"><div class="insight-label advice">建议</div><ul>' +
        advice.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul></div>";
    }
    return html;
  }
  function colorByCpl(v, avg) {
    if (!v || v <= 0) return "#ef4444";
    if (v <= avg * 0.85) return "#22c55e";
    if (v <= avg * 1.15) return "#eab308";
    return "#ef4444";
  }

  var brand = meta.accountName || meta.brandName || "Facebook 广告账户";
  var period = meta.periodLabel || ((meta.startDate || "") + " ~ " + (meta.endDate || ""));
  var campaign = meta.campaignName || "";
  document.title = brand + " Facebook 广告报告" + (campaign ? " | " + campaign : "");
  document.getElementById("heroTitle").innerHTML = esc(brand) + " · Facebook 广告投放<br/>" + esc(period) + "分析报告";
  document.getElementById("heroSub").textContent =
    (campaign ? "广告系列：" + campaign + " ｜ " : "") +
    "统计区间：" + (meta.startDate || "—") + " ~ " + (meta.endDate || "—") +
    "（货币：" + currency + "）";
  document.getElementById("ovKicker").textContent = "Account Snapshot" + (campaign ? " ｜ " + campaign : "");

  document.getElementById("ovKpis").innerHTML =
    '<div class="ov-kpi feature"><div class="label">已花费金额 (' + esc(currency) + ')</div><div class="value">' + esc(fmtMoney(kpis.spend)) + "</div></div>" +
    '<div class="ov-kpi feature accent"><div class="label">单次成效费用</div><div class="value">' + esc(fmtMoney(kpis.costPerResult)) + "</div></div>" +
    '<div class="ov-kpi c-green"><div class="label">覆盖人数</div><div class="value">' + esc(fmtInt(kpis.reach)) + "</div></div>" +
    '<div class="ov-kpi c-amber"><div class="label">展示次数</div><div class="value">' + esc(fmtInt(kpis.impressions)) + "</div></div>";
  document.getElementById("ovMeta").innerHTML =
    '<div class="ov-kpi"><div class="label">目标</div><div class="value">' + esc(kpis.resultType || meta.resultType || "—") + "</div></div>" +
    '<div class="ov-kpi"><div class="label">成效类型</div><div class="value">' + esc(kpis.resultType || meta.resultType || "—") + "</div></div>" +
    '<div class="ov-kpi"><div class="label">归因设置</div><div class="value">' + esc(kpis.attributionSetting || meta.attributionSetting || "—") + "</div></div>";

  document.getElementById("fourQ").innerHTML = (data.fourQuestions || []).map(function (q) {
    var bullets = (q.bullets || []).map(function (b) { return "<li>" + esc(b) + "</li>"; }).join("");
    return '<div class="q-card"><div class="q-head"><span class="q-ico">?</span><div class="q-title">' +
      esc(q.title || "") + '</div></div><div class="verdict">→ ' + esc(q.verdict || "") +
      "</div><ul>" + bullets + '</ul><div class="action"><strong>怎么办：</strong>' +
      esc(q.action || "") + "</div></div>";
  }).join("");

  var moneyCol = "已花费金额 (" + currency + ")";
  var dailyHeaders = ["单日", "覆盖人数", "展示次数", "频次", "归因设置", "成效类型", "成效", moneyCol, "单次成效费用"];
  document.getElementById("tableDaily").innerHTML = tableHtml(dailyHeaders, tables.daily || [], function (r) { return r.date || "—"; });
  document.getElementById("insightDaily").innerHTML = insightHtml(sections.daily);

  var countryHeaders = ["国家/地区", "广告系列名称", "覆盖人数", "展示次数", "频次", "归因设置", "成效类型", "成效", moneyCol, "单次成效费用"];
  document.getElementById("tableCountry").innerHTML = (function () {
    var rows = tables.countries || [];
    var campaignFallback = meta.campaignName || "";
    var thead = "<thead><tr>" + countryHeaders.map(function (h) { return "<th>" + esc(h) + "</th>"; }).join("") + "</tr></thead>";
    var tbody = "<tbody>" + rows.map(function (row) {
      return "<tr><td>" + esc(row.countryOrRegion || "—") + "</td><td>" +
        esc(row.campaignName || campaignFallback || "—") + "</td>" + metricTds(row) + "</tr>";
    }).join("") + "</tbody>";
    return '<table class="data">' + thead + tbody + "</table>";
  })();
  document.getElementById("insightCountry").innerHTML = insightHtml(sections.country);

  var campaignHeaders = ["广告系列名称", "覆盖人数", "展示次数", "频次", "归因设置", "成效类型", "成效", moneyCol, "单次成效费用"];
  document.getElementById("tableCampaign").innerHTML = tableHtml(campaignHeaders, tables.campaigns || [], function (r) { return r.campaignName || "—"; });
  document.getElementById("insightCampaign").innerHTML = insightHtml(sections.campaigns);

  var audHeaders = ["年龄", "性别", "覆盖人数", "展示次数", "频次", "归因设置", "成效类型", "成效", moneyCol, "单次成效费用"];
  document.getElementById("tableAudience").innerHTML = (function () {
    var rows = tables.audiences || [];
    var thead = "<thead><tr>" + audHeaders.map(function (h) { return "<th>" + esc(h) + "</th>"; }).join("") + "</tr></thead>";
    var tbody = "<tbody>" + rows.map(function (row) {
      return "<tr><td>" + esc(row.age || "—") + "</td><td>" + esc(row.gender || "—") + "</td>" + metricTds(row) + "</tr>";
    }).join("") + "</tbody>";
    return '<table class="data">' + thead + tbody + "</table>";
  })();
  document.getElementById("insightAudience").innerHTML = insightHtml(sections.audience);

  document.getElementById("recGrid").innerHTML = (data.recommendations || []).map(function (rec, i) {
    var cls = i === 1 ? " t2" : i >= 2 ? " t3" : "";
    var items = (rec.items || []).map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("");
    return '<div class="rec-card' + cls + '"><div class="rec-top"><div class="rec-num">' + (i + 1) +
      "</div><div><h4>" + esc(rec.title || "") + '</h4><span class="rec-tag">' +
      esc(rec.tag || "建议") + "</span></div></div><ul>" + items + "</ul></div>";
  }).join("");

  document.getElementById("footer").textContent =
    "货币 " + currency + " ｜ 生成：" + (meta.generatedAt || "") +
    " ｜ 结构对齐运营模板（汇总 / 日趋势 / 国家 / 广告系列 / 受众）";

  var avg = isNum(kpis.costPerResult) ? kpis.costPerResult : 0;
  var chartInstances = [];
  function bindChart(el, option) {
    if (!window.echarts || !el) return;
    var chart = echarts.init(el);
    chart.setOption(option);
    chartInstances.push(chart);
  }
  var axis = { axisLabel: { color: "#64748b" }, axisLine: { lineStyle: { color: "#e2e8f0" } }, splitLine: { lineStyle: { color: "#e2e8f0" } } };
  var daily = charts.daily || {};
  bindChart(document.getElementById("chartDaily"), {
    tooltip: { trigger: "axis" },
    legend: { data: ["线索", "花费 (" + currency + ")"], textStyle: { color: "#334155" } },
    grid: { left: 48, right: 48, top: 40, bottom: 48 },
    xAxis: { type: "category", data: daily.labels || [], axisLabel: { color: "#64748b", rotate: 45, fontSize: 10 } },
    yAxis: [
      Object.assign({ type: "value", name: "线索", nameTextStyle: { color: "#64748b" } }, axis),
      Object.assign({ type: "value", name: "花费", nameTextStyle: { color: "#64748b" }, splitLine: { show: false } }, axis),
    ],
    series: [
      {
        name: "线索",
        type: "bar",
        data: (daily.leads || []).map(function (v) {
          return { value: v, itemStyle: { color: v > 0 ? "#22c55e" : "#ef4444" } };
        }),
      },
      { name: "花费 (" + currency + ")", type: "line", yAxisIndex: 1, smooth: true, symbolSize: 6, itemStyle: { color: "#2563eb" }, data: daily.spend || [] },
    ],
  });
  var country = charts.country || {};
  bindChart(document.getElementById("chartCountry"), {
    tooltip: { trigger: "axis" },
    legend: { data: ["CPL (" + currency + ")", "花费 (" + currency + ")"], textStyle: { color: "#334155" } },
    grid: { left: 88, right: 48, top: 40, bottom: 32 },
    yAxis: { type: "category", data: country.labels || [], axisLabel: { color: "#334155" }, inverse: true },
    xAxis: [Object.assign({ type: "value" }, axis), Object.assign({ type: "value", splitLine: { show: false } }, axis)],
    series: [
      {
        name: "CPL (" + currency + ")",
        type: "bar",
        data: (country.cpl || []).map(function (v) {
          return { value: v, itemStyle: { color: colorByCpl(v, avg) } };
        }),
      },
      { name: "花费 (" + currency + ")", type: "line", xAxisIndex: 1, symbolSize: 8, itemStyle: { color: "#64748b" }, data: country.spend || [] },
    ],
  });
  var aud = charts.audience || {};
  bindChart(document.getElementById("chartAudience"), {
    tooltip: { trigger: "axis" },
    legend: { data: ["CPL", "线索"], textStyle: { color: "#334155" } },
    grid: { left: 48, right: 48, top: 40, bottom: 64 },
    xAxis: { type: "category", data: aud.labels || [], axisLabel: { color: "#64748b", rotate: 40, fontSize: 10 } },
    yAxis: [Object.assign({ type: "value" }, axis), Object.assign({ type: "value", splitLine: { show: false } }, axis)],
    series: [
      {
        name: "CPL",
        type: "bar",
        data: (aud.cpl || []).map(function (v) {
          return { value: v, itemStyle: { color: colorByCpl(v, avg) } };
        }),
      },
      { name: "线索", type: "line", yAxisIndex: 1, symbolSize: 8, itemStyle: { color: "#db2777" }, data: aud.leads || [] },
    ],
  });
  window.addEventListener("resize", function () {
    chartInstances.forEach(function (c) { c.resize(); });
  });

  var navLinks = Array.prototype.slice.call(document.querySelectorAll(".nav a"));
  var sectionEls = navLinks.map(function (a) { return document.getElementById(a.getAttribute("href").slice(1)); }).filter(Boolean);
  function setActive(id) {
    navLinks.forEach(function (a) { a.classList.toggle("active", a.getAttribute("href") === "#" + id); });
  }
  if (window.IntersectionObserver) {
    var spy = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) setActive(e.target.id); });
    }, { rootMargin: "-30% 0px -60% 0px", threshold: 0 });
    sectionEls.forEach(function (s) { spy.observe(s); });
  }
  navLinks.forEach(function (a) {
    a.addEventListener("click", function () { setActive(a.getAttribute("href").slice(1)); });
  });
})();
</script>
</body>
</html>
