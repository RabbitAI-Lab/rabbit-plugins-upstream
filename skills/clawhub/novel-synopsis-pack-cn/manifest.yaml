slug: novel-synopsis-pack-cn
name: novel-synopsis-pack-cn
display_name: 小说投稿梗概包
version: 1.0.0
short_description: 将完整小说素材整理为三档投稿梗概与可复制的人物关系摘要
description: 根据覆盖结局的完整故事概要、逐章摘要和投稿长度要求，整理300、800、1500字三档投稿梗概与人物关系摘要，保留关键因果、角色选择和结局，并分别标注实际字数；缺少章节或结局时先指出需补充的资料。
repository: https://github.com/xxjrq/novel-synopsis-pack-cn
license: MIT-0
