name: geoskill-sar-sea-ice-mapping
display_name: SAR 海冰制图
description: |
  从SAR σ⁰制图海冰类型与密集度：dB刻度三类Otsu分水面/新冰/多年冰，GLCM纹理精炼多年冰，滑窗计算冰密集度，输出海冰类型GeoTIFF、密集度GeoTIFF与面积统计JSON。SAR sea ice type and concentration mapping via multi-Otsu backscatter thresholds and GLCM texture.
version: 0.1.0
author: Mavis
entrypoint: geoskill-sar-sea-ice-mapping.py
runtime: python>=3.9
tags:
  - extraction
  - gis
  - raster
  - remote-sensing
  - sar
  - visualization
