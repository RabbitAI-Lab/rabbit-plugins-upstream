name: shop-order-exception-check-cn
slug: shop-order-exception-check-cn
display_name: 订单异常处理待办
description: 输入脱敏订单状态表、商家正常流程和时效规则，输出超时、缺项、状态矛盾订单的待办清单与人工处理顺序。适合中文小店、内容创作者核对履约或交付；资料不足时明确列出待补字段，不编造状态，不调用订单接口，也不执行发货、退款或通知。
version: 1.0.0
repository: https://github.com/xxjrq/shop-order-exception-check-cn
