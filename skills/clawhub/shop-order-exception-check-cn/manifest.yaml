tags:
  - order-management
  - exception-handling
  - ecommerce
  - chinese
trigger_words:
  - 订单异常
  - 订单超时
  - 状态矛盾
  - 待发货核对
triggers:
  - 帮我整理订单异常待办
  - 检查订单状态是否超时
  - 根据流程核对订单状态
