<!-- ══════════════════════════════════════════════════════════════
  片段:热力评估矩阵(表格 + 逐格三档底纹 + 图例)—— 原型 38
  参数:
    {{DIM1}}..{{DIM5}}   维度列名(≤6 字;5 列)
    {{R1_NAME}}..        对象行名(业务单元/风险项)
    {{R1C1_BG}}..        每格底纹,**三档单色系**:
                           弱 = var(--brand-primary)      文字 var(--white) / 700
                           中 = var(--brand-primary-soft)(主色 18% 混白)   文字 var(--charcoal) / 600
                           强 = var(--card-bg)            文字 var(--text-secondary) / 600
    {{R1C1_FG}}..        与底纹配套的文字色(见上)
    {{R1C1}}..           格内文字:只写"弱/中/强"或分数,**不写句子**(要写句子用原型 19)
    {{LEGEND_NOTE}}      打分口径(分数区间 + 打分方式 + 分歧处理)
    {{SOURCE}}           来源/口径注
  表格 y=330;图例色块 y=890(3 档,x 步进 250);口径注 y=930;来源 y=990
  ✅ 换色板预设**不需要重算中档色**(2026-08-17 第九轮起):中档用 `var(--brand-primary-soft)`,
     该令牌已在 theme.css 与 16 套预设里按各自主色自动推导(tools/gen-ladder.js),换肤自动跟随。
  纪律: ❌ 红黄绿交通灯(AI 味 + 约 8% 男性无法区分红绿);
        ❌ 五档以上色阶(超过三档人眼无法可靠比较);❌ 每格加图标、❌ 渐变底纹;
        action title 写**扫出来的结论**("数据治理是全线短板"),不写"能力评估矩阵"
  ══════════════════════════════════════════════════════════════ -->
