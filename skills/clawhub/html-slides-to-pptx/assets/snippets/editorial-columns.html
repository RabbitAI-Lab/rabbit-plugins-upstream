  片段:编辑式双栏文字(原型 7 内容区 · 满填 · 去 AI 味主力)
  参数:
    {{COL1}}  第一栏内容(段落,段间 <br><br>;每段 1 句粗体引导)

<div style="position:absolute;left:100px;top:340px;width:1720px;display:flex;gap:80px;">
  <div data-object="true" data-object-type="textbox" style="flex:1;">
    <div style="font-size:24px;line-height:1.7;color:var(--text-primary);">{{COL1}}</div>
  </div>
  <div data-object="true" data-object-type="textbox" style="flex:1;">
    <div style="font-size:24px;line-height:1.7;color:var(--text-primary);">{{COL2}}</div>
  </div>
