<!-- ══════════════════════════════════════════════════════════════
  片段:横条目(序号圆 + 标题 + 副题,对象内部 flex 对齐)
  ⚠️ 使用限制(去 AI 味反模式 5):序号圆圈仅限流程/步骤类页面;议程/列表用 agenda-list 裸排大数字。
  参数:
    {{X}} {{Y}} {{W}} {{H}}   位置尺寸(条目常用 H=100~130)
    {{NUM}}     序号/单字     {{ACCENT}} 序号圆底色
    {{TITLE}}   条目标题      {{SUB}}   条目副题(可为英文/引文)
  机制: 条目是一个 data-object;内部用 flex 做"圆+文"横向居中(对象内部 flex 一直支持);
        圆、文字均为未标记流式子元素,随条目递归提取
  ══════════════════════════════════════════════════════════════ -->
<div data-object="true" data-object-type="shape" style="position:absolute;left:{{X}};top:{{Y}};width:{{W}};height:{{H}};background:var(--white);border:1px solid var(--border-light);border-radius:10px;z-index:1;padding:0 28px;display:flex;align-items:center;gap:24px;">
  <div style="width:72px;height:72px;background:{{ACCENT}};border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;color:var(--white);">{{NUM}}</div>
  <div style="flex:1;">
    <div style="font-size:28px;font-weight:700;line-height:1.3;color:var(--charcoal);">{{TITLE}}</div>
    <div style="font-size:22px;color:var(--text-secondary);line-height:1.4;margin-top:6px;">{{SUB}}</div>
  </div>
</div>
