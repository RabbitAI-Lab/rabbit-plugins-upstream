<!-- ══════════════════════════════════════════════════════════════
  片段:议程条目(大数字编号裸排 · 原型 3)
  参数:
    {{NUM}}     编号(如 01)     {{TITLE}} 章节标题
    {{SUB}}     一句话说明      {{H}}    条目高(620÷条目数:3 条=200,5 条=124)
    {{BORDER}}  底部细线(末条写 0px,其余 1px)
  用法: 条目逐个绝对定位叠放(top 递增 {{H}}),或放入 flex-direction:column 容器(方式 B 免算 top);
        议程页标题建议"今天讲三件事"式行动句,章节名须与后续分隔页一致
  ══════════════════════════════════════════════════════════════ -->
<div data-object="true" data-object-type="shape" style="height:{{H}};border-bottom:{{BORDER}} solid var(--border-light);display:flex;align-items:center;gap:40px;">
  <div class="num" style="font-size:64px;font-weight:800;color:var(--lenovo-red);line-height:1;">{{NUM}}</div>
  <div>
    <div style="font-size:30px;font-weight:700;line-height:1.3;color:var(--charcoal);">{{TITLE}}</div>
    <div style="font-size:22px;line-height:1.4;color:var(--text-secondary);margin-top:6px;">{{SUB}}</div>
  </div>
</div>
