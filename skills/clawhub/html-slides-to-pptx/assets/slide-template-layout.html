<!doctype html>
<!--
================================================================
  html-slides 样板页 · data-layout 声明式自动布局版(方式 C)
  与 slide-template-flex.html 视觉完全一致,但子级不写任何几何:
  坐标由转换器内置解析器统一计算(data-layout-h/w → 绝对定位)。
  语法规范见 reference/html-spec.md 第 2C 章
================================================================
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>页面标题 · data-layout 版</title>
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>
<div class="slide-container" style="background:var(--off-white);">

  <!-- ── 页面骨架:绝对定位(与经典模板一致) ─────────────── -->
  <div data-object="true" data-object-type="shape" style="position:absolute;left:100px;top:60px;width:80px;height:4px;background:var(--lenovo-red);z-index:10;"></div>
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:100px;top:88px;width:1000px;z-index:10;">
    <div style="font-size:20px;font-weight:600;letter-spacing:4px;color:var(--lenovo-red);">章节标签 · KICKER</div>
  </div>
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:1720px;top:92px;width:100px;text-align:right;z-index:10;">
    <div class="num" style="font-size:18px;font-weight:600;color:var(--text-tertiary);letter-spacing:2px;">02 / 06</div>
  </div>
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:100px;top:120px;width:1720px;z-index:10;">
    <div style="font-size:56px;font-weight:700;line-height:1.15;color:var(--charcoal);letter-spacing:-0.5px;">
      内容区用 flex/grid 排布,<br>不再手算<span style="color:var(--lenovo-red);">每个像素</span>
    </div>
  </div>

  <!-- ══ 三卡片横排:columns 策略;子级只写份数,几何全自动 ══ -->
  <div data-layout="columns" data-layout-gap="20" style="position:absolute;left:100px;top:340px;width:1720px;height:400px;">
    <!-- 卡片 1 -->
    <div data-object="true" data-layout-w="1fr" style="background:var(--white);border:1px solid var(--border-light);border-radius:10px;z-index:1;padding:30px;">
      <div class="num" style="font-size:14px;font-weight:600;letter-spacing:3px;color:var(--text-tertiary);">第一点</div>
      <div style="font-size:28px;font-weight:700;color:var(--charcoal);line-height:1.25;margin-top:6px;">卡片标题</div>
      <div style="font-size:18px;font-weight:400;color:var(--text-primary);line-height:1.55;margin-top:20px;">
        正文描述,多行文字务必显式 line-height。关键结论用 <span style="color:var(--lenovo-red);font-weight:700;">红色加粗</span> 强调。
      </div>
      <div style="height:1px;background:var(--border-light);margin-top:24px;"></div>
      <div style="font-size:15px;font-weight:400;color:var(--text-tertiary);line-height:1.5;margin-top:16px;">补充小字注释。</div>
    </div>
    <!-- 卡片 2 -->
    <div data-object="true" data-layout-w="1fr" style="background:var(--white);border:1px solid var(--border-light);border-radius:10px;z-index:1;padding:30px;">
      <div class="num" style="font-size:14px;font-weight:600;letter-spacing:3px;color:var(--text-tertiary);">第二点</div>
      <div style="font-size:28px;font-weight:700;color:var(--charcoal);line-height:1.25;margin-top:6px;">卡片标题</div>
      <div style="font-size:18px;font-weight:400;color:var(--text-primary);line-height:1.55;margin-top:20px;">正文描述。</div>
    </div>
    <!-- 卡片 3:深蓝高亮卡,1.2 份宽 -->
    <div data-object="true" data-layout-w="1.2fr" style="background:var(--deep-navy);border-radius:10px;z-index:1;padding:30px;">
      <div class="num" style="font-size:14px;font-weight:600;letter-spacing:3px;color:var(--accent-orange);">★ 重点</div>
      <div style="font-size:32px;font-weight:800;color:var(--on-navy-text);line-height:1.25;margin-top:6px;">高亮卡片</div>
      <div style="font-size:18px;font-weight:400;color:var(--on-navy-sub);line-height:1.55;margin-top:20px;">
        强调用 <span style="color:var(--accent-orange);font-weight:700;">橙色加粗</span>。
      </div>
      <div style="height:52px;background:var(--accent-orange);border-radius:6px;margin-top:28px;text-align:center;">
        <div style="font-size:20px;font-weight:800;color:var(--deep-navy);line-height:52px;letter-spacing:2px;">徽 章 文 字</div>
      </div>
    </div>
  </div>

  <!-- ══ 四格统计带:grid 策略;子级只写高度 ══ -->
  <div data-layout="grid" data-layout-cols="4" data-layout-gap="20" style="position:absolute;left:100px;top:800px;width:1720px;">
    <div data-object="true" data-layout-h="160" style="background:var(--white);border:1px solid var(--border-light);border-radius:10px;z-index:1;padding:24px;">
      <div class="num" style="font-size:44px;font-weight:800;color:var(--lenovo-red);line-height:1.1;">87<span style="font-size:22px;font-weight:600;">%</span></div>
      <div style="font-size:16px;color:var(--text-secondary);line-height:1.4;margin-top:8px;">指标说明文字</div>
    </div>
    <div data-object="true" data-layout-h="160" style="background:var(--white);border:1px solid var(--border-light);border-radius:10px;z-index:1;padding:24px;">
      <div class="num" style="font-size:44px;font-weight:800;color:var(--deep-navy);line-height:1.1;">3.2<span style="font-size:22px;font-weight:600;">倍</span></div>
      <div style="font-size:16px;color:var(--text-secondary);line-height:1.4;margin-top:8px;">指标说明文字</div>
    </div>
    <div data-object="true" data-layout-h="160" style="background:var(--white);border:1px solid var(--border-light);border-radius:10px;z-index:1;padding:24px;">
      <div class="num" style="font-size:44px;font-weight:800;color:var(--signal-green);line-height:1.1;">+42<span style="font-size:22px;font-weight:600;">pp</span></div>
      <div style="font-size:16px;color:var(--text-secondary);line-height:1.4;margin-top:8px;">指标说明文字</div>
    </div>
    <div data-object="true" data-layout-h="160" style="background:var(--white);border:1px solid var(--border-light);border-radius:10px;z-index:1;padding:24px;">
      <div class="num" style="font-size:44px;font-weight:800;color:var(--charcoal);line-height:1.1;">12<span style="font-size:22px;font-weight:600;">项</span></div>
      <div style="font-size:16px;color:var(--text-secondary);line-height:1.4;margin-top:8px;">指标说明文字</div>
    </div>
  </div>

  <!-- ── 页脚(绝对定位) ──────────────────────────────── -->
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:100px;top:1020px;width:1720px;z-index:10;">
    <div style="font-size:14px;color:var(--text-tertiary);">品牌名 丨 页脚信息</div>
  </div>

</div>

<template data-slide-notes>
【核心逻辑】这页演示方式 C:columns + grid,子级只声明份数/高度,坐标全自动。
</template>
</body>
</html>
