<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>样张 · 议程</title>
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>
<!-- 原型 3:议程(编号裸列表,满填)
     2026-08-06 第四轮 P5:整页色面原为 0%。给"当前所在章"一行加浅底 + 左侧红条
     (议程页的常规做法:高亮当前位置),既是结构色面又承载"我们在哪"的信息。 -->
<div class="slide-container" style="background:var(--off-white);">
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:1720px;top:92px;width:100px;text-align:right;z-index:10;">
    <div class="num" style="font-size:16px;font-weight:600;color:var(--text-tertiary);letter-spacing:2px;">02 / 12</div>
  </div>
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:100px;top:120px;width:1720px;z-index:10;">
    <div style="font-size:60px;font-weight:700;line-height:1.15;color:var(--charcoal);">今天讲三件事</div>
  </div>

  <div style="position:absolute;left:100px;top:320px;width:1720px;display:flex;flex-direction:column;">
    <div data-object="true" data-object-type="shape" style="height:200px;background:#E8EEF6;border-left:8px solid var(--lenovo-red);border-bottom:1px solid var(--border-light);display:flex;align-items:center;gap:40px;padding-left:32px;z-index:1;">
      <div class="num" style="font-size:64px;font-weight:800;color:var(--lenovo-red);line-height:1;">01</div>
      <div>
        <div style="font-size:30px;font-weight:700;line-height:1.3;color:var(--charcoal);">问题:知识在失效,不在积累</div>
        <div style="font-size:22px;line-height:1.4;color:var(--text-secondary);margin-top:6px;">从"文档半衰期 11 个月"说起</div>
      </div>
    </div>
    <div data-object="true" data-object-type="shape" style="height:200px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;gap:40px;z-index:1;">
      <div class="num" style="font-size:64px;font-weight:800;color:var(--lenovo-red);line-height:1;">02</div>
      <div>
        <div style="font-size:30px;font-weight:700;line-height:1.3;color:var(--charcoal);">机制:给知识加上保质期</div>
        <div style="font-size:22px;line-height:1.4;color:var(--text-secondary);margin-top:6px;">写入带语境、流转有 owner、检索见时效</div>
      </div>
    </div>
    <div data-object="true" data-object-type="shape" style="height:200px;display:flex;align-items:center;gap:40px;z-index:1;">
      <div class="num" style="font-size:64px;font-weight:800;color:var(--lenovo-red);line-height:1;">03</div>
      <div>
        <div style="font-size:30px;font-weight:700;line-height:1.3;color:var(--charcoal);">证据与推广:试点三个月的数据</div>
        <div style="font-size:22px;line-height:1.4;color:var(--text-secondary);margin-top:6px;">检索时间降四成,如何复制到你的部门</div>
      </div>
    </div>
  </div>
</div>

<template data-slide-notes>【核心逻辑】三章结构 = 问题→机制→证据,与后续章节页一一呼应。</template>
</body>
</html>
