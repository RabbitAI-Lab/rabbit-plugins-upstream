<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>样张 · 执行摘要(原型 31)</title>
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>
<div class="slide-container" style="background:var(--off-white);">
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:100px;top:120px;width:1720px;">
    <div style="font-size:56px;font-weight:700;line-height:1.2;color:var(--charcoal);">建议启动 A 方案,18 个月内可收回投入</div>
  </div>
  <!-- 统领结论面板(深底,结构色面) -->
  <div data-object="true" data-object-type="shape" style="position:absolute;left:100px;top:300px;width:1720px;height:200px;background:var(--brand-dark);border-radius:8px;"></div>
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:150px;top:336px;width:1120px;">
    <div style="font-size:28px;font-weight:700;line-height:1.45;color:var(--on-navy-text);">核心判断:瓶颈在数据管道而非模型能力;先修管道可释放现有投入的 60% 闲置产能。</div>
  </div>
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:1340px;top:340px;width:430px;">
    <div class="num" style="font-size:64px;font-weight:800;color:#FFFFFF;line-height:1;">18<span style="font-size:26px;font-weight:600;">个月</span></div>
    <div style="font-size:20px;line-height:1.4;color:var(--on-navy-sub);margin-top:10px;">投资回收期(基准情景)</div>
  </div>
  <!-- 3 支柱:裸排 + 顶部细条(非卡片矩阵) -->
  <div data-layout="grid" data-layout-cols="3" data-layout-gap="40" style="position:absolute;left:100px;top:560px;width:1720px;">
    <div data-object="true" data-layout-h="320" style="border-top:3px solid var(--border-medium);padding-top:28px;">
      <div style="font-size:20px;font-weight:700;letter-spacing:2px;color:var(--text-tertiary);">01 现状</div>
      <div style="font-size:30px;font-weight:700;line-height:1.3;color:var(--charcoal);margin-top:16px;">三条产线数据口径不一致</div>
      <div style="font-size:24px;line-height:1.55;color:var(--text-secondary);margin-top:18px;">对账人工耗时占运营工时 22%,月末结账平均延迟 4.5 天。</div>
    </div>
    <div data-object="true" data-layout-h="320" style="border-top:3px solid var(--brand-primary);padding-top:28px;">
      <div style="font-size:20px;font-weight:700;letter-spacing:2px;color:var(--brand-primary);">02 主张</div>
      <div style="font-size:30px;font-weight:700;line-height:1.3;color:var(--charcoal);margin-top:16px;">先统一口径,再谈模型</div>
      <div style="font-size:24px;line-height:1.55;color:var(--text-secondary);margin-top:18px;">用 6 周做一条产线试点,验证后复制;不做全量替换。</div>
    </div>
    <div data-object="true" data-layout-h="320" style="border-top:3px solid var(--border-medium);padding-top:28px;">
      <div style="font-size:20px;font-weight:700;letter-spacing:2px;color:var(--text-tertiary);">03 收益</div>
      <div style="font-size:30px;font-weight:700;line-height:1.3;color:var(--charcoal);margin-top:16px;">年化节省 2,400 万</div>
      <div style="font-size:24px;line-height:1.55;color:var(--text-secondary);margin-top:18px;">对账工时下降 50%,结账周期压到 2 天内。</div>
    </div>
  </div>
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:100px;top:990px;width:1720px;">
    <div style="font-size:16px;line-height:1.5;color:var(--text-tertiary);">来源:2025-07 至 2026-06 三产线 ERP 流水(n=12 个月);回收期为基准情景测算(估算,假设产能利用率维持 78%)</div>
  </div>
</div>
<template data-slide-notes>
样张:原型 31 执行摘要。深色统领面板 + 3 支柱裸排(顶部细条,非卡片)+ 来源行;主色细条仅"主张"列。
</template>
</body>
</html>
