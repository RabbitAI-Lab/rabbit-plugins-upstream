<!doctype html>

  <div data-object="true" data-object-type="textbox" style="position:absolute;left:720px;top:720px;width:460px;height:40px;font-size:28px;font-weight:700;color:#0A2E5C;line-height:40px;">创新驱动</div>

  <div data-object="true" data-object-type="textbox" style="position:absolute;left:100px;top:1015px;width:1720px;height:40px;font-size:16px;color:#999;">线性渐变(多角度/多色停/圆角/边框/卡片) · radial 回退 — P2 1.6</div>

  <template data-slide-notes>
P2 1.6 原生线性渐变夹具:① 基础线性渐变(4 角度);② 多色停(三色/四色)+ 圆角/边框/虚线/椭圆;③ 渐变卡片+文字叠加(深色/彩色);④ radial-gradient 恒走截图回退。
