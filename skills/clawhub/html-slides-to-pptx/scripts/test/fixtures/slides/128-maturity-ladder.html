<!doctype html>

<title>样张 · 成熟度阶梯(原型 41)</title>

  </div>

  </div>
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:100px;top:990px;width:1720px;">

样张:原型 41 成熟度阶梯。高度递升 200/260/320/380/440 底对齐 y860;当前级唯一深底+"我们在这";目标级主色虚线边;跨级条件可观测。
