<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>样张 · 散点定位图(原型 36)</title>
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>
<div class="slide-container" style="background:var(--off-white);">
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:100px;top:120px;width:1720px;">
    <div style="font-size:56px;font-weight:700;line-height:1.2;color:var(--charcoal);">六个区域里,只有华东同时具备规模与增速</div>
  </div>
  <!-- 原生散点图(可编辑):series[0] 是 X 轴值,series[1] 是 Y 值 -->
  <div data-object="true" data-chart='{"type":"scatter","labels":["X"],"series":[{"name":"X-Axis","values":[12.4,8.1,22.6,15.2,6.7,18.9]},{"name":"区域市场","values":[9.2,14.5,21.3,7.1,4.8,12.0]}],"options":{"showLegend":false,"lineSize":0,"chartColors":["0A2E5C"],"catAxisTitle":"市场规模(亿元)","valAxisTitle":"三年复合增速(%)","showCatAxisTitle":true,"showValAxisTitle":true}}' style="position:absolute;left:100px;top:320px;width:1180px;height:580px;"></div>
  <!-- 右侧解读栏(结构色面) -->
  <div data-object="true" data-object-type="shape" style="position:absolute;left:1340px;top:320px;width:480px;height:580px;background:var(--card-bg);"></div>
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:1380px;top:356px;width:400px;">
    <div style="font-size:20px;font-weight:700;letter-spacing:2px;color:var(--brand-primary);">读图</div>
    <div style="font-size:24px;line-height:1.55;color:var(--charcoal);margin-top:18px;"><span style="font-weight:700;">华东(22.6 / 21.3)</span>是唯一落在双高区的市场,规模与增速均列第一。</div>
    <div style="font-size:24px;line-height:1.55;color:var(--text-secondary);margin-top:20px;">华南(18.9 / 12.0)规模第二但增速中游,属守成型;西北(6.7 / 4.8)双低,本轮不投。</div>
    <div style="font-size:24px;line-height:1.55;color:var(--text-secondary);margin-top:20px;">结论:资源向华东集中,华南维持现有投入。</div>
    <div style="font-size:22px;line-height:1.5;color:var(--text-secondary);margin-top:20px;">参考线 = 六区域加权均值(规模 14.0 / 增速 11.5)。</div>
  </div>
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:100px;top:990px;width:1720px;">
    <div style="font-size:16px;line-height:1.5;color:var(--text-tertiary);">来源:2026 行业年鉴 + 内部销售数据(n=6 区域);增速为 2023-2026 CAGR,规模为 2026 预测值(估算,假设渠道结构不变)</div>
  </div>
</div>
<template data-slide-notes>
样张:原型 36 散点定位图。data-chart:scatter 走原生可编辑图表;series[0]=X 轴值;lineSize:0 去连线;右侧解读栏点名"谁在哪"。
</template>
</body>
</html>
