<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>样张 · 双栏对照</title>
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>
<!-- 原型 12:双栏对照(裸双栏+中缝线;右侧唯一高亮) -->
<div class="slide-container" style="background:var(--off-white);">
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:1720px;top:92px;width:100px;text-align:right;z-index:10;">
    <div class="num" style="font-size:16px;font-weight:600;color:var(--text-tertiary);letter-spacing:2px;">08 / 12</div>
  </div>
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:100px;top:120px;width:1720px;z-index:10;">
    <div style="font-size:60px;font-weight:700;line-height:1.2;color:var(--charcoal);">
      同一批文档,两种命运:试点组与对照组
    </div>
  </div>

  <div data-object="true" data-object-type="textbox" style="position:absolute;left:100px;top:340px;width:800px;">
    <div style="font-size:22px;font-weight:600;letter-spacing:2px;color:var(--text-tertiary);">对照组(沿用旧机制)</div>
    <div style="font-size:24px;line-height:1.8;color:var(--text-primary);margin-top:24px;">
      · 检索耗时基本持平,11.2 分钟
      <br>
      · 过期文档占比升到 34%
      <br>
      · "这还有效吗"确认工单月均 16 起
      <br>
      · 作者端零新增负担,但读者端成本继续上升
    </div>
  </div>
  <div data-object="true" data-object-type="shape" style="position:absolute;left:940px;top:360px;width:1px;height:520px;background:var(--border-medium);z-index:1;"></div>
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:1020px;top:340px;width:800px;">
    <div style="font-size:22px;font-weight:600;letter-spacing:2px;color:var(--lenovo-red);">试点组(保质期机制)</div>
    <div style="font-size:22px;line-height:1.8;color:var(--text-primary);margin-top:24px;">
      · 检索耗时降至 6.4 分钟,降 42%
      <br>
      · 过期文档占比压到 9%
      <br>
      · 确认工单月均 2 起,降 88%
      <br>
      · 作者端每篇多写 40 字,读者端省下一半时间
    </div>
  </div>

  <!-- 底部结论行(内容带拉满) -->
  <div data-object="true" data-object-type="shape" style="position:absolute;left:100px;top:850px;width:1720px;height:1px;background:var(--border-medium);z-index:1;"></div>
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:100px;top:875px;width:1720px;z-index:10;">
    <div style="font-size:22px;line-height:1.5;color:var(--text-primary);"><span style="font-weight:700;color:var(--charcoal);">结论:</span>同期同量级文档,唯一变量是机制——差距只能用机制解释。</div>
  </div>
</div>

<template data-slide-notes>【核心逻辑】对照组是最强证据:同期、同量级文档,唯一变量是机制。</template>
</body>
</html>
