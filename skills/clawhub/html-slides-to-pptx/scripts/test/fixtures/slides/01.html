<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>封面 - AI：一次史诗级的人类发展机遇</title>
<link rel="stylesheet" href="../assets/theme.css">
<style>
  html,body{margin:0;padding:0;overflow:hidden;}
  .slide-container{font-family:"Noto Sans SC","Inter",sans-serif;}
</style>
</head>
<body>
<div class="slide-container" style="position:relative;width:1920px;height:1080px;overflow:hidden;background:#0A0A0A;">

  <!-- 超大出血半圆装饰 — 画面右侧被裁切 -->
  <div data-object="true" data-object-type="shape" style="position:absolute;left:1400px;top:-340px;width:1200px;height:1200px;border-radius:50%;background:linear-gradient(180deg,#1A1A1A 0%,#0A0A0A 100%);border:1px solid #2C2C2C;z-index:1;"></div>

  <!-- 一根极细的红色竖线 — 视觉锚点 -->
  <div data-object="true" data-object-type="shape" style="position:absolute;left:160px;top:0px;width:2px;height:1080px;background:#E2232A;z-index:2;"></div>

  <!-- 主标题：极大字号，非对称靠左偏下 -->
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:200px;top:480px;width:1400px;z-index:10;">
    <div style="font-size:96px;font-weight:900;color:#FFFFFF;line-height:1.15;letter-spacing:-2px;">一次史诗级的<br>人类发展机遇</div>
  </div>

  <!-- "AI" 超大底衬字 — 作为图形元素使用 -->
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:1300px;top:340px;width:700px;z-index:3;">
    <div style="font-size:360px;font-weight:900;color:#1A1A1A;line-height:1;letter-spacing:-10px;">AI</div>
  </div>

  <!-- 极小的副标题 — 与主标题的尺度对比制造张力 -->
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:200px;top:740px;width:600px;z-index:10;">
    <div style="font-size:16px;font-weight:400;color:#666666;line-height:1.8;letter-spacing:4px;">ARTIFICIAL INTELLIGENCE · 战略认知课程 · 五大模块</div>
  </div>

  <!-- 底部极细分割线 -->
  <div data-object="true" data-object-type="shape" style="position:absolute;left:200px;top:820px;width:400px;height:1px;background:#333333;z-index:2;"></div>

  <!-- 底部左下角小红点 — 克制的装饰 -->
  <div data-object="true" data-object-type="shape" style="position:absolute;left:200px;top:980px;width:8px;height:8px;border-radius:50%;background:#E2232A;z-index:3;"></div>

  <!-- 底部信息 -->
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:226px;top:972px;width:400px;z-index:10;">
    <div style="font-size:12px;font-weight:400;color:#555555;line-height:1.5;letter-spacing:2px;">2025</div>
  </div>

</div>
<template data-slide-notes>
【封面】
电影感开场：极暗背景、超大标题偏下放置制造"下沉"的重力感。"AI"二字作为360px底衬图形元素。一根贯穿全画面的红线作为唯一装饰锚点。信息极少——只有主题和年份。
</template>
</body>
</html>
