<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>行动，从今天开始</title>
<link rel="stylesheet" href="../assets/theme.css">
<style>
  html,body{margin:0;padding:0;overflow:hidden;}
  .slide-container{font-family:"Noto Sans SC","Inter",sans-serif;}
</style>
</head>
<body>
<div class="slide-container" style="position:relative;width:1920px;height:1080px;overflow:hidden;background:#E2232A;">

  <!-- 超大底衬文字 — 红底上的深红 -->
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:-60px;top:-40px;width:2000px;z-index:1;">
    <div style="font-size:320px;font-weight:900;color:#C91E24;line-height:1;letter-spacing:-10px;">NOW</div>
  </div>

  <!-- 核心文案 — 画面中心偏下，大面积留白后的"重击" -->
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:120px;top:460px;width:1200px;z-index:10;">
    <div style="font-size:68px;font-weight:900;color:#FFFFFF;line-height:1.3;">别等准备好了再开始。<br>开始了，你才会准备好。</div>
  </div>

  <!-- 极细白线 -->
  <div data-object="true" data-object-type="shape" style="position:absolute;left:120px;top:700px;width:80px;height:1px;background:#FFFFFF;z-index:3;"></div>

  <!-- 三个行动词 — 水平排列，极简 -->
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:120px;top:740px;width:1400px;z-index:10;">
    <div style="font-size:15px;font-weight:400;color:#FFFFFF;line-height:1.5;letter-spacing:3px;">今天注册一个 AI 工具　　　　本周找到 3 个应用场景　　　　本月建立你的 AI 工作流</div>
  </div>

  <!-- 右下角年份 -->
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:1700px;top:1000px;width:200px;z-index:10;">
    <div style="font-size:12px;font-weight:400;color:#FFFFFF;letter-spacing:2px;text-align:right;">2025 ·</div>
  </div>

  <!-- 左下角小白点 -->
  <div data-object="true" data-object-type="shape" style="position:absolute;left:120px;top:1020px;width:6px;height:6px;border-radius:50%;background:#FFFFFF;z-index:3;"></div>

</div>
<template data-slide-notes>
【行动号召 · 情绪高潮页】
全红色背景制造紧迫感和能量。超大的"NOW"作为底衬图形——暗示此刻行动。核心文案只有两句话，足够有力。行动指引被压缩为极小的一行15px文字——让观众自己去读、去记。
</template>
</body>
</html>
