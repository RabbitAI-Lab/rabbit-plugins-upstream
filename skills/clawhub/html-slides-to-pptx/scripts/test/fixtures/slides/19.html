<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AI不会取代人类</title>
<link rel="stylesheet" href="../assets/theme.css">
<style>
  html,body{margin:0;padding:0;overflow:hidden;}
  .slide-container{font-family:"Noto Sans SC","Inter",sans-serif;}
</style>
</head>
<body>
<div class="slide-container" style="position:relative;width:1920px;height:1080px;overflow:hidden;background:#FAFAF7;">

  <!-- 右侧大色块 — 占画面 40%，作为视觉锚点 -->
  <div data-object="true" data-object-type="shape" style="position:absolute;left:1200px;top:0px;width:720px;height:1080px;background:#0A2E5C;z-index:1;"></div>

  <!-- 右侧色块上的装饰圆弧 — 出血裁切 -->
  <div data-object="true" data-object-type="shape" style="position:absolute;left:1500px;top:600px;width:600px;height:600px;border-radius:50%;background:#14477A;z-index:2;"></div>

  <!-- 左侧：内容区 -->

  <!-- 小标签 -->
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:120px;top:80px;width:300px;z-index:10;">
    <div style="font-size:11px;font-weight:700;color:#999999;line-height:1.5;letter-spacing:4px;">PART 01 — 什么是AI</div>
  </div>

  <!-- 核心观点 — 大字，只说一句话 -->
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:120px;top:260px;width:960px;z-index:10;">
    <div style="font-size:52px;font-weight:900;color:#0A0A0A;line-height:1.35;">AI 不会取代人类，<br>但掌握 AI 的人<br>会取代不掌握的人。</div>
  </div>

  <!-- 红色点缀 -->
  <div data-object="true" data-object-type="shape" style="position:absolute;left:120px;top:570px;width:40px;height:3px;background:#E2232A;z-index:3;"></div>

  <!-- 补充信息 — 极小字，退到背景层 -->
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:120px;top:610px;width:700px;z-index:10;">
    <div style="font-size:16px;font-weight:400;color:#666666;line-height:2.0;">人类的优势不在于"知道更多"，而在于：<br>提出好问题 · 做价值判断 · 建立情感连接 · 在不确定中决策</div>
  </div>

  <!-- 右侧色块上的关键词 — 竖向排列，大留白 -->
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:1280px;top:200px;width:500px;z-index:10;">
    <div style="font-size:14px;font-weight:400;color:#A9BCD6;line-height:4.5;letter-spacing:3px;">感知<br>推理<br>学习<br>决策<br>生成</div>
  </div>

  <!-- 右侧色块中间的关键数据 -->
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:1280px;top:680px;width:500px;z-index:10;">
    <div style="font-size:72px;font-weight:900;color:#FFFFFF;line-height:1.2;">5→1</div>
  </div>
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:1280px;top:775px;width:500px;z-index:10;">
    <div style="font-size:14px;font-weight:400;color:#A9BCD6;line-height:1.6;">年，新药发现周期被 AI 压缩</div>
  </div>

  <!-- 页码 -->
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:120px;top:1020px;width:60px;z-index:10;">
    <div style="font-size:11px;font-weight:400;color:#CCCCCC;">06</div>
  </div>

</div>
<template data-slide-notes>
【核心观点页】
非对称构图：左侧60%放文字内容，右侧40%是深色视觉锚点。一页只传达一个核心观点——"掌握AI的人会取代不掌握的人"。右侧深色区域放极简的关键词列表和一个数据点作为辅助。
</template>
</body>
</html>
