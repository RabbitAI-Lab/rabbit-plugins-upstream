<!doctype html>
<html lang="zh-CN">

<title>样张 · 引用页</title>

<body>
<!-- 原型 6:引用页(airy;巨引号+正体) -->
<div class="slide-container" style="background:var(--off-white);">
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:140px;top:200px;width:300px;">
    <div style="font-size:200px;font-weight:800;line-height:1;color:var(--lenovo-red);">"</div>
  </div>
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:180px;top:440px;width:1400px;">
    <div style="font-size:44px;font-weight:600;line-height:1.4;color:var(--charcoal);">
      我们不怕写文档,怕的是写完没人再敢信它。
    </div>
  </div>
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:180px;top:600px;width:1400px;">
    <div style="font-size:22px;line-height:1.5;color:var(--text-tertiary);">—— 试点部门 B 一位研发组长,中期访谈</div>
  </div>
</div>

<template data-slide-notes>【核心逻辑】用一线原话佐证"不敢信"的判断;引用必须真实,不编造。</template>

</html>
