# ============================================================
# 服务价目配置（内部维护 · 顾问出书唯一取价来源）
# 技能只读本文件，禁止自行编价。真实报价由雄韬/鼎信维护。
# value：写固定数字或 "区间"（字符串请加引号）
# price_type：fixed | range | quote（quote=另报价/按量，非固定数）
# 未填项(null)对外不展示该行。
# ============================================================

status: "已生效"

# 【内部提醒】当前 value 为"市场参考口径"，正式对外发报价前请按贵司
# 成本与定价策略复核；若注册代办走低价引流，把 agency_fee 改回实际值并
# 在报价/合同里与年度记账绑定（否则单做注册可能亏）。

registration:              # 注册阶段（一次）——方案书第五节费用明细引用
  agency_fee:              # 代办服务费：核名+设立登记+材料+跟进+领照
    value: "800-1500"      # 市场标价区间；低价引流可改低（如 300）但须绑记账
    price_type: range
    note: "核名+设立登记+材料整理+领照全程；含刻章代领（章本身官方免费）"
  seal:                    # 首套印章（广州新开办免费）
    value: 0
    price_type: fixed
    note: "广州新开办首套 4 枚免费（公章/财务/发票/合同章），按注册区核实现状"
  address_cluster:         # 集群/托管地址费（可选，客户无地址时）
    value: "500-2000/年"
    price_type: range
    note: "市场化收费、无官方统一价；不得承诺'政府免费地址'（见 params §5）"
  misc:                    # 其他代垫/杂费
    value: "实报实销"
    price_type: quote
    note: "打印、邮寄等按实际发生"

bank:                     # 银行开户（银行收取，仅提示口径，不计入我方收费）
  value: "0-600"
  price_type: range
  note: "以所选银行报价为准；部分行对小微免开户费"

bookkeeping:              # 记账报税年度服务——方案书第八节增值推荐
  annual_plan:            # 常规年度（小规模起步）
    value: "2400-4000/年"
    price_type: range
    note: "小规模起步：每月记账+按季申报+年度汇算+工商年报等；**按年收取**"
  addon:                  # 升级/定制
    value: "一般纳税人 4000-8000/年；出口退税按票量另报"
    price_type: quote
    note: "对客口径：一般纳税人按月申报、进销项核对；出口退税含免抵退申报与退税跟进，按票量与复杂度另报"

licensing:               # 许可/资质代办（可选增值，按项目单报）
  items:
    value: "逐项另报价"
    price_type: quote
    note: "食品经营许可、海关备案等逐项单独报价，避免打包含糊"

# ---- 对外展示口径提示 ----
# 1) 方案书费用一律按本文件 value 呈现；null 行不展示。
# 2) 对外写区间并注明"以最终报价为准"。
# 3) 本文件属内部内容，绝不进入客户版对话正文（客户版只给区间）。
