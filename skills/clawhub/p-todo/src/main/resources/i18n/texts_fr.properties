# ===== À propos =====
about.title=À propos de P's Todo
about.subtitle=P's Todo — Gestion de tâches d'équipe
about.version=v1.0.0
about.build=Date de compilation : 2026-08-24

# -- Mode d'emploi --
about.section.usage=📋 Mode d'emploi
about.usage.line1=Nouvelle tâche : cliquez sur « + Nouveau » en haut ou appuyez sur Ctrl+N
about.usage.line2=Voir les détails : double-cliquez sur une tâche pour ouvrir la fenêtre de détails et modifier tous les champs
about.usage.line3=Recherche globale : Ctrl+K ouvre la boîte de recherche (titres et descriptions)
about.usage.line4=Mode mini : cliquez sur « Mini » en haut ou Ctrl+M pour la vue compacte toujours au premier plan
about.usage.line5=Vue kanban : basculez « Liste/Kanban » en haut ; le kanban prend en charge le glisser-déposer
about.usage.line6=Marquer terminé : appuyez sur Entrée sur une tâche sélectionnée
about.usage.line7=Supprimer une tâche : sélectionnez-la puis appuyez sur Suppr
about.usage.line8=Prendre une tâche : cliquez sur « Prendre en charge » à droite et choisissez ou créez votre identité
about.usage.line9=Vue calendrier : cliquez sur « Calendrier » à gauche pour voir les tâches par mois
about.usage.line10=Export des données : export JSON/CSV disponible dans les paramètres

# -- Appel par agent --
about.section.agent=🤖 API Agent
about.agent.line1=L'application intègre une API REST appelable par des agents IA ou des scripts externes.
about.agent.line2=Adresse de l'API : http://localhost:%d
about.agent.line3=Vous pouvez changer le port dans « Paramètres » ; un redémarrage est requis.
about.agent.line4=Liste des endpoints :
about.agent.line5=  GET    /api/health           — Contrôle de santé
about.agent.line6=  GET    /api/todos            — Obtenir toutes les tâches
about.agent.line7=  GET    /api/todos?status=IN_PROGRESS — Filtrer par statut
about.agent.line8=  POST   /api/todos            — Créer une tâche (corps JSON)
about.agent.line9=  PUT    /api/todos/{id}       — Modifier une tâche
about.agent.line10= DELETE /api/todos/{id}       — Supprimer une tâche
about.agent.line11= PUT    /api/todos/{id}/toggle — Basculer l'achèvement
about.agent.line12= GET    /api/users            — Obtenir tous les utilisateurs
about.agent.line13= POST   /api/users            — Créer un utilisateur
about.agent.line14= GET    /api/stats            — Obtenir les statistiques
about.agent.line15=Appel via curl, client HTTP ou OpenClaw exec, sans authentification.
about.agent.line16=Exemple : curl http://localhost:%d/api/todos

# -- Autorisations --
about.section.permissions=👥 Autorisations
about.perm.line1=L'application fonctionne entièrement en local ; toutes les données sont stockées dans une base SQLite locale.
about.perm.line2=Aucune connexion réseau ni téléversement de données utilisateur vers des serveurs externes.
about.perm.line3=Aucune inscription nécessaire ; utilisable immédiatement après installation.
about.perm.line4=Le port API n'écoute que sur 127.0.0.1 (localhost) par défaut, inaccessible depuis l'extérieur.

# -- Problèmes connus --
about.section.bugs=🐛 Problèmes connus
about.bugs.line1=La fenêtre de candidats IME ne suit pas le cursor (Problème connu dans JavaFX 26, IME chinois Windows)
about.bugs.line2=Le glissement de la mini-fenêtre est parfois décalé sur écrans haute résolution
about.bugs.line3=L'affichage du calendrier lunaire ne prend en charge que les environnements chinois
about.bugs.line4=Léger ralentissement du défilement avec beaucoup de tâches (500+)
about.bugs.line5=Le changement de port API ne prend effet qu'après redémarrage

# -- Progression du développement --
about.section.progress=🚧 Progression du développement
about.progress.line1=Version actuelle : v1.0.0 (bêta)
about.progress.line2=Terminé : CRUD des tâches, vue kanban, vue calendrier, panneau de statistiques
about.progress.line3=Terminé : mode mini, barre d'état système, raccourcis, framework multilingue
about.progress.line4=Terminé : API REST, export de données (JSON/CSV)
about.progress.line5=En développement : connexion utilisateur et système de permissions
about.progress.line6=Prévu : collaboration d'équipe (synchronisation en temps réel)
about.progress.line7=Prévu : sauvegarde et restauration dans le cloud
about.progress.line8=Prévu : adaptation mobile (Android/iOS)
about.progress.line9=Prévu : système de plugins et intégrations tierces

