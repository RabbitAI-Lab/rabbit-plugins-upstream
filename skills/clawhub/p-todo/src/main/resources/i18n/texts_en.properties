# ===== About =====
about.title=About P's Todo
about.subtitle=P's Todo — Team task management
about.version=v1.0.0
about.build=Build time: 2026-08-24

# -- How to use --
about.section.usage=📋 How to Use
about.usage.line1=New task: click "+ New" in the top bar or press Ctrl+N
about.usage.line2=View details: double-click a task to open the detail dialog and edit all fields
about.usage.line3=Global search: press Ctrl+K to open the search box, matching titles and descriptions
about.usage.line4=Mini mode: click "Mini" in the top bar or press Ctrl+M to switch to the compact always-on-top view
about.usage.line5=Kanban view: toggle "List/Kanban" in the top bar; kanban supports drag sorting
about.usage.line6=Mark done: press Enter on a selected task to toggle its completion state
about.usage.line7=Delete task: select a task and press Delete
about.usage.line8=Claim task: click the "Claim" button on the right of a task and select or create your identity
about.usage.line9=Calendar view: click "Calendar" on the left to see tasks distributed by month
about.usage.line10=Data export: JSON/CSV export is available on the Settings page

# -- Agent invocation --
about.section.agent=🤖 Agent API
about.agent.line1=This app has a built-in REST API that can be called by external AI agents or scripts.
about.agent.line2=API endpoint: http://localhost:%d
about.agent.line3=You can change the listening port on the "Settings" page; a restart is required.
about.agent.line4=Endpoints:
about.agent.line5=  GET    /api/health           — Health check
about.agent.line6=  GET    /api/todos            — Get all tasks
about.agent.line7=  GET    /api/todos?status=IN_PROGRESS — Filter by status
about.agent.line8=  POST   /api/todos            — Create a task (JSON body)
about.agent.line9=  PUT    /api/todos/{id}       — Update a task
about.agent.line10= DELETE /api/todos/{id}       — Delete a task
about.agent.line11= PUT    /api/todos/{id}/toggle — Toggle completion
about.agent.line12= GET    /api/users            — Get all users
about.agent.line13= POST   /api/users            — Create a user
about.agent.line14= GET    /api/stats            — Get statistics
about.agent.line15=Call with curl, any HTTP client, or OpenClaw exec; no authentication required.
about.agent.line16=Example: curl http://localhost:%d/api/todos

# -- Permissions --
about.section.permissions=👥 Permissions
about.perm.line1=This app runs entirely locally; all data is stored in a local SQLite database.
about.perm.line2=It does not connect to the network or upload any user data to external servers.
about.perm.line3=No registration required; works right after installation.
about.perm.line4=The API port listens on 127.0.0.1 (localhost) only by default; external networks cannot access it directly.

# -- Known issues --
about.section.bugs=🐛 Known Issues
about.bugs.line1=IME candidate window does not follow the cursor (Known issue in JavaFX 26, Windows Chinese IME)
about.bugs.line2=Mini window dragging occasionally offset on high-DPI screens
about.bugs.line3=Lunar calendar display in the calendar view only supports Chinese environments
about.bugs.line4=Slight list scrolling lag with a large number of tasks (500+)
about.bugs.line5=API port changes take effect only after restarting the app

# -- Development progress --
about.section.progress=🚧 Development Progress
about.progress.line1=Current version: v1.0.0 (beta)
about.progress.line2=Done: task CRUD, kanban view, calendar view, statistics panel
about.progress.line3=Done: mini window mode, system tray, keyboard shortcuts, multi-language framework
about.progress.line4=Done: REST API, data export (JSON/CSV)
about.progress.line5=In development: user login and permission system
about.progress.line6=Planned: team collaboration (real-time multi-user sync)
about.progress.line7=Planned: cloud backup and restore
about.progress.line8=Planned: mobile adaptation (Android/iOS)
about.progress.line9=Planned: plugin system and third-party integrations

