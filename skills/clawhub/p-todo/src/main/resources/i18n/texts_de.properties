# ===== Über =====
about.title=Über P's Todo
about.subtitle=P's Todo — Team-Aufgabenverwaltung
about.version=v1.0.0
about.build=Build-Zeit: 2026-08-24

# -- Verwendung --
about.section.usage=📋 Verwendung
about.usage.line1=Neue Aufgabe: Klicken Sie oben auf „+ Neu" oder drücken Sie Strg+N
about.usage.line2=Details anzeigen: Doppelklicken Sie auf eine Aufgabe, um den Detaildialog zu öffnen und alle Felder zu bearbeiten
about.usage.line3=Globale Suche: Strg+K öffnet die Suche mit unscharfer Übereinstimmung für Titel und Beschreibung
about.usage.line4=Mini-Modus: Klicken Sie oben auf „Mini" oder Strg+M für die kompakte Always-on-top-Ansicht
about.usage.line5=Kanban-Ansicht: Oben zwischen „Liste/Kanban" umschalten; Kanban unterstützt Drag-and-Drop-Sortierung
about.usage.line6=Als erledigt markieren: Enter auf einer ausgewählten Aufgabe drücken
about.usage.line7=Aufgabe löschen: Aufgabe auswählen und Entf drücken
about.usage.line8=Aufgabe übernehmen: Klicken Sie rechts auf „Übernehmen" und wählen oder erstellen Sie Ihre Identität
about.usage.line9=Kalenderansicht: Klicken Sie links auf „Kalender" für die monatliche Aufgabenverteilung
about.usage.line10=Datenexport: JSON/CSV-Export auf der Einstellungsseite verfügbar

# -- Agenten-Aufruf --
about.section.agent=🤖 Agenten-API
about.agent.line1=Die Anwendung enthält eine REST-API, die von externen KI-Agenten oder Skripten aufgerufen werden kann.
about.agent.line2=API-Adresse: http://localhost:%d
about.agent.line3=Der Port kann auf der Seite „Einstellungen" geändert werden; danach ist ein Neustart erforderlich.
about.agent.line4=Endpunktliste:
about.agent.line5=  GET    /api/health           — Health-Check
about.agent.line6=  GET    /api/todos            — Alle Aufgaben abrufen
about.agent.line7=  GET    /api/todos?status=IN_PROGRESS — Nach Status filtern
about.agent.line8=  POST   /api/todos            — Aufgabe erstellen (JSON-Body)
about.agent.line9=  PUT    /api/todos/{id}       — Aufgabe aktualisieren
about.agent.line10= DELETE /api/todos/{id}       — Aufgabe löschen
about.agent.line11= PUT    /api/todos/{id}/toggle — Erledigt-Status umschalten
about.agent.line12= GET    /api/users            — Alle Benutzer abrufen
about.agent.line13= POST   /api/users            — Benutzer erstellen
about.agent.line14= GET    /api/stats            — Statistiken abrufen
about.agent.line15=Aufruf per curl, HTTP-Client oder OpenClaw exec — ohne Authentifizierung.
about.agent.line16=Beispiel: curl http://localhost:%d/api/todos

# -- Berechtigungen --
about.section.permissions=👥 Berechtigungen
about.perm.line1=Die Anwendung läuft vollständig lokal; alle Daten werden in einer lokalen SQLite-Datenbank gespeichert.
about.perm.line2=Keine Netzwerkverbindung, keine Übertragung von Nutzerdaten an externe Server.
about.perm.line3=Keine Registrierung erforderlich — sofort nach der Installation nutzbar.
about.perm.line4=Der API-Port lauscht standardmäßig nur auf 127.0.0.1 (localhost); externe Netzwerke haben keinen direkten Zugriff.

# -- Bekannte Probleme --
about.section.bugs=🐛 Bekannte Probleme
about.bugs.line1=IME-Kandidatenfenster folgt nicht dem Cursor (Bekanntes Problem in JavaFX 26, Windows-Chinesisch-IME)
about.bugs.line2=Verschieben des Mini-Fensters auf High-DPI-Bildschirmen gelegentlich versetzt
about.bugs.line3=Die Mondkalender-Anzeige unterstützt nur chinesische Umgebungen
about.bugs.line4=Leichtes Scroll-Ruckeln bei sehr vielen Aufgaben (500+)
about.bugs.line5=API-Port-Änderungen werden erst nach einem Neustart wirksam

# -- Entwicklungsfortschritt --
about.section.progress=🚧 Entwicklungsfortschritt
about.progress.line1=Aktuelle Version: v1.0.0 (Beta)
about.progress.line2=Fertig: Aufgaben-CRUD, Kanban-Ansicht, Kalenderansicht, Statistik-Panel
about.progress.line3=Fertig: Mini-Modus, System-Tray, Tastenkürzel, Mehrsprachen-Framework
about.progress.line4=Fertig: REST-API, Datenexport (JSON/CSV)
about.progress.line5=In Entwicklung: Benutzer-Login und Berechtigungssystem
about.progress.line6=Geplant: Team-Zusammenarbeit (Echtzeit-Synchronisierung mehrerer Benutzer)
about.progress.line7=Geplant: Cloud-Backup und -Wiederherstellung
about.progress.line8=Geplant: Mobile Anpassung (Android/iOS)
about.progress.line9=Geplant: Plugin-System und Drittanbieter-Integrationen

