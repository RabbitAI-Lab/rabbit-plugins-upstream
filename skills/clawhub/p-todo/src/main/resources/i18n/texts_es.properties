# ===== Acerca de =====
about.title=Acerca de P's Todo
about.subtitle=P's Todo — Gestión de tareas en equipo
about.version=v1.0.0
about.build=Fecha de compilación: 2026-08-24

# -- Cómo usar --
about.section.usage=📋 Cómo usar
about.usage.line1=Nueva tarea: haz clic en «+ Nueva» arriba o pulsa Ctrl+N
about.usage.line2=Ver detalles: doble clic en una tarea para abrir el diálogo de detalles y editar todos los campos
about.usage.line3=Búsqueda global: Ctrl+K abre la búsqueda con coincidencia difusa de título y descripción
about.usage.line4=Modo mini: haz clic en «Mini» arriba o Ctrl+M para la vista compacta siempre visible
about.usage.line5=Vista kanban: cambia «Lista/Kanban» arriba; el kanban admite ordenar arrastrando
about.usage.line6=Marcar completada: pulsa Enter sobre una tarea seleccionada
about.usage.line7=Eliminar tarea: selecciona la tarea y pulsa Supr
about.usage.line8=Asumir tarea: haz clic en «Asumir» a la derecha y elige o crea tu identidad
about.usage.line9=Vista calendario: haz clic en «Calendario» a la izquierda para ver las tareas por mes
about.usage.line10=Exportar datos: exportación JSON/CSV disponible en la página de ajustes

# -- Invocación por agente --
about.section.agent=🤖 API de Agentes
about.agent.line1=La aplicación incluye una API REST que pueden invocar agentes de IA o scripts externos.
about.agent.line2=Dirección de la API: http://localhost:%d
about.agent.line3=El puerto se puede cambiar en la página «Ajustes»; se requiere reiniciar después.
about.agent.line4=Lista de endpoints:
about.agent.line5=  GET    /api/health           — Comprobación de salud
about.agent.line6=  GET    /api/todos            — Obtener todas las tareas
about.agent.line7=  GET    /api/todos?status=IN_PROGRESS — Filtrar por estado
about.agent.line8=  POST   /api/todos            — Crear una tarea (cuerpo JSON)
about.agent.line9=  PUT    /api/todos/{id}       — Actualizar una tarea
about.agent.line10= DELETE /api/todos/{id}       — Eliminar una tarea
about.agent.line11= PUT    /api/todos/{id}/toggle — Alternar estado de completado
about.agent.line12= GET    /api/users            — Obtener todos los usuarios
about.agent.line13= POST   /api/users            — Crear un usuario
about.agent.line14= GET    /api/stats            — Obtener estadísticas
about.agent.line15=Invocación con curl, cliente HTTP o OpenClaw exec, sin autenticación.
about.agent.line16=Ejemplo: curl http://localhost:%d/api/todos

# -- Permisos --
about.section.permissions=👥 Permisos
about.perm.line1=La aplicación se ejecuta totalmente en local; todos los datos se guardan en una base SQLite local.
about.perm.line2=No se conecta a la red ni sube datos de usuario a servidores externos.
about.perm.line3=No requiere registro; funciona inmediatamente tras la instalación.
about.perm.line4=El puerto de la API solo escucha en 127.0.0.1 (localhost) por defecto; las redes externas no pueden acceder.

# -- Problemas conocidos --
about.section.bugs=🐛 Problemas conocidos
about.bugs.line1=La ventana de candidatos IME no sigue al cursor (Problema conocido en JavaFX 26, IME chino de Windows)
about.bugs.line2=El arrastre de la mini ventana a veces se desplaza en pantallas de alto DPI
about.bugs.line3=La visualización del calendario lunar solo es compatible con entornos chinos
about.bugs.line4=Ligero retraso al desplazar la lista con muchas tareas (500+)
about.bugs.line5=Los cambios de puerto de la API solo se aplican tras reiniciar la aplicación

# -- Progreso del desarrollo --
about.section.progress=🚧 Progreso del desarrollo
about.progress.line1=Versión actual: v1.0.0 (beta)
about.progress.line2=Hecho: CRUD de tareas, vista kanban, vista calendario, panel de estadísticas
about.progress.line3=Hecho: modo mini, bandeja del sistema, atajos de teclado, marco multilingüe
about.progress.line4=Hecho: API REST, exportación de datos (JSON/CSV)
about.progress.line5=En desarrollo: inicio de sesión de usuarios y sistema de permisos
about.progress.line6=Planificado: colaboración en equipo (sincronización en tiempo real)
about.progress.line7=Planificado: copia de seguridad y restauración en la nube
about.progress.line8=Planificado: adaptación móvil (Android/iOS)
about.progress.line9=Planificado: sistema de plugins e integraciones de terceros

