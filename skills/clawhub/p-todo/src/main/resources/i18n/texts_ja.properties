# -- 使い方 --
about.section.usage=📋 使い方
about.usage.line1=新規タスク：トップバーの「+ 新規」をクリック、または Ctrl+N
about.usage.line2=詳細表示：タスクをダブルクリックすると詳細ダイアログが開き、すべての項目を編集できます
about.usage.line3=全体検索：Ctrl+K で検索ボックスを開き、タイトル・説明のあいまい一致が可能
about.usage.line4=ミニモード：トップバーの「ミニ」をクリック、または Ctrl+M で最前面のコンパクト表示に切り替え
about.usage.line5=カンバン表示：トップバーで「リスト/カンバン」を切り替え。カンバンはドラッグで並べ替え可能
about.usage.line6=完了にする：リストで Enter キーを押すと完了状態を切り替え
about.usage.line7=タスク削除：タスクを選択して Delete キー
about.usage.line8=タスク担当：タスク右側の「担当する」ボタンで自分の名前を選択・作成
about.usage.line9=カレンダー表示：左側の「カレンダー」で月ごとのタスク分布を確認
about.usage.line10=データ出力：設定ページで JSON/CSV 形式にエクスポート可能

# -- エージェント呼び出し --
about.section.agent=🤖 エージェント API
about.agent.line1=本アプリは REST API を内蔵しており、外部の AI エージェントやスクリプトから呼び出せます。
about.agent.line2=API アドレス：http://localhost:%d
about.agent.line3=「設定」ページで待ち受けポートを変更できます。変更後は再起動が必要です。
about.agent.line4=エンドポイント一覧：
about.agent.line5=  GET    /api/health           — ヘルスチェック
about.agent.line6=  GET    /api/todos            — 全タスク取得
about.agent.line7=  GET    /api/todos?status=IN_PROGRESS — ステータスで絞り込み
about.agent.line8=  POST   /api/todos            — タスク作成（JSON body）
about.agent.line9=  PUT    /api/todos/{id}       — タスク更新
about.agent.line10= DELETE /api/todos/{id}       — タスク削除
about.agent.line11= PUT    /api/todos/{id}/toggle — 完了状態の切り替え
about.agent.line12= GET    /api/users            — 全ユーザー取得
about.agent.line13= POST   /api/users            — ユーザー作成
about.agent.line14= GET    /api/stats            — 統計情報の取得
about.agent.line15=呼び出し方法：curl、HTTP クライアント、OpenClaw exec など。認証は不要です。
about.agent.line16=例：curl http://localhost:%d/api/todos

# -- 権限の説明 --
about.section.permissions=👥 権限の説明
about.perm.line1=本アプリは完全にローカルで動作し、すべてのデータはローカルの SQLite データベースに保存されます。
about.perm.line2=ネットワーク接続せず、ユーザーデータを外部サーバーにアップロードしません。
about.perm.line3=アカウント登録は不要で、インストール後すぐに使えます。
about.perm.line4=API ポートは初期状態で 127.0.0.1（localhost）のみを待ち受け、外部ネットワークからは直接アクセスできません。

# -- 既知の問題 --
about.section.bugs=🐛 既知の問題
about.bugs.line1=IME 変換候補がカーソルに追従しない（JavaFX 26 の既知の問題、Windows 日本語/中国語 IME）
about.bugs.line2=高 DPI 画面でミニウィンドウのドラッグ位置がずれることがある
about.bugs.line3=カレンダー表示の旧暦（農暦）は中国語環境のみ対応
about.bugs.line4=タスク数が多い（500 件以上）とリストのスクロールがやや重い
about.bugs.line5=API ポートの変更はアプリ再起動後に反映されます

# -- 開発進捗 --
about.section.progress=🚧 開発進捗
about.progress.line1=現在のバージョン：v1.0.0（ベータ版）
about.progress.line2=完了：タスクの CRUD、カンバン表示、カレンダー表示、統計パネル
about.progress.line3=完了：ミニウィンドウ、システムトレイ、ショートカット、多言語フレームワーク
about.progress.line4=完了：REST API、データ出力（JSON/CSV）
about.progress.line5=開発中：ユーザーログインと権限システム
about.progress.line6=予定：チーム連携（複数人リアルタイム同期）
about.progress.line7=予定：データのクラウドバックアップと復元
about.progress.line8=予定：モバイル対応（Android/iOS）
about.progress.line9=予定：プラグインシステムと外部連携

