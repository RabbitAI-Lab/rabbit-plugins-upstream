# ===== 关于 =====
about.title=关于 P的事
about.subtitle=P的事 — 团队待办管理
about.version=v1.0.0
about.build=构建时间：2026-08-24

# -- 使用方法 --
about.section.usage=📋 使用方法
about.usage.line1=新建任务：点击顶栏「+ 新建」或按 Ctrl+N
about.usage.line2=查看详情：双击任务条目，弹出详情弹窗可编辑所有字段
about.usage.line3=全局搜索：按 Ctrl+K 打开搜索框，支持标题和描述模糊匹配
about.usage.line4=小窗模式：点击顶栏「小窗」或按 Ctrl+M 切换精简置顶视图
about.usage.line5=看板视图：顶栏切换「列表/看板」模式，看板支持拖拽排序
about.usage.line6=标记完成：在列表中按 Enter 键切换完成状态
about.usage.line7=删除任务：选中任务后按 Delete 键删除
about.usage.line8=认领任务：点击任务右侧「认领」按钮，选择或创建你的身份
about.usage.line9=日历视图：点击左侧「日历」查看按月分布的任务
about.usage.line10=数据导出：设置页可导出 JSON/CSV 格式

# -- 智能体调用 --
about.section.agent=🤖 智能体调用说明
about.agent.line1=本应用内置 REST API 服务，支持被外部 AI 智能体或脚本调用。
about.agent.line2=API 服务地址：http://localhost:%d
about.agent.line3=可在「设置」页面修改监听端口，修改后需重启应用。
about.agent.line4=接口列表：
about.agent.line5=  GET    /api/health           — 健康检查
about.agent.line6=  GET    /api/todos            — 获取所有任务
about.agent.line7=  GET    /api/todos?status=IN_PROGRESS — 按状态筛选
about.agent.line8=  POST   /api/todos            — 创建任务（JSON body）
about.agent.line9=  PUT    /api/todos/{id}       — 更新任务
about.agent.line10= DELETE /api/todos/{id}       — 删除任务
about.agent.line11= PUT    /api/todos/{id}/toggle — 切换完成状态
about.agent.line12= GET    /api/users            — 获取所有用户
about.agent.line13= POST   /api/users            — 创建用户
about.agent.line14= GET    /api/stats            — 获取统计数据
about.agent.line15=调用方式：curl、HTTP 客户端、OpenClaw exec 等均可，无需认证。
about.agent.line16=示例：curl http://localhost:%d/api/todos

# -- 权限说明 --
about.section.permissions=👥 权限说明
about.perm.line1=本应用完全本地运行，所有数据存储在本机 SQLite 数据库中。
about.perm.line2=不联网、不上传任何用户数据到外部服务器。
about.perm.line3=无需注册账号，安装即用。
about.perm.line4=API 端口默认仅监听 127.0.0.1（localhost），外部网络无法直接访问。

# -- 已知问题 --
about.section.bugs=🐛 已知问题
about.bugs.line1=输入法候选框不跟随光标位置（JavaFX 26 已知问题，Windows 中文输入法）
about.bugs.line2=小窗拖拽在高 DPI 屏幕上偶有偏移
about.bugs.line3=日历视图农历显示仅支持简体中文环境
about.bugs.line4=大量任务（500+）时列表滚动偶有卡顿
about.bugs.line5=API 端口修改后需重启应用才能生效

# -- 开发进度 --
about.section.progress=🚧 开发进度
about.progress.line1=当前版本：v1.0.0（内测版）
about.progress.line2=已完成：任务增删改查、看板视图、日历视图、统计面板
about.progress.line3=已完成：小窗模式、系统托盘、快捷键、多语言框架
about.progress.line4=已完成：REST API、数据导出（JSON/CSV）
about.progress.line5=开发中：用户登录与权限系统
about.progress.line6=计划中：团队协作（多人实时同步）
about.progress.line7=计划中：数据云备份与恢复
about.progress.line8=计划中：移动端适配（Android/iOS）
about.progress.line9=计划中：插件系统与第三方集成

