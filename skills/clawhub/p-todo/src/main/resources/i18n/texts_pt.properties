# ===== Sobre =====
about.title=Sobre o P's Todo
about.subtitle=P's Todo — Gerenciamento de tarefas em equipe
about.version=v1.0.0
about.build=Data de compilação: 2026-08-24

# -- Como usar --
about.section.usage=📋 Como usar
about.usage.line1=Nova tarefa: clique em «+ Nova» na barra superior ou pressione Ctrl+N
about.usage.line2=Ver detalhes: clique duas vezes em uma tarefa para abrir o diálogo de detalhes e editar todos os campos
about.usage.line3=Pesquisa global: Ctrl+K abre a pesquisa com correspondência difusa de título e descrição
about.usage.line4=Modo mini: clique em «Mini» na barra superior ou Ctrl+M para a visualização compacta sempre no topo
about.usage.line5=Visualização kanban: alterne «Lista/Kanban» na barra superior; o kanban suporta ordenação por arrastar
about.usage.line6=Marcar concluída: pressione Enter sobre uma tarefa selecionada
about.usage.line7=Excluir tarefa: selecione a tarefa e pressione Delete
about.usage.line8=Assumir tarefa: clique em «Assumir» à direita e escolha ou crie sua identidade
about.usage.line9=Visualização de calendário: clique em «Calendário» à esquerda para ver as tarefas por mês
about.usage.line10=Exportar dados: exportação JSON/CSV disponível na página de configurações

# -- Invocação por agente --
about.section.agent=🤖 API de Agentes
about.agent.line1=O aplicativo inclui uma API REST que pode ser chamada por agentes de IA ou scripts externos.
about.agent.line2=Endereço da API: http://localhost:%d
about.agent.line3=A porta pode ser alterada na página «Configurações»; é necessário reiniciar depois.
about.agent.line4=Lista de endpoints:
about.agent.line5=  GET    /api/health           — Verificação de integridade
about.agent.line6=  GET    /api/todos            — Obter todas as tarefas
about.agent.line7=  GET    /api/todos?status=IN_PROGRESS — Filtrar por status
about.agent.line8=  POST   /api/todos            — Criar uma tarefa (corpo JSON)
about.agent.line9=  PUT    /api/todos/{id}       — Atualizar uma tarefa
about.agent.line10= DELETE /api/todos/{id}       — Excluir uma tarefa
about.agent.line11= PUT    /api/todos/{id}/toggle — Alternar status de conclusão
about.agent.line12= GET    /api/users            — Obter todos os usuários
about.agent.line13= POST   /api/users            — Criar um usuário
about.agent.line14= GET    /api/stats            — Obter estatísticas
about.agent.line15=Invocação com curl, cliente HTTP ou OpenClaw exec, sem autenticação.
about.agent.line16=Exemplo: curl http://localhost:%d/api/todos

# -- Permissões --
about.section.permissions=👥 Permissões
about.perm.line1=O aplicativo roda totalmente em local; todos os dados são armazenados em um banco SQLite local.
about.perm.line2=Não se conecta à rede nem envia dados de usuários para servidores externos.
about.perm.line3=Sem necessidade de registro; funciona imediatamente após a instalação.
about.perm.line4=A porta da API escuta apenas em 127.0.0.1 (localhost) por padrão; redes externas não têm acesso direto.

# -- Problemas conhecidos --
about.section.bugs=🐛 Problemas conhecidos
about.bugs.line1=A janela de candidatos do IME não segue o cursor (Problema conhecido no JavaFX 26, IME chinês do Windows)
about.bugs.line2=O arrasto da mini janela às vezes se desloca em telas de alto DPI
about.bugs.line3=A exibição do calendário lunar só suporta ambientes chineses
about.bugs.line4=Leve travamento na rolagem da lista com muitas tarefas (500+)
about.bugs.line5=Alterações na porta da API só têm efeito após reiniciar o aplicativo

# -- Progresso do desenvolvimento --
about.section.progress=🚧 Progresso do desenvolvimento
about.progress.line1=Versão atual: v1.0.0 (beta)
about.progress.line2=Concluído: CRUD de tarefas, visualização kanban, visualização de calendário, painel de estatísticas
about.progress.line3=Concluído: modo mini, bandeja do sistema, atalhos de teclado, estrutura multilíngue
about.progress.line4=Concluído: API REST, exportação de dados (JSON/CSV)
about.progress.line5=Em desenvolvimento: login de usuários e sistema de permissões
about.progress.line6=Planejado: colaboração em equipe (sincronização em tempo real)
about.progress.line7=Planejado: backup e restauração na nuvem
about.progress.line8=Planejado: adaptação móvel (Android/iOS)
about.progress.line9=Planejado: sistema de plugins e integrações de terceiros

