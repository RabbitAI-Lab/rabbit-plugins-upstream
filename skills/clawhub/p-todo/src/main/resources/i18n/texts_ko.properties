# -- 사용법 --
about.section.usage=📋 사용법
about.usage.line1=새 할 일：상단 바의「+ 새로 만들기」클릭 또는 Ctrl+N
about.usage.line2=상세 보기：할 일을 더블클릭하면 상세 대화상자가 열려 모든 항목을 편집할 수 있습니다
about.usage.line3=전체 검색：Ctrl+K로 검색창을 열어 제목과 설명을 유사 검색합니다
about.usage.line4=미니 모드：상단 바의「미니」클릭 또는 Ctrl+M으로 항상 위에 표시되는 간단 보기로 전환
about.usage.line5=칸반 보기：상단 바에서「목록/칸반」전환, 칸반은 드래그 정렬 지원
about.usage.line6=완료 처리：목록에서 Enter 키로 완료 상태 전환
about.usage.line7=할 일 삭제：할 일을 선택한 후 Delete 키
about.usage.line8=할 일 담당：할 일 오른쪽의「담당하기」버튼으로 내 이름을 선택하거나 생성
about.usage.line9=캘린더 보기：왼쪽의「캘린더」로 월별 할 일 분포 확인
about.usage.line10=데이터 내보내기：설정 페이지에서 JSON/CSV 형식으로 내보내기

# -- 에이전트 호출 --
about.section.agent=🤖 에이전트 API
about.agent.line1=본 앱은 REST API 서비스를 내장하여 외부 AI 에이전트나 스크립트에서 호출할 수 있습니다.
about.agent.line2=API 서비스 주소：http://localhost:%d
about.agent.line3=「설정」페이지에서 수신 포트를 변경할 수 있으며, 변경 후 재시작이 필요합니다.
about.agent.line4=인터페이스 목록：
about.agent.line5=  GET    /api/health           — 헬스 체크
about.agent.line6=  GET    /api/todos            — 모든 할 일 가져오기
about.agent.line7=  GET    /api/todos?status=IN_PROGRESS — 상태별 필터링
about.agent.line8=  POST   /api/todos            — 할 일 생성（JSON body）
about.agent.line9=  PUT    /api/todos/{id}       — 할 일 수정
about.agent.line10= DELETE /api/todos/{id}       — 할 일 삭제
about.agent.line11= PUT    /api/todos/{id}/toggle — 완료 상태 전환
about.agent.line12= GET    /api/users            — 모든 사용자 가져오기
about.agent.line13= POST   /api/users            — 사용자 생성
about.agent.line14= GET    /api/stats            — 통계 데이터 가져오기
about.agent.line15=호출 방법：curl, HTTP 클라이언트, OpenClaw exec 등 모두 가능하며 인증이 필요 없습니다.
about.agent.line16=예시：curl http://localhost:%d/api/todos

# -- 권한 안내 --
about.section.permissions=👥 권한 안내
about.perm.line1=본 앱은 완전히 로컬에서 실행되며 모든 데이터는 로컬 SQLite 데이터베이스에 저장됩니다.
about.perm.line2=네트워크에 연결하지 않으며 사용자 데이터를 외부 서버에 업로드하지 않습니다.
about.perm.line3=계정 등록이 필요 없으며 설치 즉시 사용할 수 있습니다.
about.perm.line4=API 포트는 기본적으로 127.0.0.1（localhost）만 수신하며 외부 네트워크에서 직접 접근할 수 없습니다.

# -- 알려진 문제 --
about.section.bugs=🐛 알려진 문제
about.bugs.line1=입력기 후보창이 커서 위치를 따라가지 않음 (JavaFX 26 알려진 문제, Windows 중국어 입력기)
about.bugs.line2=고 DPI 화면에서 미니 창 드래그가 가끔 어긋남
about.bugs.line3=캘린더 보기의 음력 표시는 중국어 환경만 지원
about.bugs.line4=할 일이 많으면（500개 이상）목록 스크롤이 가끔 버벅임
about.bugs.line5=API 포트 변경은 앱 재시작 후에 적용됩니다

# -- 개발 진행 상황 --
about.section.progress=🚧 개발 진행 상황
about.progress.line1=현재 버전：v1.0.0（베타）
about.progress.line2=완료：할 일 CRUD, 칸반 보기, 캘린더 보기, 통계 패널
about.progress.line3=완료：미니 창 모드, 시스템 트레이, 단축키, 다국어 프레임워크
about.progress.line4=완료：REST API, 데이터 내보내기（JSON/CSV）
about.progress.line5=개발 중：사용자 로그인과 권한 시스템
about.progress.line6=계획 중：팀 협업（다중 사용자 실시간 동기화）
about.progress.line7=계획 중：데이터 클라우드 백업과 복구
