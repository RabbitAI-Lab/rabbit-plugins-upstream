# OpenClaw Gateway Watchdog Configuration
# Copy this file to watchdog.conf and edit as needed.
# The watchdog searches for watchdog.conf in the same directory as watchdog.py,
# or set WATCHDOG_CONF environment variable to override the path.

[watchdog]
# Gateway health endpoint URL
HEALTH_URL = http://127.0.0.1:18789/health

# Seconds between health checks
CHECK_INTERVAL = 60

# Seconds to wait after a restart before re-checking health
RESTART_COOLDOWN = 30

# Maximum restart attempts per failure cycle before giving up
MAX_RESTART_ATTEMPTS = 3

# Path to the persistent state JSON file
# Set permissions readable by your web server (e.g. chmod 644) if exposing via nginx
STATE_FILE = /opt/openclaw-watchdog/watchdog-state.json

# Path to the alert JSON file (only written when status is critical)
ALERT_FILE = /opt/openclaw-watchdog/watchdog-alert.json

# Log file path
LOG_FILE = /var/log/openclaw-gateway-watchdog.log

# systemd user service name for the OpenClaw gateway
GATEWAY_SERVICE = openclaw-gateway