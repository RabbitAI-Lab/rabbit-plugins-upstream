# Nginx location blocks for exposing watchdog status via HTTP
# Add these to your existing nginx server block for the OpenClaw host.

# Watchdog state — returns JSON with status, failure counts, timestamps
location /watchdog/state.json {
    alias /opt/openclaw-watchdog/watchdog-state.json;
    default_type application/json;
    add_header Access-Control-Allow-Origin *;
    add_header Cache-Control "no-cache, no-store";
}

# Watchdog alert — returns JSON only when status is critical; 404 otherwise
# Useful for monitoring: if this endpoint returns data, something is wrong
location /watchdog/alert.json {
    alias /opt/openclaw-watchdog/watchdog-alert.json;
    default_type application/json;
    add_header Access-Control-Allow-Origin *;
    add_header Cache-Control "no-cache, no-store";
}