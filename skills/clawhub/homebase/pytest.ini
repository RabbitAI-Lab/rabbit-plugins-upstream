[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
# Warnings are errors, so a new one fails the build rather than scrolling past.
#
# The DeprecationWarning exemptions are SCOPED to the third-party modules they
# are for. They have to be: an unscoped `ignore::DeprecationWarning` sitting
# under `error` swallows first-party deprecations too, which is how
# datetime.utcnow() stayed invisible on a Python 3.12 floor — and an earlier
# version of this file "fixed" that by adding `error` above the same unscoped
# ignore, which changed nothing. A probe test calling utcnow() passed silently
# against it. Now homebase's own deprecations fail the build.
#
# ResourceWarning stays unscoped, and that is a real gap rather than a claim:
# unclosed-socket warnings surface against whichever frame triggers GC, so they
# cannot be attributed to a module reliably enough to scope.
filterwarnings =
    error
    ignore::DeprecationWarning:google.*
    ignore::DeprecationWarning:httplib2.*
    ignore::ResourceWarning
