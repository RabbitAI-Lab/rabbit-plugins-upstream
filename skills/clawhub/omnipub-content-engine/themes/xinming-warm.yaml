name: "xinming-warm"
description: "暖色人文风格：暖橙主调+古铜辅助+米白底，温润叙事感，适合成长故事/案例拆解/人物类内容"
colors:
  primary: "#C0392B"
  secondary: "#8B5E3C"
  tertiary: "#D4763A"
  text: "#3A2E28"
  text_light: "#7A6E62"
  background: "#FDF8F3"
  code_bg: "#F5EDE5"
  code_color: "#8B5E3C"
  quote_border: "#D4763A"
  quote_bg: "#FAF3EB"
  border: "#E8DDD0"
  card_bg: "#FFF9F2"
darkmode:
  background: "#2A2018"
  text: "#E8DDD0"
  text_light: "#9A8E80"
  primary: "#D4763A"
  code_bg: "#3A2E28"
  code_color: "#E8C5A0"
  quote_bg: "#332A22"
  quote_border: "#D4763A"
base_css: |
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.85;
    color: #3A2E28;
    background: #FDF8F3;
    max-width: 720px;
    margin: 0 auto;
    padding: 20px;
    word-wrap: break-word;
  }

  h1 {
    font-size: 24px;
    font-weight: 800;
    color: #FFFFFF;
    background: #C0392B;
    margin: 0 0 24px 0;
    padding: 24px 20px;
    text-align: center;
    line-height: 1.4;
  }

  h2 {
    font-size: 20px;
    font-weight: 700;
    color: #C0392B;
    margin: 32px 0 16px 0;
    padding: 8px 0 8px 14px;
    border-left: 5px solid #C0392B;
    line-height: 1.4;
  }

  h3 {
    font-size: 17px;
    font-weight: 600;
    color: #8B5E3C;
    margin: 24px 0 12px 0;
    padding-left: 12px;
    border-left: 3px solid #D4763A;
    line-height: 1.4;
  }

  h4 {
    font-size: 16px;
    font-weight: 600;
    color: #D4763A;
    margin: 20px 0 10px 0;
    line-height: 1.4;
  }

  p {
    font-size: 15px;
    line-height: 1.85;
    color: #3A2E28;
    margin: 12px 0;
  }

  strong {
    font-weight: 700;
    color: #C0392B;
  }

  em {
    font-style: italic;
    color: #7A6E62;
  }

  code {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
    font-size: 14px;
    background: #F5EDE5;
    color: #8B5E3C;
    padding: 2px 6px;
  }

  pre {
    background: #F5EDE5;
    color: #3A2E28;
    padding: 16px;
    overflow-x: auto;
    margin: 16px 0;
    line-height: 1.6;
    border: 1px solid #E8DDD0;
  }

  pre code {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
    font-size: 14px;
    background: none;
    color: #3A2E28;
    padding: 0;
  }

  blockquote {
    border-left: 4px solid #D4763A;
    background: #FAF3EB;
    margin: 16px 0;
    padding: 14px 18px;
    color: #3A2E28;
  }

  blockquote p {
    margin: 8px 0;
    color: #3A2E28;
    font-size: 15px;
  }

  ul {
    padding-left: 24px;
    margin: 12px 0;
  }

  ol {
    padding-left: 24px;
    margin: 12px 0;
  }

  li {
    font-size: 15px;
    line-height: 1.85;
    color: #3A2E28;
    margin: 6px 0;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0;
    font-size: 14px;
  }

  th {
    background: #C0392B;
    color: #FFFFFF;
    font-weight: 600;
    padding: 10px 14px;
    text-align: left;
    border: 1px solid #C0392B;
  }

  td {
    padding: 10px 14px;
    border: 1px solid #E8DDD0;
    color: #3A2E28;
  }

  tr {
    background: #FFFFFF;
  }

  img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 24px auto;
  }

  a {
    color: #D4763A;
    text-decoration: none;
    font-weight: 500;
  }

  hr {
    border: none;
    border-top: 2px solid #D4763A;
    margin: 32px 0;
  }
