name: "xinming-lab"
description: "心明增长实验室专属主题：紫色主调+绿色辅助+蓝色数据锚点，专业调研报告风格"
colors:
  primary: "#534AB7"
  secondary: "#639922"
  tertiary: "#2196F3"
  text: "#1A1A2E"
  text_light: "#5C5C7A"
  background: "#FFFFFF"
  code_bg: "#F5F5F7"
  code_color: "#534AB7"
  quote_border: "#534AB7"
  quote_bg: "#F3F0FF"
  border: "#E0E0EB"
  card_bg: "#F8F9FB"
darkmode:
  background: "#1A1A2E"
  text: "#C8C8D0"
  text_light: "#8C8C9E"
  primary: "#8B80D4"
  code_bg: "#2A2A3E"
  code_color: "#A78BFA"
  quote_bg: "#2A2540"
  quote_border: "#8B80D4"
base_css: |
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.8;
    color: #1A1A2E;
    background: #FFFFFF;
    max-width: 720px;
    margin: 0 auto;
    padding: 20px;
    word-wrap: break-word;
  }

  h1 {
    font-size: 24px;
    font-weight: 800;
    color: #FFFFFF;
    background: #534AB7;
    margin: 0 0 24px 0;
    padding: 24px 20px;
    text-align: center;
    line-height: 1.4;
  }

  h2 {
    font-size: 20px;
    font-weight: 700;
    color: #534AB7;
    margin: 32px 0 16px 0;
    padding: 10px 0 10px 14px;
    border-left: 5px solid #534AB7;
    line-height: 1.4;
  }

  h3 {
    font-size: 17px;
    font-weight: 600;
    color: #639922;
    margin: 24px 0 12px 0;
    padding-left: 12px;
    border-left: 3px solid #639922;
    line-height: 1.4;
  }

  h4 {
    font-size: 16px;
    font-weight: 600;
    color: #2196F3;
    margin: 20px 0 10px 0;
    line-height: 1.4;
  }

  p {
    font-size: 15px;
    line-height: 1.8;
    color: #1A1A2E;
    margin: 12px 0;
  }

  strong {
    font-weight: 700;
    color: #534AB7;
  }

  em {
    font-style: italic;
    color: #5C5C7A;
  }

  code {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
    font-size: 14px;
    background: #F5F5F7;
    color: #534AB7;
    padding: 2px 6px;
  }

  pre {
    background: #F5F5F7;
    color: #1A1A2E;
    padding: 16px;
    overflow-x: auto;
    margin: 16px 0;
    line-height: 1.6;
    border: 1px solid #E0E0EB;
  }

  pre code {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
    font-size: 14px;
    background: none;
    color: #1A1A2E;
    padding: 0;
  }

  blockquote {
    border-left: 4px solid #534AB7;
    background: #F3F0FF;
    margin: 16px 0;
    padding: 14px 18px;
    color: #1A1A2E;
  }

  blockquote p {
    margin: 8px 0;
    color: #1A1A2E;
    font-size: 15px;
  }

  ul {
    padding-left: 24px;
    margin: 12px 0;
  }

  ol {
    padding-left: 24px;
    margin: 12px 0;
  }

  li {
    font-size: 15px;
    line-height: 1.8;
    color: #1A1A2E;
    margin: 6px 0;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0;
    font-size: 14px;
  }

  th {
    background: #534AB7;
    color: #FFFFFF;
    font-weight: 600;
    padding: 10px 14px;
    text-align: left;
    border: 1px solid #534AB7;
  }

  td {
    padding: 10px 14px;
    border: 1px solid #E0E0EB;
    color: #1A1A2E;
  }

  tr {
    background: #FFFFFF;
  }

  img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 24px auto;
  }

  a {
    color: #2196F3;
    text-decoration: none;
    font-weight: 500;
  }

  hr {
    border: none;
    border-top: 2px solid #534AB7;
    margin: 32px 0;
  }
