name: "xinming-minimal"
description: "极简黑白灰风格，无色彩干扰，内容至上。适合随笔、短文、思考类内容"
colors:
  primary: "#1a1a1a"
  secondary: "#666666"
  tertiary: "#999999"
  text: "#333333"
  text_light: "#666666"
  background: "#FFFFFF"
  code_bg: "#F5F5F5"
  code_color: "#D73A49"
  quote_border: "#CCCCCC"
  quote_bg: "#F9F9F9"
  border: "#E0E0E0"
  card_bg: "#FAFAFA"
darkmode:
  background: "#1A1A1A"
  text: "#C0C0C0"
  text_light: "#888888"
  primary: "#E0E0E0"
  code_bg: "#252525"
  code_color: "#C0C0C0"
  quote_bg: "#222222"
  quote_border: "#555555"
base_css: |
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.8;
    color: #333333;
    background: #FFFFFF;
    max-width: 720px;
    margin: 0 auto;
    padding: 20px;
    word-wrap: break-word;
  }

  h1 {
    font-size: 26px;
    font-weight: 700;
    color: #1a1a1a;
    margin: 0 0 24px 0;
    text-align: center;
    line-height: 1.4;
    padding-bottom: 16px;
    border-bottom: 2px solid #1a1a1a;
  }

  h2 {
    font-size: 22px;
    font-weight: 700;
    color: #1a1a1a;
    margin: 32px 0 16px 0;
    padding-bottom: 8px;
    border-bottom: 1px solid #E0E0E0;
    line-height: 1.4;
  }

  h3 {
    font-size: 18px;
    font-weight: 600;
    color: #333333;
    margin: 24px 0 12px 0;
    padding-left: 12px;
    border-left: 3px solid #CCCCCC;
    line-height: 1.4;
  }

  h4 {
    font-size: 16px;
    font-weight: 600;
    color: #333333;
    margin: 20px 0 10px 0;
    line-height: 1.4;
  }

  p {
    font-size: 16px;
    line-height: 1.8;
    color: #333333;
    margin: 12px 0;
  }

  strong {
    font-weight: 700;
    color: #1a1a1a;
  }

  em {
    font-style: italic;
    color: #666666;
  }

  code {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
    font-size: 14px;
    background: #F5F5F5;
    color: #D73A49;
    padding: 2px 6px;
  }

  pre {
    background: #F5F5F5;
    color: #333333;
    padding: 16px;
    overflow-x: auto;
    margin: 16px 0;
    line-height: 1.6;
    border: 1px solid #E0E0E0;
  }

  pre code {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
    font-size: 14px;
    background: none;
    color: #333333;
    padding: 0;
  }

  blockquote {
    border-left: 3px solid #CCCCCC;
    background: #F9F9F9;
    margin: 16px 0;
    padding: 12px 16px;
    color: #666666;
  }

  blockquote p {
    margin: 8px 0;
    color: #666666;
    font-size: 15px;
  }

  ul {
    padding-left: 24px;
    margin: 12px 0;
  }

  ol {
    padding-left: 24px;
    margin: 12px 0;
  }

  li {
    font-size: 16px;
    line-height: 1.8;
    color: #333333;
    margin: 6px 0;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0;
    font-size: 15px;
  }

  th {
    background: #F5F5F5;
    color: #1a1a1a;
    font-weight: 600;
    padding: 10px 14px;
    text-align: left;
    border: 1px solid #E0E0E0;
  }

  td {
    padding: 10px 14px;
    border: 1px solid #E0E0E0;
    color: #333333;
  }

  tr {
    background: #FFFFFF;
  }

  img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 24px auto;
  }

  a {
    color: #333333;
    text-decoration: underline;
  }

  hr {
    border: none;
    border-top: 1px solid #E0E0E0;
    margin: 32px 0;
  }
