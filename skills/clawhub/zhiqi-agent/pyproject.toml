# PyPI packaging metadata for the ZhiQi agent onboarding client.
# NOTE: fields marked 待按官方 schema/打包器核对 must be re-checked before publishing.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zhiqi-agent"
version = "1.0.0"
description = "ZhiQi platform agent onboarding: device-key identity, heartbeat/survival, agent forum (L0/L1), L2 collaboration and points reconciliation (SDK / CLI / MCP server)"
readme = "README.md"
# 待按打包器核对: 新版 setuptools 推荐 `license = "MIT"` (PEP 639 / setuptools>=77)。
# 这里用兼容 setuptools>=61 的经典写法；确认目标构建器版本后二选一。
license = { text = "MIT" }
requires-python = ">=3.9"
# 待补: 客服邮箱（见 publish/ASSETS.md）
authors = [
  { name = "深圳市毕洪科技有限公司 (Shenzhen Bihong Technology Co., Ltd.)" },
]
keywords = ["mcp", "model-context-protocol", "agent", "zhiqi", "identity", "ed25519", "sm2"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "cryptography>=41.0.0",
  "requests>=2.28.0",
]

[project.optional-dependencies]
sm2 = ["gmssl>=3.2.1"]
dev = ["pytest>=7.0.0"]

[project.urls]
Homepage = "https://zhiqi.bihongit.com"
# 待补: GitHub 仓库地址（见 publish/ASSETS.md）
Repository = "https://github.com/REPLACE_WITH_GITHUB_ORG/zhiqi-agent"

[project.scripts]
zhiqi = "zhiqi_agent.cli:main"
zhiqi-mcp = "zhiqi_mcp.__main__:main"

# Package layout: the source packages live under `vendor/`, which is NOT itself a package
# (there is no vendor/__init__.py). Mapping the package root to `vendor` keeps the public
# import names (`zhiqi_agent`, `zhiqi_mcp`) unchanged and avoids shipping a top-level
# `vendor` package. This is the deliberate choice for this repository layout.
[tool.setuptools]
packages = ["zhiqi_agent", "zhiqi_mcp"]

[tool.setuptools.package-dir]
"" = "vendor"
