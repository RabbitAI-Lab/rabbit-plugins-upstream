id: jep-guard
name: JEP Guard
version: 3.0.0
license: MIT-0
description: Local authenticated execution gate for explicitly integrated OpenClaw hook calls.
risk_level: critical
capabilities:
  - system:file_write
  - system:network_local
entry:
  cli: dist/cli/index.js
  sdk: dist/sdk/index.js
hooks:
  pre_exec: openclaw.hooks.preExec
  post_exec: openclaw.hooks.postExec
  pre_delegate: openclaw.hooks.preDelegate
  on_error: openclaw.hooks.onError
config_schema:
  type: object
  properties:
    mode:
      type: string
      enum: [passive, full]
      default: passive
security_declarations:
  auto_start: false
  installer_spawns: false
  local_state_directory: ~/.jep-guard
  authenticated_local_ipc: true
  cross_skill_forwarding: disabled
  external_integrations: disabled
