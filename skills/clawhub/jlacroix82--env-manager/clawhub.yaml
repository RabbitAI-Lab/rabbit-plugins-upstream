slug: env-manager
name: env-manager
description: Scaffolds dev project files (package.json, Dockerfile, Cargo.toml, etc.) and returns toolchain commands for the calling agent to run. Writes files only inside the project workspace (repo root), or a descendant set via the ENV_MANAGER_WORKSPACE env var (confined to within the repo root — paths outside are refused). Environment types are restricted to a fixed allowlist (python, node, docker, go, rust) and environment names to a conservative character allowlist (lowercase letters, digits, hyphen, underscore, dot), both validated before any path is constructed; invalid input writes nothing. Every path is additionally re-checked for workspace containment immediately before each mkdir/write. Does not run shell commands.
