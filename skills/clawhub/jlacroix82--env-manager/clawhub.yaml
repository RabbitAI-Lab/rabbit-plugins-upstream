slug: env-manager
name: env-manager
description: Scaffolds dev project files (package.json, Dockerfile, Cargo.toml, etc.) and returns toolchain commands for the calling agent to run. Writes files only inside the project workspace (repo root), or a descendant set via the ENV_MANAGER_WORKSPACE env var (confined to within the repo root — paths outside are refused). Environment names are strictly sanitized to a conservative allowlist (lowercase letters, digits, hyphen, underscore, dot) and rejected if they contain path separators, parent-directory references, or shell metacharacters. Does not run shell commands.
