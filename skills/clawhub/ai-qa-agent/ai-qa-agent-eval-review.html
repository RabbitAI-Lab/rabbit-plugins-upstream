<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>AI QA Agent — Eval Review</title>
<style>
  :root {
    --bg: #f8f7f4; --surface: #fff; --border: #e2dfd6; --text: #1a1a18;
    --muted: #8a877e; --accent: #c95d2e; --accent-light: #fdf0ea;
    --green: #3d7a3d; --green-bg: #eaf4ea; --red: #c33; --red-bg: #fdeaea;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .header { background: #1a1a18; color: #f8f7f4; padding: 1.25rem 2rem; display: flex; justify-content: space-between; align-items: center; }
  .header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: -0.01em; }
  .header .badge { background: var(--accent); color: #fff; padding: 0.2rem 0.75rem; border-radius: 99px; font-size: 0.8rem; font-weight: 500; }

  .tabs { display: flex; gap: 0; border-bottom: 2px solid var(--border); padding: 0 2rem; background: var(--surface); }
  .tab { padding: 0.75rem 1.25rem; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; font-size: 0.9rem; color: var(--muted); font-weight: 500; transition: all 0.15s; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .main { max-width: 1100px; margin: 0 auto; padding: 1.5rem 2rem 4rem; }

  /* Eval cards */
  .eval-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-top: 1rem; }
  .eval-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: box-shadow 0.2s; }
  .eval-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
  .eval-card.primary { border-color: var(--accent); }
  .card-header { padding: 0.75rem 1rem; display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .card-header.primary { background: var(--accent); color: #fff; }
  .card-header.baseline { background: #e8e6dc; color: var(--text); }
  .card-body { padding: 1rem; max-height: 500px; overflow-y: auto; }
  .card-body pre { white-space: pre-wrap; word-break: break-word; font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 0.82rem; line-height: 1.6; color: var(--text); }

  /* Grade badges */
  .grade-pass { display: inline-block; background: var(--green-bg); color: var(--green); padding: 0.15rem 0.5rem; border-radius: 99px; font-size: 0.75rem; font-weight: 600; }
  .grade-fail { display: inline-block; background: var(--red-bg); color: var(--red); padding: 0.15rem 0.5rem; border-radius: 99px; font-size: 0.75rem; font-weight: 600; }

  /* Assertion table */
  .assertion-table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; font-size: 0.82rem; }
  .assertion-table th { text-align: left; padding: 0.5rem 0.75rem; background: #f4f3f0; font-weight: 600; border-bottom: 1px solid var(--border); }
  .assertion-table td { padding: 0.5rem 0.75rem; border-bottom: 1px solid #f0eeea; vertical-align: top; }
  .assertion-table tr:last-child td { border-bottom: none; }

  /* Benchmark summary */
  .bench-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
  .bench-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; }
  .bench-card .label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; margin-bottom: 0.5rem; }
  .bench-card .value { font-size: 1.75rem; font-weight: 700; }
  .bench-card .sub { font-size: 0.82rem; color: var(--muted); margin-top: 0.25rem; }
  .delta-positive { color: var(--green); }
  .delta-negative { color: var(--red); }

  /* File tabs inside cards */
  .file-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); padding: 0 1rem; }
  .file-tab { padding: 0.4rem 0.75rem; cursor: pointer; font-size: 0.78rem; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .file-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .file-content { display: none; }
  .file-content.active { display: block; }

  .eval-section { margin-bottom: 2rem; }
  .eval-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.25rem; }
  .eval-prompt { font-size: 0.88rem; color: var(--muted); margin-bottom: 0.75rem; }

  .hidden { display: none !important; }

  @media (max-width: 800px) {
    .eval-grid { grid-template-columns: 1fr; }
    .bench-summary { grid-template-columns: 1fr; }
  }
</style>

[Track: Code] Misleading variable name `revenue_per_user`**\n  Location: `test-input.py:21`\n  Detail: The key is named `revenue_per_user` but the calculation divides `total_revenue` by `active_users`, not by `len(users)`. The name implies per-total-user, but the logic computes per-active-user. Either the name should be `revenue_per_active_user`, or the divisor should be `len(users)`. As written, a consumer trusting the key name will misinterpret the metric.\n  Suggestion: Rename to `revenue_per_active_user`, or change the divisor to `len(users)` if per-total-user is the intended semantics.\n\n### Minor Issues (P2)\n\n- **[P2] [Track: Code] No type annotations on function signature**\n  Location: `test-input.py:1`\n  Detail: The function accepts `users` and returns a dict, but neither the parameter nor the return type is annotated. This reduces IDE support, static analysis coverage, and readability.\n  Suggestion: Add type hints, e.g. `def calculate_user_metrics(users: list[dict]) -> dict:` (or use a `TypedDict`/`NamedTuple` for the return).\n\n- **[P2] [Track: Code] No input validation**\n  Location: `test-input.py:7-11`\n  Detail: The function assumes every user dict contains the keys `revenue`, `active`, and `age` with the correct types. A missing key raises `KeyError`; a `None` input raises `TypeError`. No defensive checks or informative error messages exist.\n  Suggestion: Validate input (e.g., raise `ValueError` with a clear message) or use `.get()` with defaults and/or a dataclass/schema.\n\n- **[P2] [Track: Code] Minimal docstring**\n  Location: `test-input.py:2`\n  Detail: The docstring is a single sentence. It does not document the expected shape of each user dict (required keys, types), the structure of the return value, edge case behavior, or exceptions that may be raised.\n  Suggestion: Expand to include a Parameters section, Returns section, and a Raises section per Google/NumPy/Sphinx style.\n\n### Nits (P3)\n\n- **[P3] [Track: Code] Unidiomatic boolean comparison**\n  Location: `test-input.py:9`\n  Detail: `if user['active'] == True:` is non-idiomatic Python. PEP 8 recommends `if user['active']:` for truthiness checks. The explicit `== True` comparison is stricter than needed and signals inexperience with Python conventions.\n  Suggestion: Change to `if user['active']:`.\n\n## Brand Voice Score\n\n| Attribute | Score | Notes |\n|-----------|:-----:|-------|\n| Clear | N/A | Not applicable — source code, not marketing copy. |\n| Confident | N/A | Not applicable. |\n| Concise | N/A | Not applicable. |\n| Human | N/A | Not applicable. |\n| **Average** | **N/A** | Brand voice review skipped for code deliverables. |\n\n## Recommendations\n\n1. **Fix the P0 empty-list crash immediately** — add a guard clause at the top of the function. This is a shipping blocker.\n2. **Guard the `revenue_per_user` division** against `active_users == 0`.\n3. **Resolve the naming mismatch** on `revenue_per_user` vs. its actual calculation to prevent downstream misinterpretation.\n4. **Add type annotations and input validation** to make the function robust and self-documenting.\n5. **Expand the docstring** to cover parameter contracts, return structure, and edge case behavior.\n\n## Production Memo\n\nNo production memo was provided — this is a standalone code review."}, {"name": "grading.json", "content": "{\n  \"eval_id\": \"eval-0-code-review\",\n  \"config\": \"with_skill\",\n  \"assertions\": [\n    {\n      \"text\": \"Verdict is FAIL\",\n      \"passed\": true,\n      \"evidence\": \"Verdict: FAIL clearly stated in header\"\n    },\n    {\n      \"text\": \"Identifies ZeroDivisionError on empty list\",\n      \"passed\": true,\n      \"evidence\": \"P0 finding: lines 13-14 divide by len(users) with no guard\"\n    },\n    {\n      \"text\": \"Identifies ZeroDivisionError when no active users\",\n      \"passed\": true,\n      \"evidence\": \"P1: revenue_per_user divides by active_users which can be 0\"\n    },\n    {\n      \"text\": \"Identifies == True anti-pattern (PEP 8)\",\n      \"passed\": true,\n      \"evidence\": \"P3: unidiomatic boolean comparison\"\n    },\n    {\n      \"text\": \"Identifies missing type annotations\",\n      \"passed\": true,\n      \"evidence\": \"P2: no type annotations on function signature\"\n    },\n    {\n      \"text\": \"Identifies misleading variable name\",\n      \"passed\": true,\n      \"evidence\": \"P1: revenue_per_user divides by active_users not total users\"\n    },\n    {\n      \"text\": \"Uses P0/P1/P2/P3 severity system\",\n      \"passed\": true,\n      \"evidence\": \"All 4 severity levels used with proper classification\"\n    },\n    {\n      \"text\": \"Includes fix suggestions for each finding\",\n      \"passed\": true,\n      \"evidence\": \"Each finding has Suggestion with code example\"\n    },\n    {\n      \"text\": \"Follows QA report template\",\n      \"passed\": true,\n      \"evidence\": \"All sections: Summary, Findings, Brand Voice, Recommendations\"\n    }\n  ]\n}"}], "without_skill": [{"name": "qa-report.md", "content": "# QA Code Review Report\n\n## File Under Review\n`test-input.py` — `calculate_user_metrics(users)`\n\n## Verdict: **FAIL**\n\nThis function contains multiple bugs, including a **critical division-by-zero error** that will crash in a common real-world scenario (no active users). It also lacks basic input validation and contains a PEP 8 violation that can cause subtle logic errors.\n\n---\n\n## Bug List\n\n### BUG-1: Division by Zero on `revenue_per_user` (Severity: **CRITICAL**)\n\n| Field | Value |\n|---|---|\n| **Line** | 21 |\n| **Code** | `'revenue_per_user': total_revenue / active_users` |\n| **Impact** | Unhandled `ZeroDivisionError` if `active_users == 0` |\n\n**Description:** When the input list contains zero active users (a very common scenario), `active_users` remains `0`, causing `total_revenue / 0` to raise a `ZeroDivisionError`. This is a crash-level bug that will occur in production whenever no users are marked active.\n\n**Reproduction:**\n```python\nusers = [\n    {\"revenue\": 100, \"active\": False, \"age\": 25},\n    {\"revenue\": 200, \"active\": False, \"age\": 30},\n]\ncalculate_user_metrics(users)  # ZeroDivisionError\n```\n\n**Fix:**\n```python\n'revenue_per_user': total_revenue / active_users if active_users > 0 else 0\n```\n\n---\n\n### BUG-2: Division by Zero on Empty Input List (Severity: **CRITICAL**)\n\n| Field | Value |\n|---|---|\n| **Lines** | 13, 14 |\n| **Code** | `avg_age = avg_age / len(users)` and `retention_rate = active_users / len(users)` |\n| **Impact** | Unhandled `ZeroDivisionError` when `users` is empty |\n\n**Description:** If an empty list `[]` is passed, `len(users)` is `0`, causing division by zero on both lines 13 and 14.\n\n**Reproduction:**\n```python\ncalculate_user_metrics([])  # ZeroDivisionError on line 13\n```\n\n**Fix:** Add an early-return guard:\n```python\nif not users:\n    return {\n        'total_revenue': 0,\n        'active_users': 0,\n        'avg_age': 0,\n        'retention_rate': 0,\n        'revenue_per_user': 0,\n    }\n```\n\n---\n\n### BUG-3: PEP 8 Violation — `== True` Comparison (Severity: **MEDIUM**)\n\n| Field | Value |\n|---|---|\n| **Line** | 9 |\n| **Code** | `if user['active'] == True:` |\n| **Impact** | Subtle logic errors with non-boolean truthy values |\n\n**Description:** PEP 8 explicitly states: *\"Don't compare boolean values to True or False using `==`.\"* Using `== True` produces different behavior than a truthiness check for non-boolean values:\n- `1 == True` evaluates to `True` (correct)\n- `\"yes\" == True` evaluates to `False` (but `if \"yes\":` is `True`)\n- `None == True` evaluates to `False` (correct)\n\nIf `active` values come from a data source that uses non-boolean truthy/falsy values (e.g., `1`, `\"yes\"`, `0`, `None`), this comparison will silently miscount active users.\n\n**Fix:**\n```python\nif user['active']:\n```\n\n---\n\n### BUG-4: Missing Input Validation — No Guard Against Bad Types (Severity: **MEDIUM**)\n\n| Field | Value |\n|---|---|\n| **Lines** | 1–21 (entire function) |\n| **Impact** | Cryptic `TypeError` or `KeyError` with no helpful message |\n\n**Description:** The function does not validate:\n1. That `users` is a list or iterable (passing `None` or an integer raises `TypeError`).\n2. That each element is a dict with the required keys `revenue`, `active`, and `age`. A missing key raises an unhandled `KeyError`.\n3. That `revenue` and `age` are numeric (non-numeric values will cause `TypeError` on `+=`).\n\n**Fix:** Add validation at the top of the function or use `.get()` with defaults and type checks.\n\n---\n\n### BUG-5: Misleading Variable Name `retention_rate` (Severity: **LOW**)\n\n| Field | Value |\n|---|---|\n| **Line** | 14 |\n| **Code** | `retention_rate = active_users / len(users)` |\n| **Impact** | Consumer confusion; incorrect business interpretation |\n\n**Description:** \"Retention rate\" has a specific business meaning — the proportion of users who continue using a product over time. This code computes the **active user ratio** (proportion of currently active users), not a retention metric. The name is semantically incorrect and could lead to downstream business logic errors.\n\n**Fix:** Rename to `active_user_ratio` or `active_rate`.\n\n---\n\n### BUG-6: Potential Integer Division in Python 2 (Severity: **LOW**)\n\n| Field | Value |\n|---|---|\n| **Lines** | 13, 14 |\n| **Code** | `avg_age / len(users)` and `active_users / len(users)` |\n| **Impact** | Returns `0` instead of a float ratio in Python 2 |\n\n**Description:** In Python 2, the `/` operator performs floor division on integers. For example, `1 / 2` returns `0` instead of `0.5`. If this code runs under Python 2, both `avg_age` and `retention_rate` will always be `0` when there are more users than the numerator value.\n\n**Fix:** Use `from __future__ import division` or cast to float: `float(active_users) / len(users)`.\n\n---\n\n## Summary Table\n\n| # | Bug | Severity | Category |\n|---|-----|----------|----------|\n| BUG-1 | Division by zero on `revenue_per_user` when no active users | **CRITICAL** | Runtime crash |\n| BUG-2 | Division by zero on empty input list | **CRITICAL** | Runtime crash |\n| BUG-3 | `== True` comparison (PEP 8 + truthiness mismatch) | **MEDIUM** | Logic error |\n| BUG-4 | Missing input validation (type, keys, values) | **MEDIUM** | Robustness |\n| BUG-5 | Misleading name `retention_rate` | **LOW** | Naming / semantics |\n| BUG-6 | Integer division in Python 2 | **LOW** | Compatibility |\n\n## Overall Assessment\n\nThe function will **crash** in at least two realistic scenarios (empty list, no active users) and contains a comparison pattern that can silently produce wrong results. It requires fixes before it can be considered production-ready.\n\n**Verdict: FAIL** — 2 critical bugs, 2 medium bugs, 2 low-severity issues found."}, {"name": "grading.json", "content": "{\n  \"eval_id\": \"eval-0-code-review\",\n  \"config\": \"without_skill\",\n  \"assertions\": [\n    {\n      \"text\": \"Verdict is FAIL\",\n      \"passed\": true,\n      \"evidence\": \"Verdict: FAIL clearly stated\"\n    },\n    {\n      \"text\": \"Identifies ZeroDivisionError on empty list\",\n      \"passed\": true,\n      \"evidence\": \"BUG-2: lines 13-14 divide by len(users) with no guard\"\n    },\n    {\n      \"text\": \"Identifies ZeroDivisionError when no active users\",\n      \"passed\": true,\n      \"evidence\": \"BUG-1: line 21 divides by active_users\"\n    },\n    {\n      \"text\": \"Identifies == True anti-pattern (PEP 8)\",\n      \"passed\": true,\n      \"evidence\": \"BUG-3: == True comparison with truthiness analysis\"\n    },\n    {\n      \"text\": \"Identifies missing type annotations\",\n      \"passed\": false,\n      \"evidence\": \"Not explicitly called out as a finding\"\n    },\n    {\n      \"text\": \"Identifies misleading variable name\",\n      \"passed\": false,\  Location: Paragraph 1, sentence 1\n  Detail: The brand voice guide explicitly lists \"at this point in time\" as a forbidden pattern, requiring it to be replaced with \"now.\"\n  Suggestion: Remove entirely or replace with \"now.\"\n\n- **[P0] [Track: Voice] Forbidden pattern \"in order to\" used twice**\n  Location: Paragraph 1 (\"in order to facilitate\") and paragraph 3 (\"In order to take advantage\")\n  Detail: The guide mandates replacing \"in order to\" with \"to.\" It appears twice in this short copy.\n  Suggestion: Replace both instances with \"to.\"\n\n- **[P0] [Track: Voice] Forbidden word \"utilize/utilizes\" used twice**\n  Location: Paragraph 1 (\"organizations utilize\") and paragraph 2 (\"platform utilizes\")\n  Detail: The guide requires \"use\" instead of \"utilize.\"\n  Suggestion: Replace both with \"use.\"\n\n- **[P0] [Track: Voice] Opening sentence is 55 words — 20 words over the 35-word maximum**\n  Location: Paragraph 1, sentence 1\n  Detail: \"We are thrilled to announce to all of our valued and esteemed customers that at this point in time, we are leveraging cutting-edge synergistic AI technology in order to facilitate a paradigm shift in the way that organizations utilize data-driven insights to empower their teams and drive transformative business outcomes across the entire enterprise ecosystem.\" — 55 words. The guide sets a hard maximum of 35.\n  Suggestion: Break into 3-4 short sentences. Lead with the actual news.\n\n- **[P0] [Track: Voice] Triple exclamation marks (\"!!!\") in professional content**\n  Location: Paragraph 3, final sentence\n  Detail: The brand voice guide restricts exclamation marks to a maximum of 1 per piece, and only in casual content. Three exclamation marks in a professional announcement is off-brand.\n  Suggestion: Remove all exclamation marks. Let the words carry the energy.\n\n### Major Issues (P1)\n\n- **[P1] [Track: Voice] Extreme buzzword density undermines the \"Human\" attribute**\n  Location: Entire document\n  Detail: The following buzzwords appear: \"leverage,\" \"synergistic,\" \"paradigm shift,\" \"ecosystem,\" \"enterprise-grade,\" \"state-of-the-art,\" \"purpose-built,\" \"best-in-class,\" \"digital transformation journey,\" \"value proposition.\" The guide explicitly forbids corporate buzzwords (\"synergy,\" \"leverage,\" \"paradigm\" are called out or implied). This reads like a parody of corporate-speak, not a sharp colleague.\n  Suggestion: Replace every buzzword with plain language. \"Leverage\" → \"use.\" \"Paradigm shift\" → state the actual change. \"Digital transformation journey\" → describe what the customer actually does.\n\n- **[P1] [Track: Voice] Forbidden intensifiers \"really\" and \"very\" weaken the closing**\n  Location: Paragraph 3: \"We really, very much believe that this represents a truly unique value proposition\"\n  Detail: The guide explicitly bans \"very\" and \"really\" as intensifiers, noting they weaken the word they modify. Using both in a single phrase is a double violation. Additionally, \"We really, very much believe\" is the exact kind of excessive hedging the \"Confident\" attribute prohibits.\n  Suggestion: State the claim directly: \"This is a strong offer for any team looking to [specific benefit].\"\n\n- **[P1] [Track: Voice] No contractions used anywhere in the copy**\n  Location: Entire document\n  Detail: The \"Human\" attribute requires contractions to sound conversational. The copy uses \"We are,\" \"do not\" (implied), etc. Zero contractions in a product announcement that should feel approachable.\n  Suggestion: Use contractions naturally: \"We're,\" \"you'll,\" \"don't.\"\n\n- **[P1] [Track: Voice] Core message is unintelligible — reader cannot determine what the product does**\n  Location: Entire document\n  Detail: After reading all three paragraphs, the reader knows: (a) it involves AI, (b) it has something to do with data, (c) the writer is excited. The actual product name, specific capability, and concrete rgon terms in just 3 paragraphs. This is the single largest problem and cascades into failures on every other dimension.\n2. **No concrete value proposition.** After reading the entire copy, a customer cannot identify what the product does, what problem it solves, or how it differs from competitors.\n3. **Hedging language destroys confidence.** \"We really, very much believe\" is the weakest possible claim structure and directly contradicts the confident tone the rest of the copy attempts.\n4. **Multiple exclamation marks signal spam, not excitement.** The \"!!!\" ending is a strong negative signal in professional marketing copy.\n5. **Redundancy everywhere.** \"Valued and esteemed,\" \"robust, scalable, and enterprise-grade,\" and the tri-part verb chains (\"streamline, optimize, and maximize\") are repetitive filler patterns.\n\n---\n\n## Recommended Actions\n\n- **Rewrite from scratch.** This copy is not salvageable through line edits; the underlying approach is fundamentally misaligned with clear, confident, concise, and human brand voice.\n- **Start with a plain-language value statement.** One sentence: what it is, who it is for, what it does.\n- **Eliminate all buzzwords.** Ban: synergistic, paradigm shift, ecosystem, best-in-class, digital transformation journey, unique value proposition, leverage, empower, state-of-the-art, enterprise-grade, robust, scalable (unless specifying a technical capability).\n- **Remove hedging language.** Replace \"We really, very much believe\" with a direct, factual claim.\n- **Cut word count by 60-70%.** Aim for 3-5 short, declarative sentences total."}, {"name": "grading.json", "content": "{\n  \"eval_id\": \"eval-1-brand-voice\",\n  \"config\": \"without_skill\",\n  \"assertions\": [\n    {\n      \"text\": \"Verdict is FAIL\",\n      \"passed\": true,\n      \"evidence\": \"Verdict: FAIL stated\"\n    },\n    {\n      \"text\": \"Scores all 4 brand voice attributes\",\n      \"passed\": true,\n      \"evidence\": \"Clear=1, ormatting | Social media campaigns use structured bullet points with metrics; email campaigns use a prose paragraph with embedded numbers. Style should be consistent. |\n| 16 | Line 25 | Unsupported claim | \"slightly above industry average\" for email open rate — no source or benchmark citation provided. |\n| 17 | Lines 24–25 | Email section lacks detail | No breakdown by individual email campaign, A/B test results, or segmentation data. Only a single aggregate figure is given. |\n| 18 | Lines 42–44 | Unprofessional footer | Trailing horizontal rules (`------`) and a literal \"End of Report\" line are unnecessary and unpolished. |\n\n---\n\n## Summary Statistics\n\n| Severity | Count |\n|----------|-------|\n| High     | 6     |\n| Medium   | 7     |\n| Low      | 5     |\n| **Total**| **18**|\n\n---\n\n## Recommendations\n\n1. **Remove or complete all placeholders** (TODOs, `???`, `[insert here]`, TBD) before distribution.\n2. **Add a totals row** to the budget allocation table and flag all budget overruns with variance explanations.\n3. **Rewrite the conclusion** with specific data points, key wins, lessons learned, and Q4 action items.\n4. **Standardize formatting** across all channel sections (consistent use of bullet points/metrics structure).\n5. **Add document metadata** (author, date, version, stakeholders).\n6. **Remove the placeholder section** heading on line 40 and the unprofessional footer on lines 42–44.\n7. **Identify the missing channel** in the budget table (line 35) and the unnamed social platform (lines 20–22).\n8. **Add missing sections** (Q4 plan, competitor analysis, risks) or explicitly note they are out of scope."}, {"name": "grading.json", "content": "{\n  \"eval_id\": \"eval-2-doc-review\",\n  \"config\": \"without_skill\",\n  \"assertions\": [\n    {\n      \"text\": \"Verdict is FAIL\",\n      \"passed\": true,\n      \"evidence\": \"Verdict: REJECT (equivalent to FAIL)\"\n    },\n    {\n      \"text\": \"Identifies placeholder text (TODO, TBD, ???)\",\n      \"passed\": true,\n      \"evidence\": \"High severity #1-6: all placeholders listed with line numbers\"\n    },\n    {\n      \"text\": \"Identifies missing budget table channel name\",\n      \"passed\": true,\n      \"evidence\": \"High severity #4: blank channel name in budget table\"\n    },\n    {\n      \"text\": \"Identifies Events ROI ???\",\n      \"passed\": true,\n      \"evidence\": \"High severity #5: Events ROI listed as ???\"\n    },\n    {\n      \"text\": \"Identifies vague conclusion\",\n      \"passed\": true,\n      \"evidence\": \"Medium severity #10: no data references, no actionable recommendations\"\n    },\n    {\n      \"text\": \"Identifies End of Report artificial marker\",\n      \"passed\": true,\n      \"evidence\": \"Low severity #18: unprofessional footer with trailing horizontal rules\"\n    },\n    {\n      \"text\": \"Includes brand voice score\",\n      \"passed\": false,\n      \"evidence\": \"No brand voice scoring, purely document quality review\"\n    },\n    {\n      \"text\": \"Identifies budget overspend\",\n      \"passed\": true,\n      \"evidence\": \"Medium severity #7: Events 75% overrun, #8: Content 7% overrun\"\n    },\n    {\n      \"text\": \"Uses P0/P1/P2/P3 severity system\",\n      \"passed\": false,\n      \"evidence\": \"Uses HIGH/MEDIUM/LOW instead of P0-P3\"\n    },\n    {\n      \"text\": \"Follows QA report template\",\n      \"passed\": false,\n      \"evidence\": \"Different format: tabular issue list\"\n    }\n  ]\n}"}]}];

function showPanel(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.add('hidden'));
  event.target.classList.add('active');
  document.getElementById('panel-' + name).classList.remove('hidden');
}

function init() {
  renderBenchmark();
  renderOutputs();
}

function renderBenchmark() {
  let wsPass = 0, wsTotal = 0, bsPass = 0, bsTotal = 0;
  const rows = [];
  for (const r of RUNS) {
    const wGrades = getGrades(r.with_skill);
    const bGrades = getGrades(r.without_skill);
    const wRate = wGrades.length ? wGrades.filter(g => g.passed).length / wGrades.length : 0;
    const bRate = bGrades.length ? bGrades.filter(g => g.passed).length / bGrades.length : 0;
    wsPass += wGrades.filter(g => g.passed).length; wsTotal += wGrades.length;
    bsPass += bGrades.filter(g => g.passed).length; bsTotal += bGrades.length;
    rows.push({ name: r.name, wRate, bRate, wPassed: wGrades.filter(g=>g.passed).length, wTotal: wGrades.length, bPassed: bGrades.filter(g=>g.passed).length, bTotal: bGrades.length });
  }
  const wsAvg = wsTotal ? (wsPass/wsTotal) : 0;
  const bsAvg = bsTotal ? (bsPass/bsTotal) : 0;
  const delta = wsAvg - bsAvg;

  document.getElementById('bench-summary').innerHTML = `
    <div class="bench-card">
      <div class="label">With Skill</div>
      <div class="value" style="color:var(--green)">${(wsAvg*100).toFixed(0)}%</div>
      <div class="sub">${wsPass}/${wsTotal} assertions passed</div>
    </div>
    <div class="bench-card">
      <div class="label">Without Skill (Baseline)</div>
      <div class="value">${(bsAvg*100).toFixed(0)}%</div>
      <div class="sub">${bsPass}/${bsTotal} assertions passed</div>
    </div>
    <div class="bench-card">
      <div class="label">Delta</div>
      <div class="value ${delta >= 0 ? 'delta-positive' : 'delta-negative'}">${delta >= 0 ? '+' : ''}{(delta*100).toFixed(1)}%</div>
      <div class="sub">Skill impact on pass rate</div>
    </div>
  `;

  let detail = '<table class="assertion-table"><thead><tr><th>Eval</th><th>With Skill</th><th>Without Skill</th><th>Delta</th></tr></thead><tbody>';
  for (const r of rows) {
    const d = r.wRate - r.bRate;
    detail += `<tr>
      <td><strong>${esc(r.name)}</strong></td>
      <td>${r.wRate >= 0.8 ? '<span class="grade-pass">' : '<span>'}${(r.wRate*100).toFixed(0)}% (${r.wPassed}/${r.wTotal})</span></td>
      <td>${r.bRate >= 0.8 ? '<span class="grade-pass">' : r.bRate < 0.6 ? '<span class="grade-fail">' : '<span>'}${(r.bRate*100).toFixed(0)}% (${r.bPassed}/${r.bTotal})</span></td>
      <td class="${d >= 0 ? 'delta-positive' : 'delta-negative'}">${d >= 0 ? '+' : ''}{(d*100).toFixed(1)}%</td>
    </tr>`;
  }
  detail += '</tbody></table>';
  document.getElementById('bench-detail').innerHTML = detail;
}

function renderOutputs() {
  const container = document.getElementById('panel-outputs');
  let html = '';
  for (const r of RUNS) {
    html += `<div class="eval-section">
      <div class="eval-title">${esc(r.name)}</div>
      <div class="eval-prompt">${esc(r.prompt)}</div>
      <div class="eval-grid">
        ${renderCard(r, 'with_skill', true)}
        ${renderCard(r, 'without_skill', false)}
      </div>
    </div>`;
  }
  container.innerHTML = html;
}

function renderCard(run, config, isPrimary) {
  const outputs = run[config];
  const grades = getGrades(outputs);
  const passed = grades.filter(g => g.passed).length;
  const total = grades.length;
  const rate = total ? (passed/total*100).toFixed(0) : '—';

  let fileTabs = '';
  let fileContents = '';
  for (let i = 0; i < outputs.length; i++) {
    const f = outputs[i];
    const isActive = i === 0 ? ' active' : '';
    fileTabs += `<div class="file-tab${isActive}" onclick="showFile(this, '${esc(run.id)}-${config}-${i}')">${esc(f.name)}</div>`;
    fileContents += `<div id="${run.id}-${config}-${i}" class="file-content${isActive}"><pre>${esc(f.content)}</pre></div>`;
  }

  let gradesHtml = '';
  if (grades.length > 0) {
    gradesHtml = '<div style="padding:0.75rem 1rem;border-top:1px solid var(--border)"><table class="assertion-table"><thead><tr><th>Assertion</th><th></th></tr></thead><tbody>';
    for (const g of grades) {
      gradesHtml += `<tr><td>${esc(g.text)}</td><td>${g.passed ? '<span class="grade-pass">PASS</span>' : '<span class="grade-fail">FAIL</span>'}</td></tr>`;
    }
    gradesHtml += `</tbody></table></div>`;
  }

  return `<div class="eval-card ${isPrimary ? 'primary' : ''}">
    <div class="card-header ${isPrimary ? 'primary' : 'baseline'}">
      <span>${config.replace(/_/g, ' ')}</span>
      <span>${rate}% (${passed}/${total})</span>
    </div>
    <div class="file-tabs">${fileTabs}</div>
    <div class="card-body">${fileContents}</div>
    ${gradesHtml}
  </div>`;
}

function showFile(tab, id) {
  const parent = tab.closest('.eval-card');
  parent.querySelectorAll('.file-tab').forEach(t => t.classList.remove('active'));
  parent.querySelectorAll('.file-content').forEach(c => c.classList.remove('active'));
  tab.classList.add('active');
  document.getElementById(id).classList.add('active');
}

function getGrades(outputs) {
  for (const f of outputs) {
    if (f.name === 'grading.json') {
      try { return JSON.parse(f.content).assertions || []; } catch(e) {}
    }
  }
  return [];
}

init();
</script>
