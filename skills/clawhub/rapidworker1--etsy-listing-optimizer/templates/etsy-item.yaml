# Etsy Listing Optimizer - starting point
# Copy this file, replace every empty value with your own data, keep the field names.
listing:
  title: <current title>
  shop_section: <section>
  materials:
    - <material>
  what_it_is: <plain description>
  dimensions:
    - size: <size>
      cost: <USD cost to make>
      weight: <oz>
  personalization:
    - <option>
  what_is_included:
    - <item>
  processing_days: <number>
  shipping_profile: <US shipping profile name>
  forbidden_brands:
    - <brand>
  tags_current:
    - <tag>
  sales_to_date: <number>
