name: geoskill-glacier-retreat-monitoring
display_name: 冰川退缩监测
description: |
  用 NDSI 提取多期冰川范围并矢量化为边界多边形，分析冰川末端位置后退与面积变化曲线，输出边界 GeoJSON 序列、退缩速率与面积 JSON。Monitors glacier retreat from multi-temporal NDSI boundaries.
version: 0.1.0
author: Mavis
entrypoint: geoskill-glacier-retreat-monitoring.py
runtime: python>=3.9
tags:
  - analysis
  - extraction
  - gis
  - remote-sensing
  - time-series
  - vector
