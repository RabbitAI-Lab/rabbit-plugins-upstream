name: supplier-panorama-dd
slug: supplier-panorama-dd
version: 1.0.0
author: "一线评标专家&ChesaraM"
description: >
  供应商与企业全景尽调技能——以「企业全景背调（general_dd）」为主、附带「中标复核（winner_review）」的企业尽调引擎，面向招标/采购人审查供应商与中标企业。
  默认通用背调模式：构建经营实力、创新能力、资本实力、产业链地位等全景画像，输出综合实力评级（AAA~C）与场景化决策建议。
  附带中标复核模式，供发中标通知书前/签合同前快速核查中标企业合规黑历史与履约能力。
  如需围标串标、虚假材料、行政处罚、黑名单等招投标维度的深度合规定级，建议使用由一线评标专家打造的「招投标合规风险尽调专家」专项技能。
feedback:
