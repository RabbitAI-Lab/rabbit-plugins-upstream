<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root { --red:#b8232f; --red-dark:#8f1720; --line:#e7d5d5; --bg:#faf6f5; --ink:#333; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--ink);
         font-family:-apple-system,"PingFang SC","Microsoft YaHei",Arial,sans-serif; font-size:15px; }
  .wrap { max-width:720px; margin:0 auto; }
  .hd { background:linear-gradient(135deg,var(--red),var(--red-dark)); color:#fff;
        padding:16px 18px; border-radius:12px 12px 0 0; }
  .hd h1 { margin:0; font-size:19px; }
  .hd .sub { margin-top:6px; font-size:12px; opacity:.9; }
  .card { background:#fff; border:1px solid var(--line); border-top:none;
          border-radius:0 0 12px 12px; padding:8px 12px 16px; }
  table { width:100%; border-collapse:collapse; margin:6px 0; }
  table.kv th { text-align:left; width:36%; color:var(--red-dark); font-weight:600;
                vertical-align:top; padding:8px; border-bottom:1px solid var(--line); }
  table.kv td { padding:8px; border-bottom:1px solid var(--line); vertical-align:top; word-break:break-word; }
  table.grid th, table.grid td { border:1px solid var(--line); padding:6px 8px; font-size:14px; vertical-align:top; }
  table.grid thead th { background:#f6eaea; color:var(--red-dark); }
  table.grid, table.kv { background:#fff; }
  td table { margin:0; }
  .empty { color:#bbb; }
  .li { padding:4px 0; border-bottom:1px dashed var(--line); }
  .note { margin:14px 4px 0; font-size:12px; color:#999; line-height:1.6; }
  .sec { margin:10px 0; padding:10px 12px; background:#fff; border:1px solid var(--line); border-radius:8px; }
  .sec-title { margin:0 0 8px; font-size:14px; color:var(--red-dark); border-left:3px solid var(--red); padding-left:8px; font-weight:600; }
  .sec-body { font-size:14px; line-height:1.65; }
  .sec-body table { margin:0; }
  .sec-body table.kv th { width:30%; }
  section + section { margin-top:8px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="hd">
      <h1>{{TITLE}}</h1>
      <div class="sub">本地兜底渲染 · {{GENERATED}}</div>
    </div>
    <div class="card">
      {{BODY}}
      <div class="note">
        本页由 skill 包内 <code>local_render.py</code> 直接读取接口返回的 <code>data</code> 原始字段生成，
        仅用于<strong>离线/自定义样式</strong>备用场景；未复用服务端的中文标签字典与分组精修，
        故可能出现英文字段名或未分组。<strong>权威可读版本以云端 <code>render.html</code> 为准。</strong>
      </div>
    </div>
  </div>
</body>
</html>
