openapi: 3.0.3
info:
  title: My App API
  version: 1.0.0
  description: 契约优先的起点模板。补全 paths 与 components.schemas 后，前端可用 gen_types_from_openapi.py 生成类型。
servers:
  - url: http://localhost:3000
    description: 本地
paths:
  /users:
    get:
      summary: 用户列表（分页）
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
    post:
      summary: 创建用户
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
  /users/{id}:
    get:
      summary: 获取单个用户
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { description: Not Found }
components:
  schemas:
    User:
      type: object
      required: [id, email]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        createdAt: { type: string, format: date-time }
    UserCreate:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
  responses:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            field: { type: string }
