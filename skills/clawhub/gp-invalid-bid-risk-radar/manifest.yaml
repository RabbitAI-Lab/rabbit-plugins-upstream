description: 政采无效投标风险雷达——专攻政府采购项目（公开招标/邀请招标/竞争性谈判/竞争性磋商/询价/单一来源）中的无效投标条款、资格性/符合性审查硬性要求、政策性合规陷阱及隐性风险点提取。触发词："政采风险检查""政府采购废标""无效投标""资格性审查""符合性审查""87号令检查""政采合规""中小企业声明函""节能清单""信用核查""政采风险雷达""这个标能不能投""帮我看看有没有坑""投标前检查""审查资格性条款""无效投标筛查"。当用户明确要求对政府采购招标文件做专项风险筛查时触发。输出结构化检查清单，便于审核人员逐项核对。不适用：工程招标（适用《招标投标法》→引导至"废标风险雷达"招投标版）、政采合同履约纠纷、质疑函/投诉书撰写、评分策略与报价建议、招标文件全文解读（非风险导向）。
triggers:
- 政采风险检查 / 政府采购废标 / 无效投标
- 资格性审查 / 符合性审查 / 87号令检查
- 政采合规 / 中小企业声明函 / 节能清单 / 信用核查
- 政采风险雷达 / 这个标能不能投 / 帮我看看有没有坑
- 投标前检查 / 审查资格性条款 / 无效投标筛查
