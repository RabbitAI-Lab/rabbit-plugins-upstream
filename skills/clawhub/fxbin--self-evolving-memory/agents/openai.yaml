interface:
  display_name: "Self-Evolving Memory"
  short_description: "Safe local-first memory workflows for AI agents"
  default_prompt: "Use $self-evolving-memory for an AI agent's layered-memory lifecycle: initialize or repair it, safely record a user fact, consolidate or roll back memory, evaluate promotion, retrieve memory, or migrate legacy SECRET.md with trusted local helpers. Do not trigger for general passwords, API tokens, or UI menus without agent-memory context. A one-shot 'remember this' request uses lightweight_record and never starts consolidation."

  triggers:
    - "use self-evolving-memory"
    - "初始化记忆系统"
    - "记忆巩固"
    - "回滚记忆"
    - "评估晋升"
    - "分层存储"
    - "记忆检索校验"
    - "事件因果图谱"
    - "主题实体索引"
    - "证据账本"
    - "回忆规划器"
    - "主动探索与认知拉伸"
    - "自我认知演化"
    - "Agent 反思自己"
    - "技能建议冷却"
    - "Agent 反复提同一个建议"
    - "DPM 动态分层"
    - "微巩固"
    - "记住这条"
    - "记一下"
    - "lightweight record"
    - "Trace Forest"
    - "角色化记忆切片"
    - "巩固执行手册"
    - "跑四阶段巩固"
