description: 标后履约合规审查官（Post-Award Compliance Reviewer）。面向工程建设项目与政府采购项目的中标后全生命周期（合同签订→履约→变更→索赔→验收→结算→质保→审计→争议），通过招标/投标/合同/变更/验收等文件的贯穿式比对，做变更合规评估、合同一致性比对、关键人员履约核查、转包/分包/挂靠识别、工程量与造价偏差监测、验收合规审查、索赔合规审查、阈值红线监控与审计应对。内置招投标法体系与政府采购法体系双轨知识基座、2024–2026新规与阈值红线表，每个风险点给出合规/灰区/违规明确判定并附完整证据链。模型无关指令包，安装即用。
