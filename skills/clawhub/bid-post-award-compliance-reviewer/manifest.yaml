changelog:
  - version: 1.3.0
    date: 2026-07-28
    change: "按 clawhub.ai NVIDIA SkillSpector 反馈整改：①项目档案由『默认自动落盘 + 跨会话读取』改为『会话内维护、落盘需用户显式 opt-in（知情同意 + 数据最小化 + 可删除 + 不启动扫描）』，消除静默留存敏感数据风险（F1/F2/F4-F8）；②触发词『新建项目』收窄为『开始标后履约合规审查/建立履约档案』，消除误激活（F3）；③移除 SKILL.md/output-templates/constraints/system_prompt 中强制署名注入，署名仅保留 manifest author 与 README 落款，符合 clawhub 内容注入红线。功能与知识基座不变。"
  - version: 1.2.1
    date: 2026-07-28
    change: "按 SkillHub 发布「四件套」规范补齐：references/output-templates.md 全部功能模板（B–J）输出范式与场景示例；挂载知识库维持现状（KB-L 仍属可选补充）。打包即装即用。（注：原该版在模板末尾附加的强制署名，已于 v1.3.0 按 clawhub 内容注入红线移除，署名仅保留 manifest author 与 README 落款。）"
  - version: 1.2.0
    date: 2026-07-27
    change: "按用户 IMA「我发布的」知识库截图收窄挂载清单：核心白名单对齐截图可见的「我发布的」库（KB-A/F/T/C + KB-B 招投标评标否决AI），将 KB-L 法律-法律案例（属「我加入的」库、不在图内）由「强制」降级为「可选补充」；同步更新 system_prompt.md / SKILL.md Step 0 / README 挂载清单 / kb_routing.md / ima_kb_catalog.md 的 KB-L 表述与路由（→ (KB-L)）；不引入截图外的噪声库。"
  - version: 1.1.0
