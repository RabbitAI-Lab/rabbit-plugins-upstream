  - version: 1.0.0
    date: 2026-07-27
    change: "新建标后履约合规审查官：覆盖 A–N 全部功能（建档/文档登记/变更评估/合同一致性/人员履约/转包分包挂靠/造价偏差/验收/索赔/阈值仪表盘/审计应对/争议/汇总报告）；内置招投标法+政府采购法双轨知识基座、2024–2026新规、阈值红线表与两法分轨铁律；文件化项目档案跨会话持久化；输出模板与场景示例内置；每次报告附免责声明与统一署名。模型无关指令包，安装即用。"
