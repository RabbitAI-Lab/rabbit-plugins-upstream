display_name: 采访原话摘引清单
description: 输入已获授权的中文采访逐字稿、说话人、时间锚点、主题与公开边界，交付至多十五条忠实可追溯的短引语及上下文、位置、禁用或待确认项，服务采访后选句和编辑核查；缺逐字稿、身份或授权范围时先请求补料，绝不把改写或摘要伪作原话。
