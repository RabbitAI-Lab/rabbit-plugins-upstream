# LinkedIn Post Writer - starting point
# Copy this file, replace every empty value with your own data, keep the field names.
post:
  audience: <who reads this>
  key_point: <the one point>
  support_points:
    - <point>
  action: <comment | share | visit url | apply>
  url: <url or none>
  customer_mentions:
    - <company and approval status>
  disclosure: <line or none>
  hook_options:
    - <first line>
  body:
    - <line>
  cta: <closing line>
  tone: <plain | technical | founder story>
  visual: <image or none>
  scheduled_for: <YYYY-MM-DD>
  approver: <name or role>
