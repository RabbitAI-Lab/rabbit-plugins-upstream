[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-export-more"
version = "0.1.0"
description = "Export Codex CLI/Desktop sessions to Markdown, HTML, or Obsidian notes with incremental, selective, and redacted output."
readme = "README.md"
requires-python = ">=3.9"
keywords = ["codex", "export", "session", "markdown", "obsidian", "incremental", "typora"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Documentation",
]

[project.urls]
Homepage = "https://github.com/sb679/codex-export-more"
Repository = "https://github.com/sb679/codex-export-more"

[project.scripts]
codex-export-more = "codex_export_more:main"

[tool.setuptools]
packages = ["codex_export_more", "scripts"]
