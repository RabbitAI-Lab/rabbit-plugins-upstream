metadata:
  openclaw:
    homepage: https://github.com/chesaram/my-skill-hub
    triggers:
      - pattern: 关联关系识别
        description: 用户要识别多个投标主体之间是否存在工商层面的法定禁止关联关系
      - pattern: 投标企业关联
        description: 用户问几家公司投标是否构成工商层面的控股/负责人同一/管理关系
      - pattern: 关联投标核查
        description: 用户要求核对投标主体间的控股/管理/负责人同一关系
      - pattern: 单位负责人同一人
        description: 用户问不同单位负责人为同一人能否投同一标段
      - pattern: 投标股权穿透核查
        description: 用户要求穿透投标主体的股权结构，查最终受益人或实际控制人是否同一（招投标关联识别场景，非一般投资尽调）
      - pattern: 控股关系投标无效
        description: 用户问哪些工商控股/负责人同一关系会导致投标无效
