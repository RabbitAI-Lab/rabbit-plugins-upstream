name: geoskill-desertification-monitoring
display_name: 荒漠化监测
description: |
  融合 NDVI 趋势（Sen 斜率/线性回归）、反照率与植被稀缺度，综合评分分级荒漠化（稳定/轻/中/重度），输出等级与趋势栅格、面积统计。Fuses NDVI trend (Sen/linear slope), albedo and vegetation scarcity to grade desertification.
version: 0.1.0
author: Mavis
entrypoint: geoskill-desertification-monitoring.py
runtime: python>=3.9
tags:
