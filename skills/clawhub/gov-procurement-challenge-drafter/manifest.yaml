name: gov-procurement-challenge-drafter
version: 1.0.1
description: 政采质疑函与投诉书智能起草助手。基于现行政府采购法律法规，生成格式规范、论证严密、引用精准的质疑函或投诉书，并提供法定要素检查、时效速查与不予受理风险预警。
