<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<!-- Mermaid 负责自动布局，免去手写 SVG 坐标（避免连线交叉等事故）。
     库随图一起打包到 .ppshu/mermaid.min.js，完全离线可用，不依赖任何 CDN。 -->
<script src="./mermaid.min.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0f1115; color: #e6e6e6;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 28px 18px 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #8b98a9; font-size: 13px; margin: 0 0 18px; }
  .mermaid { background: #161b24; border: 1px solid #2a3342; border-radius: 12px; padding: 18px; }
  .note { margin-top: 14px; font-size: 12px; color: #6b7686; }
</style>
</head>
<body>
<div class="wrap">
  <h1>{{TITLE}}</h1>
  <p class="sub">{{SUBTITLE}}</p>
  <div class="mermaid">
{{MERMAID_CODE}}
  </div>
  <p class="note">本图由 Mermaid 自动布局渲染。Mermaid 库已随图打包到同目录 <code>mermaid.min.js</code>，完全离线可用，无需联网、不依赖任何 CDN。</p>
</div>
<script>
  mermaid.initialize({ startOnLoad: true, theme: 'dark', securityLevel: 'loose', flowchart: { curve: 'basis' } });
</script>
</body>
</html>
