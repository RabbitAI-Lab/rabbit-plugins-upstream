<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文章标题</title>
</head>
<body style="margin:0; padding:0; background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif; color:#333;">

<div style="max-width:677px; margin:0 auto; padding:0;">

<!-- 标题区 -->
<div style="padding:32px 20px 16px;">
  <h1 style="font-size:20px; font-weight:bold; color:#000; line-height:1.5; margin:0;">
    文章标题
  </h1>
</div>

<!-- 作者信息 -->
<div style="padding:0 20px 24px;">
  <span style="font-size:14px; color:#576b95;">作者名</span>&nbsp;&nbsp;<span style="font-size:14px; color:#576b95;">公众号名称</span><br>
  <span style="font-size:12px; color:#888;">日期 &nbsp;&nbsp; 地点</span>
</div>

<!-- ==================== 正文开始 ==================== -->
<div style="padding:0 20px;">

<p style="font-size:15px; line-height:1.85; margin:0 0 18px; color:#333; text-align:justify;">
  在这里开始写正文内容...
</p>

<!-- 章节标题示例 -->
<h2 style="font-size:17px; font-weight:bold; color:#000; line-height:1.6; margin:28px 0 16px; padding-left:10px; border-left:4px solid #07c160;">
  第一章标题
</h2>

<p style="font-size:15px; line-height:1.85; margin:0 0 14px; color:#555; text-align:justify;">
  正文段落，使用 #555 作为说明性文字颜色。
</p>

<!-- 引用块示例（绿底） -->
<blockquote style="margin:16px 0; padding:12px 14px; background:#f0fdf4; border-left:3px solid #07c160; color:#555; font-size:15px; line-height:1.8;">
  引用或金句内容
</blockquote>

<!-- 信息卡片示例（蓝底） -->
<section style="margin:18px 0; padding:14px 16px; background:#f0f7ff; border-radius:4px;">
  <p style="font-size:15px; line-height:1.85; margin:0; color:#444; text-align:justify;">
    补充信息或背景知识卡片内容。
    关键词用 <strong style="color:#07c160;">绿色高亮</strong>，
    数字用 <span style="color:#e74c3c;font-weight:bold;">红色强调</span>。
  </p>
</section>

<!-- 图片/视频占位符示例 -->
<section style="margin:18px 0; padding:12px 0; border-top:1px solid #f0f0f0; border-bottom:1px solid #f0f0f0; text-align:center;">
  <p style="font-size:12px; color:#aaa; margin:0;">📍 图片/视频描述 — 需手动替换</p>
</section>

<!-- 关注引导区域 -->
<section style="margin:20px 0 8px; padding:18px 16px; background:#fffbf0; text-align:center; border-radius:4px;">
  <p style="font-size:14px; color:#666; line-height:1.8; margin:0 0 10px;">
    如果这篇文章对你有价值
  </p>
  <p style="font-size:13px; color:#999; line-height:1.7; margin:0;">
    欢迎关注「公众号名称」<br>
    我会持续记录 <strong style="color:#07c160;">"Slogan"</strong> 的时刻 ✦
  </p>
</section>

</div><!-- /正文容器 -->

<!-- 底部信息 -->
<div style="padding:20px 20px 30px; text-align:center;">
  <div style="height:1px; background:#e8e8e8; margin:0 auto 16px; width:50%;"></div>
  <p style="font-size:12px; color:#bbb; margin:0;">— END —</p>
</div>

</div><!-- /max-width container -->

</body>
</html>
