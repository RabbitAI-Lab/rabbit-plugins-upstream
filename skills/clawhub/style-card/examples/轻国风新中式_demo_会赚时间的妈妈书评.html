<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Noto+Sans+SC:wght@300;400&display=swap" rel="stylesheet">
<style>
/* === html-base.css 底座 === */
:root { --card-width: 1170px; --card-height: 1560px; --bg-page: #F5EFE0; --ink: #2B2B28; --accent: #B54A35; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:var(--card-width); height:var(--card-height); overflow:hidden; background:var(--bg-page); color:var(--ink); font-family:'Noto Serif SC',serif; -webkit-font-smoothing:antialiased; }
.card { position:relative; width:100%; height:100%; overflow:hidden; padding:90px 100px; display:flex; flex-direction:column; }
::selection { background:transparent; }

/* === 淡墨晕染（径向渐变圆斑） === */
.ink-blot { position:absolute; border-radius:50%; filter:blur(60px); pointer-events:none; }
.blot-1 { width:520px; height:520px; top:-120px; right:-80px; background:radial-gradient(circle, rgba(75,74,68,.12), transparent 70%); }
.blot-2 { width:420px; height:420px; bottom:80px; left:-100px; background:radial-gradient(circle, rgba(75,74,68,.10), transparent 70%); }

/* === 区块1：栏目小字（右上） === */
.masthead { display:flex; justify-content:flex-end; font-family:'Noto Sans SC',sans-serif;
            font-weight:300; font-size:15px; letter-spacing:.35em; color:#6B6B62; }

/* === 区块2：主标题 === */
.hero { margin-top:110px; }
.hero h1 { font-weight:900; font-size:88px; line-height:1.35; letter-spacing:.06em; }
.hero .sub { margin-top:34px; font-size:22px; color:#4A4A44; font-weight:600; letter-spacing:.08em; }

/* === 区块3：细线分隔 === */
.rule { width:96px; height:2px; background:var(--ink); margin-top:56px; }

/* === 区块4：正文 === */
.body { margin-top:48px; font-size:20px; line-height:2.25; color:#4A4A44; text-align:justify; }
.body p + p { margin-top:26px; }

/* === 区块5：关键词印章式点缀 === */
.keywords { margin-top:56px; display:flex; gap:22px; }
.keyword { font-family:'Noto Sans SC',sans-serif; font-weight:300; font-size:15px;
           letter-spacing:.25em; color:#6B6B62; border:1px solid #C9C2B0; padding:8px 18px; border-radius:2px; }

/* === 区块6：朱砂印章落款 === */
.footer { margin-top:auto; display:flex; justify-content:space-between; align-items:flex-end; }
.footer .byline { font-size:14px; color:#8A857C; letter-spacing:.15em; }
.seal { width:92px; height:92px; background:var(--accent); color:#F5EFE0;
        display:flex; align-items:center; justify-content:center;
        font-size:34px; font-weight:900; letter-spacing:.1em; transform:rotate(-4deg); }
</style>
</head>
<body>
<div class="card">
  <div class="ink-blot blot-1"></div>
  <div class="ink-blot blot-2"></div>

  <!-- === 栏目小字 === -->
  <div class="masthead">巴 扎 嘿 · 读 书</div>

  <!-- === 主标题 === -->
  <div class="hero">
    <h1>时间不是省出来的，<br>是赚出来的</h1>
    <div class="sub">—— 读《会赚时间的妈妈》有感</div>
  </div>

  <div class="rule"></div>

  <!-- === 正文 === -->
  <div class="body">
    <p>这本书不再把「忙」当作勋章，而是把时间拆成可以经营的小单元。碎片十五分钟，不是喘息的边角料，而是主线的滋养期——我开始每天固定留十五分钟给学习的劲头，不刷课，只保持在场。</p>
    <p>读到「用系统替代意志力」那章，我在旁边贴了便签：我做成的每一个 skill，都不是计划出来的，是顺手做出来之后，再补的计划。种一棵树最好的时间是十年前，其次是现在——书里没写这句话，但它整本都在讲。</p>
  </div>

  <!-- === 关键词 === -->
  <div class="keywords">
    <span class="keyword">先干起来</span>
    <span class="keyword">保持势头</span>
    <span class="keyword">主线聚焦</span>
  </div>

  <!-- === 落款 + 印章 === -->
  <div class="footer">
    <span class="byline">文 / Bonnie · 二〇二六 · 滨海</span>
    <div class="seal">巴</div>
  </div>

</div>
</body>
</html>
