# Travel Search Configuration
# Do not put real API keys in this file. Set them in your local shell or project
# .env instead; this file is a publishable feature toggle template.

# Environment variable names used by scripts
AMAP_API_KEY_ENV=AMAP_API_KEY
BAIDU_MAPS_API_KEY_ENV=BAIDU_MAPS_API_KEY
GOOGLE_PLACES_API_KEY_ENV=GOOGLE_PLACES_API_KEY

# Search preferences
DEFAULT_SEARCH_ENGINE=duckduckgo  # Options: duckduckgo, bing
MAX_RESULTS_PER_SOURCE=5
CACHE_EXPIRY_DAYS=30

# Enable/disable search features
ENABLE_DUCKDUCKGO=true
ENABLE_BING_BACKUP=true  
ENABLE_LOCATION_APIS=false  # Requires API keys above
ENABLE_MULTI_SOURCE_VERIFICATION=false  # More comprehensive but slower

# Local cache settings
CACHE_DIR=~/.hermes/skills/personal-travel-butler/cache

# Logging level (DEBUG, INFO, WARNING, ERROR)
LOG_LEVEL=INFO
