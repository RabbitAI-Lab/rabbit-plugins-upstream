slug: secrets-manager
name: secrets-manager
owner: jlacroix82
description: Encrypted local secret store for OpenClaw agents. AES-256-GCM authenticated encryption with per-secret random IVs, master key in restricted-permission .master-key file. Store, retrieve, rotate, and audit secrets. Safe command injection (writes to temp file by default; --inject-stdout requires --confirm-expose). Master key is recoverable from .master-key file; losing it makes stored secrets unrecoverable. Permissions: filesystem.read-write, environment.read, crypto.aes-256-gcm.
version: 1.1.19
type: skill
author: OpenClaw
license: MIT
keywords:
  - secrets
  - encryption
  - aes-256-gcm
  - rotation
  - audit
  - key-management
capabilities:
  - filesystem
  - environment
  - crypto
entry: SKILL.md
dependencies: []
permissions:
  - name: filesystem.read-write
    description: Read/write encrypted data files in the private data directory (restricted permissions)
  - name: environment.read
    description: Read SECRETS_DIR and SECRETS_MASTER_KEY environment variables
  - name: crypto.aes-256-gcm
    description: Encrypt/decrypt secrets with AES-256-GCM authenticated encryption
  - name: elevated
    description: Set restricted permissions on secret files; required only when $SECRETS_DIR is outside $HOME. Least-privilege: elevation used solely for file permission enforcement, not for reading or writing secrets.
data_retention:
  secrets: 'AES-256-GCM encrypted, restricted permissions, persists until deleted'
  master_key: '256-bit key in .master-key file, restricted permissions'
  temp_files: 'restricted permissions, /tmp/secrets-inject-*.sh, auto-cleaned on rotate/delete/cleanup; tracked in .tmp-injections.json'
security_notes:
  - 'Master key auto-generated on first store; backup is your responsibility'
  - 'Losing .master-key = unrecoverable secrets'
  - 'Plaintext only printed via explicit --get --raw or --inject-stdout --confirm-expose'
  - 'Temp injection files auto-cleaned on rotate/delete/cleanup; tracked in .tmp-injections.json'
