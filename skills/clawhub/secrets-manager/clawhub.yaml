slug: secrets-manager
name: secrets-manager
owner: jlacroix82
description: Encrypted local secret store for OpenClaw agents. AES-256-GCM authenticated encryption with per-secret random IVs, master key in chmod 0600 .master-key file. Store, retrieve, rotate, and audit secrets. Safe command injection (writes to temp file by default; --inject-stdout requires --confirm-expose). Master key is recoverable from .master-key file; losing it makes stored secrets unrecoverable.
version: 1.1.9
type: skill
author: OpenClaw
license: MIT
keywords:
  - secrets
  - encryption
  - aes-256-gcm
  - rotation
  - audit
  - key-management
capabilities:
  - filesystem
  - environment
  - crypto
entry: SKILL.md
dependencies: []
permissions:
  - name: filesystem.read-write
    description: Read/write data files in memory/secrets/ (secrets.json chmod 0600, .master-key chmod 0600)
  - name: environment.read
    description: Read SECRETS_DIR and SECRETS_MASTER_KEY environment variables
  - name: crypto.aes-256-gcm
    description: Encrypt/decrypt secrets with AES-256-GCM authenticated encryption
data_retention:
  secrets: 'AES-256-GCM encrypted, chmod 0600, persists until deleted'
  master_key: '256-bit key in .master-key file, chmod 0600'
  temp_files: 'chmod 0600, /tmp/secrets-inject-*.sh, not auto-cleaned'
security_notes:
  - 'Master key auto-generated on first store; backup is your responsibility'
  - 'Losing .master-key = unrecoverable secrets'
  - 'Plaintext only printed via explicit --get --raw or --inject-stdout --confirm-expose'
