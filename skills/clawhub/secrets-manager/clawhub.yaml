slug: secrets-manager
name: secrets-manager
owner: jlacroix82
description: "Encrypted local secret store for OpenClaw agents. A PURE STORE: AES-256-GCM authenticated encryption with per-secret random IVs, master key in chmod 0600 .master-key file. Modes: store, get (masked; --raw prints plaintext), list (names+metadata only), delete (irreversible), rotate / rotate --all (archive old as retired), audit (--expired/--stale), status. NEVER writes plaintext secrets to disk or generates executable command scripts — command injection lives in the separate secrets-inject skill. SECRETS_DIR and SECRETS_MASTER_KEY env overrides supported. Losing .master-key makes secrets unrecoverable."
version: 1.1.15
type: skill
author: OpenClaw
license: MIT
keywords:
  - secrets
  - encryption
  - aes-256-gcm
  - rotation
  - audit
  - key-management
capabilities:
  - filesystem
  - environment
  - crypto
entry: SKILL.md
dependencies: []
permissions:
  - name: filesystem.read-write
    description: Read/write data files in memory/secrets/ (secrets.json chmod 0600, .master-key chmod 0600)
  - name: environment.read
    description: Read SECRETS_DIR and SECRETS_MASTER_KEY environment variables
  - name: crypto.aes-256-gcm
    description: Encrypt/decrypt secrets with AES-256-GCM authenticated encryption
data_retention:
  secrets: 'AES-256-GCM encrypted, chmod 0600, persists until deleted'
  master_key: '256-bit key in .master-key file, chmod 0600'
security_notes:
  - 'Master key auto-generated on first store; backup is your responsibility'
  - 'Losing .master-key = unrecoverable secrets'
  - 'Plaintext only printed via explicit --get --raw (to stdout); no plaintext written to disk'
  - 'SECRETS_MASTER_KEY env override: NEVER set it in shared, containerized, CI, or logged environments — anyone who can read process env or logs can recover the key. Prefer the file-based .master-key (chmod 0600) on a single-user host.'
  - 'Command injection / secret substitution is NOT provided here; use the separate secrets-inject skill (high-privilege).'
