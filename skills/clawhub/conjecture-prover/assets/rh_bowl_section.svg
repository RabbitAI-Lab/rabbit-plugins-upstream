<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="100%" role="img">
  <title>碗截面</title>
  <desc>|ξ|²作为σ的函数,最小值在σ=0.5处即为零点</desc>

  <line x1="60" y1="350" x2="620" y2="350" stroke="#D3D1C7" stroke-width="0.5"/>
  <text x="620" y="365" text-anchor="end" class="ts" fill="#D3D1C7">σ</text>
  <text x="60" y="365" class="ts" fill="#D3D1C7">0</text>
  <text x="340" y="365" text-anchor="middle" class="th" fill="#CECBF6">1/2</text>
  <text x="620" y="365" class="ts" fill="#D3D1C7">1</text>

  <path d="M60,80 Q340,360 620,80" fill="none" stroke="#CECBF6" stroke-width="1.5"/>

  <circle cx="340" cy="350" r="6" fill="#D85A30"/>
  <text x="355" y="305" class="th" fill="#D85A30">零点</text>
  <line x1="340" y1="356" x2="355" y2="300" stroke="#D85A30" stroke-width="0.5" stroke-dasharray="3,2"/>

  <text x="180" y="65" class="th" fill="#CECBF6">|ξ(σ+iγ)|²</text>
  <text x="180" y="90" class="ts" fill="#9FE1CB">高</text>
  <text x="180" y="130" class="ts" fill="#9FE1CB">↑</text>
  <text x="180" y="155" class="ts" fill="#AFA9EC">碗壁下降</text>
  <text x="180" y="175" class="ts" fill="#D3D1C7">导数 &lt; 0</text>

  <text x="490" y="130" class="ts" fill="#9FE1CB">高 ↑</text>
  <text x="490" y="155" class="ts" fill="#AFA9EC">碗壁上升</text>
  <text x="490" y="175" class="ts" fill="#D3D1C7">导数 &gt; 0</text>

  <text x="340" y="250" class="ts" fill="#D3D1C7">最低点 = σ=0.5</text>
  <text x="340" y="270" class="ts" fill="#9FE1CB">若最低点恰好在底部 → 零点在此</text>

  <rect x="160" y="20" width="360" height="24" rx="6" fill="#26215C" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="37" text-anchor="middle" class="th" fill="#CECBF6">每一刀切下去都是这样一只碗,碗底全在正中间</text>
</svg>