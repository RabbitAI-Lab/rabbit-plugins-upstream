setting_cards:
  Community: {setting: Autumn, effect: "-15% Expected Groups; group size +1 every 3 days (10 in overtime); third-day card choices favor Food Cards"}
  Flower Pots: {setting: Romantic, effect: "Shops offer flower pots regularly"}
  Turbo: {setting: Turbo, effect: "Two extra shop blueprints, -50% blueprint cost, starts with 25% upgraded-blueprint chance; rush cards active; choose a card daily"}
  Coffee Shop: {setting: Coffee Shop, effect: "Less patience, instant ordering, less mess"}
  Banquet Dining: {setting: Banquet Hall, effect: "Customers order without waiting"}
  Enchantment: {setting: Witch Hut, effect: "Enchant appliances instead of upgrading"}
  Christmas Treats: {setting: Elf Banquet, effect: "Buffet-focused setting; customers order without waiting"}

heat_cards:
  - {level: 1, name: Shaky Foundations, effect: "Starting appliances are worse", xp_multiplier: 1.1}
  - {level: 2, name: Second Bite, effect: "Food Card after Day 2; +15% customers", xp_multiplier: 1.1}
  - {level: 3, name: Elephant Queues, effect: "Queue patience resets only between days; queue patience total and increases halved", xp_multiplier: 1.1}
  - {level: 4, name: Health Concerns, effect: "Customers eat very slowly when large messes are in room", xp_multiplier: 1.1}
  - {level: 5, name: Customer Crowds, effect: "Maximum group size +1; +15% customers", xp_multiplier: 1.1}
  - {level: 6, name: Flaming Knives, effect: "Chop progress lost when stopping; overchopping destroys items; food burns 300% faster", xp_multiplier: 1.1}
  - {level: 7, name: Rented Restaurants, effect: "Pay 1 coin per 10 floor tiles daily; customers pay 25% less", xp_multiplier: 1.1}
  - {level: 8, name: Soft Touch, effect: "All processes 25% slower", xp_multiplier: 1.1}
  - {level: 9, name: Popularity Crisis, effect: "Customers +25%, then +5% per day", xp_multiplier: 1.1}
  - {level: 10, name: Ends and Beginnings, effect: "Choose starter or dessert after Day 1; +30% customers", xp_multiplier: 1.1}
  - {level: 11, name: Overheating, effect: "Customer messes flammable; fire spreads faster and through doors/hatches; +15% customers", xp_multiplier: 1.1}
  - {level: 12, name: Hot Desking, effect: "Using desks can set cabinets on fire; +15% customers", xp_multiplier: 1.1}
  - {level: 13, name: Friction Burns, effect: "Overcooking and overchopping start fires; +15% customers", xp_multiplier: 1.1}
  - {level: 14, name: Hotheads, effect: "Low-patience customers may set table on fire; +15% customers", xp_multiplier: 1.1}
  - {level: 15, name: Overheat 5, effect: "Placeholder/unavailable in vanilla per wiki snapshot", xp_multiplier: 1.1}
  - {level: 16, name: Overheat 6+, effect: "No vanilla card/effect listed; wiki notes level display may be incorrect", xp_multiplier: null}

chill_cards:
  - {level: 1, name: Easy Street, effect: "+100% extra shop blueprints"}
  - {level: 2, name: Friendly Faces, effect: "Patience doubled; customers -30%"}
  - {level: 3, name: Purrvana, effect: "Customers are cats; restaurant cannot be shut down by customer failure"}
