  - {id: bootstrapping, name: Bootstrapping, effect: "Two random free starting appliances"}
  - {id: grabber, name: Grabber, effect: "Start with a Grabber"}
  - {id: wash_basin, name: Wash Basin, effect: "Start with a Wash Basin"}
  - {id: coffee_tables, name: Coffee Tables, effect: "Coffee Tables added to Staple Pool"}
