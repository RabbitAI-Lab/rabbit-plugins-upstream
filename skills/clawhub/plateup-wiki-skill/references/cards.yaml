meta:
  source: https://wiki.plateupgame.com/Cards
  retrieved: 2026-11-05
  game_version: 1.5.x
  key: "type + name + prerequisite where duplicate names exist"
  note: "Food recipe cards and their preparation workflows are in recipes.yaml."

group_cards:
  Individual Dining: {blocked_by: Medium Groups, group_size: "maximum -1", total_customers: unchanged}
  Medium Groups: {blocked_by: Individual Dining, group_size: "minimum +1; maximum +2", total_customers: unchanged}
  Large Groups: {prerequisite: Medium Groups, group_size: "minimum +2; maximum +2", total_customers: unchanged}
  Flexible Dining: {prerequisite: Medium Groups, group_size: "minimum -1; maximum +1", total_customers: unchanged}

customer_cards:
  - {id: morning_rush, name: Morning Rush, effect: "+15% Expected Groups; wave at morning rush", blocked_by: Turbo}
  - {id: lunch_rush, name: Lunch Rush, effect: "+15% Expected Groups; wave at lunch rush", blocked_by: Turbo}
  - {id: dinner_rush, name: Dinner Rush, effect: "+15% Expected Groups; wave at dinner rush", blocked_by: Turbo}
  - {id: herd_mentality, name: Herd Mentality, effect: "All customers arrive in three rush waves; no added customers"}
  - {id: advertising_1, name: Advertising, effect: "+25% customers", stacks: true}
  - {id: advertising_2, name: Advertising, prerequisite: Advertising, effect: "+25% customers", stacks: true}
  - {id: all_you_can_eat, name: All You Can Eat, effect: "25% chance per group to repeat a course once; -30% Expected Groups"}
  - {id: double_helpings, name: Double Helpings, prerequisite: All You Can Eat, effect: "more repeat orders and starter/side/dessert orders; +3 coins per dish"}
  - {id: blindfolded_chefs, name: Blindfolded Chefs, effect: "Hides process progress bars; desks excluded"}
  - {id: closing_time, name: "Closing Time?", effect: "Additional customers may arrive after closing if customers remain"}
  - {id: discounts, name: Discounts, effect: "Earn 25% less money"}
  - {id: empathy, name: Empathy, effect: "Hides patience gauges; queue still indicates low patience"}
  - {id: health_and_safety, name: Health and Safety, effect: "Customers are slowed by messes"}
  - {id: high_expectations, name: High Expectations, effect: "-20% patience duration; excludes Hosting Stand Waiting for Table patience"}
  - {id: high_quality, name: High Quality, effect: "All processes 20% slower; excludes chopping/kneading and desks per wiki card notes"}
  - {id: high_standards, name: High Standards, prerequisite: Salad, effect: "Burnable food burns 2x faster"}
  - {id: instant_service, name: Instant Service, blocked_by: Coffee Shop, effect: "Removes Service phase"}
  - {id: leisurely_eating, name: Leisurely Eating, effect: "Eating duration +300%; customer mess increases accordingly"}
  - {id: personalised_waiting, name: Personalised Waiting, effect: "May change order during Waiting for Food; max once per course; patience resets"}
  - {id: picky_eaters, name: Picky Eaters, effect: "Customers leave food that must be discarded manually; non-plated dishes excluded"}
  - {id: photographic_memory, name: Photographic Memory, effect: "Orders hidden unless player is within 4-tile square centered on head table"}
  - {id: relaxed_atmosphere, name: Relaxed Atmosphere, effect: "Increases customer mess"}
  - {id: sedate_atmosphere, name: Sedate Atmosphere, effect: "Player movement -50% within 3 tiles of customers in same room; does not stack"}
  - {id: simplicity, name: Simplicity, effect: "Each research/discount/copy desk may affect one cabinet per day"}
  - {id: splash_zone, name: Splash Zone, effect: "Mess generation area expands (3x3 to 5x5); affects sink wet spots"}
  - {id: tipping_culture, name: Tipping Culture, effect: "Lost Waiting for Food patience reduces dish payment"}
  - {id: victorian_standards, name: Victorian Standards, effect: "Players in customer sight cone and same room cause +300% depletion of Waiting for Table, Service, and Waiting for Food patience"}

theme_cards:
  Affordable:
    levels:
      1: "Eating and Thinking duration -50%"
      2: "50% chance each table consumable is not used up after a group leaves"
      3: "Waiting for Food patience -50%; merges Delivery into Waiting for Food"
  Charming:
    levels:
      1: "Service patience +50%"
      2: "Table patience +50% while a player is nearby"
      3: "Customers sit before table is cleared"
  Exclusive:
    levels:
      1: "Queue patience +33%"
      2: "+1 coin per item delivered"
      3: "Table patience does not decrease while any customers queue"
  Formal:
    levels:
      1: "Less customer mess; cooking-appliance mess excluded"
      2: "+500% patience boost per delivery increment"
      3: "Customers create no mess"

