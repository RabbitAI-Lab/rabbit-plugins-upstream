  - {id: flower_pots, name: Flower Pots, effect: "Flower Pots added to Staple Pool"}
  - {id: metal_table, name: Metal Table, effect: "Metal Tables added to Staple Pool"}
  - {id: simple_cloth_table, name: Simple Cloth Table, effect: "Simple Cloth Tables added to Staple Pool"}
  - {id: loyal_customer, name: Loyal Customer, effect: "Purchasing a blueprint grants another blueprint; excludes Copying Desk copies"}
  - {id: second_helpings, name: Second Helpings, effect: "50% chance purchased blueprints can be bought again"}
  - {id: careful_accounting, name: Careful Accounting, effect: "Earn 50% more money"}
  - {id: catalogue, name: Catalogue, effect: "One additional shop blueprint each day"}
  - {id: coupons, name: Coupons, effect: "Blueprints cost 25% less"}
  - {id: double_homework, name: Double Homework, effect: "Desks produce two copies; copies are additional to normal shop stock"}
  - {id: high_tech_suppliers, name: High Tech Suppliers, effect: "25% chance shop and reroll blueprints are upgraded"}
  - {id: mandatory_tips, name: Mandatory Tips, effect: "+2 coins per customer served"}
  - {id: preparation_time, name: Preparation Time, effect: "Customers start arriving later"}
  - {id: reincarnation, name: Reincarnation, effect: "Lost Extra Lives regenerate each day"}
  - {id: savings, name: Savings, effect: "Start with 50 coins"}
