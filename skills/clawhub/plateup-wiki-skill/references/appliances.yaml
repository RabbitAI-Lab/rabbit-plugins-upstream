automation_interactions:
  Conveyor: "pushes held items only; cannot pull from adjacent surfaces"
  Grabber: "pulls from an adjacent surface when idle and pushes held items toward output"
  Smart Grabber: "pulls only an exact trained item; item pushed onto it can retrain it; can interrupt processing when output is clear"
  Grabber - Rotating: "input direction set in Preparation Phase; output direction switched in Customer Phase or Practice Mode"
  Dumbwaiter: "must be open for other appliances to interact; all dumbwaiters share one item"
  Teleporter: "operates in numbered pairs; interacting appliances can affect items before teleportation"
  Auto Plater: "interacts immediately before an item on a Teleporter is sent"
  Portioner: "can hold an item on a Teleporter during portioning"
  Combiner: "single Combiner/Teleporter interactions can work; multiple Combiners on one Teleporter are unreliable per wiki guide"

research_rules:
  adjacency: "A Research/Discount/Copying Desk must be within one of the eight neighboring tiles of a Blueprint Cabinet; both must share the same room."
  phase_order: ["Store eligible blueprint during Preparation Phase", "Use desk during Customer Phase", "Retrieve or buy result next Preparation Phase"]
  research_selection: "All possible upgrades for a base appliance have equal chance unless the wiki states otherwise."
  discount: "Halves current blueprint cost rounded up; repeated discounts stop at 1 coin; survives later upgrade."
  copying: "Cabinet can hold original plus one copy; a copy cannot be copied again, but may be upgraded, discounted, or rerolled."
  daily_use: "Each desk can affect each cabinet at most once per day."
