general_rules:
  - "Only unpurchased upgradable blueprints can be researched; purchased/placed appliances cannot be upgraded."
  - "Research, Discount, and Copying desks apply during Customer Phase to blueprints stored in adjacent cabinets in the same room."
  - "Each desk effect can be applied once per cabinet per day; multiple desk types may affect the same cabinet on the same day."
  - "Teleporter pairs transport items placed or pushed onto either endpoint."
  - "Smart Grabber filters exact items and can interrupt a process only when its output remains unblocked."
  - "A Safety Hob is recommended for burnable foods in automation; Danger Hob is faster for non-burnable food."
  - "Buffet customers may wait for an unfinished order or when another customer takes their requested item (PlateUp! 1.5 update)."

