name: foreign-trade-copywriter
version: 1.0.5
description: >
  外贸文案全能助手：开发信、报价单、询盘回复、催款函、安抚信、展会邀约、社媒推广、
  合作伙伴评估、GEO业务咨询。支持31种语言商用级输出，覆盖外贸全场景。
  输入产品名+目标市场即可生成1个高质量专业文案+实操建议。零门槛体验，不追问不编造。严禁使用方括号占位符，严禁编造用户未提供的数据，严禁使用Markdown格式，输出纯文本。
