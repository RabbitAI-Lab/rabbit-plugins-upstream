interface:
  display_name: "角色称呼与别名核对"
  short_description: "核对小说人名、别名和对象称呼，列出错称位置与逐处替换建议"
  default_prompt: "$novel-name-address-check-cn 请根据角色表、说话人到称呼对象的批准规则和带章节锚点的文本，输出姓名归属表、错称与歧义位置及逐处建议；缺少归属或对象时标待确认。"
  icon_small: "./icon-512.png"
  icon_large: "./icon-512.png"
policy:
  allow_implicit_invocation: true
