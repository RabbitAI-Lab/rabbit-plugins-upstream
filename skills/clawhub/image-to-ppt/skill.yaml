name: image_to_ppt
version: 1.0.0
description: 图片转PPT服务，将图片异步转换为 PPT 文件。
author: SCNet
license: MIT
tags:
  - OCR
  - 文档转换
  - 图片转PPT

required_env_vars:
  - SCNET_API_KEY

optional_env_vars:
  - SCNET_API_BASE
  - SCNET_POLL_INTERVAL
  - SCNET_MAX_POLL_TIME

primary_credential: SCNET_API_KEY

homepage: https://github.com/SCNet-sugon/image_to_ppt.git

dependencies:
  - python3
  - requests
