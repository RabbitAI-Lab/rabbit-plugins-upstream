<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>质量现场数据分析报告 - {{report_time}}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "微软雅黑", Arial, sans-serif;
            background-color: #f5f7fa;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #409EFF;
        }

        .header h1 {
            font-size: 28px;
            color: #303133;
            margin-bottom: 10px;
        }

        .header .time {
            font-size: 14px;
            color: #909399;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 20px;
            color: #409EFF;
            margin-bottom: 15px;
            padding-left: 10px;
            border-left: 4px solid #409EFF;
        }

        .overview-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .overview-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .overview-card.warning {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .overview-card.success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .overview-card .label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .overview-card .value {
            font-size: 32px;
            font-weight: bold;
        }

        .table-container {
            overflow-x: auto;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #EBEEF5;
        }

        th {
            background-color: #F5F7FA;
            font-weight: 600;
            color: #606266;
        }

        tr:hover {
            background-color: #F5F7FA;
        }

        .top-rank {
            color: #F56C6C;
            font-weight: bold;
        }

        .chart-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .chart-card {
            background-color: #FAFAFA;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #EBEEF5;
        }

        .chart-card h3 {
            font-size: 16px;
            color: #606266;
            margin-bottom: 15px;
            text-align: center;
        }

        .bar-chart {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .bar-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .bar-label {
            width: 150px;
            font-size: 13px;
            text-align: right;
            color: #606266;
        }

        .bar-track {
            flex: 1;
            height: 30px;
            background-color: #E4E7ED;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #409EFF 0%, #66B1FF 100%);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            color: white;
            font-size: 12px;
            transition: width 0.3s ease;
        }

        .bar-fill.warning {
            background: linear-gradient(90deg, #E6A23C 0%, #EEBE77 100%);
        }

        .bar-fill.danger {
            background: linear-gradient(90deg, #F56C6C 0%, #F89898 100%);
        }

        .bar-value {
            font-weight: bold;
        }

        .recommendation-list {
            list-style: none;
        }

        .recommendation-item {
            background-color: #F0F9FF;
            border-left: 4px solid #409EFF;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 4px;
        }

        .recommendation-item.priority-high {
            background-color: #FEF0F0;
            border-left-color: #F56C6C;
        }

        .recommendation-item.priority-medium {
            background-color: #FDF6EC;
            border-left-color: #E6A23C;
        }

        .recommendation-item.priority-low {
            background-color: #F0F9FF;
            border-left-color: #409EFF;
        }

        .recommendation-item .rank {
            display: inline-block;
            width: 24px;
            height: 24px;
            background-color: #409EFF;
            color: white;
            text-align: center;
            line-height: 24px;
            border-radius: 50%;
            font-size: 12px;
            margin-right: 10px;
        }

        .recommendation-item.priority-high .rank {
            background-color: #F56C6C;
        }

        .recommendation-item.priority-medium .rank {
            background-color: #E6A23C;
        }

        .recommendation-item .content {
            display: inline-block;
            vertical-align: middle;
        }

        .recommendation-item .defect-name {
            font-weight: bold;
            color: #303133;
        }

        .recommendation-item .defect-info {
            font-size: 13px;
            color: #909399;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .overview-grid {
                grid-template-columns: 1fr;
            }

            .chart-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>质量现场数据分析报告</h1>
            <div class="time">报告时间: {{report_time}}</div>
        </div>

        {{content}}
    </div>
</body>
</html>
