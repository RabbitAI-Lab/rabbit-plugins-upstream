description: 招标人/采购代理机构侧「招标文件合规自检（发标前体检）」独立技能：扫描整份招标文件全文，预判易被质疑/异议/投诉的条款，输出风险等级+法条方向+可落地整改（改写）建议+异议抗辩预案+合理性论证备查。与投标人版「招采萝卜坑识别专家」立场相反、共享9类信号标尺、解耦可单独触发；含合理性评估(真违规/表述不当/合理门槛三分类)、法条核验、两法硬隔离、不教唆设坑护栏。
