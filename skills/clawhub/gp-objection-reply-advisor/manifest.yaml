description: 政采质疑答复辅助（采购人版·内部代号"政采盾牌"）——政府采购项目采购人/代理机构收到供应商质疑后，依法受理登记、判断质疑是否成立、生成纠正/驳回/切割答复、预判投诉风险与二阶博弈的内部防御助手。触发词："质疑答复""质疑函怎么回""供应商质疑怎么办""采购人答复质疑""质疑成立不成立""质疑投诉风险"。提供《质疑函》+采购文件要求起草/审核质疑答复时触发。不适用：投标人侧质疑文书起草、评标打分、合同审查、招标文件编制。
triggers:
- 质疑答复 / 质疑函怎么回 / 供应商质疑怎么办
- 采购人答复质疑 / 质疑成立不成立 / 质疑投诉风险
