# 分片：与 references/api-*.md 主题一致；路径项由 references/openapi.yaml 引用。
# 注意：本组是「交易所公布的期货公司会员持仓龙虎榜」，不是用户本人持仓（本人持仓见 paths-positions-orders.yaml）。
OpenV1HoldingMetaDates:
    get:
      operationId: get_holding_trade_dates
      summary: 龙虎榜-可用交易日（倒序）
      description: |
        **查快照前必须先调它拿 tradeDate。** 龙虎榜由交易所收盘后公布，盘中当天没有数据，
        直接用今天的日期查会返回空，据此得出「没人持仓」是错误结论。
      parameters:
        - name: symbol
          in: query
          required: false
          schema:
            type: string
          description: 合约代码，如 rb2601
        - name: exchange
          in: query
          required: false
          schema:
            type: string
          description: 交易所代码，如 SHFE
        - name: product
          in: query
          required: false
          schema:
            type: string
          description: 品种前缀，如 rb
      responses:
        '200':
          description: 可用交易日
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../openapi.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object


OpenV1HoldingMetaContracts:
    get:
      operationId: get_holding_contracts
      summary: 龙虎榜-可选合约
      parameters:
        - name: exchange
          in: query
          required: true
          schema:
            type: string
          description: 交易所代码
        - name: product
          in: query
          required: true
          schema:
            type: string
          description: 品种前缀
      responses:
        '200':
          description: 可选合约
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../openapi.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object


OpenV1HoldingMetaBrokers:
