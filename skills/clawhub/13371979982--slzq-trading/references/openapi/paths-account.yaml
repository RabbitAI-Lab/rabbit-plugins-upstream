# 分片：与 references/api-*.md 主题一致；路径项由 references/openapi.yaml 引用。
OpenV1Me:
    get:
      operationId: get_me
      summary: 当前密钥上下文
      description: 获取当前 API Key 对应的 userId、keyId 及生效的交易环境（sim 或 live）。可用于验证鉴权是否正常。
      responses:
        '200':
          description: 当前用户上下文
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../openapi.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '../openapi.yaml#/components/schemas/MeInfo'


OpenV1AccountSummary:
    get:
      operationId: get_account_summary
      summary: 账户摘要
      description: |
        获取交易账户摘要：余额、可用资金、已用保证金、持仓盈亏。
        - sim 环境：返回模拟盘数据（simAccount 有值，liveTradeAccount 为 null）。
        - live 环境：返回 CTP 实盘数据（liveTradeAccount 有值，simAccount 为 null）。
        live 需已在 App 内绑定实盘 CTP 凭据。
      responses:
        '200':
          description: 账户摘要
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../openapi.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '../openapi.yaml#/components/schemas/AccountSummary'
OpenV1AccountPnlHistory:
    get:
      operationId: get_account_pnl_history
      summary: 账户历史盈亏（日/周序列 + 区间合计）
      description: |
        用户问「这个月赚了多少」「最近一周盈亏」「收益率多少」时用它，**不要自己拉成交记录手工累加**——
        那样算不出持仓盯市盈亏，结果一定和 App 对不上。
        区间用 preset 或 startTradingDay+endTradingDay 二选一；都不传时默认 preset=last90d。
        - `periodTotalProfit`：区间内各日「平仓盈亏 + 持仓盯市盈亏」之和（元）。
        - `periodTotalRate`：区间收益率（%）。**仅 sim 有值**；live 恒为 null（实盘没有统一初始资金口径，
          不要自己编一个初始资金去算收益率）。
        - `detail.dailyData` / `detail.weeklyData`：日 / 周明细；`detail.summary` 仅 sim 有。
        - live 数据来自服务端已落库的结算单解析：**区间内没有落库结算单的交易日就是没有数据**，
          不代表那天没交易、也不代表盈亏为 0；按 `liveNote` 如实说明，不要补零、不要外推。
      parameters:
        - name: preset
          in: query
          required: false
          schema:
            type: string
            enum: [last7d, last30d, last90d, monthToDate]
          description: |
            区间预设，仅在未传 startTradingDay+endTradingDay 时生效，不传默认 last90d。
            last7d / last30d / last90d = 从当前交易日往前推 7 / 30 / 90 个**自然日**（含边界）；
            monthToDate = 当月 1 日至当前交易日。
        - name: startTradingDay
          in: query
          required: false
          schema: { type: string }
          description: 自定义区间起始交易日，yyyyMMdd 或 yyyy-MM-dd。**必须与 endTradingDay 成对传**，只传一个会报参数错误；传了则 preset 被忽略。
        - name: endTradingDay
          in: query
          required: false
          schema: { type: string }
          description: 自定义区间结束交易日（含），格式同 startTradingDay。必须与 startTradingDay 成对传。
      responses:
        '200':
          description: 账户历史盈亏
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../openapi.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          preset: { type: string, nullable: true, description: '使用的预设；自定义区间时为 null' }
                          startTradingDay: { type: string, description: '解析后的区间起始交易日 yyyyMMdd' }
                          endTradingDay: { type: string, description: '解析后的区间结束交易日 yyyyMMdd' }
                          tradingEnv: { type: string, description: 'sim / live' }
                          periodTotalProfit: { type: number, description: '区间内各日「平仓盈亏+持仓盯市盈亏」之和（元）' }
                          periodTotalRate: { type: number, nullable: true, description: '区间收益率（%）；仅 sim 有值，live 恒为 null' }
                          liveNote: { type: string, nullable: true, description: 'live 时说明数据来自已落库结算单；sim 一般为 null' }
                          detail:
                            type: object
                            description: 'summary（仅 sim）/ dailyData / weeklyData'
