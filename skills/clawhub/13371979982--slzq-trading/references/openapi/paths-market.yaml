# 分片：与 references/api-*.md 主题一致；路径项由 references/openapi.yaml 引用。
OpenV1MarketSnapshot:
    get:
      operationId: get_market_snapshot
      summary: 单合约行情快照
      description: |
        获取单个合约的实时行情快照（来自 Redis 缓存）。
        字段就是 MarketSnapshot 里列的那些：最新价、今开、最高最低、买一/卖一价量、昨结算价、今结算价、
        交易日、更新时间，加合约乘数 volumeMultiple 与最小变动价位 priceTick。
        **本接口不返回涨停价 / 跌停价，也不返回成交量与持仓量**——需要涨跌停请查 GET /open/v1/catalog/contract，
        缺什么就说缺什么，不要编。
        **volumeMultiple 是计算盈亏的必要参数**；priceTick 可能为 null（取决于 Redis 里缓存的是哪种合约对象）。
        除 volumeMultiple 是整数外，**价格与量都是字符串**，做算术前要先转数字。
        仅读取 Redis 缓存、不回源 DB/CTP：缓存缺失时字段为 null，**null 表示这一刻没缓存，不代表合约停牌或不存在**。
      parameters:
        - name: instrumentId
          in: query
          required: false
          schema:
            type: string
          description: 合约代码，如 au2606、cu2506。与 contractCode 二选一（优先 instrumentId），两个都不传会报参数错误
        - name: contractCode
          in: query
          required: false
          schema:
            type: string
          description: 合约代码的别名，与 instrumentId 等价
      responses:
        '200':
          description: 行情快照
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../openapi.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '../openapi.yaml#/components/schemas/MarketSnapshot'


OpenV1MarketSnapshots:
    get:
      operationId: get_market_snapshots
      summary: 批量行情快照
      description: 批量获取多个合约的实时行情快照，返回数组，顺序与请求中 instrumentIds 一致。每条结构与单合约快照相同。建议最多 20 个合约。
      parameters:
        - name: instrumentIds
          in: query
          required: true
          schema:
            type: string
          description: 逗号分隔的合约代码，如 au2606,ag2612,cu2506，最多建议 20 个
      responses:
        '200':
          description: 批量行情快照
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../openapi.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '../openapi.yaml#/components/schemas/MarketSnapshot'


OpenV1MarketTick:
    get:
      operationId: get_tick_data
      summary: 分时图数据
      description: 获取合约今日分时图数据（每分钟一条 tick），含价格、成交量、持仓量、成交额。用于盘中价格走势分析。
      parameters:
        - name: exchangeId
          in: query
          required: false
          schema:
            type: string
          description: |
            交易所代码，如 SHFE、DCE、CZCE、INE、CFFEX、GFEX。**可省略**——服务端会按合约代码自动解析交易所；
            自己猜一个错的交易所只会拿到空数据，而空数据很容易被误读成「这个合约没有行情」。
            要确认交易所请调 GET /open/v1/catalog/contract。
        - name: instrumentId
          in: query
          required: false
          schema:
            type: string
          description: 合约代码，如 au2606。与 contractCode 二选一，优先 instrumentId
        - name: contractCode
          in: query
          required: false
          schema:
            type: string
          description: 合约代码的别名，与 instrumentId 等价
      responses:
        '200':
          description: 分时数据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../openapi.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '../openapi.yaml#/components/schemas/TickData'


OpenV1MarketKline:
    get:
      operationId: get_kline_data
      summary: K 线图数据
      description: |
        获取合约 K 线（蜡烛图）数据，用于技术分析。返回 OHLC + 成交量、持仓量、结算价（日K线）。
        数组从旧到新排列。下单前可调用此接口分析趋势。

        **K 线周期 type 枚举**：
        - `10` = 1分钟
        - `2` = 5分钟
        - `3` = 15分钟
        - `4` = 30分钟
        - `5` = 1小时
        - `9` = 4小时
        - `6` = 日线
        - `7` = 周线
      parameters:
        - name: exchangeId
          in: query
          required: false
          schema:
            type: string
          description: |
            交易所代码，如 SHFE、DCE、CZCE、INE、CFFEX、GFEX。**可省略**——服务端会按合约代码自动解析交易所；
            自己猜一个错的交易所只会拿到空数据，而空数据很容易被误读成「这个合约没有行情」。
            要确认交易所请调 GET /open/v1/catalog/contract。
        - name: instrumentId
          in: query
          required: false
          schema:
            type: string
          description: 合约代码，如 au2606。与 contractCode 二选一，优先 instrumentId
        - name: contractCode
          in: query
          required: false
          schema:
            type: string
          description: 合约代码的别名，与 instrumentId 等价
        - name: type
          in: query
          required: false
          schema:
            type: integer
            enum: [10, 2, 3, 4, 5, 9, 6, 7]
          description: |
            K 线周期，只接受这 8 个值：10=1分钟，2=5分钟，3=15分钟，4=30分钟，5=1小时，9=4小时，6=日线，7=周线。
            **不传默认 10（1分钟）。没有月线，也没有 1 或 8**，传别的数字拿不到数据——不要按「1=1分钟」之类的直觉推。
      responses:
        '200':
          description: K 线数据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../openapi.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '../openapi.yaml#/components/schemas/KlineData'


