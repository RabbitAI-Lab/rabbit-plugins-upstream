name: geoskill-water-purification-mapping
display_name: 水源涵养/净化功能制图
description: |
  简化 InVEST Budyko 水量平衡计算产水量，叠加 NDVI 调制的植被截留系数得水源涵养量，并估算养分截留净化量。Maps water retention and purification with a simplified InVEST water yield model. 输出产水/涵养/净化三张 GeoTIFF。
version: 0.1.0
author: Mavis
entrypoint: geoskill-water-purification-mapping.py
runtime: python>=3.9
