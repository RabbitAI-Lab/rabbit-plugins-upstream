<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Header Example — ui-master-static</title>
  <link rel="stylesheet" href="header.css" />
</head>
<body>
  <header class="header">
    <a class="header__brand" href="#">Product</a>

    <nav class="header__nav" aria-label="Primary">
      <a class="header__link" href="#features">Features</a>
      <a class="header__link" href="#pricing">Pricing</a>
      <a class="header__link" href="#docs">Docs</a>
    </nav>

    <div class="header__actions">
      <a class="button button--ghost" href="#signin">Sign in</a>
      <a class="button button--primary" href="#start">Get started</a>
      <button
        class="header__mobile-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="mobile-nav"
      >
        <span class="sr-only">Toggle menu</span>
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </svg>
      </button>
    </div>
  </header>

  <nav id="mobile-nav" class="mobile-nav" data-open="false" aria-label="Mobile">
    <a class="mobile-nav__link" href="#features">Features</a>
    <a class="mobile-nav__link" href="#pricing">Pricing</a>
    <a class="mobile-nav__link" href="#docs">Docs</a>
  </nav>

  <!-- Filler content so the sticky/blur behavior is visible on scroll -->
  <main style="padding: 2rem; max-width: 640px; margin-inline: auto;">
    <p>Scroll down to see the header's backdrop blur against real content.</p>
    <div style="height: 1600px;"></div>
  </main>

  <script>
    const toggle = document.querySelector(".header__mobile-toggle");
    const nav = document.querySelector(".mobile-nav");
    toggle.addEventListener("click", () => {
      const isOpen = nav.dataset.open === "true";
      nav.dataset.open = String(!isOpen);
      toggle.setAttribute("aria-expanded", String(!isOpen));
    });
  </script>
</body>
</html>
