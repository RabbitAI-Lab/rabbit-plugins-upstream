schema_version = "1.0"

[network]
id = "simple-network"
name = "Single-source load network"
pressure_reference = "gauge"
units_system = "SI"

[solver]
residual_tolerance_m3_s = 1.0e-8
max_nfev = 1000

[[nodes]]
id = "source"
kind = "pressure_boundary"
pressure_pa = 300000.0
boundary_role = "source"

[[nodes]]
id = "load_inlet"
kind = "load"
function_id = "cooling"
measurement_edge_id = "load_restriction"
min_inlet_pressure_pa = 200000.0
min_flow_m3_s = 0.003

[[nodes]]
id = "ambient"
kind = "pressure_boundary"
pressure_pa = 0.0
boundary_role = "sink"

[[edges]]
id = "supply_pipe"
from = "source"
to = "load_inlet"
kind = "pipe"
resistance_model = "quadratic"
resistance = 5.0e9
diameter_m = 0.04
enabled = true

[[edges]]
id = "load_restriction"
from = "load_inlet"
to = "ambient"
kind = "pipe"
resistance_model = "quadratic"
resistance = 2.0e10
diameter_m = 0.02
enabled = true

[[scenarios]]
id = "normal"
description = "Supply path available"

[[scenarios]]
id = "supply_blocked"
description = "Supply path blocked"

[[scenarios.actions]]
target_type = "edge"
target_id = "supply_pipe"
attribute = "enabled"
value = false
