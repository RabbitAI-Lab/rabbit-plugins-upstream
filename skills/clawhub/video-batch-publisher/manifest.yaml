description: >-
  本地运行的短视频批量发布工具，支持抖音/视频号/快手/B站。从 Excel 读取任务，
  自动上传视频、填封面/标题/描述/合集/标签，按发布日期自动判断立即或定时发布。运行全程不修改你的 Excel，发布结果实时显示在界面与日志。
  纯本地、无需平台开发者资质，首次登录一次后自动复用。
