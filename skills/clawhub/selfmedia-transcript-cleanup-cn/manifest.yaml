description: 接收用户拥有或获授权的中文原始转录文字、可选说话人和时间标记及清稿尺度，交付忠实原意的干净稿、逐项修改清单与待确认标记，适用于访谈、口述和视频字幕初稿；缺少文本或说话人无法区分时先请求补充，绝不凭空补词或校正专名数字。
