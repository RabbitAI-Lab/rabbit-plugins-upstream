    description: 按招标文件格式自动生成投标文件骨架（docx）；支持四套编号体系、解析 docx 提取章节与字体、自定义封面/页脚/目录。仅生成格式骨架，不含实质内容；PDF 不支持解析。
    triggers:
      - 按招标文件格式生成投标文件骨架
      - 投标文件docx排版编号
      - 生成标书格式框架
  coze:
    name: 投标文件编制助手
    description: 按招标文件格式自动生成投标文件骨架（docx）；支持四套编号体系、解析 docx 提取章节与字体、自定义封面/页脚/目录。仅生成格式骨架，不含实质内容；PDF 不支持解析。
    triggers:
      - 按招标文件格式生成投标文件骨架
      - 投标文件docx排版编号
      - 生成标书格式框架
