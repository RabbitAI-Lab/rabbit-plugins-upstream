description: >-
  秽土转生（edo-tensei）：多会话上下文协同控制塔。把臃肿会话安全拆分为聚焦子会话，或把散落会话纳管为可追溯地图。
  五个动词：转生（同空间拆分）、接管（同空间纳管）、导出（跨空间/跨设备打包）、导入（跨空间/跨设备落成）、设置（配置默认中转目录）。
  提供细胞分裂式就地拆分、依赖 DAG 死锁检测、两阶段提交、跨工作空间导出导入（产物副本 + 命名空间防污染），以及权属溯源 SEAL。
