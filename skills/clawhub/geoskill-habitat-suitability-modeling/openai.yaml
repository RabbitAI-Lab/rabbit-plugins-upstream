name: geoskill-habitat-suitability-modeling
display_name: 栖息地适宜性建模
description: |
  由多变量环境栅格训练物种分布模型，输出 0-1 栖息地适宜性概率与变量贡献度。Models habitat suitability probability from environmental rasters with RF or logistic regression. 输出适宜性 GeoTIFF + 模型参数 JSON（含交叉验证 AUC）。
version: 0.1.0
author: Mavis
entrypoint: geoskill-habitat-suitability-modeling.py
runtime: python>=3.9
tags:
  - analysis
  - biodiversity
  - gis
  - land-use
  - machine-learning
  - raster
  - remote-sensing
