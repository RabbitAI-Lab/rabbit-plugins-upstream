name: gp-review-expert-caselaw
display_name: 评审专家判例法指引（即时判定规则）
version: 1.0.0
author: "一线评标专家&ChesaraM"
description: 评审专家"判例法"即时指引（预防向）。评审委员会在评审环节出现争议（如"★"条款认定、异常低价判断、实质性参数/品牌认定）时，即时查询全国5万+真实投诉处理决定中同类问题的财政部门判定规则，告知"若如此认定、未来被投诉后通常如何纠偏"，并提示是否启动澄清程序要求供应商提供客观佐证（如厂家彩页/检测报告）。例：对"★脱水缸容量≥5L"这类客观参数，若仅依据承诺函认定通过，未来被投诉后财政部门通常要求提供厂家公开发布彩页或检测报告作为事实审查依据，应启动澄清要求客观佐证。
