name: notify-hub
slug: notify-hub
version: 1.0.0
description: "统一通知层：一个 skill 抽象掉所有消息通道。调用方定义一次内容（text/card/file），广播到飞书、企业微信、钉钉、Slack、Telegram、邮件六个通道。统一卡片 DSL + 各通道降级渲染（表格/按钮自动适配），通道可插拔（新增通道=加一个 adapter 文件），内置签名与限流，纯 Python 标准库零依赖。"
