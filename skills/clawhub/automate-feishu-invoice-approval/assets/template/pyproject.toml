[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feishu-invoice-approval-bot"
version = "0.1.0"
description = "Receive invoice images from Feishu, extract them with Codex vision, and create expense approvals."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
invoice-approval-bot = "invoice_approval_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

