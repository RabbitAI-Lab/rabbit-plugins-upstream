    change: "重构为功能性问答闭环（非文档生成器）：固定白名单 KB-A/B/C/X/L 为基座 + 缓存式动态核验（Step0，TTL 24h / 刷新命令强制重拉）；片段级 IMA 检索（title/introduction/highlight_content + cursor 翻页）；知识治理层（效力层级 + 四大铁律 + KB-L 降级显式标注）；四段式引用输出；四功能各 2 个 Few-Shot；T01-T15 验收用例。Sprint 0 检查清单 7 项收口，具备进入开发 Sprint 条件。"
