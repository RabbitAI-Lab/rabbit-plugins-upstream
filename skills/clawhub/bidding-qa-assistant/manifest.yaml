    change: "去除验收/回归套件中的 GLM/Kimi 模型指定，改为模型无关表述（按需运行、模型更换时回归）；system_prompt.md 与 SKILL.md 中'为 GLM/Kimi 优化'改为通用结构化优化；明确 skill 为模型无关指令包，模型选择由部署者自定。"
  - version: 2.1.0
    date: 2026-07-18
    change: "定位为可安装即用成品：移除 SKILL.md/README.md 中'开发完成后打包''接入模型后跑基线'等开发期描述，改为'已打包安装即用 + 验收/回归套件（test_cases.md，GLM/Kimi 下运行，换模型时回归）'；test_cases.md 开头改为验收/回归套件定位；version_stage 由 P0_SPRINT_READY 升为 GA。"
