description: 废标风险雷达——专攻招标文件中的否决投标（废标）条款、硬性资质要求、保证金条款及隐性风险点提取。触发词："废标风险检查""审查否决条款""提取★号条款""封标前检查""风险雷达""检查废标项""否决项清单""标书体检""这个标能不能投""资格审查能不能过""★条款有哪些"。当用户明确要求对招标文件做专项风险筛查时触发。输出结构化检查清单，便于审核人员逐项核对。不适用：招标文件全文解读/翻译、投标文件编制、合同审查、评标打分、报价策略与评分拆解建议。
