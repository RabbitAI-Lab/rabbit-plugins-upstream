name: novel-world-rule-check-cn
slug: novel-world-rule-check-cn
display_name: 世界规则冲突表
description: 输入作者确认的世界规则清单（编号、触发条件、代价、例外）及最多10个待审短场景，输出逐条对应原文、成立/冲突/无法判定表、判断依据与需作者批准的修订选项。适用于章节校对和设定连续性复核；缺少正式规则、例外条件或文本证据时，明确请求补充，不把类型惯例当成本书设定。
version: 1.0.0
license: MIT-0
repository: https://github.com/xxjrq/novel-world-rule-check-cn
icon: icon-512.png
tags:
  - 小说创作
  - 世界观设定
  - 连续性校对
  - 中文写作
trigger_words:
  - 世界规则冲突
  - 设定矛盾检查
  - 小说规则核对
interface:
  display_name: 世界规则冲突表
  short_description: 核对作者批准的世界规则与章节文本，整理证据和待批修订选项
  default_prompt: "$novel-world-rule-check-cn 请提供正式规则清单和待审片段，我将逐条输出判定表。"
  icon_small: ./icon-512.png
  icon_large: ./icon-512.png
self_test: python3 scripts/self_test.py
