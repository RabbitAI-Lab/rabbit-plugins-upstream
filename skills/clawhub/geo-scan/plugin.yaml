name: geo-scan
label: GEO Scan
version: 1.2.0
author: Aurelius
homepage: https://github.com/AureliusClaw/geo-scan
description: >
  Answer-engine readiness audit for any public website, with no API key and no
  account. Scores a site 0-100 on six axes: crawler access for search/retrieval
  agents (20, a gate), machine readability (15), snippet permissions (10),
  structure (25), quotability (20) and freshness (10). Every score carries the
  evidence line that produced it. Returns a compact JSON report with a
  prioritised action list; can also write the full Markdown and JSON report to
  disk. Obeys robots.txt, about one request per second, 90 s cap, public hosts
  only. stdlib only.
requires_hermes: ">=0.21.5"
provides_tools:
  - geo_scan
provides_hooks: []
