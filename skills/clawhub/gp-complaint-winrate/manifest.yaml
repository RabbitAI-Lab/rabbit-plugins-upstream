name: gp-complaint-winrate
display_name: 政采投诉胜诉率预判（类案判例法·攻向）
version: 1.0.0
author: "一线评标专家&ChesaraM"
description: 政府采购投诉"胜诉率"预判模型（供应商/投诉人攻向）。输入自身遭遇的不公情形，通过"投诉事项结构化拆解 + 5万+真实投诉处理决定类案相似度比对"，以真实检索样本计数给出投诉成功率（成立率）预测，并按"证据充分性"做条件分层（强证据/弱证据分层胜诉率），输出证据收集与补强路线图。例：针对"参数不满足实质性要求"仅凭公开资料、缺官方检测报告者，弱证据层历史驳回率极高，建议在法定质疑期内申请公开中标产品规格型号并索取样机第三方检测。
tags:
  - 政府采购
  - 投诉预判
  - 胜诉率
  - 类案检索
  - 证据策略
  - 合规辅助
