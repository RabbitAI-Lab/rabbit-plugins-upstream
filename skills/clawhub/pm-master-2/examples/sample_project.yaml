    blocker: no
governance:
  parts:
    - name: Core Trading
      methodology: waterfall
      gate: GA Review
      decision_owner: CTO
    - name: Merchant Portal
      methodology: agile
      gate: Sprint Review
      decision_owner: Product VP
    - name: Data Platform
      methodology: hybrid
      gate: Stage Gate
      decision_owner: Data Lead
  principles:
    - No entry to the next phase until the gate is passed
    - Hybrid parts are measured by their own methodology; health is reported in a unified way
map:
  - macro_milestone: M1 Trading Loop
    micro_iteration: I1 Order Placement
    alignment_status: aligned
  - macro_milestone: M1 Trading Loop
    micro_iteration: I2 Payment
    alignment_status: aligned
  - macro_milestone: M2 Risk Control Go-live
    micro_iteration: I3 Risk Rules
    alignment_status: drift
