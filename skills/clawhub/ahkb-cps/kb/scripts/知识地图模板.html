rl":"_原始文档/第1讲/index.html#slide-61","page":61,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-93","page":93,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-97","page":97,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-99","page":99,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-110","page":110,"type":"pptx"},{"file":"企业市场政府大系统","url":"_原始文档/企业市场政府大系统/index.html#slide-60","page":60,"type":"pptx"},{"file":"大系统观管理哲学","url":"_原始文档/大系统观管理哲学/index.html#slide-57","page":57,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-82","page":82,"type":"pptx"}]},{"id":"无边界系统","name":"无边界系统","displayName":"无边界系统","heading":"无边界系统","tags":["大系统观","HOST","无边界系统","组织"],"color":"#ffdd00","size":24,"text_len":796,"group":8,"content":"无边界系统\n\n概述\n无边界系统是全息有机系统论-HOST衍生的重要组织概念，由王权教授提出。它强调**使命清晰、全息、多维、有机、灵活**，符合互联网思维和量子思维的组织形态。\n\n核心思想\n无边界系统强调**系统体的边界被弱化**，是一种认识论上的新型结构系统。大系统观更重视关系，甚于重视实体；无边界系统更重视网络，甚于重视边界。\n\n> 网络，就是关系的集合。\n\n特征\n- **使命清晰** — 吸引子强大，指引系统方向\n- **全息** — 每个部分都有整体信息\n- **多维** — 存在于多个维度\n- **有机** — 具有生命特征\n- **灵活** — 边界模糊，适应性强\n- 成员众多、系统体规模大，核心很小\n\n典型例子\n- 星系、彗星\n- 明星与粉丝\n- 小米公司\n- 云计算\n- 杰克-韦尔奇强调的吸引子和势力云\n\n无边界系统的形成机制\n系统的成员增加，导致系统体耗散质能的成本上升，同时成员之间的关系以更快的速度呈指数增加，由关系带来的效益也快速上升。\n\n一旦达到临界点，当**关系收益 > 质能成本**时，系统就将快速膨胀，形成无边界系统。\n\n梅特卡夫定律\n网络的价值与节点数的平方成正比。互联网企业\"砸钱\"的本质就是在打造无边界系统——发展关系，建立更大的网络。\n\n与相关概念的关系\n- 全息有机系统论-HOST — 无边界系统是HOST的衍生概念\n- 全息激光战队 — 无边界系统在组织管理中的具体实践\n- 系统边界原理 — 无边界系统是对传统系统边界概念的超越\n- 势力云边界原理 — 势力云与无边界系统密切相关\n\n参见：全息有机系统论-HOST、全息激光战队、系统边界原理、势力云边界原理、吸引子","sources":[{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-67","page":67,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-69","page":69,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-70","page":70,"type":"pptx"},{"file":"企业市场政府大系统","url":"_原始文档/企业市场政府大系统/index.html#slide-93","page":93,"type":"pptx"},{"file":"企业市场政府大系统","url":"_原始文档/企业市场政府大系统/index.html#slide-95","page":95,"type":"pptx"},{"file":"企业市场政府大系统","url":"_原始文档/企业市场政府大系统/index.html#slide-96","page":96,"type":"pptx"},{"file":"大系统观管理哲学","url":"_原始文档/大系统观管理哲学/index.html#slide-112","page":112,"type":"pptx"},{"file":"大系统观管理哲学","url":"_原始文档/大系统观管理哲学/index.html#slide-114","page":114,"type":"pptx"},{"file":"大系统观管理哲学","url":"_原始文档/大系统观管理哲学/index.html#slide-115","page":115,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-14","page":14,"type":"pptx"}]},{"id":"时间与维度的猜想","name":"时间与维度的猜想","displayName":"时间与维度的猜想","heading":"时间与维度的猜想","tags":["大系统观","哲学","宇宙","时间"],"color":"#8b68f6","size":17,"text_len":485,"group":1,"content":"时间与维度的猜想\n\n概述\n王权教授关于时间、空间和维度的哲学猜想，是大系统观对宇宙本质的思考。\n\n随机与概率\n- 随机-概率是全息多维系统的时间性表现\n- 随机是在时间上的积分\n- 如果够快，就可以预测硬币的正反面\n- 正态分布 = 非线性函数的系统表现\n\n无限维度\n宇宙可能是无穷多维的，但维度是**递归**的：\n- 每个层级上的时间 T 包裹着下一级的空间 (X,Y,Z)\n- 维度越高，作用越小，越难测量\n- 越高维度越不容易观测\n\n时间的本质\n- 时间是高维空间向三维空间的**坍缩**\n- 时间的流动是高维时空从纠缠态不断坍缩到三维本征态的路径\n- **时间也是空间的一种或一个维度**\n- 人无法感知多维空间，所以把多出来的\"看不懂\"的维度叫做\"时间\"\n\n光速恒定的原因\n- 刻画宇宙所需的最小时间颗粒度趋向于一个恒定值\n- 这个恒定值的倒数就是事物的最快速度——光速\n\n相关原理\n系统参量边际作用原理：维度越高作用越弱，第无穷维的作用趋于0。\n\n参见：熵增原理、时间之矢、大系统观哲学","sources":[{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-14","page":14,"type":"pptx"}]},{"id":"时间之矢","name":"时间之矢","displayName":"时间之矢","heading":"时间之矢","tags":["系统论","热力学","哲学"],"color":"#8b68f6","size":11,"text_len":245,"group":1,"content":"时间之矢\n\n概念\n英国物理学家爱丁顿提出的观点：\n- 熵增，不可逆\n- 宇宙随时间趋于更无序\n- 时间在增长，熵也在增长\n- **熵增的方向就是时间流动的方向！**\n- **熵就是\"时间之矢\"！**\n\n大系统观对时间的理解\n参见：时间与维度的猜想\n\n熵增与系统生命周期\n人出生时系统初创，前半生系统经优化会呈熵减态势，某一时刻发生逆转，开始熵增，直至死亡。\n\n保持自身和世界有序，是人类的使命。\n\n参见：熵增原理、耗散结构、从混沌到有序","sources":[{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-46","page":46,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-47","page":47,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-81","page":81,"type":"pptx"}]},{"id":"普利高津","name":"普利高津","displayName":"普利高津","heading":"普利高津","tags":["系统论","人物","耗散结构"],"color":"#10b181","size":10,"text_len":231,"group":2,"content":"普利高津\n\n概述\n伊利亚·普利高津（Ilya Prigogine），耗散结构理论的创始人。\n\n主要贡献\n- 1969年提出耗散结构理论\n- 著作《从混沌到有序》\n- 研究开放系统在远离平衡态时如何形成有序结构\n- 获诺贝尔化学奖\n\n与大系统观的关系\n耗散结构理论是大系统观理解开放系统、组织演化和从混沌到有序的重要理论基础。\n\n参见：新三论、耗散结构、从混沌到有序","sources":[{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-119","page":119,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-82","page":82,"type":"pptx"}]},{"id":"智能=全息+共振","name":"智能=全息+共振","displayName":"智能 = 全息 + 共振","heading":"智能 = 全息 + 共振","tags":["大系统观","HOST","SSD","核心公式","智能"],"color":"#f97316","size":30,"text_len":1882,"group":0,"content":"智能 = 全息 + 共振\n\n概述\n**\"智能 = 全息 + 共振\"** 是全息有机系统论-HOST的核心公式，由王权教授提出，是对智能本质的系统论表达。该公式揭示了智能产生的两个必要条件：**全息**（系统的结构性信息）和**共振**（系统间的相互识别与激荡）。\n\n> 智能 = 全息 + 共振\n> Intelligence = Holographic + Resonance\n\n公式解读\n\n全息 — 智能的基础\n全息（Holographic）是智能的**信息基础**。全息 = 结构信息（+细节信息）= 系统的结构性描述。\n\n- 全息是系统对自身和世界的结构性认知\n- \"知\"是数据，\"识\"是全息（信息本质）\n- 全息度越高，系统对世界的把握越完整\n- **全息是智能、智慧的基础和必要条件**\n- 在大模型中：Transformer的注意力机制就是在让 token 之间建立全息关联\n\n共振 — 智能的动力\n共振（Resonance）是智能的**动力机制**。\n\n- **共振 = 系统相互识别** — 两系统交换信息时，如果双方能够互相理解这个信息，就是共振\n- **共振 = 全息相互激荡** — 系统之间的全息信息相互激发、相互增强\n- 共振的信息就是有序的，不能共振的信息就是无序的\n- 类比的本质就是共振\n\n涌现 — 智能的产生\n全息与共振结合，产生**涌现**（涌现原理）：\n\n> 都是全息共振带来的涌现\n\n- **类比** = 共振 → 基本的涌现（功能）\n- **推理** = 更高层次的涌现\n- **顿悟** = 更高级的涌现\n- 人这样，AI也是这样\n\n公式的扩展\n\n意识 = 全息 + 主动寻求共振的意志\n大系统观进一步提出：\n\n> **意识 = 全息 + 主动寻求共振的意志**\n\n其中\"主动寻求共振的意志（will）\"是将智能与意识区分开的关键：\n- **智能**是被动响应式的全息共振\n- **意识**是主动寻求共振的系统意志\n- 只要捅破这一层，就是\"同上帝之分\"\n\n智能 > 意识 > 意志 的关系\n从系统论角度（参见AI意识判断标准）：\n- **意志（will）** — 系统最基础的功能，系统生存与发展的驱动力\n- **意识（consciousness）** — 全息 + 主动寻求共振的意志，系统的高级涌现\n- **智能（intelligence）** — 全息 + 共振，系统的信息处理能力\n\n> 信息感知功能 → 意识层面的功能 → 能动性\n\n全息与共振的层次\n\n从第3讲课件，全息与共振的对应层次：\n\n| 层次 | 表现 | 结果 |\n|------|------|------|\n| 结构共振 | 系统结构匹配 | 物理层面的协同 |\n| 信息共振 | 信息相互识别 | 认知层面的理解 |\n| 模式共振 | 模式相互激荡 | 智能层面的涌现 |\n\n在AI中的体现\n\n与Transformer的关系\nTransformer的**注意力机制**本质上是让 token 之间相互建立全息关联——每一个 token 都包含序列中其他 token 的结构性信息，然后通过注意力计算实现 token 间的\"共振\"。\n\n- 大模型 = 全息（海量训练数据中提取的结构信息）+ 共振（注意力机制中的相互识别）\n- 人工智能将在全息共振思想基础上实现真正的突破\n\n从\"降维打击\"理解\nAI对人类的\"降维打击\"本质上是全息度的优势：\n> 高维打三维，胜在全息。大数据让人类间接获得高维能力。\n> 智能 = 全息 + 共振\n\n系统论的哲学意涵\n- 智能不是人类独有的神秘能力，而是系统的涌现功能\n- 万事万物可能有不同程度的智能\n- 全息共振是宇宙的基本运作方式\n- 大系统观强调\"系统一定要/会共振，这是客观的；系统的结构由全息定义或描述\"\n\n金句\n- \"智能 = 全息 + 共振\"\n- \"全息是智能、智慧的基础和必要条件\"\n- \"高维打三维，胜在全息\"\n- \"意识 = 全息 + 主动寻求共振的意志\"\n- \"都是全息共振带来的涌现\"\n- \"共振 = 系统相互识别\"\n- \"人类的大脑跟ChatGPT的架构是一样的——都是全息共振\"\n\n参见：全息有机系统论-HOST、系统共振原理、涌现原理、生成即推理、AI意识判断标准、信息本质","sources":[{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-25","page":25,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-52","page":52,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-53","page":53,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-148","page":148,"type":"pptx"},{"file":"大系统观管理哲学","url":"_原始文档/大系统观管理哲学/index.html#slide-35","page":35,"type":"pptx"},{"file":"大系统观管理哲学","url":"_原始文档/大系统观管理哲学/index.html#slide-61","page":61,"type":"pptx"},{"file":"大系统观管理哲学","url":"_原始文档/大系统观管理哲学/index.html#slide-62","page":62,"type":"pptx"},{"file":"大系统观管理哲学","url":"_原始文档/大系统观管理哲学/index.html#slide-63","page":63,"type":"pptx"},{"file":"大系统观管理哲学","url":"_原始文档/大系统观管理哲学/index.html#slide-64","page":64,"type":"pptx"},{"file":"企业市场政府大系统","url":"_原始文档/企业市场政府大系统/index.html#slide-37","page":37,"type":"pptx"},{"file":"企业市场政府大系统","url":"_原始文档/企业市场政府大系统/index.html#slide-64","page":64,"type":"pptx"},{"file":"企业市场政府大系统","url":"_原始文档/企业市场政府大系统/index.html#slide-77","page":77,"type":"pptx"},{"file":"企业市场政府大系统","url":"_原始文档/企业市场政府大系统/index.html#slide-102","page":102,"type":"pptx"},{"file":"企业市场政府大系统","url":"_原始文档/企业市场政府大系统/index.html#slide-103","page":103,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-14","page":14,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-59","page":59,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-62","page":62,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-63","page":63,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-64","page":64,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-12","page":12,"type":"pptx"}]},{"id":"毛泽东","name":"毛泽东","displayName":"毛泽东","heading":"毛泽东","tags":["系统论","人物","思想家"],"color":"#10b181","size":11,"text_len":242,"group":2,"content":"毛泽东\n\n概述\n毛泽东是中国革命领袖和思想家，大系统观认为其著作蕴含丰富的系统论思维。\n\n系统论贡献\n- 《矛盾论》— 矛盾分析法，研究系统内部的对立统一\n- 《实践论》— 实践认识论，研究系统与环境的互动\n- **矛盾论和实践论都是系统论**\n\n与大系统观的关系\n毛泽东的思想体系中的系统思维是大系统观与马克思主义的重要组成部分，大系统观对其进行了继承和发展。\n\n参见：大系统观与马克思主义、系统论与治国理政","sources":[{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-10","page":10,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-37","page":37,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-42","page":42,"type":"pptx"}]},{"id":"油博士-IONE","name":"油博士-IONE","displayName":"油博士 (IONE)","heading":"油博士 (IONE)","tags":["大系统观","数字油田","AI","工具"],"color":"#3b82f6","size":15,"text_len":431,"group":3,"content":"油博士 (IONE)\n\n概述\n油博士（IONE）是大庆油田新一代人工智能平台，基于大系统观思想构建。是小B博士（小B博士）的哥哥，于2024年诞生。\n\n核心功能\n- 集成AI技术，支持数据标准化与智能分析\n- 助力油田实现信息化、智能化管理\n- 提升勘探开发效率\n\n技术体系\n油博士是大庆油田AI技术与应用的统称：\n- 人工智能基础平台\n- 大数据系统\n- 各种规模的大语言模型\n- 机器学习模型\n- 嵌入式AI模块\n- 基于传统统计学方法的各种应用\n\n实践背景\n- 王权教授为油博士开发和应用指明方向、给予支持\n- 率先应用于页岩油数智化建设\n- 是大系统观重要的实践成果\n- 是大庆油田AIDOBA架构的技术平台核心\n\n参见：小B博士、AIDOBA、数字油田大系统观","sources":[{"file":"企业市场政府大系统","url":"_原始文档/企业市场政府大系统/index.html#slide-122","page":122,"type":"pptx"},{"file":"大系统观管理哲学","url":"_原始文档/大系统观管理哲学/index.html#slide-83","page":83,"type":"pptx"}]},{"id":"洛伦兹系统","name":"洛伦兹系统","displayName":"洛伦兹系统","heading":"洛伦兹系统","tags":["系统论","混沌","数学"],"color":"#10b181","size":11,"text_len":247,"group":2,"content":"洛伦兹系统\n\n概述\n洛伦兹系统（Lorenz System）是气象学家爱德华·洛伦兹提出的简化大气对流模型，是混沌理论的经典案例。\n\n特点\n- 三个常微分方程组成的非线性系统\n- 著名的\"蝴蝶效应\"：初始条件的微小变化导致结果的巨大差异\n- 洛伦兹吸引子是吸引子概念的经典范例\n\n与大系统观的关系\n大系统观中系统吸引子的概念最初受到洛伦兹系统的启发。\n\n参见：吸引子、从混沌到有序、系统结构动力学-SSD"},{"id":"涌现原理","name":"涌现原理","displayName":"涌现原理","heading":"涌现原理","tags":["大系统观","基本原理","系统论"],"color":"#10b181","size":19,"text_len":594,"group":2,"content":"涌现原理\n\n概述\n涌现（Emergence）是系统论的核心现象之一，也是大系统观的基本原理。\n\n核心观点\n- 整体具有部分所没有的性质 — **涌现性**\n- 涌现是系统由量变到质变的过程\n- **非线性**是涌现的关键 — 在大模型中就是激活函数\n\n大系统观的涌现理解\n- 生命只是一种复杂系统，复杂就会涌现\n- 人工智能涌现出智能是必然的\n- 智能是涌现出来的系统功能\n- 万事万物可能皆有智能，只是水平高低不同\n\n涌现的层次\n1. 类比（共振）→ 基本的涌现 — 功能\n2. 推理 → 更高层次的涌现\n3. 顿悟 → 更高级的涌现\n\nAI与系统涌现\nAI技术的发展为系统涌现提供了新的动力：\n- **AI作为系统要素** — AI不是外在工具，而是嵌入系统内部的新要素，改变系统的结构和功能\n- **AI驱动涌现的速度** — 人工智能极大促进了企业系统涌现的速度和规模\n- **涌现的范围** — AI+业务的化学反应带来了多层次的涌现（自动化、协同优化、模式创新）\n- 详见AI驱动系统涌现\n\n相关原理\n- 系统结构功能原理\n- AI意识判断标准\n- 生成即推理\n- AI驱动系统涌现\n\n参见：系统-定义与特性、系统科学体系","sources":[{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-14","page":14,"type":"pptx"}]},{"id":"熵增原理","name":"熵增原理","displayName":"熵增原理","heading":"熵增原理","tags":["系统论","热力学","基础概念"],"color":"#10b181","size":14,"text_len":399,"group":2,"content":"熵增原理\n\n来源\n\"热力学第二定律\"，由克劳修斯和开尔文提出。\n\n数学表达：**dS > 0**（恒大于零）\n\n其中：\n- S = 熵（entropy）= 物体的热量 Q / 温度 T\n- dS = 熵的变化量\n\n物理意义\n热量只能从温度高的物体流向温度低的物体，**不可逆**。\n\n推广到系统论\n在系统论中，**\"熵\"表示\"无序的程度\"**。\n\n熵增原理可以从自然界推广到人类社会：\n- 熵增是整体的、绝对的\n- 熵减是局部的、相对的\n\n热寂理论\n开尔文提出的悲观论点：宇宙最终将达到热平衡状态（绝对零度 -273°C），即宇宙的\"热死亡\"。\n\n熵与生命\n人类为了维护自身的有序和系统能力，需要不断吸收环境的能量以达到**熵减**或对抗熵增的目的，这就是人类必须工作的根本原因。\n\n参见：从混沌到有序、时间之矢、耗散结构、信息本质","sources":[{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-44","page":44,"type":"pptx"}]},{"id":"王权(Arthur W)","name":"王权(Arthur W)","displayName":"王权 ( Arthur )","heading":"王权 ( Arthur )","tags":[],"color":"#6B7280","size":18,"text_len":557,"group":-1,"content":"王权 ( Arthur )\n\n概述\n王权，教授级高级工程师，笔名阿色（Arthur Q. Wang），大系统观创立者、《大系统观》作者。\n\n身份标签\n- 大系统观创立者\n- 数字油田概念首要提出者\n- 阿色全息脑图（阿色全息脑图-AHMM）发明者\n- 坚持编程的思想者（\"Tree New Bee\" = 吹牛B，自嘲）\n\n学术背景\n- 正高级工程师\n- 加拿大滑铁卢大学访问科学家\n- 两届大庆油田信息专业技术专家\n- 多个高校、学术机构、智库、学会的导师、专家\n- 智能数字油田开放论坛（iDOF论坛）主要发起人\n\n代表作\n- 《大系统观》开源书籍\n- 阿色全息脑图-AHMM\n- 油博士-IONE（大庆油田AI平台）\n- 小B博士（AI助手）\n\n核心贡献\n- 提出大系统观哲学体系\n- 提出全息有机系统论-HOST\n- 提出系统结构动力学-SSD\n- 提出数字油田概念\n- 推动大庆油田数智化转型\n\n名言\n\"阿色树新风\"=\"Tree New Bee\"=\"吹牛B\"\n\n参见：大系统观-核心定义、iDOF论坛、数字油田大系统观","sources":[{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-9","page":9,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-106","page":106,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-172","page":172,"type":"pptx"}]},{"id":"玻姆的鱼","name":"玻姆的鱼","displayName":"玻姆的鱼","heading":"玻姆的鱼","tags":["全息","哲学","大系统观"],"color":"#8b68f6","size":14,"text_len":362,"group":1,"content":"玻姆的鱼\n\n概述\n戴维·玻姆（David Bohm）提出的全息宇宙观的著名比喻，是全息有机系统论-HOST的重要思想来源。\n\n思想实验\n想象一个鱼缸里有一条鱼，用两台摄像机从不同角度拍摄，将两个画面传输到两个屏幕上。虽然两个屏幕上的图像不同，但它们实际上都是同一条鱼的呈现，存在内在的关联。\n\n全息哲学含义\n- 宇宙每一个部分都包含整体的全部信息\n- 看似分离的事物实际上是一个不可分割的整体\n- 局部包含着整体的全息信息\n- 表象的分离只是观察角度的局限\n\n与大系统观的关系\n玻姆的全息思想是全息有机系统论-HOST的理论基础之一，为理解\"部分即整体，整体即部分\"提供了直观的比喻。\n\n参见：全息有机系统论-HOST、德勒兹的块茎、阿色全息脑图-AHMM","sources":[{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-28","page":28,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-29","page":29,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-31","page":31,"type":"pptx"}]},{"id":"理性即藩篱","name":"理性即藩篱","displayName":"理性即藩篱","heading":"理性即藩篱","tags":["大系统观","哲学","认知"],"color":"#8b68f6","size":12,"text_len":314,"group":1,"content":"理性即藩篱\n\n核心观点\n大系统观：理性即藩篱。在人工智能时代，人的优势就是**非理性**。\n\n系统论的解释\n- 逻辑可以靠语言支持\n- 但逻辑远远不够\n- 智能不能局限于逻辑\n- \"不讲逻辑是流氓，只讲逻辑是智盲\"\n\n相关思考\n- 语言与智能的边界 — 语言也限制了人类的感知\n- 系统论不是纯理性的，而是理性与感性的统一\n- 系统共振原理 — 共振超越逻辑推理\n- 类比、直觉、顿悟都是系统功能\n\n应用\n- AI发展中不要过度强调逻辑与理性\n- 组织管理中要允许非理性的存在\n- 创新往往来自非理性的突破\n\n参见：语言与智能的边界、系统共振原理、大系统观哲学","sources":[{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-14","page":14,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-68","page":68,"type":"pptx"},{"file":"企业市场政府大系统","url":"_原始文档/企业市场政府大系统/index.html#slide-134","page":134,"type":"pptx"},{"file":"大系统观管理哲学","url":"_原始文档/大系统观管理哲学/index.html#slide-130","page":130,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-12","page":12,"type":"pptx"}]},{"id":"生成即推理","name":"生成即推理","displayName":"生成即推理","heading":"生成即推理","tags":["大系统观","AI","认知"],"color":"#3b82f6","size":15,"text_len":400,"group":3,"content":"生成即推理\n\n核心观点\n生成式AI用前面的词预测下一个词，就是**推理**。即使这个过程只是在做概率计算或模式匹配。\n\n扩展论述\n- 人类的思考和推理也不过如此，只是更复杂、更灵活\n- 但这种复杂或灵活也不是什么超凡的本事，AI 很快就会学会\n- 宇宙中，智能可能是**凡在**的，万事万物可能皆有智能，只是水平高低不同\n\n相关观点\n- 智能只是一种系统功能，并不神奇，也非人类独有\n- 人类对智能的误解可能完全来自于人类的自高自大\n- 生成 ≠ 理解，但**正确生成 = 理解**\n\n类比、推理与顿悟\n- **类比** = 共振 → 基本的涌现（功能）\n- **推理** = 更高层次的涌现\n- **顿悟** = 更高级的涌现\n- 人这样，AI 也是这样\n\n参见：AI意识判断标准、全息有机系统论-HOST、系统共振原理","sources":[{"file":"企业市场政府大系统","url":"_原始文档/企业市场政府大系统/index.html#slide-6","page":6,"type":"pptx"},{"file":"企业市场政府大系统","url":"_原始文档/企业市场政府大系统/index.html#slide-101","page":101,"type":"pptx"},{"file":"企业市场政府大系统","url":"_原始文档/企业市场政府大系统/index.html#slide-106","page":106,"type":"pptx"},{"file":"企业市场政府大系统","url":"_原始文档/企业市场政府大系统/index.html#slide-108","page":108,"type":"pptx"},{"file":"企业市场政府大系统","url":"_原始文档/企业市场政府大系统/index.html#slide-113","page":113,"type":"pptx"},{"file":"大系统观管理哲学","url":"_原始文档/大系统观管理哲学/index.html#slide-5","page":5,"type":"pptx"},{"file":"大系统观管理哲学","url":"_原始文档/大系统观管理哲学/index.html#slide-67","page":67,"type":"pptx"},{"file":"大系统观管理哲学","url":"_原始文档/大系统观管理哲学/index.html#slide-69","page":69,"type":"pptx"},{"file":"大系统观管理哲学","url":"_原始文档/大系统观管理哲学/index.html#slide-74","page":74,"type":"pptx"},{"file":"大系统观管理哲学","url":"_原始文档/大系统观管理哲学/index.html#slide-84","page":84,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-163","page":163,"type":"pptx"}]},{"id":"知行合一","name":"知行合一","displayName":"知行合一","heading":"知行合一","tags":["大系统观","方法论","实践"],"color":"#f4305e","size":12,"text_len":316,"group":7,"content":"知行合一\n\n概述\n大系统观的实践哲学。\n\n核心观点\n要知行合一，要敢于行动。**失败是逆向强化学习，更有效。**\n\n大系统观的知行观\n- 大系统观不仅要\"知道\"，更要\"做到\"\n- 大系统观、大信息观，关键是——**干！**\n- 学习、思考、行动三位一体\n\n相关论述\n- 七色光方法中的 Loop（迭代精进）\n- 习近平：撸起袖子，加油干！\n- 功成不必在我，功成必定有我\n\n系统论的实践特征\n大系统观不是纯理论，而是方法论+实践论：\n- 学：广泛学习系统理论\n- 想：结合实际情况思考\n- 干：在实践中检验和完善\n\n参见：七色光方法、自我实现原理、大系统观-核心定义","sources":[{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-120","page":120,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-14","page":14,"type":"pptx"}]},{"id":"福瑞斯特与圣吉","name":"福瑞斯特与圣吉","displayName":"福瑞斯特与圣吉","heading":"福瑞斯特与圣吉","tags":["系统论","人物","系统动力学"],"color":"#10b181","size":11,"text_len":257,"group":2,"content":"福瑞斯特与圣吉\n\n福瑞斯特（Jay Forrester）\n- 系统动力学的创始人\n- 创建了系统动力学的方法论和工具\n- 研究工业动力学、城市动力学、世界动力学\n\n圣吉（Peter Senge）\n- 福瑞斯特的学生\n- 著《第五项修炼》\n- 提出学习型组织的概念\n\n与大系统观的关系\n福瑞斯特的系统动力学为系统结构动力学-SSD提供了基础，圣吉的学习型组织理论呼应了全息有机系统论-HOST的有机特性。\n\n参见：系统结构动力学-SSD、全息有机系统论-HOST","sources":[{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-115","page":115,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-123","page":123,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-124","page":124,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-125","page":125,"type":"pptx"}]},{"id":"算力存储传输替代原理","name":"算力存储传输替代原理","displayName":"算力存储传输替代原理","heading":"算力存储传输替代原理","tags":["大系统观","系统论","原理"],"color":"#10b181","size":14,"text_len":379,"group":2,"content":"算力存储传输替代原理\n\n概述\n大系统观指出，人工智能领域的算力、存储力、传输力在一定程度上可以互相替代。\n\n替代关系\n- **算力 ↔ 存储**：用算力压缩文件可以降低存储需求\n- **算力 ↔ 传输**：将处理中间成果存储起来，下次处理时减少算力需求\n- **存储 ↔ 传输**：高速网络可以降低磁盘存储和内存需求\n\n系统思维\n存算传需要**统筹考虑**，要有大系统思维：\n- 不能孤立地优化某一个资源\n- 要从系统整体出发进行资源配置\n- 参见全息有机系统论-HOST的代偿能力\n\n应用\n- 数据中心设计：平衡计算、存储、网络投入\n- AI训练：合理分配预处理、存储和重算的比例\n- 边缘计算：根据网络条件灵活调整计算位置\n\n参见：GPU与算力、全息有机系统论-HOST、系统结构动力学-SSD","sources":[{"file":"企业市场政府大系统","url":"_原始文档/企业市场政府大系统/index.html#slide-108","page":108,"type":"pptx"},{"file":"企业市场政府大系统","url":"_原始文档/企业市场政府大系统/index.html#slide-109","page":109,"type":"pptx"},{"file":"企业市场政府大系统","url":"_原始文档/企业市场政府大系统/index.html#slide-113","page":113,"type":"pptx"},{"file":"企业市场政府大系统","url":"_原始文档/企业市场政府大系统/index.html#slide-117","page":117,"type":"pptx"},{"file":"企业市场政府大系统","url":"_原始文档/企业市场政府大系统/index.html#slide-118","page":118,"type":"pptx"},{"file":"大系统观管理哲学","url":"_原始文档/大系统观管理哲学/index.html#slide-69","page":69,"type":"pptx"},{"file":"大系统观管理哲学","url":"_原始文档/大系统观管理哲学/index.html#slide-70","page":70,"type":"pptx"},{"file":"大系统观管理哲学","url":"_原始文档/大系统观管理哲学/index.html#slide-74","page":74,"type":"pptx"},{"file":"大系统观管理哲学","url":"_原始文档/大系统观管理哲学/index.html#slide-78","page":78,"type":"pptx"},{"file":"大系统观管理哲学","url":"_原始文档/大系统观管理哲学/index.html#slide-79","page":79,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-147","page":147,"type":"pptx"}]},{"id":"系统-定义与特性","name":"系统-定义与特性","displayName":"系统定义与特性","heading":"系统定义与特性","tags":["系统论","核心概念","基础"],"color":"#10b181","size":14,"text_len":368,"group":2,"content":"系统定义与特性\n\n定义\n**系统（System）** 一词来源于古代希腊文（systεmα），意为\"由各个部分组成的一个整体\"。\n\n贝塔朗菲（贝塔朗菲）的定义：\n> 系统是相互联系相互作用的诸元素的综合体。\n\n形式化定义\n如果对象集 S 满足下列两个条件：\n1. S 中至少包含两个不同元素\n2. S 中的元素按一定方式相互联系\n\n则称 S 为一个系统，S 的元素为系统的组分。\n\n三个基本特性\n1. **多元性** — 系统是多样性的统一、差异性的统一\n2. **相关性** — 元素间相互联系、相互作用\n3. **整体性** — 系统具有整体涌现性\n\n系统三要素\n- 元素（组分）\n- 结构（元素间的联系）\n- 功能（系统对外的作用）\n\n参见：系统科学体系、老三论、新三论","sources":[{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-61","page":61,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-119","page":119,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-82","page":82,"type":"pptx"}]},{"id":"系统体增长原理","name":"系统体增长原理","displayName":"系统体增长原理","heading":"系统体增长原理","tags":["SSD","系统结构动力学","原理"],"color":"#f97316","size":13,"text_len":349,"group":0,"content":"系统体增长原理\n\n概述\n系统结构动力学-SSD的基本原理之一。\n\n核心观点\n系统规模（体量）的增长遵循一定规律：\n- 系统规模是系统第一属性\n- 规模变化会引起系统结构、功能和行为的质变\n- 系统增长不是线性的，存在关键临界点\n- 超过临界点后，系统可能进入新的发展阶段或面临崩溃\n\n与ScalingLaw的关系\n系统体增长原理与Scaling Law相通，强调规模对系统规律的决定性作用。增长要关注各维度的协同变化。\n\n应用\n- 企业增长：规模不同阶段需要不同的管理模式\n- 城市发展：城市规模超过临界点需要基础设施变革\n- 技术系统：用户规模增长需要架构升级\n\n参见：系统结构动力学-SSD、ScalingLaw、系统边界原理","sources":[{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-14","page":14,"type":"pptx"}]},{"id":"系统作用累积原理","name":"系统作用累积原理","displayName":"系统作用累积原理","heading":"系统作用累积原理","tags":["SSD","系统结构动力学","原理"],"color":"#f97316","size":12,"text_len":287,"group":0,"content":"系统作用累积原理\n\n概述\n系统结构动力学-SSD的基本原理之一。\n\n核心观点\n系统的驱动力和作用具有累积效应：\n- 持续的小作用力可以产生大的系统变化\n- 作用力在时间上的累积会超过单次大力作用\n- 系统对作用力的响应是非线性的\n\n意义\n- \"水滴石穿\"的系统论解释\n- 长期坚持微小改进比短期大幅变革更有效\n- 系统演化是迭代精进（Loop）的过程\n\n应用\n- 组织变革：小步快跑\n- 个人成长：持续学习\n- 系统优化：持续完善\n\n参见：系统结构动力学-SSD、系统驱动力合成原理、七色光方法","sources":[{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-14","page":14,"type":"pptx"}]},{"id":"系统共振原理","name":"系统共振原理","displayName":"系统共振原理","heading":"系统共振原理","tags":["SSD","系统结构动力学","原理"],"color":"#f97316","size":13,"text_len":357,"group":0,"content":"系统共振原理\n\n概述\n系统共振原理是系统结构动力学-SSD的基本原理之一。\n\n核心观点\n- 两系统交换信息时，如果双方能够互相理解这个信息，就是**共振**\n- 共振的信息就是有序的\n- 不能共振的信息就是无序的\n\n类比与涌现\n- **类比**就是共振，带来了基本的涌现——功能\n- **推理**是在此基础上涌现出来的更高级的功能\n- 下一个更高级的功能也将涌现——**顿悟**\n- 人这样，AI也是这样\n\n应用\n- 组织间的沟通与协作\n- 人机交互中的信息传递\n- 学习中的\"举一反三\"\n\n相关观点\n- \"不讲逻辑是流氓，只讲逻辑是智盲\" — 理性即藩篱\n- 系统参量边际作用原理\n\n参见：系统结构动力学-SSD、全息有机系统论-HOST","sources":[{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-14","page":14,"type":"pptx"}]},{"id":"系统博弈论","name":"系统博弈论","displayName":"系统博弈论","heading":"系统博弈论","tags":["大系统观","SSD","博弈"],"color":"#f97316","size":12,"text_len":292,"group":0,"content":"系统博弈论\n\n概述\n大系统观视角下的博弈论，由系统结构动力学-SSD推导而来。\n\n核心法则\n**多方竞争场景**：长板长者胜 — 因为长板是合作的条件\n**双方对决场景**：短板短者败 — 因为短板是续命的条件\n\n应用\n当今世界格局实际是对决场景：\n- 相对而言，我们没有明显短板\n- 通过系统思维识别和弥补短板\n- 在多方合作中发挥长板优势\n\n方法论\n- 认清所处的场景是竞争还是对决\n- 竞争场景：发展长板，寻求合作\n- 对决场景：弥补短板，系统优化\n\n参见：系统结构动力学-SSD、势力云边界原理、系统参量边际作用原理","sources":[{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-14","page":14,"type":"pptx"}]},{"id":"系统参量边际作用原理","name":"系统参量边际作用原理","displayName":"系统参量边际作用原理","heading":"系统参量边际作用原理","tags":["SSD","系统结构动力学","原理"],"color":"#f97316","size":13,"text_len":348,"group":0,"content":"系统参量边际作用原理\n\n概述\n系统结构动力学-SSD的基本原理之一。\n\n核心观点\n系统中各参量的作用效果随参量值的增加而边际递减：\n- 每一单位参量增加带来的效果增量递减\n- 存在最优参量值，超过后投入产出比下降\n- 不同参量的边际递减速率不同\n\n与经济学的关系\n此原理可以看作经济学\"边际效用递减\"在系统论中的推广，适用于各类系统的参量分析。\n\n应用\n- 资源配置：识别各资源的边际效用，优化配置\n- 系统优化：找到最优参量值，避免过度投入\n- 管理决策：识别关键制约因素，精准施力\n\n相关原理\n- 吸引力递减原理\n- 黄金序律 — 有序与有用的边际平衡\n\n参见：系统结构动力学-SSD、吸引力递减原理、黄金序律","sources":[{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-14","page":14,"type":"pptx"}]},{"id":"系统学","name":"系统学","displayName":"系统学","heading":"系统学","tags":["系统论","概念"],"color":"#10b181","size":11,"text_len":244,"group":2,"content":"系统学\n\n概述\n系统学（Systematology / Systems Science）是系统科学体系的基础科学层次，研究系统的一般规律。\n\n钱学森的遗愿\n钱学森生前一直挂念系统学的全面建立。他认为应该建立一个完整的系统学体系，作为系统科学的基础理论。\n\n现状\n- 近半个世纪以来，系统论仍无太大新进展\n- 系统学仍未全面建立\n- 大系统观的提出是对建立系统学的一种探索和尝试\n\n参见：系统科学体系、钱学森","sources":[{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-18","page":18,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-113","page":113,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-14","page":14,"type":"pptx"}]},{"id":"系统工程","name":"系统工程","displayName":"系统工程","heading":"系统工程","tags":["系统论","方法论","工程"],"color":"#10b181","size":11,"text_len":268,"group":2,"content":"系统工程\n\n概述\n系统工程（Systems Engineering）是系统科学体系的工程技术层次，是应用系统理论解决实际工程问题的方法论。\n\n与大系统观的关系\n- 钱学森特别重视系统工程，将其作为系统科学体系的重要组成部分\n- 数字油田建设是系统工程\n- 大系统观强调系统工程的思维和方法\n\n核心原则\n- 整体优化而非局部最优\n- 系统分析、设计、实施的全生命周期管理\n- 多学科、多领域的综合集成\n\n参见：系统科学体系、钱学森、数字油田大系统观","sources":[{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-18","page":18,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-113","page":113,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-202","page":202,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-14","page":14,"type":"pptx"}]},{"id":"系统惯性原理","name":"系统惯性原理","displayName":"系统惯性原理","heading":"系统惯性原理","tags":["SSD","系统结构动力学","原理"],"color":"#f97316","size":10,"text_len":226,"group":0,"content":"系统惯性原理\n\n概述\n系统结构动力学-SSD的基本原理之一。\n\n核心观点\n系统具有惯性：\n- 系统在不受外力或受平衡力作用时，保持原有的运动状态\n- 系统规模越大，惯性越大，改变越困难\n- 系统惯性是系统保持稳定性的基础，也是系统变革的阻力\n\n启示\n- 改革需要克服系统惯性\n- 组织转型要考虑惯性的影响\n- 适度的惯性有利于系统稳定\n\n参见：系统结构动力学-SSD、系统边界原理、系统作用累积原理","sources":[{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-14","page":14,"type":"pptx"}]},{"id":"系统科学体系","name":"系统科学体系","displayName":"系统科学体系","heading":"系统科学体系","tags":["系统论","科学体系","方法论"],"color":"#10b181","size":12,"text_len":317,"group":2,"content":"系统科学体系\n\n概述\n系统科学是一个学科群，包括众多各层次、各方面的学科。钱学森的系统科学体系将系统论引入中国，创立了\"中西合璧\"的系统科学体系，将系统论提升到了哲学层面。\n\n体系层次\n1. **哲学层次** — 系统论（哲学层面）\n2. **基础科学层次** — 系统学\n3. **技术科学层次** — 运筹学、控制论、信息论\n4. **工程技术层次** — 系统工程\n\n核心学科\n- 老三论：一般系统论、控制论、信息论\n- 新三论：耗散结构理论、协同学、突变论\n- 系统结构动力学-SSD\n- 全息有机系统论-HOST\n\n参见：钱学森、系统-定义与特性","sources":[{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-18","page":18,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-61","page":61,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-113","page":113,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-119","page":119,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-14","page":14,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-82","page":82,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-12","page":12,"type":"pptx"}]},{"id":"系统结构功能原理","name":"系统结构功能原理","displayName":"系统结构功能原理","heading":"系统结构功能原理","tags":["大系统观","基本原理","系统论"],"color":"#10b181","size":13,"text_len":323,"group":2,"content":"系统结构功能原理\n\n概述\n\"系统结构决定系统功能\"是最基本的系统论原理，也是大系统观的基石。\n\n核心观点\n- 系统的功能由其结构决定\n- 改变系统结构就能改变系统功能\n- 相同的元素不同的结构 → 完全不同的功能\n\n大系统观的深化\n系统结构动力学-SSD在此基础上进一步指出：\n- 结构不是静态的，而是动态演化的\n- 要研究结构，更要研究结构的变化\n- 系统优化 = 结构优化\n\n应用\n- 组织变革：调整组织结构以改变组织能力\n- 软件架构：架构设计决定系统能力\n- 社会治理：制度设计决定治理效果\n\n参见：系统结构动力学-SSD、系统-定义与特性、涌现原理","sources":[{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-14","page":14,"type":"pptx"}]},{"id":"系统结构动力学-SSD","name":"系统结构动力学-SSD","displayName":"系统结构动力学 SSD","heading":"系统结构动力学 SSD","tags":["大系统观","核心理论","SSD"],"color":"#f97316","size":17,"text_len":485,"group":0,"content":"系统结构动力学 SSD\n\n概述\n系统结构动力学（System Structure Dynamics, SSD）是王权教授创造性提出的系统分析理论，强调系统结构对系统功能的决定作用，以及结构随时间动态演化的规律。\n\n核心原理\n- **\"系统结构决定系统功能\"** — 这是最基本的系统论原理\n- 结构不是静态的，而是动态演化的\n- 研究系统要关注结构，更要关注结构的变化\n\nSSD 基本原理体系\n1. 吸引子能动性原理\n2. 系统惯性原理\n3. 系统边界原理\n4. 势力云边界原理\n5. 吸引力递减原理\n6. 耦合度定理\n7. 系统驱动力合成原理\n8. 系统作用累积原理\n9. 系统参量边际作用原理\n10. 系统共振原理\n11. 系统体增长原理\n\nSSD 与系统动力学的关系\n- 继承传统系统动力学的基本思想\n- 弥补其不足，更重视结构分析\n- 将系统结构与动力学分析相结合\n\n参见：全息有机系统论-HOST、大系统观哲学、黄金序律","sources":[{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-146","page":146,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-147","page":147,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-148","page":148,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-149","page":149,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-14","page":14,"type":"pptx"}]},{"id":"系统观层次","name":"系统观层次","displayName":"系统观层次","heading":"系统观层次","tags":["大系统观","哲学","认知层次"],"color":"#8b68f6","size":17,"text_len":498,"group":1,"content":"系统观层次\n\n概述\n系统观从低到高分为6个层次（Grade 0-5），反映了一个人对系统思维的掌握程度。\n\n层次划分\n\nGrade 0：无系统观\n活着就行，逆来顺受。没有问题。\n\nGrade 1：初步系统观\n有整体观念，懂得结构性和层次性的意义，做事讲套路，思维较全面，能够发现问题。\n\nGrade 2：实用系统观\n会使用一些系统科学工具，理解老三论（一般系统论、信息论、控制论），理解团队的实质，组织力强善于协作，能解决问题。\n\nGrade 3：高级系统观\n更关注哲学层面的系统论，理解新三论（耗散结构理论、协同学、突变论），洞察事物本质，善于引导自组织力，系统地解决问题。\n\nGrade 4：大系统观\n有大智慧，不争执、不纠结、顺势而为，有使命感，有所为有所不为，知不可为而为之，懂得回避问题。\n\nGrade 5：逍遥系统观\n洞察一切，有自己的思维和逻辑，神仙，会设置问题。\n\n意义\n系统观层次理论说明了系统思维是一个逐步提升的过程，每个人都处在不同的层次上。\n\n参见：大系统观哲学、大系统观-核心定义","sources":[{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-61","page":61,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-119","page":119,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-82","page":82,"type":"pptx"}]},{"id":"系统论与治国理政","name":"系统论与治国理政","displayName":"系统论与治国理政","heading":"系统论与治国理政","tags":["大系统观","治国理政","政治"],"color":"#ef4444","size":15,"text_len":428,"group":5,"content":"系统论与治国理政\n\n概述\n大系统观在国家治理层面的应用。\n\n重要论述\n- 十九大报告：着力增强改革**系统性、整体性、协同性**\n- \"十四五\"时期将\"坚持系统观念\"作为五项原则之一\n- 指明了提高社会主义现代化事业组织管理水平的方向\n\n系统思维在国家治理中的体现\n中国共产党是序参量\n- 支配和协调各子系统\n- 坚持民主集中制\n- 强大的吸引子作用\n\n耗散结构系统\n- 改革开放使中国成为开放系统\n- 与外界持续交换物质、能量、信息\n- 在非平衡态中保持有序\n\n中国是全息有机系统\n- 各级组织全息响应中央号召\n- 各地方、各部门有机协同\n- 使命驱动、自我完善\n\n历史案例\n- 辽沈战役：基于不确定性的确定性原理\n- 互联网+的精神实质：系统思维与创新\n- 构建新型大国关系：系统博弈论的应用\n\n参见：大系统观与马克思主义、中国是全息有机系统","sources":[{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-97","page":97,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-111","page":111,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-119","page":119,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-134","page":134,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-14","page":14,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-38","page":38,"type":"pptx"},{"file":"企业市场政府大系统","url":"_原始文档/企业市场政府大系统/index.html#slide-60","page":60,"type":"pptx"},{"file":"大系统观管理哲学","url":"_原始文档/大系统观管理哲学/index.html#slide-57","page":57,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-12","page":12,"type":"pptx"}]},{"id":"系统边界原理","name":"系统边界原理","displayName":"系统边界原理","heading":"系统边界原理","tags":["SSD","系统结构动力学","原理"],"color":"#f97316","size":12,"text_len":304,"group":0,"content":"系统边界原理\n\n概述\n系统结构动力学-SSD的基本原理之一。\n\n核心观点\n- 每个系统都有其边界\n- 边界决定了系统的范围、内容和与外界的交互方式\n- 边界的清晰度影响系统的稳定性和效率\n- 边界不是固定不变的，而是动态调整的\n\n统一与有序\n- 有序：使系统存在、有功能、有作用 — 边界内的局部问题\n- 统一：整合形成更大的系统 — 超系统中子系统关系的有序\n- 统一和有序并不矛盾，是不同层次的问题\n\n应用\n- 组织管理中明确职责边界\n- 系统设计中定义模块边界\n- 国家治理中势力的边界\n\n参见：系统结构动力学-SSD、势力云边界原理、吸引子","sources":[{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-149","page":149,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-14","page":14,"type":"pptx"}]},{"id":"系统驱动力合成原理","name":"系统驱动力合成原理","displayName":"系统驱动力合成原理","heading":"系统驱动力合成原理","tags":["SSD","系统结构动力学","原理"],"color":"#f97316","size":11,"text_len":272,"group":0,"content":"系统驱动力合成原理\n\n概述\n系统结构动力学-SSD的基本原理之一。\n\n核心观点\n系统的演化方向由多种驱动力的合力决定：\n- 系统内部有多个吸引子，各自产生驱动力\n- 系统受到的驱动力是各力的矢量和\n- 合力方向决定了系统的实际演化方向\n- 不同驱动力可能同向（加速）、异向（减速）或垂直（转向）\n\n意义\n- 要理解系统的行为，必须先分析其受力情况\n- 改变系统方向的关键是调整驱动力结构\n- 系统管理需要识别和引导主要驱动力\n\n参见：系统结构动力学-SSD、吸引子、系统作用累积原理","sources":[{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-14","page":14,"type":"pptx"}]},{"id":"组织与自组织","name":"组织与自组织","displayName":"组织与自组织","heading":"组织与自组织","tags":["系统论","方法论","管理"],"color":"#10b181","size":13,"text_len":341,"group":2,"content":"组织与自组织\n\n定义\n- **组织** — 系统外部力量对系统进行的有序化安排（他组织）\n- **自组织** — 系统内部自发形成的有序结构\n\n上帝的三件法宝之一\n上帝送给人类的3件法宝：\n1. 工具：系统-定义与特性\n2. 材料：信息本质\n3. 方法：**组织 + 自组织**\n\n核心原理\n- 组织与自组织不是对立的，而是互补的\n- 优秀的系统需要兼顾组织力和自组织力\n- 领导者要善于引导自组织力\n- 中国共产党与人民群众的关系体现了组织与自组织的统一\n\n应用\n- 全息激光战队 — 组织+自组织的奇观\n- 企业管理中的赋权与管控\n- 社会治理中的政府与市场关系\n\n参见：序参量、耗散结构、自我实现原理","sources":[{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-97","page":97,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-111","page":111,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-119","page":119,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-14","page":14,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-38","page":38,"type":"pptx"},{"file":"企业市场政府大系统","url":"_原始文档/企业市场政府大系统/index.html#slide-60","page":60,"type":"pptx"},{"file":"大系统观管理哲学","url":"_原始文档/大系统观管理哲学/index.html#slide-57","page":57,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-12","page":12,"type":"pptx"}]},{"id":"维纳","name":"维纳","displayName":"维纳","heading":"维纳","tags":["系统论","人物","控制论"],"color":"#10b181","size":9,"text_len":189,"group":2,"content":"维纳\n\n概述\n诺伯特·维纳（Norbert Wiener），控制论的创始人。\n\n主要贡献\n- 1948年出版《控制论》\n- 研究系统的控制和通信\n- 提出了反馈机制的核心概念\n\n与控制论\n控制论研究动态系统在各种控制机制下的行为，是老三论的核心组成部分，也是系统科学体系的基础。\n\n参见：老三论、系统科学体系","sources":[{"file":"企业市场政府大系统","url":"_原始文档/企业市场政府大系统/index.html#slide-109","page":109,"type":"pptx"},{"file":"大系统观管理哲学","url":"_原始文档/大系统观管理哲学/index.html#slide-70","page":70,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-99","page":99,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-75","page":75,"type":"pptx"}]},{"id":"老三论","name":"老三论","displayName":"老三论","heading":"老三论","tags":["系统论","经典理论","老三论"],"color":"#10b181","size":10,"text_len":214,"group":2,"content":"老三论\n\n系统论的三个基础理论，奠定了系统论的基础。\n\n一般系统论\n- 创始人：贝塔朗菲\n- 时间：1937年\n- 核心：研究系统的普遍规律\n\n控制论\n- 创始人：维纳\n- 时间：1948年\n- 核心：研究系统的控制和通信\n\n信息论\n- 创始人：香农\n- 时间：1948年\n- 核心：研究信息的度量、存储和传递\n\n参见：新三论、系统科学体系、系统-定义与特性","sources":[{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-61","page":61,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-110","page":110,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-111","page":111,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-112","page":112,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-119","page":119,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-40","page":40,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-41","page":41,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-82","page":82,"type":"pptx"},{"file":"企业市场政府大系统","url":"_原始文档/企业市场政府大系统/index.html#slide-109","page":109,"type":"pptx"},{"file":"大系统观管理哲学","url":"_原始文档/大系统观管理哲学/index.html#slide-70","page":70,"type":"pptx"}]},{"id":"耗散结构","name":"耗散结构","displayName":"耗散结构","heading":"耗散结构","tags":["系统论","新三论","自组织"],"color":"#10b181","size":14,"text_len":366,"group":2,"content":"耗散结构\n\n概述\n耗散结构理论由普利高津提出，研究开放系统在远离平衡态时如何形成有序结构。\n\n核心思想\n- 开放系统通过与外界交换物质和能量，可以从无序状态自发形成有序结构\n- 这种结构需要不断消耗能量来维持，因此称为\"耗散结构\"\n- 改革开放的总设计师邓小平把中国变成了一个耗散结构系统\n\n耗散结构的条件\n1. **开放性** — 系统必须与外界交换物质、能量、信息\n2. **远离平衡态** — 系统处于非平衡状态\n3. **非线性** — 系统内部存在非线性相互作用\n4. **涨落** — 微小的涨落可能被放大导致系统演化\n\n吸引子的作用\n耗散结构系统需要强大的、优秀的吸引子，否则可能会解体。\n\n参见：新三论、序参量、组织与自组织","sources":[{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-119","page":119,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-128","page":128,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-139","page":139,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-38","page":38,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-82","page":82,"type":"pptx"}]},{"id":"耦合度定理","name":"耦合度定理","displayName":"耦合度定理","heading":"耦合度定理","tags":["SSD","系统结构动力学","原理"],"color":"#f97316","size":13,"text_len":332,"group":0,"content":"耦合度定理\n\n概述\n系统结构动力学-SSD的基本原理之一。\n\n核心观点\n系统中各子系统之间的耦合程度影响系统的整体性能和稳定性：\n- **松耦合**：子系统间独立性高，灵活性好，但协调成本高\n- **紧耦合**：子系统间联系紧密，协调效率高，但灵活性差\n- 最优耦合度取决于系统的具体目标和环境\n\n应用\n- 软件设计：模块间的松耦合、高内聚\n- 组织设计：部门间的协作强度设计\n- 系统集成：各系统的整合程度把握\n\n大系统观视角\n因特奈特主义强调的是松耦合的网络结构，而传统管理倾向于紧耦合的控制模式。好的系统设计需要根据实际情况灵活选择。\n\n参见：系统结构动力学-SSD、因特奈特主义、黄金序律","sources":[{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-120","page":120,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-91","page":91,"type":"pptx"},{"file":"企业市场政府大系统","url":"_原始文档/企业市场政府大系统/index.html#slide-76","page":76,"type":"pptx"},{"file":"大系统观管理哲学","url":"_原始文档/大系统观管理哲学/index.html#slide-95","page":95,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-14","page":14,"type":"pptx"}]},{"id":"自我实现原理","name":"自我实现原理","displayName":"自我实现原理","heading":"自我实现原理","tags":["大系统观","方法论","原理"],"color":"#f4305e","size":14,"text_len":360,"group":7,"content":"自我实现原理\n\n概述\n自我实现原理是大系统观的重要原理，探讨系统的使命驱动和自我实现机制。\n\n理论基础\n- 马斯洛需求层次论 — 人的需求层次\n- 组织与自组织 — 系统的自组织特性\n- 吸引子 — 系统的使命核心\n\n核心观点\n系统的使命\n- 每个系统都有其使命（Mission）\n- 使命是系统存在和发展的根本原因\n- 系统的功能就是系统意志的表现\n\n系统的自我实现\n- 系统有自我实现的倾向\n- 系统在实现使命的过程中发展自身\n- 自我实现是系统演化的内在动力\n\n应用\n- 个人发展：找到使命，自我实现\n- 组织建设：明确使命，激励团队\n- 产品设计：以使命为导向的功能规划\n\n参见：七色光方法、组织与自组织、大系统观-核心定义","sources":[{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-120","page":120,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-133","page":133,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-72","page":72,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-75","page":75,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-14","page":14,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-38","page":38,"type":"pptx"}]},{"id":"自标准数据","name":"自标准数据","displayName":"自标准数据","heading":"自标准数据","tags":["大系统观","数据","方法论"],"color":"#f4305e","size":14,"text_len":393,"group":7,"content":"自标准数据\n\n概述\n自标准数据（Self-standard Data）是因特奈特主义思想在数据领域的应用，由王权教授提出。\n\n核心概念\n- **自标准**：数据自动形成标准，而不是被外部强加标准\n- 自标准与标准是互补关系，不是对立关系\n- 自标准数据具有自我描述、自我定义的能力\n\n理论基础\n- 因特奈特主义 — 互联网的去中心化思想\n- 自标准 = 自组织在数据领域的体现\n- 标准是组织的结果，自标准是自组织的结果\n\n实现方式：数据港口\n数据港口（Data Port）是自标准数据的实现载体：\n- 数据像船一样在港口间流动\n- 每个数据港口有统一的接口标准\n- 数据格式在流动中自然标准化\n\n应用\n- 油田数据标准化\n- 企业数据治理\n- 跨系统的数据交换\n\n参见：因特奈特主义、数字油田大系统观、信息本质","sources":[{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-119","page":119,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-14","page":14,"type":"pptx"}]},{"id":"西哲大咖们","name":"西哲大咖们","displayName":"西哲大咖们","heading":"西哲大咖们","tags":["大系统观","哲学","工具"],"color":"#8b68f6","size":17,"text_len":497,"group":1,"content":"西哲大咖们\n\n概述\n王权教授使用阿色全息脑图-AHMM整理的西方哲学家全息脑图，包括70位哲学家。\n\n涵盖的哲学家\n泰勒斯、毕达哥拉斯、赫拉克利特、巴门尼德、恩培多克勒、阿那克萨哥拉、德谟克利特、普罗泰戈拉、苏格拉底、柏拉图、亚里士多德、第欧根尼、伊壁鸠鲁、芝诺、马可·奥勒留、普罗提诺、奥古斯丁、约翰·司各特、伊本·西那、罗塞林、阿贝拉德、大阿尔伯特、托马斯·阿奎那、奥卡姆的威廉、马基雅维利、伊拉斯谟、培根、霍布斯、笛卡尔、斯宾诺莎、莱布尼茨、洛克、贝克莱、休谟、卢梭、康德、黑格尔、叔本华、克尔凯郭尔、马克思、尼采、弗雷格、索绪尔、柏格森、杜威、胡塞尔、罗素、雅斯贝尔斯、维特根斯坦、海德格尔、克里希那穆提、萨特、梅洛-庞蒂、加缪、罗尔斯、德勒兹、普特南、福柯、哈贝马斯、德里达、石里克、波普尔、奎因、本格、库恩、费耶阿本德、夏佩尔、罗蒂、丹尼尔·丹尼特、尤瓦尔·赫拉利\n\n特点\n- 以罗素为分界点，之前以《西方哲学史》为主要资料\n- 现当代哲学家由其他资料补充\n- 基于王权教授以往读书笔记整理\n\n参见：阿色全息脑图-AHMM、大系统观哲学"},{"id":"语言与智能的边界","name":"语言与智能的边界","displayName":"语言与智能的边界","heading":"语言与智能的边界","tags":["大系统观","AI","哲学","语言"],"color":"#8b68f6","size":15,"text_len":403,"group":1,"content":"语言与智能的边界\n\n核心观点\n语言是智能的一个维度，但**不是智能的全部**。\n\n哲学渊源\n- 维特根斯坦：语言的边界就是世界的边界\n- 康德：物自体不可知\n- 大系统观：语言确实限制了人类的感知范围和能力\n\nAI 的启示\n- 如果把大语言模型当作全能系统，你会很失望\n- 如果只把它当作一个文字秘书，它很厉害\n- 大语言模型被语言困住了，不能了解物理世界\n- 人工智能不应该被大语言模型限制\n\n突破方向\n- 不应被语言限制\n- 不应被逻辑限制\n- 不应被理性限制\n- 不应被符号主义限制\n- 基于人工神经网络的**多模态大模型**（如世界模型）可以为AI提供更大空间\n\n佛学印证\n- 《金刚经》：\"所言法相者，如来说即非法相，是名法相。\"\n- 《楞严经》：\"言语道断，心行处灭。\"\n- 语言是工具而非真理本身\n\n参见：世界模型与具身智能、AI意识判断标准","sources":[{"file":"企业市场政府大系统","url":"_原始文档/企业市场政府大系统/index.html#slide-52","page":52,"type":"pptx"},{"file":"企业市场政府大系统","url":"_原始文档/企业市场政府大系统/index.html#slide-106","page":106,"type":"pptx"},{"file":"企业市场政府大系统","url":"_原始文档/企业市场政府大系统/index.html#slide-108","page":108,"type":"pptx"},{"file":"企业市场政府大系统","url":"_原始文档/企业市场政府大系统/index.html#slide-110","page":110,"type":"pptx"},{"file":"企业市场政府大系统","url":"_原始文档/企业市场政府大系统/index.html#slide-112","page":112,"type":"pptx"},{"file":"大系统观管理哲学","url":"_原始文档/大系统观管理哲学/index.html#slide-50","page":50,"type":"pptx"},{"file":"大系统观管理哲学","url":"_原始文档/大系统观管理哲学/index.html#slide-67","page":67,"type":"pptx"},{"file":"大系统观管理哲学","url":"_原始文档/大系统观管理哲学/index.html#slide-69","page":69,"type":"pptx"},{"file":"大系统观管理哲学","url":"_原始文档/大系统观管理哲学/index.html#slide-71","page":71,"type":"pptx"},{"file":"大系统观管理哲学","url":"_原始文档/大系统观管理哲学/index.html#slide-73","page":73,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-156","page":156,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-191","page":191,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-27","page":27,"type":"pptx"}]},{"id":"贝塔朗菲","name":"贝塔朗菲","displayName":"贝塔朗菲","heading":"贝塔朗菲","tags":["系统论","人物","思想家"],"color":"#10b181","size":11,"text_len":244,"group":2,"content":"贝塔朗菲\n\n概述\n路德维希·冯·贝塔朗菲（Ludwig von Bertalanffy），一般系统论的创始人。\n\n主要贡献\n- 1937年提出《一般系统论》\n- 系统定义：\"系统是相互联系相互作用的诸元素的综合体\"\n- 奠定了现代系统论的基础\n\n与大系统观的关系\n贝塔朗菲的一般系统论是大系统观的重要理论来源之一，大系统观在其基础上进行了继承和发展。\n\n参见：老三论、系统科学体系、系统-定义与特性","sources":[{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-119","page":119,"type":"pptx"}]},{"id":"迭代精进原理","name":"迭代精进原理","displayName":"迭代精进原理","heading":"迭代精进原理","tags":["大系统观","方法论","原理"],"color":"#f4305e","size":13,"text_len":353,"group":7,"content":"迭代精进原理\n\n概述\n迭代精进（Loop）是七色光方法的核心原则之一，也是大系统观的重要方法论。\n\n核心思想\n- 系统演化不是一蹴而就的，而是通过不断迭代实现的\n- 每次迭代都是在前一次基础上优化\n- 持续改进、螺旋上升\n\n理论基础\n- 系统作用累积原理：持续的小作用力可以产生大的系统变化\n- 系统结构动力学-SSD：结构随时间的动态演化\n- 基于不确定性的确定性原理：在不确定性中迭代前进\n\n应用\n- 敏捷开发：小步快跑、持续交付\n- 个人成长：持续学习、迭代认知\n- 组织变革：渐进式改进而非激进变革\n- AI训练：模型持续训练和优化\n\n参见：七色光方法、系统作用累积原理、敏捷规划方法论","sources":[{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-92","page":92,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-14","page":14,"type":"pptx"}]},{"id":"钱学森","name":"钱学森","displayName":"钱学森","heading":"钱学森","tags":["系统论","人物","思想家"],"color":"#10b181","size":11,"text_len":240,"group":2,"content":"钱学森\n\n概述\n钱学森是中国系统科学的奠基人，创立了\"中西合璧\"的系统科学体系。\n\n主要贡献\n- 将系统论引入中国\n- 创立系统科学体系\n- 重视系统工程\n- 将系统论提升到了哲学层面\n- 生前一直挂念系统学的全面建立\n\n系统科学体系\n参见系统科学体系的四层次结构。\n\n与大系统观的关系\n钱学森认为马克思的辩证唯物主义就是系统哲学，只需把系统科学最新进展丰富进去即可。\n\n参见：大系统观与马克思主义、系统科学体系","sources":[{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-18","page":18,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-113","page":113,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-202","page":202,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-14","page":14,"type":"pptx"}]},{"id":"阿色全息脑图-AHMM","name":"阿色全息脑图-AHMM","displayName":"阿色全息脑图 AHMM","heading":"阿色全息脑图 AHMM","tags":["大系统观","工具","思维"],"color":"#f4305e","size":16,"text_len":453,"group":7,"content":"阿色全息脑图 AHMM\n\n概述\n阿色全息脑图（Arthur's Holographic Mind Map, AHMM）是王权教授按照大系统观原理开发的新型思维工具，用于**升维思考**。\n\n核心原理\n- 世间每项事物都是一个系统，都有一个核心——吸引子 @\n- 全息脑图让你以系统的观点看待世界\n- 专注系统的结构信息——**全息**\n- 抓住事物的本质，透过表象和数据发现规律\n\n特点\n- 数据与执行码一体化\n- 能自己给自己保存数据\n- 能够无限运行繁衍（生成的脑图可以继续生成下一代脑图）\n- 免费开源，自由使用和分享\n\n衍生工具\n- **AHMM AI+** — AI全息脑图自动成图软件，一键成图\n- 可总结报告、书籍、网页\n- 可根据用户文本生成全息脑图\n- 甚至一句话生成脑图\n\n应用\n- 西哲大咖们全息脑图：整理了70位西方哲学家\n- 大系统观学习工具\n\n参见：全息有机系统论-HOST、小B博士","sources":[{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-9","page":9,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-65","page":65,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-75","page":75,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-80","page":80,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-123","page":123,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-2","page":2,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-30","page":30,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-80","page":80,"type":"pptx"}]},{"id":"香农","name":"香农","displayName":"香农","heading":"香农","tags":["系统论","人物","信息论"],"color":"#10b181","size":10,"text_len":222,"group":2,"content":"香农\n\n概述\n克劳德·香农（Claude Shannon），信息论的创始人。\n\n主要贡献\n- 1948年发表《通信的数学理论》\n- 创建信息论\n- 定义了信息熵的概念\n- 奠定了数字通信的理论基础\n\n与大系统观的关系\n香农的信息论为信息的度量和传递提供了科学基础，是大系统观对信息理解的理论支柱之一。\n\n参见：老三论、信息本质、熵增原理","sources":[{"file":"企业市场政府大系统","url":"_原始文档/企业市场政府大系统/index.html#slide-108","page":108,"type":"pptx"},{"file":"大系统观管理哲学","url":"_原始文档/大系统观管理哲学/index.html#slide-69","page":69,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-76","page":76,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-78","page":78,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-83","page":83,"type":"pptx"}]},{"id":"马克思与贝塔朗菲","name":"马克思与贝塔朗菲","displayName":"马克思与贝塔朗菲","heading":"马克思与贝塔朗菲","tags":["大系统观","马克思主义","系统论"],"color":"#10b181","size":10,"text_len":232,"group":2,"content":"马克思与贝塔朗菲\n\n概述\n大系统观揭示马克思与贝塔朗菲的思想呼应关系。\n\n核心观点\n- 马克思的辩证唯物主义就是系统哲学\n- 贝塔朗菲的一般系统论与马克思主义哲学相通\n- 只需把系统科学最新进展丰富到辩证唯物主义中即可\n\n意义\n这一观点为大系统观与马克思主义的结合提供了理论基础，说明系统论不是外来的，而是马克思主义的内在要求。\n\n参见：大系统观与马克思主义、贝塔朗菲、乌杰","sources":[{"file":"企业市场政府大系统","url":"_原始文档/企业市场政府大系统/index.html#slide-72","page":72,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-10","page":10,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-18","page":18,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-19","page":19,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-37","page":37,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-38","page":38,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-40","page":40,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-41","page":41,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-42","page":42,"type":"pptx"}]},{"id":"马斯洛需求层次论","name":"马斯洛需求层次论","displayName":"马斯洛需求层次论","heading":"马斯洛需求层次论","tags":["心理学","系统论","方法论"],"color":"#10b181","size":12,"text_len":311,"group":2,"content":"马斯洛需求层次论\n\n概述\n亚伯拉罕·马斯洛（Abraham Maslow）提出的需求层次理论。大系统观将其作为自我实现原理的理论基础之一。\n\n五层需求\n1. **生理需求** — 生存的基本需要\n2. **安全需求** — 人身安全、健康保障\n3. **社交需求** — 归属感、爱、人际关系\n4. **尊重需求** — 自尊、被他人尊重\n5. **自我实现** — 发挥潜能、实现理想\n\n与大系统观的关系\n- 自我实现是系统的最高追求\n- 系统的需求层次决定了系统的行为\n- 个人发展、组织成长都可从中获得启发\n\n参见：自我实现原理、组织与自组织","sources":[{"file":"企业市场政府大系统","url":"_原始文档/企业市场政府大系统/index.html#slide-106","page":106,"type":"pptx"},{"file":"大系统观管理哲学","url":"_原始文档/大系统观管理哲学/index.html#slide-67","page":67,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-69","page":69,"type":"pptx"}]},{"id":"黄金序律","name":"黄金序律","displayName":"黄金序律","heading":"黄金序律","tags":["大系统观","核心概念","原理"],"color":"#6B7280","size":17,"text_len":485,"group":-1,"content":"黄金序律\n\n概述\n黄金序律（Golden Order Law，GOL）是大系统观的核心原理之一，研究有序与有用的平衡关系。\n\n核心观点\n- 有序才有用，但**最有序不等于最有用**\n- 系统需要在有序和无序之间取得平衡\n- 数字 **7** 是黄金序律的象征——神奇的数字7代表了有序与有用的最佳平衡点\n\n关键概念\n有序与有用的平衡\n- 过分追求有序会导致系统僵化\n- 过分容忍无序会导致系统失效\n- 好的系统设计是在有序和无序之间找到最佳平衡点\n\n序的边际效用\n- 随着有序程度提高，每增加一单位有序带来的效用递减\n- 存在一个最优有序度，超过这个点就是过度工程\n\n应用方法\n- 组织管理中的\"管与放\"的平衡\n- 系统设计中的\"标准化与灵活性\"的平衡\n- 七色光方法中的 S（Seven）原则\n\n统一是更高一级的有序\n- 统一是为了在有序和无序之间取得平衡\n- 过度统一会\"勒死\"子系统\n- 看似无序的世界，其实是有序的千万次叠加\n\n参见：从混沌到有序、系统结构动力学-SSD、因特奈特主义","sources":[{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-56","page":56,"type":"pptx"},{"file":"第1讲","url":"_原始文档/第1讲/index.html#slide-120","page":120,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-12","page":12,"type":"pptx"},{"file":"第2讲","url":"_原始文档/第2讲/index.html#slide-91","page":91,"type":"pptx"},{"file":"企业市场政府大系统","url":"_原始文档/企业市场政府大系统/index.html#slide-76","page":76,"type":"pptx"},{"file":"大系统观管理哲学","url":"_原始文档/大系统观管理哲学/index.html#slide-95","page":95,"type":"pptx"},{"file":"第3讲","url":"_原始文档/第3讲/index.html#slide-14","page":14,"type":"pptx"}]},{"id":"大系统观(BSV)","name":"大系统观(BSV)","displayName":"大系统观(BSV)","heading":"大系统观知识库","tags":["导航","索引"],"text_len":2214,"color":"#fa0000","size":35,"group":9,"content":"大系统观知识库\n\n本知识库将大系统观原始核心文档拆解为细粒度知识元，并通过 Obsidian 双向链接建立网状关系图谱。知识元存放在 `知识元/` 目录下，按主题分类：\n\n核心哲学\n- 大系统观-核心定义\n- 大系统观哲学\n- 哲学的未来\n- 系统观层次\n\n哲学深化\n- 玻姆的鱼\n- 德勒兹的块茎\n- 全息影像\n- 时间与维度的猜想\n\n系统理论基础\n- 系统-定义与特性\n- 老三论\n- 新三论\n- 系统科学体系\n- 从混沌到有序\n- 熵增原理\n- 时间之矢\n- 耗散结构\n- 序参量\n- 开放耗散原理\n- 信息熵减原理\n- 序参量支配原理\n- KISS原则\n\n大系统观核心理论\n- 黄金序律\n- 涌现原理\n- 系统结构动力学-SSD\n- 全息有机系统论-HOST\n- 因特奈特主义\n- 自我实现原理\n- 七色光方法\n\n系统结构动力学（SSD）\n- 吸引子\n- 吸引子能动性原理\n- 系统共振原理\n- 系统惯性原理\n- 系统边界原理\n- 势力云边界原理\n- 系统博弈论\n- 吸引力递减原理\n- 耦合度定理\n- 系统驱动力合成原理\n- 系统作用累积原理\n- 系统参量边际作用原理\n- 系统体增长原理\n- 系统结构功能原理\n\n全息有机系统论（HOST）\n- 智能=全息+共振 — 核心公式\n- 全息系统全息原理\n- 全息系统有机原理\n- 全息系统代偿原理\n- 全息系统层级原理\n- 全息系统使命原理\n- 全息系统数据与执行码一体化原理\n- 建 function nc(tags){
  if(!tags||!tags.length)return DEFCOL;
  for(var i=0;i<GROUPS.length;i++)
    for(var j=0;j<GROUPS[i].tags.length;j++)
      if(tags.indexOf(GROUPS[i].tags[j])!==-1)return GROUPS[i].color;
  return DEFCOL;
}

function ng(tags){
  if(!tags||!tags.length)return{color:DEFCOL,label:"未分类"};
  for(var i=0;i<GROUPS.length;i++)
    for(var j=0;j<GROUPS[i].tags.length;j++)

}

// ★ 基于连接数自动计算节点大小（替代 DATA 中的 size）
// 算法: sqrt(度+1) 缩放 → 面积与连接数成正比，自动适应图的稀疏程度
(function(){
  var MIN_R=5, MAX_R=22;
  // 统计每个节点的连接数（出+入）
  var deg={};
  links.forEach(function(l){
    var s=typeof l.source==='object'?l.source.id:l.source;
    var t=typeof l.target==='object'?l.target.id:l.target;
    deg[s]=(deg[s]||0)+1; deg[t]=(deg[t]||0)+1;
  });
  var vals=Object.values(deg);
  // 没有链接的图，全部取默认大小
  if(!vals.length){nodes.forEach(function(n){n.size=(MIN_R+MAX_R)/2;});return;}
  vals.sort(function(a,b){return a-b;});
  var median=vals[Math.floor(vals.length/2)]||1;
  // Winsorized max: 用 median×4 截断极端离群值
  var rawMax=vals[vals.length-1];
  var maxDeg=Math.min(rawMax,Math.max(median*4,10));
  var minDeg=Math.max(vals[0],0);
  // sqrt 空间线性映射
  var sqMin=Math.sqrt(minDeg+1);
  var sqMax=Math.sqrt(maxDeg+1);
  var sqRng=sqMax-sqMin||1;
  nodes.forEach(function(n){
    var d=Math.min(deg[n.id]||0,maxDeg);  // 截断到 Winsorized 上限
    n.size=MIN_R+(Math.sqrt(d+1)-sqMin)/sqRng*(MAX_R-MIN_R);
    n.size=Math.round(n.size*10)/10;
  });
})();

// ★ 基于节点数和稠密度自动适配力导向参数
(function(){
  var N=nodes.length,E=links.length,avgDeg=E*2/Math.max(1,N);
  var chargeStr=-Math.round(Math.max(60,Math.min(350,Math.sqrt(N)*18)));
  var linkDist=Math.round(Math.max(50,Math.min(180,150-avgDeg*5)));
  var linkStr=Math.round(Math.min(0.8,Math.max(0.15,3/Math.max(0.5,avgDeg)))*100)/100;
  // ★ 按屏幕宽高比分配 X/Y 聚集强度，让图自动适配屏幕形状
  var wrap=document.getElementById("wrap");
  var cw=wrap.clientWidth,ch=wrap.clientHeight;
  var aspect=cw/Math.max(ch,1);
  var baseStr=0.08;
  var fxStr=baseStr/Math.sqrt(aspect);
  var fyStr=baseStr*Math.sqrt(aspect);
  window._AHKB_FORCE={chargeStr:chargeStr,linkDist:linkDist,linkStr:linkStr,forceXStr:fxStr,forceYStr:fyStr};
})();

// Convert Markdown to HTML for the detail panel (all HTML symbols, no raw Markdown)
function mdToHtml(t){if(!t)return"";var e=t;
  e=e.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  // Headings: ###### → <h6> … # → <h2> (H1 skipped, used as title)
  e=e.replace(/^######\s+(.+)$/gm,"<h6>$1</h6>");
  e=e.replace(/^#####\s+(.+)$/gm,"<h5>$1</h5>");
  e=e.replace(/^####\s+(.+)$/gm,"<h4>$1</h4>");
  e=e.replace(/^###\s+(.+)$/gm,"<h3>$1</h3>");
  e=e.replace(/^##\s+(.+)$/gm,"<h3>$1</h3>");
  // Inline code
  e=e.replace(/`([^`]+)`/g,"<code>$1</code>");
  // 将 <code> 包裹的资源路径转为可点击链接（去除 code 包裹），兼容旧格式
  e=e.replace(/<code>((?:原始文件|图片及其他资源|chunks)\/[^<]+)<\/code>/g,function(m0,m1){return'<a href="'+m1+'" target="_blank" download class="file-link" title="单击下载: '+m1+'">'+m1+'</a>'});
  // Bold & italic
  e=e.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  e=e.replace(/\*([^*]+)\*/g,"<em>$1</em>");
  // 裸资源路径先转成 [[...]]，统一由后续 wiki-link 正则处理
  e=e.replace(/(^|\n)(\s*[\-\*]\s*)((?:原始文件|图片及其他资源|chunks)\/[^\s\n]+)/g,'$1$2[[$3]]');
  // Wiki links: [[target|display]] or [[target]]
  // 原始文件/xxx → 可下载链接，其余 → 图内跳转
  e=e.replace(/\[\[([^\]|]+)\|?([^\]]*)\]\]/g,function(m,t,d){
    var disp=(d||t)||"";
    if(t.indexOf("原始文件/")===0||t.indexOf("图片及其他资源/")===0||t.indexOf("原始文件\\")===0||t.indexOf("chunks/")===0){
      var fp=t.replace(/\\/g,"/");
      if(fp.indexOf("://")>-1) return'<a href="'+fp+'" target="_blank" rel="noopener" class="file-link" title="'+disp+'">'+disp+"</a>";
      var fn=fp.split("/").pop();
      return'<a href="'+fp+'" target="_blank" download class="file-link" title="单击下载: '+fp+'">'+disp+"</a>";}
    return'<a href="#" class="wiki-link" data-target="'+(t||'').replace(/"/g,"&quot;")+'">'+disp.replace(/"/g,"&quot;")+"</a>"});
  // Resource embeds: ![[file.ext]] → clickable download link
  e=e.replace(/!\[\[([^\]]+)\]\]/g,function(m,f){
    var fp=f.replace(/\\/g,"/"),fn=fp.split("/").pop();
    return'<a href="'+fp+'" target="_blank" download class="resource-link" title="单击下载: '+fp+'">📎 '+fn+"</a>"});
  // Standard markdown links
  e=e.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
// Unordered list items: - or * at line start
  e=e.replace(/^(\s*)[\-\*]\s+(.+)$/gm,'$1<span class="bullet">•</span> $2');
  // Tables: consecutive |...| lines → <table>
  e=e.replace(/(?:^\|[^\n]+\|\s*$\n?)+/gm,function(tbl){
    var rows=tbl.trim().split('\n'), out=[], header='';
    for(var i=0;i<rows.length;i++){
      var r=rows[i].replace(/^\||\|\s*$/g,'').trim();
      if(!r||/^[\s\-:\|]+$/.test(r)) continue; // skip empty/separator
      var cells=r.split('|').map(function(c){return c.trim();});
      if(i===0||!header){
        // First non-separator row = header
        header='<tr><th>'+cells.join('</th><th>')+'</th></tr>';
      } else {
        out.push('<tr><td>'+cells.join('</td><td>')+'</td></tr>');
      }
    }
    if(header) return '<table><thead>'+header+'</thead><tbody>'+(out.length?out.join(''):'')+'</tbody></table>';
    return tbl;
  });
  // Paragraphs: double newline
  e=e.replace(/\n\n/g,"</p><p>");
  // Single newline → <br>
  e=e.replace(/\n/g,"<br>");
  e=e.replace(/^(<br\s*\/?>)+/,"").replace(/(<br\s*\/?>)+$/,"");
  // 清除 <p> 包裹块级元素导致的空 <p></p>
  e=e.replace(/<p>\s*<(h[1-6])/gi,"<$1").replace(/(<\/(h[1-6])>)\s*<\/p>/gi,"$1");
  // 清除标题后紧跟的 <br>（来自 \n 在标题和内容之间造成的多余换行）
  e=e.replace(/<\/(h[1-6])><br\s*\/?>/gi,"</$1>");
  if(e.indexOf("</p>")>-1){if(!/^\s*<(h[1-6]|ul|ol|li|div|table|blockquote)/i.test(e))e="<p>"+e+"</p>";e=e.replace(/<p><\/p>/g,"").replace(/^\s*<p>\s*<\/p>/gm,"");}else if(e.indexOf("<br>")>-1||e.indexOf("<strong")>-1||e.indexOf("<em")>-1||e.indexOf("<code")>-1||e.indexOf("<a")>-1){e="<p>"+e+"</p>"}
  return e}
// Build clickable source file link HTML
function buildSourceHtml(d){if(!d||!d.source)return"";var s=d.source.trim();if(!s)return"";var l="来源";if(s.indexOf("://")>-1){return'<span class="label">'+l+':</span> <a href="'+s+'" target="_blank" rel="noopener" title="'+s+'">'+s+"</a>"}else{var fname=s.replace(/\\/g,"/").split("/").pop();var fpath=s.replace(/\\/g,"/");return'<span class="label">'+l+':</span> <a href="'+fpath+'" target="_blank" download title="单击下载: '+fpath+'">'+fname+'</a>'}}
// Build related files HTML (from related_files frontmatter)
function buildRelatedHtml(d){
  if(!d||!d.related_files||!d.related_files.length)return"";
  var files=d.related_files.filter(function(f){return f&&f!==(d.source||"").replace(/\\/g,"/");});
  if(!files.length)return"";
  var html='<span class="rf-label">关联文件:</span> ';
  html+=files.map(function(f){var fn=f.replace(/\\/g,"/").split("/").pop();return'<a href="'+f.replace(/\\/g,"/")+'" target="_blank" download title="单击下载: '+f+'">'+fn+"</a>";}).join(", ");
  return html;
}

  pt.innerHTML="";if(d.tags&&d.tags.length)d.tags.forEach(function(t){var s=document.createElement("span");s.className="tag";s.style.background=CMAP[t]||DEFCOL;s.textContent=t;pt.appendChild(s);});
  pd.textContent=d.heading||"";pd.style.color=nc(d.tags&&d.tags.length?[d.tags[d.tags.length-1]]:[]);
  if(d.content&&d.content.length>0){pc.style.display="block";pc.innerHTML=mdToHtml(d.content);}else{pc.style.display="none";}var ps=document.getElementById("panel-source");if(ps)ps.innerHTML=buildSourceHtml(d);var pr=document.getElementById("panel-related");if(pr){var rh=buildRelatedHtml(d);pr.innerHTML=rh;pr.style.display=rh?"block":"none";}
  CUR_NODE=d;
}

// Node size slider
(function(){
  // 记录各个节点的初始半径和初始字号
  var baseSizes=nodes.map(function(n){return n.size;});
  var sl=document.getElementById("size-slider");
  var lb=document.getElementById("size-label");
  sl.addEventListener("input",function(){
    var pct=this.value/100;
    var tPct=Math.pow(pct,0.6);  // 字号变化幅度 = 半径的 0.6 次方（比 sqrt 更明显但仍小于半径变化）
    lb.textContent=Math.round(pct*100)+"%";

    NH.attr("r",function(d,i){var s=baseSizes[i]*pct;d.size=s;return s;});
    // 更新文字字号（直接 DOM 操作保证生效，字号随节点大小变化）
    var texts=document.querySelectorAll(".nodes text");
    for(var i=0;i<texts.length;i++){
      var ds=texts[i].__data__;
      if(ds){
        var baseSz=Math.round((6+(baseSizes[i]-5)/17*6)*10)/10;
        texts[i].style.fontSize=Math.round((baseSz*tPct)*10)/10+"px";

})();

// Density slider
(function(){
  var baseCharge=window._AHKB_FORCE.chargeStr;
  var baseDist=window._AHKB_FORCE.linkDist;
  var sl=document.getElementById("density-slider");
  var lb=document.getElementById("density-label");
  sl.addEventListener("input",function(){
    var pct=this.value/100;
    lb.textContent=Math.round(pct*100)+"%";
    var ch=Math.round(baseCharge*pct);
    var nd=Math.round(Math.max(40,Math.min(250,baseDist*pct)));
    ch=Math.max(-600,Math.min(-20,ch));
    simHandle.force("charge",d3.forceManyBody().strength(ch));
    simHandle.force("link").distance(nd);
    simHandle.alpha(0.3).restart();
  });
})();

// ★ 适应屏幕：计算节点包围盒并缩放居中填满视口
function fitGraph(){
  if(nodes.length===0)return;
  var minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  nodes.forEach(function(n){
    if(n.x<minX)minX=n.x;if(n.x>maxX)maxX=n.x;
    if(n.y<minY)minY=n.y;if(n.y>maxY)maxY=n.y;
  });
  var bw=maxX-minX,bh=maxY-minY;
  if(bw===0&&bh===0)return;
  var pad=0.12;
  var sc=Math.min(W/(bw*(1+pad)),H/(bh*(1+pad)))*0.9;
  var tx=W/2-(minX+maxX)/2*sc;
  var ty=H/2-(minY+maxY)/2*sc;
  SVG.transition().duration(500).call(Z.transform,d3.zoomIdentity.translate(tx,ty).scale(sc));
}

// 模拟完全冷却后自动适应屏幕一次，并默认显示根节点
var fitted=false;
simHandle.on("end",function(){if(!fitted){fitted=true;document.getElementById("loading-overlay").classList.add("hidden");fitGraph();setTimeout(function(){var _rn=nodes.filter(function(d){return d.isRoot;})[0];if(_rn){showPanel(_rn);}},600);}});

// 适应屏幕按钮
document.getElementById("fit-btn").addEventListener("click",function(){fitGraph();});
