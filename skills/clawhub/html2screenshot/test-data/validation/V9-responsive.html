<!DOCTYPE html><html><head><meta charset="UTF-8"><title>V9</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:sans-serif;padding:40px;background:#f5f5f5}h1{text-align:center;margin-bottom:40px}.grid{display:grid;gap:16px;margin:0 auto;max-width:1000px}.card{background:white;border-radius:12px;padding:24px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.1)}.card .icon{font-size:32px;margin-bottom:12px}.card h3{font-size:16px;margin-bottom:8px}.card p{font-size:13px;color:#666}@media(min-width:768px){.grid{grid-template-columns:repeat(3,1fr)}}@media(min-width:1024px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:767px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:479px){.grid{grid-template-columns:1fr}}</style></head>
<body><h1>V9 - 响应式断点测试</h1>
<p style="text-align:center;margin-bottom:30px;color:#999;font-size:14px">当前 viewport: 1280px (≥1024px，应为 4 列)</p>
<div class="grid">
<div class="card"><div class="icon">📱</div><h3>移动端</h3><p>&lt;480px: 1 列</p></div>
<div class="card"><div class="icon">📲</div><h3>平板</h3><p>480-767px: 2 列</p></div>
<div class="card"><div class="icon">💻</div><h3>小桌面</h3><p>768-1023px: 3 列</p></div>
<div class="card"><div class="icon">🖥️</div><h3>大桌面</h3><p>≥1024px: 4 列</p></div>
<div class="card"><div class="icon">🔧</div><h3>配置 1</h3><p>响应式网格布局</p></div>
<div class="card"><div class="icon">⚙️</div><h3>配置 2</h3><p>媒体查询测试</p></div>
<div class="card"><div class="icon">📐</div><h3>配置 3</h3><p>断点自适应</p></div>
<div class="card"><div class="icon">✅</div><h3>配置 4</h3><p>1280px 下 4 列</p></div>
</div>
<p style="text-align:center;margin-top:30px;color:#999;font-size:14px">如果显示 4 列，说明响应式断点正确应用</p></body></html>
