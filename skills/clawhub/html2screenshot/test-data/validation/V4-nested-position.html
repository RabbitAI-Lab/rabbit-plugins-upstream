<!DOCTYPE html><html><head><meta charset="UTF-8"><title>V4</title>
<style>body{font-family:sans-serif;padding:40px;background:#f5f5f5}.fixed-header{position:fixed;top:0;left:0;right:0;height:50px;background:#1a73e8;color:white;display:flex;align-items:center;padding:0 40px;z-index:1000}.relative-box{position:relative;width:200px;height:100px;background:#667eea;margin:80px 0 40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:white}.absolute-box{position:absolute;top:20px;right:20px;width:100px;height:60px;background:#f093fb;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px}.content{max-width:800px;margin:0 auto;padding:20px;background:white;border-radius:12px;margin-top:80px}</style></head>
<body><div class="fixed-header">📌 V4 - 嵌套定位测试（Fixed Header）</div>
<div class="relative-box">Relative Box
  <div class="absolute-box">Absolute Box</div>
</div>
<div class="content"><h2>内容区域</h2><p>测试 fixed + relative + absolute 三种定位方式的嵌套渲染。</p><p>预期：fixed 头部在顶部可见，relative 框内的 absolute 元素位置正确。</p></div></body></html>
