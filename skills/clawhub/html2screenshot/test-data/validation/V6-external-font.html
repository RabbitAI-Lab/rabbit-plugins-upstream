<!DOCTYPE html><html><head><meta charset="UTF-8"><title>V6</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>body{font-family:'Noto Sans SC',sans-serif;padding:40px;background:#f5f5f5}h1{font-family:'ZCOOL KuaiLe',cursive;text-align:center;margin-bottom:40px;color:#333}.card{background:white;border-radius:12px;padding:30px;max-width:600px;margin:0 auto 20px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}.card p{font-size:16px;line-height:1.8;color:#555}.highlight{color:#1a73e8;font-weight:700}</style></head>
<body><h1>V6 - 外部字体测试</h1>
<div class="card"><p>这是一段使用 <span class="highlight">Noto Sans SC</span> 字体的正文内容。</p><p>Google Fonts 加载的中文无衬线字体，用于测试外部字体是否正确渲染。</p></div>
<div class="card"><p style="font-family:'ZCOOL KuaiLe'">这是一段使用 <span class="highlight">ZCOOL KuaiLe</span>（站酷快乐体）的标题风格文字。</p><p>测试中文字体库的加载和渲染效果。</p></div>
<div class="card"><p>如果字体显示为默认 sans-serif，说明外部字体加载失败。</p><p>正确行为：正文应使用 Noto Sans SC，标题应使用 ZCOOL KuaiLe。</p></div></body></html>
