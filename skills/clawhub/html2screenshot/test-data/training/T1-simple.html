<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T1 - 简单静态页面</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 40px; background: #f5f5f5; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h1 { color: #333; font-size: 28px; margin-bottom: 16px; }
    p { color: #666; line-height: 1.8; font-size: 16px; }
    .highlight { color: #007AFF; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <h1>T1 - 简单静态页面</h1>
    <p>这是一个用于测试 html2screenshot 基本功能的简单页面。</p>
    <p>页面包含 <span class="highlight">内联 CSS</span>、标题、段落和简单的布局。</p>
    <p>预期：所有内容清晰可见，无遗漏。</p>
  </div>
</body>
</html>
