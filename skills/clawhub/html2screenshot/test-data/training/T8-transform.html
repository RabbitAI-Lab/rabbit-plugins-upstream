<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T8 - CSS transform 动画</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 40px; color: white; }
    h1 { text-align: center; margin-bottom: 40px; font-size: 32px; }

    .transform-section { margin-bottom: 50px; }
    .transform-section h2 { text-align: center; margin-bottom: 24px; font-size: 22px; }

    /* scale 变换 */
    .scale-container { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; }
    .scale-box {
      width: 120px;
      height: 120px;
      background: rgba(255,255,255,0.2);
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transform: scale(1);
      transition: transform 0.3s;
    }
    .scale-box.large { transform: scale(1.3); }
    .scale-box.small { transform: scale(0.8); }

    /* rotate 变换 */
    .rotate-container { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; }
    .rotate-box {
      width: 100px;
      height: 100px;
      background: rgba(255,255,255,0.2);
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .rotate-box.rot-45 { transform: rotate(45deg); border-radius: 8px; }
    .rotate-box.rot-90 { transform: rotate(90deg); }
    .rotate-box.rot-180 { transform: rotate(180deg); }

    /* translate 变换 */
    .translate-container { position: relative; height: 200px; background: rgba(255,255,255,0.1); border-radius: 12px; margin: 20px auto; max-width: 600px; }
    .translate-box {
      position: absolute;
      width: 80px;
      height: 80px;
      background: rgba(255,255,255,0.3);
      border: 2px solid rgba(255,255,255,0.6);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
    .translate-box.t1 { top: 20px; left: 20px; transform: translate(0, 0); }
    .translate-box.t2 { top: 20px; left: 120px; transform: translate(30px, -20px); }
    .translate-box.t3 { top: 100px; left: 20px; transform: translate(-20px, 30px); }
    .translate-box.t4 { top: 100px; left: 120px; transform: translate(50px, 50px); }

    /* skew 变换 */
    .skew-container { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; }
    .skew-box {
      width: 100px;
      height: 80px;
      background: rgba(255,255,255,0.2);
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
    .skew-box.skew-x { transform: skewX(20deg); }
    .skew-box.skew-y { transform: skewY(15deg); }
    .skew-box.skew-both { transform: skewX(15deg) skewY(10deg); }

    .note { text-align: center; margin-top: 40px; opacity: 0.8; font-size: 14px; }
  </style>
</head>
<body>
  <h1>🔄 T8 - CSS transform 变换测试</h1>

  <div class="transform-section">
    <h2>📐 scale 缩放</h2>
    <div class="scale-container">
      <div class="scale-box">正常</div>
      <div class="scale-box large">放大 1.3x</div>
      <div class="scale-box small">缩小 0.8x</div>
    </div>
  </div>

  <div class="transform-section">
    <h2>🔁 rotate 旋转</h2>
    <div class="rotate-container">
      <div class="rotate-box">0°</div>
      <div class="rotate-box rot-45">45°</div>
      <div class="rotate-box rot-90">90°</div>
      <div class="rotate-box rot-180">180°</div>
    </div>
  </div>

  <div class="transform-section">
    <h2>📍 translate 位移</h2>
    <div class="translate-container">
      <div class="translate-box t1">原位置</div>
      <div class="translate-box t2">+30,-20</div>
      <div class="translate-box t3">-20,+30</div>
      <div class="translate-box t4">+50,+50</div>
    </div>
  </div>

  <div class="transform-section">
    <h2>📏 skew 倾斜</h2>
    <div class="skew-container">
      <div class="skew-box">正常</div>
      <div class="skew-box skew-x">skewX 20°</div>
      <div class="skew-box skew-y">skewY 15°</div>
      <div class="skew-box skew-both">skewX+Y</div>
    </div>
  </div>

  <p class="note">⚠️ 如果 transform 元素显示异常（如位置错误、形状变形），说明 Chrome 渲染或截图时机有问题。</p>
</body>
</html>
