changelog:
  - "1.0.0 正式发布版（整合此前内部迭代 v1.1–v1.4 实测验证的全部能力，统一以本版本号对外发布）：投标人体检定位——按省检索历史否决案例库，输出条款级雷区体检报告；双路比对(历史召回 × 当前文件对照) + 证据锚定定位(精确条款坐标 + 历史伤亡证据 + 原文链接)；禁止跨省排名(parent_folder_id 硬过滤)；行业同义词扩张；案例时间范围显式呈现 + 近 N 年过滤；案例链接收束(每雷区≤3 链接)；路径B双输入源分流(完整招标文件 / 否决记录·评标报告，输出真实命中)；雷区分型固化(竞争性淘汰如 3.2.4 未进前 N 名严禁计入雷区命中)；降级与异常处理全分支 + 风险等级确定性阈值 + 护栏铁律(不写占比/不跨省/不编价格/不推断偏好) + 上线前自测清单(P0–P19)。"
