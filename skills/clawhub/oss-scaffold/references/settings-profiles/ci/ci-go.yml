# ci-go.yml — Tencent org Go CI 骨架（oss-scaffold settings profile）
# 形态蒸馏自：WeKnora cli.yml（paths 过滤 / defaults shell bash /
#           matrix os×go + fail-fast: false / setup-go cache-dependency-path /
#           go build + go test -race -coverprofile + go vet / coverage 报告）
#           WeKnora go-lint.yml（golangci-lint 独立流）。
name: CI

on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/ci-go.yml'
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/ci-go.yml'

# WeKnora 形态：Windows 默认 shell 会拆词，统一 bash 保证跨平台 run 一致
defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }} / go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['stable']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum
      - name: go build
        run: go build ./...
      - name: go test
        run: go test -race -coverprofile=coverage.out ./...
      - name: go vet
        run: go vet ./...
      - name: coverage report
        if: matrix.os == 'ubuntu-latest'
        run: go tool cover -func=coverage.out

  lint:
    # WeKnora go-lint.yml 形态：golangci-lint 单独成 job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
