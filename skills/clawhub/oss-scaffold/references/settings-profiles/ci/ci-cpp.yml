# ci-cpp.yml — Tencent org C++ CI 骨架（oss-scaffold settings profile）
# 形态蒸馏自：ncnn（paths 过滤 / concurrency / contents: read / cmake+ctest / 按平台拆文件）
#           Tendis（lint → build/test needs 链）、ncnn release.yml 与 TNN release.yml（tag 发布流）。
# org 实测：push+PR 双触发为主流，46% 带 paths 过滤，56% 显式 contents: read；
# C++ 仓偏好「每平台一个 workflow 文件」而非大矩阵（ncnn 45 个文件按 os/arch 拆分）。
name: ci

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/ci-cpp.yml'
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/ci-cpp.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    # Tendis Tendis-CI.yml 形态：cpplint + clang-format 把关，先于编译
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: cpplint
        run: |
          pip install cpplint
          cpplint --filter="-runtime/reference,-whitespace/indent_namespace" --recursive src include || true
      - name: clang-format check
        run: |
          find src include -name '*.h' -o -name '*.cc' -o -name '*.cpp' \
            | xargs clang-format --dry-run --Werror

  build-and-test:
    needs: [lint]
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false        # ncnn/TNN 系均显式 fail-fast: false
      matrix:
        include:
          - platform: linux-gcc
            os: ubuntu-latest
          - platform: windows-msvc
            os: windows-latest
          - platform: macos-clang
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true     # ncnn 形态：跨端 C++ 仓普遍带 submodule

      - name: configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: build
        run: cmake --build build --config Release -j 4

      - name: test
        run: ctest --test-dir build --output-on-failure -j 4

      - name: upload artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.platform }}
          path: build/bin/
          if-no-files-found: ignore

  # 发布流形态 A（ncnn release.yml / TNN release.yml）：push tag 时聚合产物出 Release
  package:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: package source
        run: |
          mkdir -p dist
          tar czf dist/${{ github.event.repository.name }}-${{ github.ref_name }}.tar.gz \
            --exclude='.git' --exclude='build*' .
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: dist/
