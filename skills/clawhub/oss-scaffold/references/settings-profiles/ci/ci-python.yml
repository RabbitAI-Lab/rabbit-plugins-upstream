# ci-python.yml — Tencent org Python CI 骨架（oss-scaffold settings profile）
# 形态蒸馏自：WeKnora mcp-server.yml（push main+paths / PR paths / tags v*；
#           matrix python 3.10–3.13 + fail-fast: false；contents: read；
#           build 仅非 PR；PyPI Trusted Publishing OIDC 免 token）
#           AI-Infra-Guard create-release.yml（tag → GitHub Release）。
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/ci-python.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/ci-python.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Run tests
        run: python -m pytest tests/ -v

  build:
    name: Build sdist + wheel
    needs: test
    # WeKnora 形态：构建只在 push main / 手动 / tag，PR 不构建
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # 发布流：tag → PyPI Trusted Publishing（OIDC，无 API token）+ GitHub Release
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write        # PyPI Trusted Publishing（WeKnora 形态）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
