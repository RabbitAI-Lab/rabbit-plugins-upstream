# Nature Paper Workflow - Manifest
# 论文生产链工作流定义与子技能映射表
# 版本: 1.0.0 | 2026-07-25

version: 1.0.0
name: nature-paper-workflow
slug: nature-paper-workflow
display_name: 论文生产链
description: 端到端论文工作流顶层路由 skill

# ============================================
# 工作流阶段定义
# ============================================
workflow:
  - phase: 0a
    name: 读论文
    description: 单篇论文中英对照阅读、图文对应、来源锚点
    primary_skill: nature-reader
    triggers: [读论文, 精读论文, 论文翻译, 中英对照, paper reader, 读这篇 PDF]

  - phase: 0b
    name: 文献调研
    description: 多篇文献检索、综述、下载、卡片化整理
    primary_skill: nature-academic-search
    secondary_skills: [academic-researcher, nature-downloader, nature-paper-card, nature-literature-pipeline]
    triggers: [文献调研, 找文献, 综述, literature review, PubMed, Scopus, 论文下载, 论文卡片]

  - phase: 1a
    name: 项目脚手架
    description: 论文项目目录初始化、source of truth、状态文件
    primary_skill: paper-bootstrap
    triggers: [项目初始化, 新论文, bootstrap, 项目目录, 论文项目结构]

  - phase: 1b
    name: 期刊定位
    description: Nature / Nature Methods / Nature Biotechnology 选择与政策预检
    primary_skill: nature-portfolio-playbook
    triggers: [期刊选择, venue, 投哪本, Nature Methods, Nature Biotechnology, 期刊定位]

  - phase: 2a
    name: 章节起草
    description: 摘要/引言/方法/结果/讨论/结论起草，含投稿包
    primary_skill: nature-writing
    triggers: [起草, 写摘要, 写引言, 写方法, 写讨论, 写结论, 投稿包, cover letter]

  - phase: 2b
    name: 结构优化
    description: claim/evidence/术语/图逻辑漂移修复
    primary_skill: manuscript-optimizer
    triggers: [结构修复, 证据链漂移, manuscript optimizer, 论文结构, claim driven]

  - phase: 2c
    name: Results 专项修订
    description: Results 小节叙述结构修复
    primary_skill: results-section-revision
    triggers: [Results 修订, results section, 结果叙述, Results 小节]

  - phase: 3a
    name: 图规划
    description: 一图一主张、panel 角色、legend 同步
    primary_skill: figure-planner
    triggers: [图规划, 一图一主张, panel role, figure planner, 图逻辑]

  - phase: 3b
    name: 出图
    description: matplotlib/seaborn/ggplot2 投稿级科研图，含 AI 示意图
    primary_skill: nature-figure
    triggers: [出图, 科研绘图, 论文 figure, 论文 plot, 图形摘要, 示意图]

  - phase: 3c
    name: 图检查
    description: 出版级图形正确性与可读性清单
    primary_skill: figure-style
    triggers: [图检查, figure style, 图形正确性, 图形可读性]

  - phase: 4a
    name: 统计审计
    description: n值/重复性/多重比较/图注统计审计
    primary_skill: stats-reporting-audit
    triggers: [统计审计, stats audit, p值, 样本量, n值, 多重比较, 重复数]

  - phase: 4b
    name: 统计分析
    description: 数据处理与统计分析
    primary_skill: nature-statistics
    secondary_skills: [nature-data]
    triggers: [统计分析, 数据分析, statistics, data analysis, 数据处理]

  - phase: 5a
    name: 引用核验
    description: 引用准确性核验、造假检测、BibTeX 卫生
    primary_skill: nature-ref-verifier
    secondary_skills: [citation-verifier, reference-audit-guide]
    triggers: [引用核验, citation verifier, 引用造假, 引用准确性, BibTeX 卫生]

  - phase: 5b
    name: 引用补充
    description: 自动补 Nature/CNS 系列严格引用
    primary_skill: nature-citation
    triggers: [引用补充, 加引用, CNS 引用, Nature 引用, 找引用, 配文献]

  - phase: 5c
    name: 数据声明
    description: 数据可用性声明、FAIR、accession
    primary_skill: data-availability
    triggers: [数据声明, data availability, FAIR, accession, 数据可用性]

  - phase: 6a
    name: 语言润色
    description: Nature 风格英文学术润色 + LaTeX 排版 + 句子精修
    primary_skill: nature-polishing
    secondary_skills: [scientific-prose-style]
    triggers: [润色, polishing, 学术英语, LaTeX 排版, SCI 写作, 英文润色, 句子精修]

  - phase: 6b
    name: 投稿预检
    description: 投稿前/返修前总预检
    primary_skill: submission-audit
    triggers: [投稿预检, submission audit, 投前检查, 投稿前, 预检]

  - phase: 7a
    name: 审稿模拟
    description: Nature 审稿人视角模拟，3 份 reviewer reports
    primary_skill: nature-reviewer
    triggers: [审稿模拟, reviewer, 预审, 审稿意见, 投稿前自审]

  - phase: 7b
    name: 返修回复
    description: 逐点回复、cover letter、标红修改
    primary_skill: nature-response
    triggers: [返修, rebuttal, response, 逐点回复, cover letter, 回复审稿人, 修回信]

# ============================================
# 衍生场景（按需触发，不在主线上）
# ============================================
derived:
  - phase: D1
    name: 转 PPT
    description: 论文转中文组会汇报 PPT
    primary_skill: nature-paper2ppt
    triggers: [转 PPT, 组会汇报, 文献汇报, 论文做PPT]

  - phase: D2
    name: 转专利
    description: 论文转专利，含国知局公布公告检索
    primary_skill: nature-paper-to-patent
    triggers: [转专利, paper to patent, 国知局, 专利转化]

  - phase: D3
    name: 写基金
    description: 基金/项目申请书撰写
    primary_skill: nature-proposal-writer
    triggers: [写基金, proposal, 申请书, 基金申请]

  - phase: D4
    name: 实验记录
    description: 实验记录管理
    primary_skill: nature-experiment-log
    triggers: [实验记录, experiment log]

  - phase: D5
    name: 会议论文
    description: NeurIPS/ICML/ICLR 等会议论文流程
    primary_skill: conference-paper-writing
    triggers: [会议论文, NeurIPS, ICML, ICLR, conference paper]

# ============================================
# 冲突消解与协同（统一规则）
# ============================================
# 等价冲突：择一使用（优先已安装版本）
# 互补协同：配合使用（不同维度补足）
# ============================================
skills_count:
  total: 35  # 1 main router + 19 + 16
  primary_router: 1
  sub_skills: 34  # 不含 router 自身

conflict_resolution:
  # 等价冲突（择一使用）
  equivalent:
    - function: 科研绘图
      use: nature-figure
    - function: 审稿模拟
      use: nature-reviewer
    - function: 返修回复
      use: nature-response
    - function: 章节起草
      use: nature-writing
    - function: 论文深读
      use: nature-reader
    - function: 论文转 PPT
      use: nature-paper2ppt

  # 互补协同（配合使用，不冲突）
  complementary:
    - function: 引用核验
      primary: nature-ref-verifier
      complementary: [citation-verifier, reference-audit-guide]
      usage: 先 nature-ref-verifier 查内容准确性，再 citation-verifier 查 BibTeX 格式

    - function: 润色
      primary: nature-polishing
      complementary: [scientific-prose-style]
      usage: 先 nature-polishing 做段落+排版，再 scientific-prose-style 做句子节奏

    - function: 会议论文（按需）
      primary: conference-paper-writing
      usage: 仅在会议论文场景触发，与 nature-writing（期刊）不冲突

# ============================================
# 跨阶段 handoff 产物映射
# ============================================
handoffs:
  - from: 0a
    to: 1a
    artifacts: [paper.md, source_map.json, terminology_ledger]
  - from: 1a
    to: 2a
    artifacts: [notes/project_truth.md, notes/result_summary.md, notes/paper_handoff.md]
  - from: 2a
    to: 3a
    artifacts: [claim_list, section_structure]
  - from: 3b
    to: 4a
    artifacts: [figures_with_stats, legends]
  - from: 6b
    to: 7a
    artifacts: [risk_list, audit_report]
  - from: 7a
    to: 7b
    artifacts: [reviewer_reports, cross_review_synthesis]
