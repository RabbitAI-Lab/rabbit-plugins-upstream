interface:
  display_name: "Agent 整体瘦身"
  short_description: "只读盘点 Agent 的常驻上下文、Skill、插件、备份和旧会话，给出 Token/磁盘分账与可回滚的移动计划；默认 dry-run，不删除原件。"
  default_prompt: "使用 $agent-slim 先对当前 Agent 做只读审计，分别报告 Hot、Warm、Cold 三层、Token 与磁盘收益、风险等级和回滚方式；不要修改任何文件，等我审阅计划。"
  icon_small: "icons/icon_small.png"
  icon_large: "icons/icon_large.png"

policy:
  allow_implicit_invocation: true
