<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>行程一下 — 小程序宣传封面</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@200;300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500&display=swap">
  <style>
    *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0f; font-family: "Inter", -apple-system, sans-serif; padding: 0; display: flex; flex-direction: column; align-items: center; }
    .poster { position: relative; width: 1080px; height: 1440px; overflow: hidden; isolation: isolate; background: #0a0a0f; }
    .content { position: relative; width: 100%; height: 100%; padding: 88px 80px; display: flex; flex-direction: column; z-index: 2; }

    /* Ambient glow */
    .ambient-glow {
      position: absolute; top: -120px; right: -120px;
      width: 500px; height: 500px; border-radius: 50%;
      background: radial-gradient(circle, rgba(56,176,209,0.08), transparent 70%);
      z-index: 1;
    }
    .ambient-glow-2 {
      position: absolute; bottom: -80px; left: -80px;
      width: 400px; height: 400px; border-radius: 50%;
      background: radial-gradient(circle, rgba(56,176,209,0.05), transparent 70%);
      z-index: 1;
    }

    /* Top decorative line */
    .top-line {
      width: 60px; height: 2px;
      background: linear-gradient(90deg, rgba(56,176,209,0.6), transparent);
      margin-bottom: 48px;
    }

    .label-tag {
      font-family: "IBM Plex Mono", monospace; font-size: 11px;
      letter-spacing: 0.25em; color: rgba(255,255,255,0.35);
      text-transform: uppercase; margin-bottom: 24px;
    }

    .hero-title {
      font-family: "Noto Serif SC", serif; font-size: 96px; font-weight: 900;
      line-height: 1.05; color: #fff; margin-bottom: 6px;
      letter-spacing: -0.01em;
    }
    .hero-title .accent { color: #38b0d1; }
    .hero-sub {
      font-family: "Playfair Display", serif; font-size: 26px; font-weight: 400;
      font-style: italic; color: rgba(255,255,255,0.3);
      margin-bottom: 0;
    }

    .spacer { flex: 1; }

    /* Divider */
    .divider {
      width: 100%; height: 1px;
      background: linear-gradient(90deg, rgba(56,176,209,0.2), transparent 80%);
      margin: 48px 0;
    }

    /* Feature list - minimal */
    .feature-list {
      display: flex; flex-direction: column; gap: 20px;
    }
    .feature-row {
      display: flex; align-items: center; gap: 20px;
      padding: 20px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .feature-row:last-child { border-bottom: none; }
    .feature-icon {
      width: 32px; height: 32px; border-radius: 50%;
      background: rgba(56,176,209,0.1);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .feature-icon svg { width: 16px; height: 16px; }
    .feature-title {
      font-family: "Noto Sans SC", sans-serif; font-size: 17px; font-weight: 600;
      color: #fff; margin-bottom: 2px;
    }
    .feature-desc {
      font-family: "Noto Sans SC", sans-serif; font-size: 14px;
      color: rgba(255,255,255,0.35); font-weight: 300;
    }

    /* Bottom CTA */
    .bottom-section {
      margin-top: 48px;
    }
    .cta-text {
      font-family: "Playfair Display", serif; font-size: 18px; font-style: italic;
      color: rgba(255,255,255,0.25); margin-bottom: 24px;
    }
    .cta-btn {
      display: inline-flex; align-items: center; gap: 10px;
      font-family: "Inter", sans-serif; font-size: 14px; font-weight: 500;
      letter-spacing: 0.05em; text-transform: uppercase;
      padding: 14px 32px; border: 1px solid rgba(56,176,209,0.3);
      color: #38b0d1; background: transparent; cursor: default;
      transition: all 0.3s;
    }
    .cta-arrow {
      font-family: "IBM Plex Mono", monospace; font-size: 16px;
      color: rgba(56,176,209,0.5);
    }

    /* Footer */
    .footer-band {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 24px 80px; display: flex; justify-content: space-between;
      border-top: 1px solid rgba(255,255,255,0.04); z-index: 10;
    }
    .footer-text {
      font-family: "IBM Plex Mono", monospace; font-size: 10px;
      letter-spacing: 0.15em; color: rgba(255,255,255,0.15);
    }
  </style>
</head>
<body>
  <div class="poster" id="poster-1">
    <div class="ambient-glow"></div>
    <div class="ambient-glow-2"></div>

    <div class="content">
      <div class="top-line"></div>
      <div class="label-tag">AI TRAVEL PLANNER</div>
      <h1 class="hero-title">行程<span class="accent">一下</span></h1>
      <div class="hero-sub">effortless journeys</div>

      <div class="spacer"></div>

      <div class="divider"></div>

      <div class="feature-list">
        <div class="feature-row">
          <div class="feature-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#38b0d1" stroke-width="1.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
          </div>
          <div>
            <div class="feature-title">一句话生成行程</div>
            <div class="feature-desc">目的地、天数、偏好，AI 三秒规划</div>
          </div>
        </div>
        <div class="feature-row">
          <div class="feature-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#38b0d1" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          </div>
          <div>
            <div class="feature-title">实时路况导航</div>
            <div class="feature-desc">内置地图，路线自动优化</div>
          </div>
        </div>
        <div class="feature-row">
          <div class="feature-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#38b0d1" stroke-width="1.5"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
          </div>
          <div>
            <div class="feature-title">一键分享旅伴</div>
            <div class="feature-desc">生成小程序卡片，微信发送</div>
          </div>
        </div>
      </div>

      <div class="bottom-section">
        <div class="cta-text">start planning your next adventure</div>
        <div class="cta-btn">
          立即体验
          <span class="cta-arrow">→</span>
        </div>
      </div>
    </div>

    <div class="footer-band">
      <div class="footer-text">XINGCHENG · AI-POWERED TRAVEL</div>
      <div class="footer-text">2026</div>
    </div>
  </div>
</body>
</html>
