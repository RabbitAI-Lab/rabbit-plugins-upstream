<!doctype html>
<html lang="zh-CN" data-theme="forest-ink">
<head>
  <meta charset="utf-8">
  <title>西安旅行笔记</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    :root, [data-theme="forest-ink"] {
      --paper: #f5f1e8; --paper-2: #e8dfcf; --ink: #16251b; --muted: #5d665d;
      --line: rgba(22,37,27,.22); --accent: #2e6b4f; --accent-soft: #d4dfd2;
      --ink-rgb: 22,37,27; --paper-rgb: 245,241,232; --accent-rgb: 46,107,79;
    }
    :root {
      --serif-zh: "Noto Serif SC", "Songti SC", serif;
      --serif-en: "Playfair Display", serif;
      --sans-zh: "Noto Sans SC", -apple-system, "PingFang SC", sans-serif;
      --sans-en: "Inter", sans-serif;
      --mono: "IBM Plex Mono", monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a1a1a; font-family: var(--sans-zh); padding: 0; display: flex; flex-direction: column; align-items: center; }
    .poster { position: relative; width: 1080px; height: 1440px; overflow: hidden; isolation: isolate; }

    .bg-image {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0;
    }
    .bg-image img { width: 100%; height: 100%; object-fit: cover; }
    .bg-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(180deg, rgba(22,37,27,0.3) 0%, rgba(22,37,27,0.7) 100%);
      z-index: 1;
    }

    .content {
      position: relative; width: 100%; height: 100%; padding: 96px 88px;
      display: flex; flex-direction: column; z-index: 2;
    }

    .label-tag {
      display: inline-block; font-family: var(--mono); font-size: 12px;
      letter-spacing: 0.15em; color: #fff; border: 1px solid rgba(255,255,255,0.4);
      padding: 6px 14px; margin-bottom: 28px; align-self: flex-start;
    }
    .hero-title {
      font-family: var(--serif-zh); font-size: 112px; font-weight: 900;
      line-height: 1.05; color: #fff; margin-bottom: 16px;
      text-shadow: 0 2px 20px rgba(0,0,0,0.3);
    }
    .hero-sub {
      font-family: var(--serif-en); font-size: 28px; font-weight: 400;
      font-style: italic; color: rgba(255,255,255,0.8); margin-bottom: auto;
    }
    .divider { width: 60px; height: 1px; background: rgba(255,255,255,0.5); margin: 40px 0; }
    .body-text {
      font-family: var(--sans-zh); font-size: 26px; line-height: 1.8; color: rgba(255,255,255,0.9);
    }
    .tag-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 32px; }
    .tag {
      font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em;
      padding: 6px 14px; border: 1px solid rgba(255,255,255,0.4); color: #fff;
    }
    .footer-band {
      position: absolute; bottom: 0; left: 0; right: 0; padding: 28px 88px;
      display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid rgba(255,255,255,0.2); z-index: 10;
    }
    .footer-text { font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; color: rgba(255,255,255,0.7); }
  </style>
</head>
<body>

  <div class="poster" id="poster-1">
    <div class="bg-image">
      <img src="https://images.unsplash.com/photo-1448375240586-882707db888b?w=1080&h=1440&fit=crop" alt="Forest" />
    </div>
    <div class="bg-overlay"></div>

    <div class="content">
      <div class="label-tag">旅行 · 生活方式</div>
      <h1 class="hero-title">西安</h1>
      <div class="hero-sub">XI'AN TRAVEL NOTE</div>

      <div class="divider"></div>

      <div class="body-text">
        十三朝古都，雪山环绕。<br>
        古城墙的厚重，兵马俑的震撼，<br>
        大雁塔的禅意。<br><br>
        每一处景点，都在历史与现代的<br>
        交织中展现独特魅力。
      </div>

      <div class="tag-row">
        <div class="tag">森林</div>
        <div class="tag">西安</div>
        <div class="tag">旅行</div>
        <div class="tag">古都</div>
      </div>
    </div>

    <div class="footer-band">
      <div class="footer-text">旅行笔记 · 西安文旅</div>
      <div class="footer-text">2026</div>
    </div>
  </div>

</body>
</html>
