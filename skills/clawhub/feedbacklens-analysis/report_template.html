<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户反馈分析报告 - {{TITLE}}</title>
<style>
  :root {
    --ink: #1B1B24;
    --ink-soft: #2A2A36;
    --paper: #FAF9F6;
    --card: #FFFFFF;
    --line: #ECEAE2;
    --muted: #6E6C64;
    --accent: #D7383E;
    --accent-deep: #B02A30;
    --good: #1F7A5C;
    --warn: #B87A1A;
    --me: #4A3FBF;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--paper); color: var(--ink); margin: 0; padding: 0 0 40px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 20px; }

  /* ---------- Hero ---------- */
  .hero {
    background: linear-gradient(148deg, #15151C 0%, #23232E 58%, #2E1E22 100%);
    color: #F5F2EC; padding: 40px 0 46px; position: relative; overflow: hidden;
  }
  .hero::after {
    content: ""; position: absolute; right: -80px; top: -80px; width: 340px; height: 340px;
    border-radius: 50%; background: radial-gradient(circle, rgba(215,56,62,0.22), transparent 65%);
  }
  .brand {
    display: flex; align-items: center; gap: 10px; font-size: 13px; letter-spacing: 2px;
    color: #C9C4B8; text-transform: uppercase; margin-bottom: 26px;
  }
  .brand .mark {
    width: 26px; height: 26px; border-radius: 7px; background: var(--accent);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 800; color: #fff; letter-spacing: 0;
  }
  .hero h1 {
    font-size: 30px; font-weight: 750; margin: 0 0 12px; line-height: 1.25; position: relative; z-index: 1;
  }
  .hero .conclusion {
    font-size: 15px; color: #C9C4B8; max-width: 640px; line-height: 1.6; position: relative; z-index: 1;
  }
  .hero .meta {
    display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; position: relative; z-index: 1;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px;
    border-radius: 999px; font-size: 12px; background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12); color: #E3DED2;
  }

  /* ---------- Section ---------- */
  .section { margin-top: 34px; }
  .sec-title {
    font-size: 17px; font-weight: 700; margin: 0 0 16px; display: flex; align-items: center; gap: 8px;
  }
  .sec-title::before { content: ""; width: 4px; height: 18px; background: var(--accent); border-radius: 2px; }

  /* ---------- 优先级条形图 ---------- */
  .bar-list { display: flex; flex-direction: column; gap: 12px; }
  .bar-row {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
  }
  .bar-row .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .bar-row .label { font-weight: 650; font-size: 14px; }
  .bar-row .score { font-weight: 750; font-size: 16px; font-variant-numeric: tabular-nums; }
  .bar-row .score.high { color: var(--accent-deep); }
  .bar-row .score.mid { color: var(--warn); }
  .bar-row .score.low { color: var(--good); }
  .bar-track { height: 10px; background: #F0EEE8; border-radius: 999px; overflow: hidden; }
  .bar-fill {
    height: 100%; border-radius: 999px; width: 0;
    transition: width 1.1s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .bar-fill.high { background: linear-gradient(90deg, #D7383E, #B02A30); }
  .bar-fill.mid { background: linear-gradient(90deg, #E0A44A, #C8882A); }
  .bar-fill.low { background: linear-gradient(90deg, #2E9A7A, #1F7A5C); }
  .bar-row .subs {
    display: flex; gap: 14px; margin-top: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap;
  }
  .bar-row .subs span b { color: var(--ink); font-weight: 650; }

  /* ---------- 聚类明细卡 ---------- */
  .cluster-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px;
    margin-bottom: 14px;
  }
  .cluster-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .cluster-head .name { font-size: 16px; font-weight: 700; }
  .cluster-head .badge {
    font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px;
  }
  .badge.high { background: #FBE9EA; color: var(--accent-deep); }
  .badge.mid { background: #FBF1E0; color: var(--warn); }
  .badge.low { background: #E7F3EE; color: var(--good); }
  .kws { display: flex; gap: 6px; margin: 10px 0; flex-wrap: wrap; }
  .kw { font-size: 11px; color: #5B5A6E; background: #F3F2EC; padding: 3px 9px; border-radius: 6px; }
  .quote {
    font-size: 13px; color: #4A4957; background: #F7F6F1; border-left: 3px solid #E3E0D6;
    padding: 9px 12px; border-radius: 0 8px 8px 0; line-height: 1.6; margin: 10px 0;
  }
  .subs-grid { display: flex; gap: 16px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .subs-grid b { color: var(--ink); font-weight: 650; }

  /* ---------- 建议卡 ---------- */
  .sug-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px;
    margin-bottom: 14px; position: relative;
  }
  .sug-rank {
    display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px;
    border-radius: 7px; font-size: 13px; font-weight: 750; color: #fff; margin-right: 8px;
  }
  .sug-rank.r1 { background: var(--accent-deep); }
  .sug-rank.r2 { background: #7A6FBF; }
  .sug-rank.r3 { background: #9A9388; }
  .sug-rank.rx { background: #B8B2A6; }
  .sug-head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .sug-head .ttl { font-size: 15px; font-weight: 700; }
  .quickwin {
    font-size: 11px; font-weight: 700; color: #fff; background: var(--good);
    padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  }
  .roi-tag { font-size: 12px; font-weight: 700; color: var(--me); }
  .sug-body { font-size: 13.5px; line-height: 1.7; color: #33323E; }
  .sug-body .lbl { font-weight: 700; color: var(--ink); }
  .sug-how {
    background: #F4F2FB; border-left: 3px solid var(--me); padding: 9px 12px;
    border-radius: 0 8px 8px 0; margin-top: 8px; font-size: 13px; color: #3E3A66;
  }

  /* ---------- Footer ---------- */
  .footer {
    margin-top: 44px; text-align: center; padding: 26px 20px; border-top: 1px solid var(--line);
  }
  .footer .cta {
    display: inline-block; margin-top: 10px; padding: 10px 22px; border-radius: 999px;
    background: var(--ink); color: #fff; text-decoration: none; font-size: 13px; font-weight: 650;
    transition: transform .15s ease, background .15s ease;
  }
  .footer .cta:hover { background: var(--accent-deep); transform: translateY(-1px); }
  .footer .note { font-size: 12px; color: var(--muted); margin-top: 14px; }
</style>
</head>
<body>

<div class="hero">
  <div class="wrap">
    <div class="brand"><span class="mark">F</span>FeedbackLens 用户反馈分析</div>
    <h1>{{TITLE}}</h1>
    <div class="conclusion">{{CONCLUSION}}</div>
    <div class="meta">
      <span class="chip">行业：{{INDUSTRY}}</span>
      <span class="chip">反馈 {{TOTAL_COUNT}} 条</span>
      <span class="chip">来源：{{SOURCE_TYPE}}</span>
      <span class="chip">{{DATE}}</span>
    </div>
  </div>
</div>

<div class="wrap">

  <!-- 优先级总览 -->
  <div class="section">
    <h2 class="sec-title">优先级总览</h2>
    <div class="bar-list">
      {{BAR_ROWS}}
    </div>
  </div>

  <!-- 聚类明细 -->
  <div class="section">
    <h2 class="sec-title">聚类明细</h2>
    {{CLUSTER_CARDS}}
  </div>

  <!-- 改进建议 -->
  <div class="section">
    <h2 class="sec-title">改进建议（按性价比排序）</h2>
    {{SUG_CARDS}}
  </div>

</div>

<div class="footer">
  <div style="font-size:13px; color:var(--ink); font-weight:650;">本报告由 FeedbackLens 自动生成</div>
  <a class="cta" href="https://www.feedbacklens.cn/?utm_source=workbuddy_skill&amp;utm_medium=report_footer&amp;utm_campaign=feedbacklens_analysis&amp;utm_content={{UTM_CONTENT}}">需要历史记录 / 分享 / 团队协作？访问 feedbacklens.cn →</a>
  <div class="note">AI 生成的反馈分析结果，建议结合业务上下文人工复核</div>
</div>

<script>
  // 条形图动画：滚动到视口时按 data-w 填充宽度
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        const f = e.target;
        f.style.width = f.dataset.w + '%';
        io.unobserve(f);
      }
    });
  }, { threshold: 0.3 });
  document.querySelectorAll('.bar-fill').forEach(el => io.observe(el));
</script>

</body>
</html>
