<!DOCTYPE html>
<!--
  Template: Capa de Página do Facebook (1640x924 — proporção oficial desktop).
  Uso: logo.svg na MESMA pasta; renderize com Playwright viewport={'width':1640,'height':924}.
  Safe-zone: padding 90px/100px — o Facebook recorta as laterais no mobile,
  então nada crítico deve ficar fora do terço central horizontal.
  Substitua os textos marcados com {{ }}.
-->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --brand: #3db665; --brand-2: #00e676; --accent: #00d2ff; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1640px; height: 924px; background: #06090c;
    font-family: 'Plus Jakarta Sans', sans-serif; color: #fff;
    position: relative; overflow: hidden;
  }
  .bg-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 50px 50px;
  }
  .glow-a { position: absolute; top: -150px; right: -100px; width: 800px; height: 800px;
    background: radial-gradient(circle, rgba(61,182,101,0.22) 0%, rgba(0,0,0,0) 70%); }
  .glow-b { position: absolute; bottom: -150px; left: 20%; width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(0,210,255,0.15) 0%, rgba(0,0,0,0) 70%); }

  .container { position: relative; z-index: 2; height: 100%;
    padding: 90px 100px; display: flex; flex-direction: column; justify-content: space-between; }

  .top-bar { display: flex; align-items: center; justify-content: space-between; }
  .logo { height: 64px; }
  .badge {
    background: rgba(61,182,101,0.12); border: 1px solid rgba(61,182,101,0.35);
    color: var(--brand); padding: 10px 22px; border-radius: 100px;
    font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 10px;
  }
  .badge::before { content: ''; width: 10px; height: 10px; background: var(--brand);
    border-radius: 50%; box-shadow: 0 0 10px var(--brand); }

  .content { max-width: 1000px; }
  h1 { font-size: 58px; font-weight: 900; line-height: 1.15; letter-spacing: -1.5px; margin-bottom: 24px; }
  h1 span { background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  p { font-size: 24px; color: #94a3b8; line-height: 1.5; max-width: 850px; }

  .features { display: flex; gap: 30px; margin-top: 35px; }
  .feat-card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(10px); border-radius: 16px; padding: 18px 24px;
    display: flex; align-items: center; gap: 14px; }
  .feat-icon { font-size: 26px; }
  .feat-title { font-size: 19px; font-weight: 800; color: #f8fafc; }
  .feat-desc { font-size: 14px; color: #64748b; font-family: 'JetBrains Mono', monospace; }

  .footer { display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid rgba(255,255,255,0.08); padding-top: 25px; }
  .domain { font-size: 24px; font-weight: 800; font-family: 'JetBrains Mono', monospace;
    display: flex; align-items: center; gap: 10px; }
  .domain span { color: var(--brand); }
  .price-tag { font-size: 20px; color: #cbd5e1; font-weight: 600; }
  .price-tag strong { color: var(--brand-2); font-size: 26px; }
</style>
</head>
<body>
  <div class="bg-grid"></div><div class="glow-a"></div><div class="glow-b"></div>

  <div class="container">
    <div class="top-bar">
      <img class="logo" src="logo.svg" />
      <div class="badge">{{BADGE}}</div>
    </div>

    <div class="content">
      <h1>{{HEADLINE_PARTE_1}} <span>{{PALAVRA_DESTAQUE}}</span> {{HEADLINE_PARTE_2}}</h1>
      <p>{{SUBHEADLINE}}</p>

      <div class="features">
        <div class="feat-card"><div class="feat-icon">⚡</div>
          <div><div class="feat-title">{{FEAT_1}}</div><div class="feat-desc">{{FEAT_1_DESC}}</div></div></div>
        <div class="feat-card"><div class="feat-icon">🎙️</div>
          <div><div class="feat-title">{{FEAT_2}}</div><div class="feat-desc">{{FEAT_2_DESC}}</div></div></div>
        <div class="feat-card"><div class="feat-icon">🛡️</div>
          <div><div class="feat-title">{{FEAT_3}}</div><div class="feat-desc">{{FEAT_3_DESC}}</div></div></div>
      </div>
    </div>

    <div class="footer">
      <div class="domain">🌐 <span>{{DOMINIO}}</span></div>
      <div class="price-tag">Planos a partir de <strong>{{PRECO}}</strong></div>
    </div>
  </div>
</body>
</html>
