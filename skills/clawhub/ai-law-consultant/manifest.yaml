name: ai-law-consultant
slug: ai-law-consultant
version: 3.1.1
category: legal
author: 王云峰
description: "AI使用法律咨询（垂直专业方向）——只回答涉及 AI 环节的法律问题。覆盖网信办7部AI专项规章、AI安全国家标准（含GB 45438-2025强制国标）、基础法律中与 AI 直接相关的条款，给出「专业版+说人话版」双版本结论。含算法备案实操、AI内容标识、45条违规红线、11个真实案例。与 AI 无关的传统法律咨询不在本技能范围。"
long_description: |
  AI使用法律咨询——用 AI 创作，先问合不合规。本技能是 AI 法律咨询的垂直专业技能，**只回答涉及 AI 环节的法律问题**。

  每条结论都输出「专业版 + 说人话版」两个版本，法律从业者和普通用户都能用。

  技能边界（专业方向性）：
  - 范围内：AI 创作合规、AI 内容版权归属、AI 换脸/深度合成侵权、AI 训练数据合法性、算法备案、AI 服务上线资质、AI 内容标识、AI 伦理审查、人脸识别合规、AI 违规处罚
  - 范围外：与 AI 无关的传统法律咨询（合同、劳动、婚姻继承、普通电商经营等）——不强行套用本技能法规库

  法规收录原则：一律以「与 AI 直接相关」为标准，基础法律与行政法规中与 AI 无直接关联的通用条款（如反法平台低价倾销、大型企业优势地位滥用等）不收录、不展开。

  覆盖法规：
  - 7 部 AI 专项部门规章（生成式 AI 办法、深度合成规定、内容标识办法、算法推荐规定、人脸识别办法、气象应用办法；拟人化互动办法标注为征求意见稿状态）
  - 7 部基础法律中与 AI 直接相关的条款（民法典肖像权/AI产出/网络侵权、网络安全法2025修正第20条AI专门条款、数据安全法AI训练数据、个人信息保护法自动化决策/敏感信息、著作权法AI版权、科学技术进步法AI伦理、反不正当竞争法第13条数据/算法条款）
  - 行政法规与监管文件的 AI 相关部分（网络数据安全管理条例AI训练数据、AI 伦理审查办法、最高法 AI 司法应用意见、互联网信息服务管理办法AI服务资质、网络信息内容生态治理规定AI条款、关键信息基础设施保护条例AI认定）
  - AI 安全国家标准（GB 45438-2025 强制标识国标、GB/T 45652/45654/45674 训练数据/服务安全/数据标注规范）
  - 法规元数据总表（全称/文号/发布机关/施行日期/效力状态）

  特色机制：
  - 动态核验前置纪律：先核后答、区分征求意见稿、标注检索时点
  - 拟人化互动办法时效修正：明确为 2025.12.27 征求意见稿、尚未施行，不再误标为已生效

  典型使用场景：
  - 个人：「用 AI 画图发小红书需要标注吗？」「AI 生成的图版权归谁？」「AI 换脸视频违法吗？」
  - 企业：「公司用 ChatGPT 处理客户数据有风险吗？」「AI 做员工绩效评估合规吗？」
  - 服务商：「AI 对话机器人上线需要什么资质？」「AI 虚拟恋人产品有什么特殊要求？」

  功能模块：
  - 法规速查表 + 咨询工作流程 + 快速判断决策树
  - 双版本输出（专业版 + 说人话版）+ 诊断对话机制
  - 45 条违规红线清单（含法律后果）
  - 三套合规检查表（个人商用 / 企业 AI 办公 / 对外 AI 服务）
  - 算法备案、安全评估、内容标识、伦理审查实操指南
  - 典型违规案例库（11 个案例，含双版本解读）+ 最新执法案例检索指引
  - 合规文档模板（自查报告/用户协议/备案报告/免责声明/管理制度）
  - 可执行合规检查工具（交互式 + 命令行双模式）

