description: "AI法律使用咨询——让人合理合规地使用AI创作。覆盖网信办 7 部 AI 专项规章、5 部基础法律 AI 法条、行政法规与伦理政策。提供算法备案实操流程、AI 内容标识要求、违规红线清单，以及个人商用、企业 AI 办公、对外 AI 服务三套合规检查表。"
long_description: |
  AI法律使用咨询——让人合理合规地使用 AI 创作。

  宗旨：帮助个人创作者、企业和 AI 服务提供者在中国法律框架下合理、合规地
  使用 AI 进行文本、图片、音视频等创作活动。明确什么能做、什么不能做、
  怎么做才合规。

  基于现行有效的 AI 专项规章、基础法律、行政法规和伦理政策，给出合规判断、
  风险提示和操作指引。

  覆盖法规：
  - 7 部 AI 专项部门规章（生成式 AI 办法、深度合成规定、拟人化互动办法、内容标识办法、算法推荐规定、人脸识别办法、气象应用办法）
  - 5 部基础法律 AI 相关法条（民法典、网络安全法、数据安全法、个人信息保护法、著作权法）
  - 行政法规与伦理政策（网络数据安全管理条例、关键信息基础设施保护条例、AI 伦理审查办法、AI+ 行动意见、新一代 AI 伦理规范）

  功能模块：
  - 法规速查表 + 咨询工作流程 + 快速判断决策树
  - 双版本输出（专业版 + 通俗版）+ 诊断对话机制
  - 45 条违规红线清单（含法律后果）
  - 三套合规检查表（个人商用 / 企业 AI 办公 / 对外 AI 服务）
  - 算法备案、安全评估、内容标识、伦理审查实操指南
  - 典型违规案例库（11 个案例，含双版本解读）
  - 合规文档模板（自查报告/用户协议/备案报告/免责声明/管理制度）
  - 可执行合规检查工具（交互式 + 命令行双模式）

