<!-- 文艺情感模板 - 素雅诗意风 -->
<!-- 配色: 主色 #757575 辅色 #e91e63 背景 #fafafa 正文 #424242 -->

<section style="font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;font-size:17px;box-sizing:border-box;color:#616161;line-height:2;letter-spacing:0.5px;max-width:100%;word-break:break-all;">

<!-- ===== 头部样式 ===== -->
<section style="text-align:center;padding:40px 0 30px;margin-bottom:10px;">
  <section style="width:2px;height:40px;background:linear-gradient(180deg,transparent,#e91e63,transparent);margin:0 auto 16px;"></section>
  <h1 style="font-size:24px;font-weight:400;color:#212121;margin:0 0 12px;line-height:1.6;letter-spacing:3px;">{{文章主标题}}</h1>
  <p style="font-size:13px;color:#bdbdbd;margin:0;letter-spacing:2px;">{{作者}} · {{日期}}</p>
  <section style="width:30px;height:1px;background:#e0e0e0;margin:16px auto 0;"></section>
</section>

<!-- ===== 导语（可选） ===== -->
<section style="padding:20px;margin:20px 0;text-align:center;">
  <p style="margin:0;font-size:16px;color:#9e9e9e;line-height:2;font-style:italic;letter-spacing:1px;">
    {{引导语内容，文艺风格的诗意开篇，娓娓道来}}
  </p>
</section>

<!-- ===== 二级标题 ===== -->
<h2 style="font-size:19px;font-weight:400;color:#616161;margin:30px 0 14px;text-align:center;line-height:1.5;letter-spacing:2px;">
  ── {{二级标题}} ──
</h2>

<p style="font-size:17px;color:#616161;line-height:2;margin:0 0 20px;text-align:justify;letter-spacing:0.5px;">
  {{正文段落内容，文艺情感风格注重语言的质感和情感的流露，行距较宽，节奏舒缓，给读者留白呼吸的空间。每个段落都是一次情感的微旅行。}}
</p>

<!-- ===== 金句/划重点 ===== -->
<section style="text-align:center;padding:24px 20px;margin:24px 0;">
  <section style="display:inline-block;border-top:1px solid #e0e0e0;border-bottom:1px solid #e0e0e0;padding:20px 16px;">
    <p style="margin:0;font-size:18px;color:#e91e63;line-height:1.8;letter-spacing:2px;font-weight:300;">
      {{金句内容，一句话打动人心}}
    </p>
  </section>
</section>

<!-- ===== 引用块样式 ===== -->
<blockquote style="margin:24px 0;padding:0 0 0 20px;border-left:2px solid #e91e63;">
  <p style="margin:0 0 8px;font-size:16px;color:#9e9e9e;line-height:2;font-style:italic;">
    "{{引用内容}}"
  </p>
  <p style="margin:0;font-size:13px;color:#bdbdbd;">——《{{作品名}}》</p>
</blockquote>

<!-- ===== 无序列表（极简居中） ===== -->
<ul style="font-size:17px;color:#757575;line-height:2;padding-left:32px;margin:20px 0;">
  <li style="margin-bottom:4px;">{{列表项一}}</li>
  <li style="margin-bottom:4px;">{{列表项二}}</li>
  <li>{{列表项三}}</li>
</ul>

<!-- ===== 诗意文字区 ===== -->
<pre style="background:#fafafa;color:#757575;padding:24px;font-size:14px;line-height:2;margin:20px 0;text-align:center;border:1px solid #f0f0f0;white-space:pre-wrap;font-family:inherit;letter-spacing:1px;">
{{诗意的文字片段
可以是对生活的感悟
也可以是一段小诗}}
</pre>

<!-- ===== 分隔线 ===== -->
<section style="text-align:center;margin:30px 0;">
  <span style="display:inline-block;width:20px;height:1px;background:#e0e0e0;vertical-align:middle;"></span>
  <span style="margin:0 12px;color:#e0e0e0;font-size:17px;vertical-align:middle;">❋</span>
  <span style="display:inline-block;width:20px;height:1px;background:#e0e0e0;vertical-align:middle;"></span>
</section>

<!-- ===== 底部样式 ===== -->
<section style="text-align:center;padding:30px 0 16px;margin-top:20px;">
  <p style="font-size:14px;color:#757575;margin:0 0 6px;letter-spacing:2px;">{{公众号名称}}</p>
  <p style="font-size:13px;color:#bdbdbd;margin:0 0 20px;letter-spacing:1px;">在文字里，遇见另一个自己</p>
  <section style="margin:16px 0;">
    <img src="{{二维码图片地址}}" alt="关注二维码" style="display:block;max-width:100%;height:auto;width:100px;height:100px;border:1px solid #e0e0e0;padding:10px;margin:0 auto;opacity:0.85;">
  </section>
  <p style="font-size:12px;color:#e0e0e0;margin:14px 0 0;letter-spacing:2px;">长按识别 · 温柔相遇</p>
</section>

</section>
