description: 将用户筛选的链接、笔记、受众和栏目格式编排为可编辑中文周刊，提供带来源链接的导语、条目摘要与编辑说明，适用于内容策展、社群周报与品牌通讯。仅使用用户材料；缺少链接、受众或栏目时明确列出缺项，不采集未授权名单或执行群发。
