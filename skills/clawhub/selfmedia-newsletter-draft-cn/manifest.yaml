  short_description: 将已选素材整理成带来源、可编辑并可继续发布的中文周刊草稿
  default_prompt: 请根据我提供的链接、笔记、受众和栏目格式，生成带来源链接的中文周刊草稿；若资料不足，请先列出缺项。
