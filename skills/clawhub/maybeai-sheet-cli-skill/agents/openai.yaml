interface:
  display_name: "MaybeAI Sheet CLI"
  short_description: "Inspect, import, edit, and share MaybeAI spreadsheets"
  default_prompt: "Use $maybeai-sheet-cli with the mbs command to inspect workbook metadata, import local or remote-URL XLS/XLSX, CSV/TSV, and Google Sheet sources through Excelize or PG/SheetTable, natively copy PG/Excelize worksheets between workbooks, append selected worksheets into existing workbooks, safely replace worksheet data with mbs sheet update-data-keep-headers while retaining row 1 and formula columns, read or update ranges, work with excel-table and db-table data, preserve formulas, trace lineage, style worksheets, manage chart/image CRUD, orchestrate worksheet-level dashboards, export files, and manage sharing in MaybeAI. For full worksheet refreshes, run --dry-run first and --verify on execution; numeric-looking strings may normalize as Excel values. For PG/SheetTable field formatter/color/width/header metadata, prefer mbs db-table field batch-update --verify; for automatic report polish, prefer mbs style beautify. Treat worksheet images as floating chart-like objects: use picture format JSON for position/size and verify with image list plus media check. For dashboard-first or chart-authoring workflows, use $sheet-dashboard."
