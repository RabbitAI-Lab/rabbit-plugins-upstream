<script data-page-node-id="DcoJZ9ondc4LqeqrCZTuv8" data-pnid-children="HMAYTdHpaAkPYN7SUm9L4c">
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function seg(t,a,b){ return clamp((t-a)/(b-a),0,1); }
  function ease(x){ return x<0.5 ? 2*x*x : 1-Math.pow(-2*x+2,2)/2; }

  var NS='http://www.w3.org/2000/svg';
  var nodes=[
    {year:1956, x:540,  shape:'circle',   ev:'「人工智能」正式命名',    sub:'达特茅斯会议'},
    {year:1997, x:1420, shape:'square',   ev:'深蓝击败国际象棋世界冠军', sub:'IBM 深蓝'},
    {year:2012, x:2300, shape:'triangle', ev:'AlexNet 引爆深度学习',    sub:'ImageNet 竞赛'},
    {year:2016, x:3180, shape:'diamond',  ev:'AlphaGo 4:1 胜李世石',    sub:'围棋 · 深度强化学习'},
    {year:2020, x:4060, shape:'hexagon',  ev:'GPT-3：1750 亿参数',      sub:'大规模语言模型'},
    {year:2022, x:4940, shape:'burst',    ev:'ChatGPT 上线',            sub:'AI 进入每个人的日常'}
  ];
  var world=document.getElementById('world');
  var iconDraw={
    circle:function(){ var e=document.createElementNS(NS,'circle'); e.setAttribute('cx',0); e.setAttribute('cy',0); e.setAttribute('r',40); return e; },
    square:function(){ var e=document.createElementNS(NS,'rect'); e.setAttribute('x',-36); e.setAttribute('y',-36); e.setAttribute('width',72); e.setAttribute('height',72); e.setAttribute('rx',10); return e; },
    triangle:function(){ var e=document.createElementNS(NS,'polygon'); e.setAttribute('points','0,-44 42,34 -42,34'); e.setAttribute('stroke-linejoin','round'); return e; },
    diamond:function(){ var e=document.createElementNS(NS,'polygon'); e.setAttribute('points','0,-46 46,0 0,46 -46,0'); e.setAttribute('stroke-linejoin','round'); return e; },
    hexagon:function(){ var e=document.createElementNS(NS,'polygon'); e.setAttribute('points','38,-22 38,22 0,44 -38,22 -38,-22 0,-44'); e.setAttribute('stroke-linejoin','round'); return e; },
    burst:function(){ var e=document.createElementNS(NS,'circle'); e.setAttribute('cx',0); e.setAttribute('cy',0); e.setAttribute('r',48); return e; }
  };
  nodes.forEach(function(n){
    var d=document.createElement('div');
    d.className='node'; d.style.left=n.x+'px';
    d.innerHTML='<div class="yr">'+n.year+'</div>'+
      '<svg class="icon" viewBox="-60 -60 120 120"><g class="ic" fill="none" stroke="#5c6f94" stroke-width="7"></g><g class="ring"><circle cx="0" cy="0" r="40" fill="none" stroke="#5b8cff" stroke-width="4" opacity="0"/></g></svg>'+
      '<div class="ev"><div class="main">'+n.ev+'</div><div class="sub">'+n.sub+'</div></div>';
    var g=d.querySelector('.ic');
    g.appendChild(iconDraw[n.shape]());
    if(n.shape==='burst'){ g.firstChild.setAttribute('fill','#5b8cff'); g.firstChild.setAttribute('stroke','none'); }
    world.appendChild(d);
    n.el=d;
  });

  // 大年份层
  var bigyear=document.getElementById('bigyear');
  nodes.forEach(function(n){
    var s=document.createElement('span');
    s.textContent=n.year;
    bigyear.appendChild(s);
    n.bigEl=s;
  });

  // 相机时间表
  var holds=[0.55,0.55,0.55,0.55,0.55,0.9], trans=0.75, t0=0.55;
  var onTimes=[];
  (function(){
    var time=t0;
    for(var i=0;i<nodes.length;i++){
      time+=holds[i];
      onTimes.push(time-holds[i]+0.12);
      if(i<nodes.length-1) time+=trans;
    }
  })();
  function cameraX(t){
    var x=nodes[0].x, time=t0;
    for(var i=0;i<nodes.length;i++){
      if(t<time+holds[i]) return x;
      time+=holds[i];
      if(i===nodes.length-1) return x;
      var p=ease(seg(t,time,time+trans));
      x=x+(nodes[i+1].x-x)*p;
      time+=trans;
    }
    return x;
  }

  var axis=document.getElementById('axis');
  var axisLit=document.getElementById('axisLit');
  var axisLen=4940-540;

  window.seek=function(t){
    var cx=cameraX(t);
    document.getElementById('world').style.transform='translateX('+(540-cx)+'px)';
    document.getElementById('scanline').style.transform='translateX('+(cx-540)+'px)';
    document.getElementById('scanGlow').style.transform='translateX('+(cx-540)+'px)';

    // 时间轴点亮：跟随相机
    var reveal=clamp((cx-540+520)/axisLen,0,1);
    axisLit.style.strokeDasharray=axisLen;
    axisLit.style.strokeDashoffset=axisLen*(1-ease(reveal));

    // header
    document.getElementById('header').style.opacity=(seg(t,0.15,0.6)).toFixed(3);

    var lastAct=0;
    nodes.forEach(function(n,i){
      var act=seg(t,onTimes[i],onTimes[i]+0.3);
      lastAct=Math.max(lastAct,act);
      // 图标点亮
      var ic=n.el.querySelector('.ic');
      ic.style.opacity=act.toFixed(3);
      var sc=(0.6+0.4*ease(act)).toFixed(3);
      n.el.querySelector('.icon').style.transform='scale('+sc+')';
      ic.firstElementChild.setAttribute('stroke', act>0.5 ? '#5b8cff' : '#5c6f94');
      if(n.shape==='burst') ic.firstElementChild.setAttribute('fill', act>0.5 ? '#5b8cff' : '#5c6f94');
      // 扩散环
      var rp=seg(t,onTimes[i],onTimes[i]+0.7);
      var ring=n.el.querySelector('.ring circle');
      ring.setAttribute('r',(40+130*ease(rp)).toFixed(1));
      ring.setAttribute('opacity',((1-rp)*0.6).toFixed(3));
      // 年份与事件文字
      n.el.querySelector('.yr').style.opacity=(0.25+0.75*act).toFixed(3);
      n.el.querySelector('.yr').setAttribute('fill', act>0.5?'#5b8cff':'#5c6f94');
      var evEl=n.el.querySelector('.ev');
      var eo=Math.min(act, 1); // 跟随点亮
      evEl.style.opacity=eo.toFixed(3);
      evEl.style.transform='translateX(-50%) translateY('+((1-ease(eo))*36).toFixed(1)+'px)';
      // 大年份交叉淡变（提前到转场开始，与镜头同步）
      var nextOut=(i<nodes.length-1)?(onTimes[i+1]-0.55):99;
      var bo=seg(t,onTimes[i],onTimes[i]+0.3)*(1-seg(t,nextOut,nextOut+0.3));
      n.bigEl.style.opacity=(ease(bo)*0.96).toFixed(3);
    });

    // 尾声：舞台整体淡出，尾屏干净登场
    var veil=seg(t,7.95,8.65);
    var stageOut=1-ease(seg(t,7.95,8.55));
    document.getElementById('world').style.opacity=stageOut.toFixed(3);
    document.getElementById('bigyear').style.opacity=stageOut.toFixed(3);
    document.getElementById('header').style.opacity=(seg(t,0.15,0.6)*stageOut).toFixed(3);
    document.getElementById('veil').style.opacity=(veil*0.97).toFixed(3);
    document.getElementById('scanline').style.opacity=((1-veil)*0.35).toFixed(3);
    document.getElementById('scanGlow').style.opacity=(1-veil).toFixed(3);
    document.getElementById('f66').style.opacity=ease(seg(t,8.5,9.0)).toFixed(3);
    document.getElementById('frange').style.opacity=ease(seg(t,8.7,9.1)).toFixed(3);
    document.getElementById('fline').style.opacity=ease(seg(t,9.0,9.45)).toFixed(3);
    document.getElementById('fhook').style.opacity=ease(seg(t,9.35,9.8)).toFixed(3);
  };
  window.seek(0);
</script>
</body>
</html>
