<script data-page-node-id="I6crT4LxHgc4q9vAPr5eyV" data-pnid-children="jO9ytlyPerG1TrGkBhWBrK">
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function seg(t,a,b){ return clamp((t-a)/(b-a),0,1); }
  function ease(x){ return x<0.5 ? 2*x*x : 1-Math.pow(-2*x+2,2)/2; }
  function fade(t,inA,inB,outA,outB){
    return Math.min(seg(t,inA,inB), 1-seg(t,outA,outB));
  }

  // 星星（确定性伪随机）
  var starBox = document.getElementById('stars');
  for (var i=0;i<46;i++){
    var s=document.createElement('div');
    s.className='star';
    s.style.left = ((i*173.3)%1020+30)+'px';
    s.style.top = ((i*391.7)%820+40)+'px';
    s.dataset.ph = (i%7);
    starBox.appendChild(s);
  }

  var stages=[
    {el:'s1', lb:'lb1', inA:0.10, inB:0.70, outA:2.30, outB:2.75},
    {el:'s2', lb:'lb2', inA:2.45, inB:3.05, outA:4.35, outB:4.80},
    {el:'s3', lb:'lb3', inA:4.50, inB:5.10, outA:6.30, outB:6.75},
    {el:'s4', lb:'lb4', inA:6.45, inB:7.05, outA:7.95, outB:8.35}
  ];
  var dsPaths = document.querySelectorAll('#jgw-strokes .ds');
  var lens = [];
  dsPaths.forEach(function(p){ lens.push(p.getTotalLength()); });
  dsPaths.forEach(function(p,i){
    p.style.strokeDasharray = lens[i];
    p.style.strokeDashoffset = lens[i];
  });

  window.seek = function(t){
    // 四幕
    stages.forEach(function(st,idx){
      var el=document.getElementById(st.el);
      var o=fade(t, st.inA, st.inB, st.outA, st.outB);
      el.style.opacity=o.toFixed(4);
      var zoom=1+0.06*ease(seg(t, st.inB, st.outA));
      var gw=el.querySelector('.glyph-wrap');
      if(gw) gw.style.transform='translate(-50%,-50%) scale('+zoom.toFixed(4)+')';
      var lb=document.getElementById(st.lb);
      var lo=Math.min(seg(t, st.inB, st.inB+0.35), 1-seg(t, st.outA, st.outA+0.35));
      lb.style.opacity=lo.toFixed(4);
      lb.style.transform='translateY('+((1-ease(lo))*30).toFixed(1)+'px)';
    });
    // 甲骨文笔画刻痕生长
    var drawP=ease(seg(t,0.55,1.75));
    dsPaths.forEach(function(p,i){
      var each=clamp(drawP*1.35-i*0.18,0,1);
      p.style.strokeDashoffset=(lens[i]*(1-each)).toFixed(1);
    });
    // 火光闪烁（确定性）
    var fl=0.55+0.12*Math.sin(t*7.3)+0.06*Math.sin(t*13.7+1.3);
    var visible1=fade(t,0.10,0.70,2.30,2.75);
    document.getElementById('glow1').style.opacity=(visible1*fl).toFixed(4);
    // 转场火光脉冲（第一幕→第二幕）
    var pulse=seg(t,2.20,2.45)*(1-seg(t,2.45,2.85));
    if(pulse>0){
      document.getElementById('glow1').style.opacity=Math.max(
        parseFloat(document.getElementById('glow1').style.opacity||0), pulse).toFixed(4);
    }
    // 尾声
    var eo=fade(t,8.20,8.90,10.5,11);
    document.getElementById('end').style.opacity=eo.toFixed(4);
    var moon=document.getElementById('endmoon');
    var rise=ease(seg(t,8.5,9.6));
    moon.setAttribute('transform','translate(0,'+((1-rise)*140).toFixed(1)+') scale('+(0.9+0.1*rise).toFixed(3)+')');
    document.getElementById('poem').style.opacity=ease(seg(t,9.0,9.6)).toFixed(4);
    var hk=document.getElementById('hook');
    hk.style.opacity=ease(seg(t,9.4,9.9)).toFixed(4);
    hk.style.transform='translateY('+((1-ease(seg(t,9.4,9.9)))*24).toFixed(1)+'px)';
    // 星星闪烁
    var stars=starBox.children;
    for(var i=0;i<stars.length;i++){
      var tw=0.35+0.3*Math.sin(t*2.2+Number(stars[i].dataset.ph));
      stars[i].style.opacity=(eo*tw).toFixed(3);
    }
  };
  window.seek(0);
</script>
