# newsyslog.conf entry for swarmArena logs (macOS / BSD).
# Install: add to /etc/newsyslog.d/swarm-arena.conf and fix the path.
# logfilename                   [owner:group] mode count size   when  flags
/ABSOLUTE/PATH/TO/swarm-arena/logs/scan.log        644  14    1024  *     ZC
/ABSOLUTE/PATH/TO/swarm-arena/logs/review.log      644  14    1024  *     ZC
/ABSOLUTE/PATH/TO/swarm-arena/logs/daily.log       644  30    1024  *     ZC
/ABSOLUTE/PATH/TO/swarm-arena/logs/watchdog.log    644  14    512   *     ZC
