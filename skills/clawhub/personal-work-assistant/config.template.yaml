# 个人工作助理配置模板 (Personal Work Assistant Config Template)

user:
  name: "张三"
  aliases: ["San", "三哥"]
  dingtalk_user_id: "your_dingtalk_user_id"

rules:
  # 1. 重点全量监控群（无论有无@，全量分析讨论与任务）
  focused_groups:
    - name: "核心产品群"
      id: "群openConversationId"
      profile: "corpId:userId"

  # 2. 完全忽略的群（如报警通知群）
  ignored_group_keywords:
    - "报警"
    - "通知"
    - "监控"

  # 3. 私聊监控配置（拉取与核心协作者的 1 对 1 对话）
  direct_messages:
    enabled: true
    profiles:
      - "corpId:userId"

  # 4. @所有人 智能识别
  at_all_mode: "smart_classify" # 自动识别为待办任务或需知悉公告

  # 5. Teambition 任务配置
  teambition:
    enabled: true
    user_token: "your_teambition_user_token"
    org_id: "your_teambition_org_id"
    role_types: "executor"

reporting:
  delivery_channel: "dingtalk-connector"
  target_user_id: "your_dingtalk_user_id"
  time_window_hours: 24
