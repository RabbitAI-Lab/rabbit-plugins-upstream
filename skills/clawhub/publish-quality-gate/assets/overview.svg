<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="100%" role="img">
  <title>MedXpert-QG-001 发布质量门禁全景图</title>
  <desc>发布前四层敏感检查加发布后 TRACE 五维自测，T 维度一票否决</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="40" y="30" font-size="15" font-weight="500" fill="#0C447C">发布质量门禁 · 四层检查 + TRACE 五维</text>
  <text x="40" y="48" font-size="12" fill="#5F5E5A">MedXpert-QG-001 · 任何对外发布物必过此门禁</text>

  <text x="40" y="78" font-size="12" font-weight="500" fill="#444441">发布前 · 四层敏感信息检查</text>
  <g class="c-red">
    <rect x="40" y="88" width="136" height="52" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
    <text x="108" y="106" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#501313">L1 公司敏感</text>
    <text x="108" y="122" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#A32D2D">公司名/人名/证号</text>
  </g>
  <line x1="176" y1="114" x2="192" y2="114" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g class="c-amber">
    <rect x="194" y="88" width="136" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="262" y="106" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#412402">L2 本机信息</text>
    <text x="262" y="122" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B">路径/用户名/硬件</text>
  </g>
  <line x1="330" y1="114" x2="346" y2="114" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g class="c-teal">
    <rect x="348" y="88" width="136" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="416" y="106" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#04342C">L3 个人信息</text>
    <text x="416" y="122" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">手机/邮箱/身份证</text>
  </g>
  <line x1="484" y1="114" x2="500" y2="114" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g class="c-purple">
    <rect x="502" y="88" width="138" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="571" y="106" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#26215C">L4 机密信息</text>
    <text x="571" y="122" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#534AB7">密钥/密码/内部代号</text>
  </g>

  <line x1="340" y1="140" x2="340" y2="166" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="356" y="156" font-size="11" fill="#5F5E5A">零命中才可发布</text>

  <text x="40" y="196" font-size="12" font-weight="500" fill="#444441">发布后 · TRACE 五维自测（T 为红线一票否决）</text>
  <g class="c-blue">
    <rect x="40" y="206" width="112" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="96" y="224" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#0C447C">T 可信任</text>
    <text x="96" y="240" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">安全红线</text>
  </g>
  <g class="c-blue">
    <rect x="158" y="206" width="112" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="214" y="224" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#0C447C">R 可靠</text>
    <text x="214" y="240" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">稳定运行</text>
  </g>
  <g class="c-teal">
    <rect x="276" y="206" width="112" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="332" y="224" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#04342C">A 适用</text>
    <text x="332" y="240" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">场景匹配</text>
  </g>
  <g class="c-amber">
    <rect x="394" y="206" width="112" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="450" y="224" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#412402">C 规范</text>
    <text x="450" y="240" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B">结构可复用</text>
  </g>
  <g class="c-red">
    <rect x="512" y="206" width="128" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
    <text x="576" y="224" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#501313">E 有效</text>
    <text x="576" y="240" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#A32D2D">真实增益</text>
  </g>

  <rect x="40" y="280" width="600" height="28" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="340" y="294" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#501313">T 维度任何一条不通过 → 直接淘汰，其他维度不计分</text>
</svg>
