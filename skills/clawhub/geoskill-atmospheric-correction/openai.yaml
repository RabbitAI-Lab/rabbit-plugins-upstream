name: geoskill-atmospheric-correction
display_name: 大气校正
description: |
  对多光谱影像执行 DOS/简化6S 大气校正，将 DN/TOA 转为地表反射率。DOS/simplified-6S atmospheric correction converting DN/TOA to surface reflectance. 支持 Landsat 8/Sentinel-2 传感器元数据，输出地表反射率 GeoTIFF + 校正参数 JSON。
version: 0.1.0
author: Mavis
entrypoint: geoskill-atmospheric-correction.py
runtime: python>=3.9
tags:
  - gis
  - preprocessing
  - raster
  - remote-sensing
  - tooling
  - vector
