[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "zero-cover-mode"
version = "1.0.0"
description = "bug fix -> auto test + regression + root cause + weekly report + refactor alert"
requires-python = ">=3.10"

[tool.pytest.ini_options]
# modules: event_publisher, test_runner
testpaths = ["tests"]
addopts = "-v --tb=short"
