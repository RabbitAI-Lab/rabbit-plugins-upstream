changelog:
  - version: 1.0.4
    date: 2026-07-17
    change: 新增深度节点 C 上游工具——价格分规则半自动抽取脚本 scripts/extract_price_rules.py（评标办法 PDF 或文本→price_config.json 草稿 + 审阅报告，置信度+需人工确认项）；新增 references/price-rule-extraction.md 与 test_cases 用例 K；节点2评分建模接入抽取流。
  - version: 1.0.3
    date: 2026-07-17
    change: 新增深度节点 C 价格分自动算分引擎（scripts/price_score.py，低价优先/基准价/区间三类算法，仅依赖标准库，结果标需人工复核）；新增响应文件内容自动填充管线（references/response-autofill.md + templates/autofill-map.md + scripts/autofill_prepare.py），实现 招标解析→content.json→章节初稿 docx 可复现流水线；节点2评分建模接入价格分引擎，节点5接入 autofill 流。
  - version: 1.0.2
    date: 2026-07-17
    change: 全周期升级：流程扩为 4 阶段 12 节点（新增商机甄别/任务分解/润色去模板化/图表占位/呈交终审/经验沉淀）；深度节点 B 由骨架扩至章节初稿（body）+图表占位（chart）；新增前沿适配专章（电子招投标/中小企业/双信封/ESG/围串标）；评分建模补价格异常与 ESG；新增 test_cases 与 demo。
  - version: 1.0.1
    date: 2026-07-17
    change: 内嵌文档生成深度节点 B 三脚本（scripts/），消除独立安装缺生成引擎的可移植缺口
