    displayName: 政府采购文件解读助手
    description: 政府采购/企业招标文件解读与深度分析助手。当用户上传招标文件或说"解读这份标书/算价格分/出Excel清单/生成投标框架"时触发，输出 6 大模块结构化解读与红黄预警。疑似违规/差别待遇/废标条款调用 IMA 知识库（政府采购实务与合规）引用具体法条做合规溯源。区别于 bid-compliance-due-diligence（企业黑历史尽调）、bid-lightning-rod（废标雷区扫描）、bid-related-party-expert（关联关系识别），本技能专注"招标文件本身"的拆解。不适用于合同审查、投标文件代写、围标串标建议。
