<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paper2Slides — Presentation</title>
<style>
  /* === Reveal.js style minimal slide deck === */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
  }
  .slide-deck {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
  }
  .slide {
    min-height: 80vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 60px 80px;
    margin-bottom: 30px;
    border-radius: 16px;
    background: linear-gradient(145deg, #16213e, #0f3460);
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    page-break-after: always;
    position: relative;
    overflow: hidden;
  }
  .slide::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, #e94560, #533483);
  }
  .slide-cover { text-align: center; }
  .slide-cover h1 {
    font-size: 3em;
    margin-bottom: 20px;
    background: linear-gradient(135deg, #e94560, #f5a623);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .slide-cover .authors { font-size: 1.2em; color: #a0a0c0; margin-bottom: 10px; }
  .slide-cover .venue { font-size: 1em; color: #e94560; }
  .slide h2 {
    font-size: 2em;
    margin-bottom: 24px;
    color: #f5a623;
    border-bottom: 2px solid #533483;
    padding-bottom: 8px;
  }
  .slide h3 { font-size: 1.4em; margin-bottom: 16px; color: #e0e0e0; }
  .slide p, .slide li { font-size: 1.1em; line-height: 1.6; margin-bottom: 12px; }
  .slide ul, .slide ol { margin-left: 24px; margin-bottom: 16px; }
  .slide li { margin-bottom: 8px; }
  .slide .highlight { color: #f5a623; font-weight: 600; }
  .slide .tag {
    display: inline-block;
    background: #e94560;
    color: white;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.8em;
    margin-right: 8px;
  }
  .slide .metric-box {
    display: inline-block;
    background: #533483;
    border-radius: 12px;
    padding: 20px 30px;
    margin: 10px;
    text-align: center;
    min-width: 150px;
  }
  .slide .metric-box .value { font-size: 2em; font-weight: 700; color: #f5a623; }
  .slide .metric-box .label { font-size: 0.9em; color: #a0a0c0; }
  .slide .columns { display: flex; gap: 30px; }
  .slide .columns > * { flex: 1; }
  .slide .figure-placeholder {
    background: #0a0a23;
    border: 2px dashed #533483;
    border-radius: 12px;
    padding: 40px;
    text-align: center;
    color: #666;
    margin: 16px 0;
  }
  .slide .figure-placeholder img {
    max-width: 100%;
    max-height: 50vh;
    border-radius: 8px;
  }
  .slide pre {
    background: #0a0a23;
    padding: 16px;
    border-radius: 8px;
    overflow-x: auto;
    font-size: 0.85em;
  }
  .slide code { font-family: 'Cascadia Code', 'Fira Code', monospace; }
  blockquote {
    border-left: 4px solid #e94560;
    padding-left: 20px;
    margin: 16px 0;
    color: #c0c0d0;
    font-style: italic;
  }
  .slide-number {
    position: absolute;
    bottom: 20px;
    right: 30px;
    font-size: 0.8em;
    color: #666;
  }
  .speaker-notes {
    margin-top: 20px;
    padding: 16px;
    background: #0a0a2350;
    border: 1px dashed #533483;
    border-radius: 8px;
    font-size: 0.9em;
    color: #888;
  }
  .speaker-notes::before { content: "🎤 Speaker Notes: "; font-weight: 600; color: #f5a623; }
  @media print {
    .slide { min-height: 100vh; margin: 0; border-radius: 0; page-break-after: always; }
  }
</style>
</head>
<body>
<div class="slide-deck">

  <!-- ====== SLIDES GENERATED BY Paper2Slides ====== -->

  <!-- Slide 1: Cover -->
  <div class="slide slide-cover">
    <h1>${TITLE}</h1>
    <p class="authors">${AUTHORS}</p>
    <p class="venue">${VENUE} · ${YEAR}</p>
    <div style="margin-top: 60px;">
      <p>${CONFERENCE_INFO}</p>
    </div>
    <div class="slide-number">1 / ${TOTAL_SLIDES}</div>
  </div>

  <!-- Slide 2: Outline -->
  <div class="slide">
    <h2>📋 目录 / Outline</h2>
    <ul>
      <li><span class="highlight">背景 & 动机</span> — 为什么做这个研究？</li>
      <li><span class="highlight">问题定义</span> — 我们要解决什么？</li>
      <li><span class="highlight">核心方法</span> — 怎么解决的？</li>
      <li><span class="highlight">实验验证</span> — 效果如何？</li>
      <li><span class="highlight">结论 & 贡献</span> — 学到了什么？</li>
    </ul>
    <div class="slide-number">2 / ${TOTAL_SLIDES}</div>
  </div>

  <!-- ====== Insert remaining slides here ====== -->

</div>
</body>
</html>
