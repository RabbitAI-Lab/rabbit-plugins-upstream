interface:
  display_name: "维普查重与报告验真"
  short_description: "15 个维普产品的选型、价格、下单、报告与验真"
  default_prompt: "使用 $vpcs-paper-check 识别维普查重大学生版/研究生版/编辑部版/职称版/作业版/科研版、维普AIGC检测、维普格式检测、维普斟知智评三版本和四类专项检测；先使用 Skill 内置的 15 产品快照回答选型和价格，只有用户明确询问最新价格或启用状态时才一次调用 products --live；再按 /pwp 流程上传论文、返回支付与进度链接、查询报告并指导官方验真。"
