body: "## Propósito\nDefine el procedimiento obligatorio de limpieza y reset del entorno\
  \ sandbox después de completar una tarea. Garantiza que el sandbox quede limpio\
  \ para la siguiente tarea y no queden residuos que contaminen ejecuciones futuras.\n\
  \n## Disparador\nAl completar TASK con STATUS: SANDBOX_VALIDATED (después de SOP-DEV-001)\
  \ y antes de promover a host, o al cancelar/abortar una tarea en sandbox.\n\n##\
  \ Procedimiento\n1. **Identificar artifacts a preservar** — Revisar ARTIFACTS listados\
  \ en COMMS del bloque SANDBOX_VALIDATED. Estos NO se borran (se promueven a host\
  \ si procede).\n2. **Eliminar archivos temporales** — Borrar del sandbox:\n   -\
  \ Archivos `*.tmp`, `*.temp`, `*.bak`, `*~`\n   - Directorios `__pycache__/`, `.pytest_cache/`,\
  \ `node_modules/` (si no son artifacts)\n   - Logs de ejecución temporal (`*.log`,\
  \ `nohup.out`)\n   - Cualquier archivo creado durante validación que no esté en\
  \ ARTIFACTS\n3. **Reset de estado de servicios** — Si se levantaron servicios en\
  \ sandbox (DB, Redis, mocks):\n   - Detener contenedores/servicios: `docker compose\
  \ down` o equivalente\n   - Limpiar volúmenes temporales si se crearon\n   - Verificar\
  \ que puertos quedan libres\n4. **Reset de git (si aplica)** — Si se hizo `git clone`\
  \ o trabajo en repo:\n   - `git checkout -- .` para descartar cambios no committed\n\
  \   - `git clean -fd` para eliminar untracked (excepto artifacts preservados)\n\
  \   - Volver al commit/branch base documentado en SOP-DEV-001\n5. **Verificar limpieza**\
  \ — Ejecutar `ls -la` y `git status` en sandbox root. Confirmar que solo quedan\
  \ artifacts listados y estructura base.\n6. **Registrar en COMMS** — Escribir bloque\
  \ `TASK_PROGRESS` con STATUS: SANDBOX_CLEANED, lista de archivos eliminados/limpiados,\
  \ confirmación de sandbox listo para siguiente tarea.\n\n## Validación\n- ✅ Ningún\
  \ archivo temporal residual en sandbox (tmp, cache, logs, build outputs no declarados)\n\
  - ✅ Servicios/containers detenidos y puertos libres\n- ✅ Git status limpio (solo\
  \ artifacts preservados)\n- ✅ COMMS block con STATUS: SANDBOX_CLEANED escrito\n\
  - ✅ Sandbox listo para próxima tarea sin intervención manual\n\n## Escalado\n- Si\
  \ limpieza falla (permisos, procesos zombie, volúmenes persistentes) → STATUS: BLOCKED\
  \ → notificar a main\n- Si artifacts no preservados correctamente → STATUS: BLOCKED\
  \ → no proceder a promoción; recuperar de backup si existe\n- Si sandbox corrupto\
  \ irrecuperable → STATUS: DECISION_RECORDED → solicitar nuevo sandbox a main\n\n\
  ---\n*Ref: ~/.openclaw/workspace/gobierno/SOP_STANDARD.md*"
