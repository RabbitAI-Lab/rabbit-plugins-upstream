<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="980" rx="28" fill="#F6F3EE"/>
  <rect x="36" y="36" width="1528" height="908" rx="24" fill="#FFFDF8" stroke="#D8D1C7" stroke-width="2"/>
  <text x="74" y="96" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#182127">humanize-text-skill Skill Architecture</text>
  <text x="74" y="132" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#56636D">Mode → scene → protected spans → detector → action policy</text>
  <text x="74" y="156" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#56636D">→ second-pass audit → user-facing output</text>

  <rect x="74" y="182" width="1452" height="126" rx="22" fill="#FFF7E8" stroke="#E4C999" stroke-width="2"/>
  <text x="106" y="214" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#6A4A0A">1. Entry Contract</text>
  <text x="106" y="248" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#3D3D3D">SKILL.md defines rewrite / detect / edit, protected-spans-first,</text>
  <text x="106" y="272" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#3D3D3D">second-pass audit, and output shape.</text>
  <text x="106" y="296" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#3D3D3D">It tells the model how to behave as an editor, not just a phrase filter.</text>

  <rect x="74" y="340" width="250" height="110" rx="18" fill="#E6F1F8" stroke="#8EB7D0" stroke-width="2"/>
  <text x="101" y="370" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#17384D">User Input</text>
  <text x="101" y="400" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#33434E">text / file / request</text>

  <rect x="372" y="340" width="250" height="110" rx="18" fill="#E6F1F8" stroke="#8EB7D0" stroke-width="2"/>
  <text x="399" y="370" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#17384D">Mode Select</text>
  <text x="399" y="400" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#33434E">rewrite / detect / edit</text>

  <rect x="670" y="340" width="250" height="110" rx="18" fill="#EAF5EA" stroke="#99C39D" stroke-width="2"/>
  <text x="697" y="370" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#244A29">Scene + Scope</text>
  <text x="697" y="400" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#35543A">chat / status / docs / public-writing</text>

  <rect x="968" y="340" width="250" height="110" rx="18" fill="#FBEEDF" stroke="#D7B07D" stroke-width="2"/>
  <text x="995" y="370" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#6A4317">Protected Spans</text>
  <text x="995" y="400" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5B5248">numbers / commands / paths / owners / quotes</text>

  <rect x="1266" y="340" width="250" height="110" rx="18" fill="#EFE8FA" stroke="#B49AD3" stroke-width="2"/>
  <text x="1293" y="370" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#4A2F72">Detector Layer</text>
  <text x="1293" y="400" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#4F4A58">score / issues / voice.drift</text>

  <path d="M324 395H372" stroke="#70808B" stroke-width="4" stroke-linecap="round"/>
  <path d="M622 395H670" stroke="#70808B" stroke-width="4" stroke-linecap="round"/>
  <path d="M920 395H968" stroke="#70808B" stroke-width="4" stroke-linecap="round"/>
  <path d="M1218 395H1266" stroke="#70808B" stroke-width="4" stroke-linecap="round"/>

  <rect x="74" y="500" width="1452" height="204" rx="22" fill="#F8FBFD" stroke="#C9D8E2" stroke-width="2"/>
  <text x="106" y="530" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#17384D">2. Action Policy</text>
  <text x="106" y="562" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#3D3D3D">The same signal can lead to different actions depending on scene and risk.</text>
  <text x="106" y="586" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#3D3D3D">Public writing often rewrites; status and docs may prefer audit-only.</text>

  <rect x="106" y="608" width="400" height="72" rx="16" fill="#EAF5EA" stroke="#99C39D" stroke-width="2"/>
  <text x="132" y="638" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#244A29">rewrite</text>
  <text x="132" y="664" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#35543A">positive-style + scene-packs</text>
  <text x="132" y="686" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#35543A">+ operation-manual</text>

  <rect x="552" y="608" width="400" height="72" rx="16" fill="#FFF7E8" stroke="#E4C999" stroke-width="2"/>
  <text x="578" y="638" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#6A4A0A">audit-only</text>
  <text x="578" y="664" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5B5248">state missing source, risk, or boundary</text>
  <text x="578" y="686" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5B5248">instead of pretending certainty</text>

  <rect x="998" y="608" width="400" height="72" rx="16" fill="#FBEEDF" stroke="#D7B07D" stroke-width="2"/>
  <text x="1024" y="638" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#6A4317">minimal edit</text>
  <text x="1024" y="664" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5B5248">smallest stable change set, especially</text>
  <text x="1024" y="686" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5B5248">for code-adjacent text</text>

  <rect x="74" y="736" width="1452" height="132" rx="22" fill="#F4EFE7" stroke="#D9CCB8" stroke-width="2"/>
  <text x="106" y="780" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#4E3F2D">3. Second-Pass Audit</text>
  <text x="106" y="812" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4E4A43">Check only five residues: opener, summary, narrator,</text>
  <text x="106" y="836" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4E4A43">empty judgment, and over-even rhythm. Keep this pass light.</text>

  <rect x="74" y="884" width="1452" height="54" rx="18" fill="#182127"/>
  <text x="104" y="918" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFDF8">Output Contract</text>
  <text x="292" y="918" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#D9E1E6">rewrite = usable draft · detect = diagnosis · edit = changes + verification</text>

  <rect x="74" y="340" width="1452" height="598" rx="24" stroke="#D8E0E4" stroke-width="2" stroke-dasharray="8 8"/>

  <rect x="74" y="948" width="410" height="10" rx="5" fill="#E6F1F8"/>
  <text x="74" y="973" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5A6770">Decision: scene-guardrails.md + scene-packs.md + policy/*.toml</text>
  <rect x="538" y="948" width="410" height="10" rx="5" fill="#EAF5EA"/>
  <text x="538" y="973" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5A6770">Execution: positive-style.md + voice-contract.md + operation-manual.md</text>
  <rect x="1002" y="948" width="180" height="10" rx="5" fill="#EFE8FA"/>
  <text x="1002" y="973" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5A6770">Engine: detector/*</text>
</svg>
