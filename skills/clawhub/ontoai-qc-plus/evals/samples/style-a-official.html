<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ontoAI 质检官 · 质检报告</title>
<style>
/* ============ 预览外壳（不属于报告本体） ============ */
*{box-sizing:border-box}
body{margin:0;background:#EDEDF2;color:#16161D;
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif}
.shell{max-width:1120px;margin:0 auto;padding:20px 16px 60px}
.pv-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.pv-title{font-size:16px;font-weight:700}
.pv-sub{font-size:12px;color:#73737F;margin-top:2px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:1px solid #D5D5E0;background:#fff;border-radius:10px;padding:8px 14px;font-size:13px;cursor:pointer;
  font-family:inherit;color:#5B5B68;line-height:1.3}
.tab b{display:block;font-size:13px;color:#16161D}
.tab small{font-size:11px;color:#8A8A96}
.tab.on{border-color:#6E56CF;background:#F0ECFF;box-shadow:0 0 0 3px rgba(110,86,207,.12)}
.tab.on b{color:#4B39B8}
/* 快捷切换条：双击打开 HTML 即见（左上角悬浮），点击即换款；收起后进入正式外观 */
.qbar{position:fixed;top:14px;left:14px;z-index:9999;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  background:#fff;border:1px solid #C9C4E8;border-radius:12px;padding:6px 8px;
  box-shadow:0 8px 28px rgba(20,20,40,.18)}
.qbar .qtag{font-size:11px;font-weight:700;color:#6E56CF;padding:0 4px}
.qbar .tab{padding:5px 10px;border-radius:8px;font-size:12px}
.qbar .qhide{border:1px solid transparent;background:transparent;border-radius:8px;padding:5px 8px;
  font-size:12px;cursor:pointer;color:#8A8A96;font-family:inherit;line-height:1.3}
.qbar .qhide:hover{color:#16161D;border-color:#D5D5E0}
body.formal .qbar{display:none!important}
.stage{background:#fff;border-radius:14px;padding:18px;box-shadow:0 6px 24px rgba(20,20,40,.08)}
.skin{display:none}
.skin.on{display:block}
.pv-tip{font-size:12px;color:#73737F;margin:14px 2px 0;line-height:1.8}
/* 正式报告模式：去掉预览外壳的灰底、边距与卡片阴影 */
body.formal{background:#fff}
body.formal .shell{padding:0;max-width:none}
body.formal .stage{box-shadow:none;border-radius:0;padding:0;background:transparent}

/* ============ 通用：打印 ============ */
@page{size:A4;margin:14mm 14mm 16mm}
@media print{
  body{background:#fff}
  .shell{padding:0;max-width:none}
  .pv-head,.tabs,.pv-tip,.qbar{display:none!important}
  .stage{box-shadow:none;border-radius:0;padding:0}
  .skin{display:none!important}
  .skin.on{display:block!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* =========================================================
   A 款 · 官方检验报告（公文风）
   ========================================================= */
.sk-a{background:#fff;color:#111;font-family:"SimSun","Songti SC","Source Han Serif SC",serif;font-size:14px;line-height:1.85}
.sk-a .paper{width:176mm;min-height:250mm;margin:0 auto;padding:14mm 15mm;background:#fff;
  box-shadow:0 2px 14px rgba(0,0,0,.10)}
.sk-a .org{text-align:center;font-size:12px;letter-spacing:3px;color:#333}
.sk-a .ttl{text-align:center;font-family:"SimHei","Heiti SC","Microsoft YaHei",sans-serif;
  font-size:26px;letter-spacing:6px;margin:6px 0 2px}
.sk-a .sub{text-align:center;font-size:12px;color:#555;letter-spacing:2px}
.sk-a .redline{height:2.5px;background:#9E1B1B;margin:10px 0 14px}
.sk-a .kv{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:14px}
.sk-a .kv td{border:1px solid #888;padding:5px 8px;vertical-align:top}
.sk-a .kv td.k{background:#F2F2F2;width:78px;color:#333;white-space:nowrap;font-family:"SimHei","Microsoft YaHei",sans-serif;font-weight:400}
.sk-a h2{font-family:"SimHei","Heiti SC",sans-serif;font-size:14.5px;margin:16px 0 7px;letter-spacing:1px;
  border-left:4px solid #9E1B1B;padding-left:7px}
.sk-a table.d{border-collapse:collapse;width:100%;font-size:12px;margin-bottom:6px}
.sk-a table.d th,.sk-a table.d td{border:1px solid #777;padding:5px 6px;vertical-align:top;text-align:left}
.sk-a table.d th{background:#EFEFEF;font-family:"SimHei","Microsoft YaHei",sans-serif;font-weight:400;font-size:11.5px;text-align:center}
.sk-a .concl{border:2px solid #111;padding:10px 12px;font-size:13px;margin-bottom:4px;position:relative;background:#FAFAFA}
.sk-a .concl.has-seal{padding-right:106px}
.sk-a .concl .lb{font-family:"SimHei","Microsoft YaHei",sans-serif;font-weight:400}
.sk-a .seal{position:absolute;right:16px;bottom:8px;width:88px;height:88px;border:2.5px dashed #C0392B;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:#C0392B;font-size:11px;text-align:center;
  transform:rotate(-12deg);opacity:.85;letter-spacing:1px;line-height:1.4;font-family:"SimHei",sans-serif}
.sk-a .rcode{font-family:"SimHei",sans-serif}
.sk-a .note{font-size:11.5px;color:#444;line-height:1.7;margin:4px 0 0}
.sk-a .sign{display:flex;gap:0;margin-top:18px;border:1px solid #888;border-right:none}
.sk-a .sign div{flex:1;border-right:1px solid #888;padding:6px 10px;font-size:12px;min-height:52px}
.sk-a .sign span{color:#666;font-size:11px}
.sk-a .decl{margin-top:12px;font-size:11px;color:#555;line-height:1.75;border-top:1px solid #999;padding-top:6px}
.sk-a .pg{text-align:center;font-size:11px;color:#666;margin-top:10px}
.sk-a .c-must{color:#9E1B1B;font-family:"SimHei","Microsoft YaHei",sans-serif;font-weight:400}
.sk-a .bar{display:inline-block;width:118px;height:10px;background:#EFE7E7;border-radius:2px;overflow:hidden;vertical-align:middle}
.sk-a .bar i{display:block;height:100%;background:#9E1B1B}
.sk-a b{font-family:"SimHei","Microsoft YaHei",sans-serif;font-weight:400}
@media print{.sk-a .paper{width:auto;min-height:0;box-shadow:none;padding:0}}

/* =========================================================
   B 款 · 第三方检测机构（实验室风）
   ========================================================= */
.sk-b{background:#fff;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;font-size:13px;line-height:1.7;color:#1B2430}
.sk-b .paper{width:180mm;margin:0 auto;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.10)}
.sk-b .top{background:#12386B;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.sk-b .top .t1{font-size:19px;font-weight:700;letter-spacing:1px}
.sk-b .top .t2{font-size:11.5px;opacity:.85;margin-top:3px;letter-spacing:.5px}
.sk-b .top .no{text-align:right;font-size:11.5px;line-height:1.65;opacity:.95}
.sk-b .top .no b{font-size:13px;letter-spacing:.5px}
.sk-b .body{padding:18px 22px 22px}
.sk-b .kv{width:100%;border-collapse:collapse;margin-bottom:16px;font-size:12.5px}
.sk-b .kv td{border:1px solid #D6DEE8;padding:6px 9px}
.sk-b .kv td.k{background:#EEF3F9;width:96px;color:#37506E;font-weight:700;white-space:nowrap}
.sk-b .verdict{border:1px solid #C9D6E4;border-left:5px solid var(--vc,#12386B);background:#F7FAFD;
  padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:16px}
.sk-b .vbadge{background:var(--vc,#12386B);color:#fff;font-size:15px;font-weight:700;padding:7px 16px;border-radius:4px;letter-spacing:1px;white-space:nowrap}
.sk-b .vn{font-size:12.5px;color:#40556E}
.sk-b h2{font-size:13.5px;color:#12386B;margin:18px 0 8px;padding-bottom:5px;border-bottom:2px solid #12386B;letter-spacing:.5px}
.sk-b h2 em{font-style:normal;font-size:11.5px;color:#7A8CA1;font-weight:400;margin-left:8px}
.sk-b table.d{width:100%;border-collapse:collapse;font-size:12px}
.sk-b table.d th{background:#12386B;color:#fff;font-weight:600;padding:6px 8px;text-align:left;font-size:11.5px}
.sk-b table.d td{border-bottom:1px solid #E3E9F0;padding:6px 8px;vertical-align:top}
.sk-b table.d tbody tr:nth-child(even){background:#F7FAFD}
.sk-b .tag{display:inline-block;background:#EEF3F9;color:#12386B;border:1px solid #C9D6E4;border-radius:3px;
  font-size:10.5px;padding:1px 6px;font-weight:700}
.sk-b .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.sk-b .barm{height:9px;background:#EEF2F7;border-radius:2px;overflow:hidden}
.sk-b .barm i{display:block;height:100%}
.sk-b .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:4px}
.sk-b .card{border:1px solid #D6DEE8;border-top:3px solid var(--cc,#12386B);padding:10px 8px;text-align:center;border-radius:3px}
.sk-b .card .n{font-size:24px;font-weight:700;color:var(--cc,#12386B);line-height:1.1}
.sk-b .card .l{font-size:11px;color:#5A6B80;margin-top:2px}
.sk-b .decl{margin-top:16px;border:1px solid #D6DEE8;background:#FBFCFE;padding:10px 14px;font-size:10.5px;color:#5A6B80;line-height:1.8}
.sk-b .sign{margin-top:14px;display:flex;gap:14px;font-size:12px}
.sk-b .sign div{flex:1;border-bottom:1px solid #9AAABB;padding-bottom:22px;color:#37506E}
.sk-b .ft{margin-top:10px;text-align:center;font-size:10.5px;color:#8A99AB;border-top:1px solid #E3E9F0;padding-top:8px}
@media print{.sk-b .paper{width:auto;box-shadow:none}}

/* =========================================================
   C 款 · 现代图表（SaaS 风）
   ========================================================= */
.sk-c{background:#F6F6F9;padding:24px 0 40px;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#16161D}
.sk-c .paper{max-width:920px;margin:0 auto;padding:0 20px}
.sk-c .hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.sk-c .brand{font-size:21px;font-weight:700;letter-spacing:.5px}
.sk-c .brand span{color:#6E56CF}
.sk-c .tagline{font-size:12px;color:#8A8A96;margin-top:2px}
.sk-c .meta{font-size:12px;color:#5B5B68;text-align:right;line-height:1.9}
.sk-c .meta b{color:#16161D}
.sk-c .verdict{background:#fff;border:1px solid #E6E6EE;border-radius:14px;padding:20px 22px;margin-bottom:14px;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-left:6px solid var(--vc,#6E56CF)}
.sk-c .vlab{font-size:25px;font-weight:700;color:var(--vc,#6E56CF)}
.sk-c .vnote{font-size:13px;color:#5B5B68}
.sk-c .vkick{font-size:11px;color:#8A8A96;letter-spacing:2px}
.sk-c .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:14px}
.sk-c .stat{background:#fff;border:1px solid #E6E6EE;border-radius:11px;padding:14px 12px;text-align:center}
.sk-c .stat .n{font-size:29px;font-weight:700;line-height:1.1;color:var(--cc,#6E56CF)}
.sk-c .stat .l{font-size:11.5px;color:#5B5B68;margin-top:3px}
.sk-c .panel{background:#fff;border:1px solid #E6E6EE;border-radius:14px;padding:18px 20px;margin-bottom:13px}
.sk-c .panel h3{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sk-c .panel h3 i{width:7px;height:7px;border-radius:50%;background:#6E56CF}
.sk-c .barrow{display:grid;grid-template-columns:92px 1fr 30px;gap:10px;align-items:center;margin-bottom:8px}
.sk-c .blab{font-size:12px;color:#5B5B68;text-align:right}
.sk-c .btrk{background:#F0F0F5;border-radius:999px;height:15px;overflow:hidden}
.sk-c .bfill{height:100%;border-radius:999px}
.sk-c .bval{font-size:12px;font-weight:600}
.sk-c .stack{display:flex;height:15px;border-radius:999px;overflow:hidden;background:#F0F0F5}
.sk-c .stack i{display:block;height:100%}
.sk-c .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:#5B5B68;margin-bottom:12px}
.sk-c .legend em{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px}
.sk-c table.d{width:100%;border-collapse:collapse;font-size:12.5px}
.sk-c table.d th{text-align:left;font-weight:600;color:#5B5B68;font-size:11px;padding:8px 9px;border-bottom:1.5px solid #E6E6EE;background:#FAFAFD;white-space:nowrap}
.sk-c table.d td{padding:10px 9px;border-bottom:1px solid #F0F0F5;vertical-align:top}
.sk-c .rule{display:inline-block;background:#F0ECFF;color:#5B45C9;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap}
.sk-c .quote{color:#5B5B68;font-size:12px}
.sk-c .cons{color:#C0392B;font-size:12px}
.sk-c .next{background:#F0ECFF;border:1px solid #DDD4FB;border-radius:12px;padding:15px 20px;font-size:13px;color:#3B2A82}
.sk-c .next b{display:block;font-size:11px;letter-spacing:1px;margin-bottom:4px;color:#6E56CF}
.sk-c .foot{text-align:center;font-size:11px;color:#8A8A96;margin-top:20px;line-height:1.9}
@media print{.sk-c{background:#fff;padding:0}.sk-c .panel,.sk-c .verdict,.sk-c .stat{break-inside:avoid}}

/* =========================================================
   D 款 · 学术 / 出版（期刊风）
   ========================================================= */
.sk-d{background:#fff;color:#1A1A1A;font-family:"Songti SC","SimSun","Source Han Serif SC",Georgia,serif;
  font-size:14px;line-height:1.95}
.sk-d .paper{width:170mm;margin:0 auto;padding:16mm 14mm;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.10)}
.sk-d .jhead{border-bottom:2.5px solid #1A1A1A;padding-bottom:8px;margin-bottom:4px;
  display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sk-d .jname{font-size:11.5px;letter-spacing:2px;color:#444}
.sk-d .jno{font-size:11px;color:#666}
.sk-d h1{font-size:21px;text-align:center;margin:16px 0 6px;letter-spacing:1px;font-family:"Microsoft YaHei","Songti SC",serif;font-weight:700}
.sk-d .au{text-align:center;font-size:12px;color:#555;margin-bottom:4px}
.sk-d .abst{border-top:1px solid #CCC;border-bottom:1px solid #CCC;padding:9px 0;margin:12px 0 16px;font-size:12.5px;color:#333}
.sk-d .abst b{font-family:"Microsoft YaHei","Songti SC",serif;font-weight:700;color:#9E1B1B}
.sk-d h2{font-size:15px;margin:20px 0 8px;font-family:"Microsoft YaHei","Songti SC",serif;font-weight:700;letter-spacing:.5px;border-bottom:1px solid #1A1A1A;padding-bottom:5px}
.sk-d h3{font-size:13.5px;margin:14px 0 6px;font-family:"Microsoft YaHei","Songti SC",serif;font-weight:700;color:#333}
.sk-d table.d{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0 4px}
.sk-d table.d th{border-top:1.6px solid #1A1A1A;border-bottom:.8px solid #1A1A1A;padding:5px 7px;text-align:left;font-weight:400;font-size:11.5px}
.sk-d table.d td{border-bottom:.5px solid #DDD;padding:5px 7px;vertical-align:top}
.sk-d table.d tr:last-child td{border-bottom:1.6px solid #1A1A1A}
.sk-d .cap{font-size:11px;color:#666;margin:2px 0 12px}
.sk-d .fn{font-size:11px;color:#666;border-top:.5px solid #CCC;margin-top:14px;padding-top:6px;line-height:1.8}
.sk-d .rule{font-variant:small-caps;font-size:11px;color:#444}
.sk-d .kv{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0 14px}
.sk-d .kv td{padding:3px 8px 3px 0;color:#333}
.sk-d .kv td.k{width:74px;color:#666;white-space:nowrap}
.sk-d .bar{display:inline-block;width:118px;height:9px;background:#ECECEC;border-radius:2px;overflow:hidden;vertical-align:middle}
.sk-d .bar i{display:block;height:100%;background:#1A1A1A}
.sk-d b{font-family:"Microsoft YaHei","Songti SC",serif;font-weight:700}
@media print{.sk-d .paper{width:auto;box-shadow:none;padding:0}}

/* =========================================================
   英文版字体（lang=en）：Latin 栈优先，保留 CJK 回退防乱码
   Arial / Georgia 均有真粗体 → 不会触发"合成粗体"位图
   ========================================================= */
.lang-en .sk-a{font-family:"Georgia","Times New Roman","Songti SC","SimSun",serif;font-size:14px;line-height:1.8}
.lang-en .sk-a .ttl,.lang-en .sk-a h2,.lang-en .sk-a .kv td.k,.lang-en .sk-a table.d th,
.lang-en .sk-a .concl .lb,.lang-en .sk-a .seal,.lang-en .sk-a .rcode,.lang-en .sk-a b{font-family:"Arial","Helvetica Neue","Microsoft YaHei",sans-serif;font-weight:700}
.lang-en .sk-a .c-must{font-family:"Arial","Helvetica Neue","Microsoft YaHei",sans-serif;font-weight:400}
.lang-en .sk-b{font-family:"Arial","Helvetica Neue","Microsoft YaHei",sans-serif}
.lang-en .sk-c{font-family:"Arial","Helvetica Neue","Microsoft YaHei",sans-serif}
.lang-en .sk-d{font-family:"Georgia","Times New Roman","Songti SC",serif}
.lang-en .sk-d h1,.lang-en .sk-d h2,.lang-en .sk-d h3,.lang-en .sk-d .abst b,
.lang-en .sk-d .kv td.k,.lang-en .sk-d b{font-family:"Arial","Helvetica Neue","Microsoft YaHei",sans-serif;font-weight:700}
</style>
</head>
<body>
<div class="shell">

  <div class="pv-head">
    <div>
      <div class="pv-title">ontoAI 质检官 · 报告款式对比</div>
      <div class="pv-sub">同一份质检数据，四种版式。选定后落成正式模板（HTML 版 + PDF 版）。</div>
    </div>
    <div class="tabs" id="tabs"></div>
  </div>

  <div class="stage" id="stage"></div>

  <div class="pv-tip">
    打印 / 导出：切到某一款后按 Ctrl+P（或点右上角浏览器的打印），已内置 A4 版式与背景色保留规则。
  </div>

</div>

<script>
/* ============================================================
   同一份 DATA，四款版式共用。正式模板只需替换此对象。
   ============================================================ */
const DATA = {
  /* 版式：a=官方检验报告 b=第三方检测机构 c=现代图表 d=学术/出版 */
  style: "a",
  /* 语言：zh=中文外壳 en=英文外壳（仅影响报告 UI 标签；issue/quote 等正文保持原文） */
  lang: "zh",
  publisher: "天津市微数人工智能科技有限责任公司",
  reportNo: "ontoAI-QC-20261011-001",
  date: "2026-10-11",
  product: "2026Q3 产品发布稿.docx",
  modality: "H1 图文混排 / W1 Word",
  scenario: "S2 对外发布",
  ruleLevel: "RL1–RL3 · L1–L2",
  basis: "ontoAI 质检官 SKILL.md v1.4.3 · 通用维度 D1–D6 · 中文残留规则库 RZ",
  verdict: { code:"modify", label:"修改后放行", emoji:"🟡", note:"改完 2 处必改项即可发布" },
  counts: { must:2, should:3, doubt:1, pass:7 },
  byDimension: [
    { dim:"残留度 D1", must:1, should:2, doubt:0 },
    { dim:"真实性 D2", must:1, should:0, doubt:1 },
    { dim:"一致性 D3", must:0, should:1, doubt:0 },
    { dim:"完整性 D4", must:0, should:0, doubt:0 },
    { dim:"合规性 D5", must:0, should:0, doubt:0 },
    { dim:"适配性 D6", must:0, should:0, doubt:0 }
  ],
  must: [
    { no:1, loc:"第 8 页末段", issue:"结尾残留对话尾巴", rule:"RZ-01",
      quote:"需要我帮你生成其他版本吗？",
      consequence:"读者一眼看出是 AI 输出，全文可信度归零，客户或出版社直接退回",
      fix:"删除该句" },
    { no:2, loc:"第 3 页第 2 段", issue:"引用无出处", rule:"D2.4",
      quote:"据 2025 年行业统计，市场规模增长了 37%",
      consequence:"被追问时无法作答；投标或出版场景下属事实性错误",
      fix:"补真实来源（发布方+年份+页码），或删除改用定性表述" }

const ZH2EN_ORDER = Object.keys(ZH2EN).sort((a,b)=>b.length-a.length);
function localize(html){
  if (DATA.lang !== "en") return html;
  /* 先摘出 P() 标记内的产物原文（引语/正文逐字保留），再做外壳替换，最后还原 */
  const stash = [];
  html = html.replace(/\uE000([\s\S]*?)\uE001/g, (m, g) => { stash.push(g); return "\uE000" + (stash.length - 1) + "\uE001"; });
  for (const z of ZH2EN_ORDER) if (z) html = html.split(z).join(ZH2EN[z]);
  return html.replace(/\uE000(\d+)\uE001/g, (m, i) => stash[+i]);
}

/* ========================= 装配 ========================= */
const SKINS = [
  { id:"a", name:"A · 官方检验报告", desc:"公文版式 · 宋体正文 · 红头线 · 印章位 · 签署栏", fn:skinA },
  { id:"b", name:"B · 第三方检测机构", desc:"实验室风 · 深蓝表头 · 结论徽章 · 三线统计", fn:skinB },
  { id:"c", name:"C · 现代图表", desc:"SaaS 风 · 卡片 · 条形图 · 屏幕阅读友好", fn:skinC },
  { id:"d", name:"D · 学术 / 出版", desc:"期刊风 · 衬线 · 三线表 · 表题与注释", fn:skinD }
];

const tabs = document.getElementById("tabs");
const stage = document.getElementById("stage");

/* 版式选择优先级：URL ?style=  >  DATA.style  >  默认 A 款 */
const qs = new URLSearchParams(location.search);
const pick = (qs.get("style") || DATA.style || "a").toLowerCase();
let cur = SKINS.filter(s => s.id === pick).length ? pick : "a";

/* 语言：写回 <html lang> 并挂字体类（CSS 据此切换 Latin / CJK 字体栈） */
document.documentElement.lang = DATA_LANG === "en" ? "en" : "zh-CN";
document.documentElement.classList.add(DATA_LANG === "en" ? "lang-en" : "lang-zh");
if (DATA_LANG === "en") document.title = "ontoAI Quality Inspector · Inspection Report";

function show(id){
  const s = SKINS.filter(x => x.id === id)[0];
  stage.innerHTML = '<div class="skin on" id="sk-' + id + '">' + localize(s.fn()) + '</div>';
  tabs.querySelectorAll(".tab").forEach((t,k)=>t.classList.toggle("on", SKINS[k].id === id));
  document.querySelectorAll(".qbar .tab").forEach(el => el.classList.toggle("on", el.dataset.id === id));
}

/* 模式分支：
   ?formal=1 → 正式交付：无任何外壳，收件人看到的就是干净报告
   ?picker=1 → 全量对比模式：标题 + 带描述的切换卡 + 打印提示
   默认（双击打开）→ 左上角悬浮快捷切换条（4 款 + 收起），点击即换款 */
if (qs.get("picker") === "1") {
  tabs.innerHTML = SKINS.map(s => '<button class="tab" data-id="' + s.id + '">' +
    '<b>' + s.name + '</b><small>' + s.desc + '</small></button>').join("");
  tabs.addEventListener("click", e => {
    const b = e.target.closest(".tab"); if (!b) return;
    cur = b.dataset.id; show(cur);
  });
  show(cur);
} else if (qs.get("formal") !== "1") {
  document.querySelector(".pv-head").style.display = "none";
  document.querySelector(".pv-tip").style.display = "none";
  const bar = document.createElement("div");
  bar.className = "qbar";
  bar.innerHTML = '<span class="qtag">款式</span>' +
    SKINS.map(s => '<button class="tab" data-id="' + s.id + '" title="' + s.desc + '">' + s.name + '</button>').join("") +
    '<button class="qhide" title="隐藏切换条，恢复正式报告外观">收起 ✕</button>';
  document.body.appendChild(bar);
  bar.addEventListener("click", e => {
    const t = e.target.closest(".tab");
    if (t) { cur = t.dataset.id; show(cur); return; }
    if (e.target.closest(".qhide")) { bar.remove(); document.body.classList.add("formal"); }
  });
  show(cur);
} else {
  document.querySelector(".pv-head").style.display = "none";
  document.querySelector(".pv-tip").style.display = "none";
  document.body.classList.add("formal");
  show(cur);
}
</script>
