<!DOCTYPE html>

<title>ontoAI 质检官 · 质检报告</title>
<style>
/* ============ 预览外壳（不属于报告本体） ============ */
*{box-sizing:border-box}
body{margin:0;background:#EDEDF2;color:#16161D;
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif}
.shell{max-width:1120px;margin:0 auto;padding:20px 16px 60px}
.pv-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.pv-title{font-size:16px;font-weight:700}
.pv-sub{font-size:12px;color:#73737F;margin-top:2px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:1px solid #D5D5E0;background:#fff;border-radius:10px;padding:8px 14px;font-size:13px;cursor:pointer;
  font-family:inherit;color:#5B5B68;line-height:1.3}
.tab b{display:block;font-size:13px;color:#16161D}
.tab small{font-size:11px;color:#8A8A96}
.tab.on{border-color:#6E56CF;background:#F0ECFF;box-shadow:0 0 0 3px rgba(110,86,207,.12)}
.tab.on b{color:#4B39B8}
.stage{background:#fff;border-radius:14px;padding:18px;box-shadow:0 6px 24px rgba(20,20,40,.08)}
.skin{display:none}
.skin.on{display:block}
.pv-tip{font-size:12px;color:#73737F;margin:14px 2px 0;line-height:1.8}
/* 正式报告模式：去掉预览外壳的灰底、边距与卡片阴影 */
body.formal{background:#fff}
body.formal .shell{padding:0;max-width:none}
body.formal .stage{box-shadow:none;border-radius:0;padding:0;background:transparent}

/* ============ 通用：打印 ============ */
@page{size:A4;margin:14mm 14mm 16mm}
@media print{
  body{background:#fff}
  .shell{padding:0;max-width:none}
  .pv-head,.tabs,.pv-tip{display:none!important}
  .stage{box-shadow:none;border-radius:0;padding:0}
  .skin{display:none!important}
  .skin.on{display:block!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* =========================================================
   A 款 · 官方检验报告（公文风）
   ========================================================= */
.sk-a{background:#fff;color:#111;font-family:"SimSun","Songti SC","Source Han Serif SC",serif;font-size:14px;line-height:1.85}
.sk-a .paper{width:176mm;min-height:250mm;margin:0 auto;padding:14mm 15mm;background:#fff;
  box-shadow:0 2px 14px rgba(0,0,0,.10)}
.sk-a .org{text-align:center;font-size:12px;letter-spacing:3px;color:#333}
.sk-a .ttl{text-align:center;font-family:"SimHei","Heiti SC","Microsoft YaHei",sans-serif;
  font-size:26px;letter-spacing:6px;margin:6px 0 2px}
.sk-a .sub{text-align:center;font-size:12px;color:#555;letter-spacing:2px}
.sk-a .redline{height:2.5px;background:#9E1B1B;margin:10px 0 14px}

.sk-a .kv td{border:1px solid #888;padding:5px 8px;vertical-align:top}
.sk-a .kv td.k{background:#F2F2F2;width:78px;color:#333;white-space:nowrap;font-family:"SimHei","Microsoft YaHei",sans-serif;font-weight:400}
.sk-a h2{font-family:"SimHei","Heiti SC",sans-serif;font-size:14.5px;margin:16px 0 7px;letter-spacing:1px;
  border-left:4px solid #9E1B1B;padding-left:7px}
.sk-a table.d{border-collapse:collapse;width:100%;font-size:12px;margin-bottom:6px}
.sk-a table.d th,.sk-a table.d td{border:1px solid #777;padding:5px 6px;vertical-align:top;text-align:left}
.sk-a table.d th{background:#EFEFEF;font-family:"SimHei","Microsoft YaHei",sans-serif;font-weight:400;font-size:11.5px;text-align:center}

  transform:rotate(-12deg);opacity:.85;letter-spacing:1px;line-height:1.4;font-family:"SimHei",sans-serif}
.sk-a .rcode{font-family:"SimHei",sans-serif}
.sk-a .note{font-size:11.5px;color:#444;line-height:1.7;margin:4px 0 0}
.sk-a .sign{display:flex;gap:0;margin-top:18px;border:1px solid #888;border-right:none}
.sk-a .sign div{flex:1;border-right:1px solid #888;padding:6px 10px;font-size:12px;min-height:52px}
.sk-a .sign span{color:#666;font-size:11px}
.sk-a .decl{margin-top:12px;font-size:11px;color:#555;line-height:1.75;border-top:1px solid #999;padding-top:6px}
.sk-a .pg{text-align:center;font-size:11px;color:#666;margin-top:10px}
.sk-a .c-must{color:#9E1B1B;font-family:"SimHei","Microsoft YaHei",sans-serif;font-weight:400}
.sk-a .bar{display:inline-block;width:118px;height:10px;background:#EFE7E7;border-radius:2px;overflow:hidden;vertical-align:middle}
.sk-a .bar i{display:block;height:100%;background:#9E1B1B}
.sk-a b{font-family:"SimHei","Microsoft YaHei",sans-serif;font-weight:400}
@media print{.sk-a .paper{width:auto;min-height:0;box-shadow:none;padding:0}}

/* =========================================================
   B 款 · 第三方检测机构（实验室风）
   ========================================================= */
.sk-b{background:#fff;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;font-size:13px;line-height:1.7;color:#1B2430}
.sk-b .paper{width:180mm;margin:0 auto;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.10)}

.sk-b table.d{width:100%;border-collapse:collapse;font-size:12px}

.sk-b .sign div{flex:1;border-bottom:1px solid #9AAABB;padding-bottom:22px;color:#37506E}
.sk-b .ft{margin-top:10px;text-align:center;font-size:10.5px;color:#8A99AB;border-top:1px solid #E3E9F0;padding-top:8px}

/* =========================================================

.sk-c{background:#F6F6F9;padding:24px 0 40px;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#16161D}
.sk-c .paper{max-width:920px;margin:0 auto;padding:0 20px}
.sk-c .hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.sk-c .brand{font-size:21px;font-weight:700;letter-spacing:.5px}
.sk-c .brand span{color:#6E56CF}
.sk-c .tagline{font-size:12px;color:#8A8A96;margin-top:2px}
.sk-c .meta{font-size:12px;color:#5B5B68;text-align:right;line-height:1.9}
.sk-c .meta b{color:#16161D}
.sk-c .verdict{background:#fff;border:1px solid #E6E6EE;border-radius:14px;padding:20px 22px;margin-bottom:14px;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-left:6px solid var(--vc,#6E56CF)}
.sk-c .vlab{font-size:25px;font-weight:700;color:var(--vc,#6E56CF)}
.sk-c .vnote{font-size:13px;color:#5B5B68}
.sk-c .vkick{font-size:11px;color:#8A8A96;letter-spacing:2px}
.sk-c .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:14px}
.sk-c .stat{background:#fff;border:1px solid #E6E6EE;border-radius:11px;padding:14px 12px;text-align:center}
.sk-c .stat .n{font-size:29px;font-weight:700;line-height:1.1;color:var(--cc,#6E56CF)}
.sk-c .stat .l{font-size:11.5px;color:#5B5B68;margin-top:3px}
.sk-c .panel{background:#fff;border:1px solid #E6E6EE;border-radius:14px;padding:18px 20px;margin-bottom:13px}
.sk-c .panel h3{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sk-c .panel h3 i{width:7px;height:7px;border-radius:50%;background:#6E56CF}
.sk-c .barrow{display:grid;grid-template-columns:92px 1fr 30px;gap:10px;align-items:center;margin-bottom:8px}
.sk-c .blab{font-size:12px;color:#5B5B68;text-align:right}
.sk-c .btrk{background:#F0F0F5;border-radius:999px;height:15px;overflow:hidden}
.sk-c .bfill{height:100%;border-radius:999px}
.sk-c .bval{font-size:12px;font-weight:600}
.sk-c .stack{display:flex;height:15px;border-radius:999px;overflow:hidden;background:#F0F0F5}
.sk-c .stack i{display:block;height:100%}
.sk-c .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:#5B5B68;margin-bottom:12px}
.sk-c .legend em{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px}
.sk-c table.d{width:100%;border-collapse:collapse;font-size:12.5px}
.sk-c table.d th{text-align:left;font-weight:600;color:#5B5B68;font-size:11px;padding:8px 9px;border-bottom:1.5px solid #E6E6EE;background:#FAFAFD;white-space:nowrap}
.sk-c table.d td{padding:10px 9px;border-bottom:1px solid #F0F0F5;vertical-align:top}
.sk-c .rule{display:inline-block;background:#F0ECFF;color:#5B45C9;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap}
.sk-c .quote{color:#5B5B68;font-size:12px}
.sk-c .cons{color:#C0392B;font-size:12px}

.sk-c .next b{display:block;font-size:11px;letter-spacing:1px;margin-bottom:4px;color:#6E56CF}
.sk-c .foot{text-align:center;font-size:11px;color:#8A8A96;margin-top:20px;line-height:1.9}
@media print{.sk-c{background:#fff;padding:0}.sk-c .panel,.sk-c .verdict,.sk-c .stat{break-inside:avoid}}

/* =========================================================
   D 款 · 学术 / 出版（期刊风）
   ========================================================= */
.sk-d{background:#fff;color:#1A1A1A;font-family:"Songti SC","SimSun","Source Han Serif SC",Georgia,serif;
  font-size:14px;line-height:1.95}
.sk-d .paper{width:170mm;margin:0 auto;padding:16mm 14mm;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.10)}
.sk-d .jhead{border-bottom:2.5px solid #1A1A1A;padding-bottom:8px;margin-bottom:4px;
  display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sk-d .jname{font-size:11.5px;letter-spacing:2px;color:#444}
.sk-d .jno{font-size:11px;color:#666}
.sk-d h1{font-size:21px;text-align:center;margin:16px 0 6px;letter-spacing:1px;font-family:"Microsoft YaHei","Songti SC",serif;font-weight:700}
.sk-d .au{text-align:center;font-size:12px;color:#555;margin-bottom:4px}
.sk-d .abst{border-top:1px solid #CCC;border-bottom:1px solid #CCC;padding:9px 0;margin:12px 0 16px;font-size:12.5px;color:#333}
.sk-d .abst b{font-family:"Microsoft YaHei","Songti SC",serif;font-weight:700;color:#9E1B1B}
.sk-d h2{font-size:15px;margin:20px 0 8px;font-family:"Microsoft YaHei","Songti SC",serif;font-weight:700;letter-spacing:.5px;border-bottom:1px solid #1A1A1A;padding-bottom:5px}
.sk-d h3{font-size:13.5px;margin:14px 0 6px;font-family:"Microsoft YaHei","Songti SC",serif;font-weight:700;color:#333}

.sk-d table.d th{border-top:1.6px solid #1A1A1A;border-bottom:.8px solid #1A1A1A;padding:5px 7px;text-align:left;font-weight:400;font-size:11.5px}
.sk-d table.d td{border-bottom:.5px solid #DDD;padding:5px 7px;vertical-align:top}

.sk-d .kv td{padding:3px 8px 3px 0;color:#333}
.sk-d .kv td.k{width:74px;color:#666;white-space:nowrap}
.sk-d .bar{display:inline-block;width:118px;height:9px;background:#ECECEC;border-radius:2px;overflow:hidden;vertical-align:middle}
.sk-d .bar i{display:block;height:100%;background:#1A1A1A}
.sk-d b{font-family:"Microsoft YaHei","Songti SC",serif;font-weight:700}
@media print{.sk-d .paper{width:auto;box-shadow:none;padding:0}}
</style>
</head>
<body>
<div class="shell">

  <div class="pv-head">
    <div>
      <div class="pv-title">ontoAI 质检官 · 报告款式对比</div>

  </div>

</div>

<script>
/* ============================================================
   同一份 DATA，四款版式共用。正式模板只需替换此对象。
   ============================================================ */
const DATA = {
  basis: "《ontoAI 质检官质检规范》v1.2 · 通用维度 D1–D6",
  date: "2026-10-11",

/* ========================= 工具 ========================= */
const esc = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const VCOLOR = { pass:"#2FA36B", tweak:"#3B82F6", modify:"#E08A00", redo:"#C0392B" };
const C = { must:"#C0392B", should:"#E08A00", doubt:"#8A8A96", pass:"#2FA36B" };
const c = DATA.counts;
const M=c.must|0, S=c.should|0, D=c.doubt|0, P=c.pass|0, TOTAL=M+S+D+P;
const VC = VCOLOR[DATA.verdict.code] || "#6E56CF";
const RATE = TOTAL ? Math.round(P/TOTAL*100) : 100;
const lvMax = Math.max(M,S,D,P,1);
const dimMax = Math.max.apply(null, DATA.byDimension.map(d=>(d.must|0)+(d.should|0)+(d.doubt|0)).concat([1]));
const txtBar = (n, mx) => { const pct = mx>0 ? Math.max(2, Math.round(n/mx*100)) : 0; return '<span class="bar"><i style="width:'+pct+'%"></i></span>'; };
/* 用 CSS 画彩色圆点替代 emoji —— emoji 在 PDF 里会变成位图(Type3)字，放大就糊 */
const dotEmoji = (col, sz) => '<span style="display:inline-block;width:'+(sz||10)+'px;height:'+(sz||10)+'px;border-radius:50%;background:'+col+';margin-right:6px;vertical-align:middle"></span>';

/* ========================= A 款 ========================= */
function skinA(){
  const dimRows = DATA.byDimension.map(d=>{
    const t=(d.must|0)+(d.should|0)+(d.doubt|0);
    return "<tr><td>"+esc(d.dim)+"</td><td style='text-align:center'>"+(d.must|0)+"</td>"+
      "<td style='text-align:center'>"+(d.should|0)+"</td><td style='text-align:center'>"+(d.doubt|0)+"</td>"+
      "<td style='text-align:center'>"+t+"</td><td>"+(t?txtBar(t,dimMax):"—")+"</td></tr>";
  }).join("");
  const lvRows = [[dotEmoji(C.must,11)+"必改",M,"不改就别发","改完再发"],[dotEmoji(C.should,11)+"可改",S,"改了更好，不改也能发","可选"],
    [dotEmoji(C.doubt,11)+"存疑",D,"我判断不了，请你确认","确认后处理"],[dotEmoji(C.pass,11)+"已通过",P,"已检查、无问题","—"]]
    .map(r=>"<tr><td>"+r[0]+"</td><td style='text-align:center'><b>"+r[1]+"</b></td>"+
      "<td>"+txtBar(r[1],lvMax)+"</td><td>"+r[2]+"</td><td>"+r[3]+"</td></tr>").join("");
  return '<div class="sk-a"><div class="paper">'+
  '<div class="org">'+esc(DATA.publisher)+'</div>'+
  '<div class="ttl">AI 产物质检报告</div>'+
  '<div class="sub">QUALITY INSPECTION REPORT · 交付前最后一道关</div>'+
  '<div class="redline"></div>'+
  '<table class="kv">'+
    '<tr><td class="k">受检产物</td><td colspan="3">'+esc(DATA.product)+'</td>'+
        '<td class="k">报告编号</td><td class="rcode">'+esc(DATA.reportNo)+'</td></tr>'+
    '<tr><td class="k">模态 / 场景</td><td colspan="3">'+esc(DATA.modality)+' ｜ '+esc(DATA.scenario)+'</td>'+
        '<td class="k">检验日期</td><td>'+esc(DATA.date)+'</td></tr>'+
    '<tr><td class="k">检验依据</td><td colspan="3">'+esc(DATA.basis)+'</td>'+
        '<td class="k">规则级别</td><td>'+esc(DATA.ruleLevel)+'</td></tr>'+
  '</table>'+
  '<h2>一、检验结论</h2>'+
  '<div class="concl has-seal"><span class="lb">检验结论：</span>经检验，该产物共检出必改项 '+M+' 项、可改项 '+S+
    ' 项、存疑项 '+D+' 项，通过项 '+P+' 项。综合判定为 <b>'+esc(DATA.verdict.label)+'</b>。'+
    '<div class="note">'+esc(DATA.verdict.note)+'</div>'+
    '<div class="seal">质检专用章<br>（电子签章）</div></div>'+
  '<h2>二、结果汇总</h2>'+
  '<table class="d"><thead><tr><th style="width:92px">分层</th><th style="width:52px">数量</th>'+
    '<th style="width:150px">分布</th><th>含义</th><th style="width:96px">处置</th></tr></thead><tbody>'+
    lvRows+'<tr><td><b>合计</b></td><td style="text-align:center"><b>'+TOTAL+'</b></td><td colspan="3"></td></tr>'+
  '</tbody></table>'+
  '<h2>三、问题分布（按维度）</h2>'+
  '<table class="d"><thead><tr><th>维度</th><th style="width:52px">必改</th><th style="width:52px">可改</th>'+
    '<th style="width:52px">存疑</th><th style="width:52px">小计</th><th style="width:150px">分布</th></tr></thead><tbody>'+
    dimRows+'</tbody></table>'+
  '<h2>四、必改项明细（'+M+' 项）</h2>'+
  '<table class="d"><thead><tr><th style="width:28px">#</th><th style="width:82px">位置</th><th style="width:98px">问题</th>'+
    '<th style="width:56px">规则</th><th>原文</th><th>不改的后果</th><th style="width:120px">怎么改</th></tr></thead><tbody>'+
    DATA.must.map(r=>"<tr><td style='text-align:center'>"+esc(r.no)+"</td><td>"+esc(r.loc)+"</td><td>"+esc(r.issue)+
      "</td><td style='text-align:center'>"+esc(r.rule)+"</td><td>「"+esc(r.quote)+"」</td>"+
      "<td class='c-must'>"+esc(r.consequence)+"</td><td>"+esc(r.fix)+"</td></tr>").join("")+
  '</tbody></table>'+
  '<h2>五、可改项明细（'+S+' 项）</h2>'+
  '<table class="d"><thead><tr><th style="width:28px">#</th><th style="width:82px">位置</th><th>问题</th>'+
    '<th style="width:56px">规则</th><th>建议</th></tr></thead><tbody>'+
    DATA.should.map(r=>"<tr><td style='text-align:center'>"+esc(r.no)+"</td><td>"+esc(r.loc)+"</td><td>"+esc(r.issue)+
      "</td><td style='text-align:center'>"+esc(r.rule)+"</td><td>"+esc(r.advice)+"</td></tr>").join("")+
  '</tbody></table>'+
  '<h2>六、存疑项明细（'+D+' 项）</h2>'+
  '<table class="d"><thead><tr><th style="width:28px">#</th><th style="width:82px">位置</th><th>存疑点</th>'+
    '<th>为什么核不动</th><th style="width:130px">未确认前按什么处理</th></tr></thead><tbody>'+
    DATA.doubt.map(r=>"<tr><td style='text-align:center'>"+esc(r.no)+"</td><td>"+esc(r.loc)+"</td><td>"+esc(r.point)+
      "</td><td>"+esc(r.reason)+"</td><td>"+esc(r.action)+"</td></tr>").join("")+
  '</tbody></table>'+
  '<h2>七、已通过项（'+P+' 项）</h2>'+
  '<table class="d"><thead><tr><th style="width:86px">维度</th><th>检查项与结论</th><th style="width:46px">结果</th></tr></thead><tbody>'+
    DATA.passed.map(r=>"<tr><td>"+esc(r.dim)+"</td><td>"+esc(r.item)+"</td><td style='text-align:center'>"+dotEmoji(C.pass,11)+"</td></tr>").join("")+
  '</tbody></table>'+
  '<h2>八、下一步</h2>'+
  '<div class="concl" style="border-style:solid">'+esc(DATA.next)+'</div>'+
  '<div class="sign"><div><span>编制：</span></div><div><span>审核：</span></div><div><span>批准：</span></div></div>'+
  '<div class="decl">声明：1. 本报告仅对受检产物负责，只标注问题、不修改原文。2. 未新增任何原文不存在的事实、数字与引语。'+
    '3. 存疑项须由委托方确认后方可消除。4. 本报告不得部分摘用，复制全文须注明出处。</div>'+
  '<div class="pg">— 报告结束 —</div>'+
  '</div></div>';
}

/* ========================= B 款 ========================= */
function skinB(){
  const max = Math.max.apply(null, DATA.byDimension.map(d=>(d.must|0)+(d.should|0)+(d.doubt|0)).concat([1]));
  const dimRows = DATA.byDimension.map(d=>{
    const m=d.must|0,s=d.should|0,u=d.doubt|0,t=m+s+u;
    const mk=(n,col)=>n?'<i style="width:'+(n/max*100)+'%;background:'+col+'"></i>':'';
    return '<tr><td>'+esc(d.dim)+'</td>'+
      '<td style="width:38%"><div class="barm">'+mk(m,C.must)+mk(s,C.should)+mk(u,C.doubt)+'</div></td>'+
      '<td style="text-align:center;width:44px">'+m+'</td><td style="text-align:center;width:44px">'+s+'</td>'+
      '<td style="text-align:center;width:44px">'+u+'</td><td style="text-align:center;width:44px"><b>'+t+'</b></td></tr>';
  }).join("");
  const card=(n,l,col)=>'<div class="card" style="--cc:'+col+'"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>';
  return '<div class="sk-b"><div class="paper">'+
  '<div class="top"><div><div class="t1">AI 产物质检报告</div>'+

    '<tr><td class="k">受检产物</td><td>'+esc(DATA.product)+'</td><td class="k">模态</td><td>'+esc(DATA.modality)+'</td></tr>'+
    '<tr><td class="k">应用场景</td><td>'+esc(DATA.scenario)+'</td><td class="k">规则级别</td><td>'+esc(DATA.ruleLevel)+'</td></tr>'+
    '<tr><td class="k">检验依据</td><td colspan="3">'+esc(DATA.basis)+'</td></tr>'+
  '</table>'+
  '<div class="verdict" style="--vc:'+VC+'"><div class="vbadge">'+esc(DATA.verdict.label)+'</div>'+
    '<div class="vn">'+esc(DATA.verdict.note)+'<br>通过率 <b>'+RATE+'%</b>（已通过 '+P+' / 全部已检 '+TOTAL+' 项）</div></div>'+
  '<h2>1. 结果汇总<em>SUMMARY</em></h2>'+
  '<div class="cards">'+card(M,"必改 MUST",C.must)+card(S,"可改 SHOULD",C.should)+
    card(D,"存疑 UNVERIFIED",C.doubt)+card(P,"已通过 PASS",C.pass)+'</div>'+
  '<h2>2. 问题分布（按维度）<em>BY DIMENSION</em></h2>'+

    '<th style="text-align:center">可改</th><th style="text-align:center">存疑</th><th style="text-align:center">小计</th></tr></thead><tbody>'+
    dimRows+'</tbody></table>'+
  '<div style="font-size:11px;color:#7A8CA1;margin-top:8px">'+
    '<span class="dot" style="background:'+C.must+'"></span>必改　'+
    '<span class="dot" style="background:'+C.should+'"></span>可改　'+
    '<span class="dot" style="background:'+C.doubt+'"></span>存疑</div>'+
  '<h2>3. 必改项（'+M+'）<em>MUST FIX</em></h2>'+

    DATA.must.map(r=>"<tr><td>"+esc(r.no)+"</td><td>"+esc(r.loc)+"</td><td>"+esc(r.issue)+
      "</td><td><span class='tag'>"+esc(r.rule)+"</span></td><td>「"+esc(r.quote)+"」</td>"+
      "<td style='color:#C0392B'>"+esc(r.consequence)+"</td><td>"+esc(r.fix)+"</td></tr>").join("")+
  '</tbody></table>'+
  '<h2>4. 可改项（'+S+'）<em>SHOULD FIX</em></h2>'+

  '<h2>6. 已通过项（'+P+'）<em>PASSED</em></h2>'+
  '<table class="d"><thead><tr><th style="width:86px">维度</th><th>检查项与结论</th><th style="width:46px">结果</th></tr></thead><tbody>'+

  '<div class="ft">'+esc(DATA.publisher)+'　·　'+esc(DATA.reportNo)+'　·　第 1 页 / 共 1 页</div>'+
  '</div></div></div>';

/* ========================= C 款 ========================= */
function skinC(){
  const rows=[["必改",M,C.must],["可改",S,C.should],["存疑",D,C.doubt],["通过",P,C.pass]];
  const mx=Math.max(M,S,D,P,1);
  const bars=rows.map(r=>'<div class="barrow"><div class="blab">'+r[0]+'</div>'+
    '<div class="btrk"><div class="bfill" style="width:'+Math.max(2,Math.round(r[1]/mx*100))+'%;background:'+r[2]+'"></div></div>'+
    '<div class="bval">'+r[1]+'</div></div>').join("");
  const dmax=Math.max.apply(null,DATA.byDimension.map(d=>(d.must|0)+(d.should|0)+(d.doubt|0)).concat([1]));
  const mk=(n,col)=>n?'<i style="width:'+(n/dmax*100)+'%;background:'+col+'"></i>':'';
  const dims=DATA.byDimension.map(d=>{const m=d.must|0,s=d.should|0,u=d.doubt|0;
    return '<div class="barrow"><div class="blab">'+esc(d.dim)+'</div><div class="stack">'+
      mk(m,C.must)+mk(s,C.should)+mk(u,C.doubt)+'</div><div class="bval">'+(m+s+u)+'</div></div>';}).join("");

  '<div class="hd"><div><div class="brand">ontoAI <span>质检官</span></div>'+

  '<div class="verdict" style="--vc:'+VC+'"><div><div class="vkick">质检裁定</div>'+

  '<div class="stats">'+
    ['<div class="stat" style="--cc:'+C.must+'"><div class="n">'+M+'</div><div class="l">'+dotEmoji(C.must,9)+'必改</div></div>',
     '<div class="stat" style="--cc:'+C.should+'"><div class="n">'+S+'</div><div class="l">'+dotEmoji(C.should,9)+'可改</div></div>',
     '<div class="stat" style="--cc:'+C.doubt+'"><div class="n">'+D+'</div><div class="l">'+dotEmoji(C.doubt,9)+'存疑</div></div>',
     '<div class="stat" style="--cc:'+C.pass+'"><div class="n">'+P+'</div><div class="l">'+dotEmoji(C.pass,9)+'已通过</div></div>'].join("")+
  '</div>'+
  '<div class="panel"><h3><i></i>问题分布</h3>'+bars+'</div>'+
  '<div class="panel"><h3><i></i>问题分布（按维度）</h3>'+
    '<div class="legend"><span><em style="background:'+C.must+'"></em>必改</span>'+
    '<span><em style="background:'+C.should+'"></em>可改</span>'+
    '<span><em style="background:'+C.doubt+'"></em>存疑</span></div>'+dims+'</div>'+
  '<div class="panel"><h3><i style="background:'+C.must+'"></i>必改项 — 不改就别发</h3>'+
    '<table class="d"><thead><tr><th style="width:28px">#</th><th>位置</th><th>问题</th><th>规则</th>'+
    '<th>原文</th><th>不改的后果</th><th>怎么改</th></tr></thead><tbody>'+
    DATA.must.map(r=>"<tr><td>"+esc(r.no)+"</td><td>"+esc(r.loc)+"</td><td>"+esc(r.issue)+
      "</td><td><span class='rule'>"+esc(r.rule)+"</span></td><td class='quote'>「"+esc(r.quote)+"」</td>"+
      "<td class='cons'>"+esc(r.consequence)+"</td><td>"+esc(r.fix)+"</td></tr>").join("")+
    '</tbody></table></div>'+

    DATA.should.map(r=>"<tr><td>"+esc(r.no)+"</td><td>"+esc(r.loc)+"</td><td>"+esc(r.issue)+
      "</td><td><span class='rule'>"+esc(r.rule)+"</span></td><td>"+esc(r.advice)+"</td></tr>").join("")+
    '</tbody></table></div>'+

    '<table class="d"><thead><tr><th style="width:28px">#</th><th>位置</th><th>存疑点</th><th>为什么核不动</th><th>未确认前按什么处理</th></tr></thead><tbody>'+
    DATA.doubt.map(r=>"<tr><td>"+esc(r.no)+"</td><td>"+esc(r.loc)+"</td><td>"+esc(r.point)+

    '</tbody></table></div>'+

    '</tbody></table></div>'+

    '本报告只标注问题、不修改原文；未新增任何原文不存在的事实、数字与引语。</div>'+

  '<div class="abst"><b>摘要：</b>依据 '+esc(DATA.basis)+'，对受检产物（'+esc(DATA.modality)+'，场景 '+esc(DATA.scenario)+

    D+' 项，通过 '+P+' 项，通过率 '+RATE+'%。综合裁定：<b>'+esc(DATA.verdict.label)+'</b>。</div>'+
  '<h2>1. 结果汇总</h2>'+
  '<table class="d"><thead><tr><th>分层</th><th style="width:58px;text-align:center">数量</th>'+
    '<th style="width:150px">分布</th><th>处置</th></tr></thead><tbody>'+
    [[dotEmoji(C.must,10)+"必改",M,"改完再发"],[dotEmoji(C.should,10)+"可改",S,"可选"],[dotEmoji(C.doubt,10)+"存疑",D,"确认后处理"],[dotEmoji(C.pass,10)+"已通过",P,"—"]]
    .map(r=>"<tr><td>"+r[0]+"</td><td style='text-align:center'><b>"+r[1]+"</b></td>"+
      "<td>"+txtBar(r[1],lvMax)+"</td><td>"+r[2]+"</td></tr>").join("")+
    '</tbody></table>'+
  '<div class="cap">表 1　各分层问题数量。条形长度 ∝ 该层数量（以各层最大数量为满格）。</div>'+
  '<h2>2. 问题分布（按维度）</h2>'+
  '<table class="d"><thead><tr><th>维度</th><th style="width:58px;text-align:center">必改</th>'+
    '<th style="width:58px;text-align:center">可改</th><th style="width:58px;text-align:center">存疑</th>'+
    '<th style="width:58px;text-align:center">小计</th></tr></thead><tbody>'+dimRows+'</tbody></table>'+
  '<div class="cap">表 2　按通用维度 D1–D6 的交叉统计。</div>'+
  '<h2>3. 必改项</h2>'+
  '<table class="d"><thead><tr><th style="width:28px">#</th><th style="width:78px">位置</th><th style="width:92px">问题</th>'+
    '<th style="width:52px">规则</th><th>原文</th><th>不改的后果</th><th style="width:112px">怎么改</th></tr></thead><tbody>'+
    DATA.must.map(r=>"<tr><td>"+esc(r.no)+"</td><td>"+esc(r.loc)+"</td><td>"+esc(r.issue)+
      "</td><td class='rule'>"+esc(r.rule)+"</td><td>「"+esc(r.quote)+"」</td>"+
      "<td>"+esc(r.consequence)+"</td><td>"+esc(r.fix)+"</td></tr>").join("")+
  '</tbody></table>'+
  '<div class="cap">表 3　必改项明细。规则代号见《中文残留规则库》与《维度表》。</div>'+
  '<h2>4. 可改项</h2>'+
  '<table class="d"><thead><tr><th style="width:28px">#</th><th style="width:78px">位置</th><th>问题</th>'+
    '<th style="width:52px">规则</th><th>建议</th></tr></thead><tbody>'+
    DATA.should.map(r=>"<tr><td>"+esc(r.no)+"</td><td>"+esc(r.loc)+"</td><td>"+esc(r.issue)+
      "</td><td class='rule'>"+esc(r.rule)+"</td><td>"+esc(r.advice)+"</td></tr>").join("")+
  '</tbody></table>'+
  '<h2>5. 存疑项</h2>'+
  '<table class="d"><thead><tr><th style="width:28px">#</th><th style="width:78px">位置</th><th>存疑点</th>'+
    '<th>为什么核不动</th><th style="width:120px">未确认前按什么处理</th></tr></thead><tbody>'+
    DATA.doubt.map(r=>"<tr><td>"+esc(r.no)+"</td><td>"+esc(r.loc)+"</td><td>"+esc(r.point)+
      "</td><td>"+esc(r.reason)+"</td><td>"+esc(r.action)+"</td></tr>").join("")+
  '</tbody></table>'+
  '<h2>6. 已通过项</h2>'+
  '<table class="d"><thead><tr><th style="width:84px">维度</th><th>检查项与结论</th><th style="width:46px;text-align:center">结果</th></tr></thead><tbody>'+
    DATA.passed.map(r=>"<tr><td>"+esc(r.dim)+"</td><td>"+esc(r.item)+"</td><td style='text-align:center'>✓</td></tr>").join("")+
  '</tbody></table>'+
  '<h2>7. 处置建议</h2>'+
  '<p style="font-size:13px">'+esc(DATA.next)+'</p>'+
  '<div class="fn">注 1：本报告只标注问题、不修改原文；未新增任何原文不存在的事实、数字与引语。<br>'+
    '注 2：存疑项系因证据不足未能核实，非判定为错误，须经委托方确认后方可消除。<br>'+
    '注 3：规则代号 RZ 见《中文残留规则库》，D 见《通用维度表》，L 见《合规检查表》。</div>'+
  '</div></div>';
}

/* ========================= 装配 ========================= */
const SKINS = [
  { id:"a", name:"A · 官方检验报告", desc:"公文版式 · 宋体正文 · 红头线 · 印章位 · 签署栏", fn:skinA },
  { id:"b", name:"B · 第三方检测机构", desc:"实验室风 · 深蓝表头 · 结论徽章 · 三线统计", fn:skinB },
  { id:"c", name:"C · 现代图表", desc:"SaaS 风 · 卡片 · 条形图 · 屏幕阅读友好", fn:skinC },
  { id:"d", name:"D · 学术 / 出版", desc:"期刊风 · 衬线 · 三线表 · 表题与注释", fn:skinD }
];

const tabs = document.getElementById("tabs");
const stage = document.getElementById("stage");

/* 版式选择优先级：URL ?style=  >  DATA.style  >  默认 A 款 */
const qs = new URLSearchParams(location.search);
const pick = (qs.get("style") || DATA.style || "a").toLowerCase();
let cur = SKINS.filter(s => s.id === pick).length ? pick : "a";

function show(id){
  const s = SKINS.filter(x => x.id === id)[0];
  stage.innerHTML = '<div class="skin on" id="sk-' + id + '">' + s.fn() + '</div>';
  tabs.querySelectorAll(".tab").forEach((t,k)=>t.classList.toggle("on", SKINS[k].id === id));
}

/* 对比模式：URL 加 ?picker=1 显示款式切换条；否则为正式报告，隐藏预览外壳 */
if (qs.get("picker") === "1") {
  tabs.innerHTML = SKINS.map(s => '<button class="tab" data-id="' + s.id + '">' +
    '<b>' + s.name + '</b><small>' + s.desc + '</small></button>').join("");
  tabs.addEventListener("click", e => {
    const b = e.target.closest(".tab"); if (!b) return;
    cur = b.dataset.id; show(cur);
  });
  show(cur);
} else {
  document.querySelector(".pv-head").style.display = "none";
  document.querySelector(".pv-tip").style.display = "none";
  document.body.classList.add("formal");
  show(cur);
}
</script>
