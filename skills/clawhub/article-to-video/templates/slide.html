<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide Template</title>
    <!--
        HTML Slide Template for Article-to-Video Skill

        This template is rendered to PNG using a headless browser or Pillow.
        It supports multiple themes and content types:
        - title:     Full-screen title slide
        - content:   Heading + body text slide
        - quote:     Centered quote/highlight slide
        - code:      Code block with syntax highlighting

        Usage in create_slides.py:
            The Python script reads scenes.json and renders each scene
            using this template, replacing placeholders with scene data.
    -->
    <style>
        /* ================================================
           CSS Variables - Override via data-theme attribute
           ================================================ */
        :root {
            --bg: #1a1a2e;
            --accent: #7c3aed;
            --text: #ffffff;
            --text-muted: #a1a1aa;
            --surface: #16213e;
            --border: #2d3748;
            --font-title: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
            --font-body: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
            --font-mono: "Consolas", "Cascadia Code", monospace;
        }

        [data-theme="light"] {
            --bg: #f8f9fa;
            --accent: #7c3aed;
            --text: #1a1a2e;
            --text-muted: #6b7280;
            --surface: #ffffff;
            --border: #e5e7eb;
        }

        [data-theme="dark"] {
            --bg: #0f0f0f;
            --accent: #a78bfa;
            --text: #f8f9fa;
            --text-muted: #9ca3af;
            --surface: #1a1a1a;
            --border: #333333;
        }

        [data-theme="warm"] {
            --bg: #2d1810;
            --accent: #f59e0b;
            --text: #fef3c7;
            --text-muted: #d97706;
            --surface: #3d2418;
            --border: #5d3628;
        }

        [data-theme="ocean"] {
            --bg: #0c1e3a;
            --accent: #06b6d4;
            --text: #e0f2fe;
            --text-muted: #67e8f9;
            --surface: #102f4f;
            --border: #1e3a5f;
        }

        /* ================================================
           Base Layout - 16:9 slide (1920x1080)
           ================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1920px;
            height: 1080px;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            overflow: hidden;
        }

        .slide {
            width: 1920px;
            height: 1080px;
            position: relative;
            padding: 80px 100px;
            display: flex;
            flex-direction: column;
        }

        /* Accent bar at top */
        .accent-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: var(--accent);
        }

        /* ================================================
           Title Slide
           ================================================ */
        .slide-title {
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .slide-title h1 {
            font-size: 72px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 30px;
            max-width: 1400px;
        }

        .slide-title .subtitle {
            font-size: 36px;
            color: var(--accent);
            font-weight: 400;
        }

        .slide-title .divider {
            width: 160px;
            height: 4px;
            background: var(--accent);
            margin: 40px 0;
            border-radius: 2px;
        }

        /* ================================================
           Content Slide
           ================================================ */
        .slide-content {
            justify-content: flex-start;
        }

        .scene-number {
            font-size: 120px;
            font-weight: 800;
            color: var(--accent);
            opacity: 0.3;
            position: absolute;
            top: 60px;
            right: 100px;
            line-height: 1;
        }

        .slide-content h2 {
            font-size: 52px;
            font-weight: 700;
            margin-top: 60px;
            margin-bottom: 30px;
            color: var(--text);
        }

        .slide-content .heading-divider {
            width: 120px;
            height: 4px;
            background: var(--accent);
            margin-bottom: 40px;
            border-radius: 2px;
        }

        .slide-content .body-text {
            font-size: 36px;
            line-height: 1.6;
            color: var(--text);
            max-width: 1600px;
        }

        .slide-content .footer {
            position: absolute;
            bottom: 60px;
            left: 100px;
            font-size: 24px;
            color: var(--accent);
            font-weight: 500;
        }

        /* ================================================
           Quote Slide
           ================================================ */
        .slide-quote {
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .slide-quote .quote-mark {
            font-size: 120px;
            color: var(--accent);
            opacity: 0.3;
            margin-bottom: -40px;
        }

        .slide-quote blockquote {
            font-size: 48px;
            line-height: 1.5;
            font-style: italic;
            max-width: 1400px;
            color: var(--text);
        }

        /* ================================================
           Code Slide
           ================================================ */
        .slide-code {
            justify-content: flex-start;
        }

        .slide-code h2 {
            font-size: 44px;
            font-weight: 700;
            margin-top: 60px;
            margin-bottom: 30px;
        }

        .slide-code pre {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px 40px;
            font-family: var(--font-mono);
            font-size: 28px;
            line-height: 1.5;
            overflow: hidden;
            max-width: 1600px;
        }

        .slide-code code {
            color: var(--text);
        }
    </style>
</head>
<body>
    <!--
        Template is populated by create_slides.py:
        - {{THEME}}: light/dark/warm/ocean
        - {{TYPE}}: title/content/quote/code
        - {{HEADING}}: Scene heading text
        - {{BODY}}: Scene body text
        - {{NUMBER}}: Scene number
        - {{FOOTER}}: Footer text
    -->

    <!-- Example: Content Slide (rendered with theme=default) -->
    <div class="slide slide-content" data-theme="default">
        <div class="accent-bar"></div>
        <div class="scene-number">{{NUMBER}}</div>
        <h2>{{HEADING}}</h2>
        <div class="heading-divider"></div>
        <div class="body-text">{{BODY}}</div>
        <div class="footer">{{FOOTER}}</div>
    </div>

    <!--
        Example: Title Slide
    <div class="slide slide-title" data-theme="default">
        <div class="accent-bar"></div>
        <h1>{{TITLE}}</h1>
        <div class="divider"></div>
        <div class="subtitle">{{SUBTITLE}}</div>
    </div>
    -->

    <!--
        Example: Quote Slide
    <div class="slide slide-quote" data-theme="default">
        <div class="accent-bar"></div>
        <div class="quote-mark">"</div>
        <blockquote>{{QUOTE}}</blockquote>
    </div>
    -->

    <!--
        Example: Code Slide
    <div class="slide slide-code" data-theme="dark">
        <div class="accent-bar"></div>
        <h2>{{HEADING}}</h2>
        <pre><code>{{CODE}}</code></pre>
    </div>
    -->
</body>
</html>
