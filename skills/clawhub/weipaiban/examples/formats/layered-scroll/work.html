<section data-name="江岸夜巡" data-background="#17252B">
  <section data-type="overlay" data-elevated="true" data-name="中间固定内容层">
    <svg width="390" height="600" data-overflow="visible" data-name="固定航标">
      <image
        href="https://svg-cdn.creatby.com/67e8dd5d4bf7cd7229097390/019ddbf3a1cfd4f8e48f1c6eec0442dd11f34bdf.png_large"
        x="278"
        y="34"
        width="90"
        height="90"
        data-fit="contain"
      ></image>
    </svg>
  </section>
  <section
    data-type="scroller"
    data-scroll-direction="vertical"
    height="620"
    data-name="滑动长图内容层"
  >
    <section data-type="overlay" data-elevated="false" data-name="背景图专用层">
      <image
        href="https://svg-cdn.creatby.com/67e8dd5d4bf7cd7229097390/2d21226218402d33a1766d175d57de2094df4874.png_large"
        width="390"
        height="1170"
        data-fit="contain"
        data-name="可循环长背景-1"
      ></image>
      <image
        href="https://svg-cdn.creatby.com/67e8dd5d4bf7cd7229097390/2d21226218402d33a1766d175d57de2094df4874.png_large"
        width="390"
        height="1170"
        data-fit="contain"
        data-name="可循环长背景-2"
      ></image>
    </section>
    <section data-type="overlay" data-elevated="true" data-name="前景内容层">
      <svg
        width="390"
        height="600"
        data-overflow="visible"
        data-name="窗棂前景"
      >
        <g
          data-type="animationGroup"
          data-mode="autoplay"
          data-trigger="load"
          data-name="窗棂入场"
        >
          <image
            href="https://svg-cdn.creatby.com/67e8dd5d4bf7cd7229097390/e0aaf2ba7d33fad7e0e6bd38278ba5d83af25d39.png_large"
            x="0"
            y="0"
            width="220"
            height="600"
            data-fit="contain"
            opacity="0"
            data-editor-visible="true"
          >
            <animate
              data-preset="左滑渐现"
              data-trigger="load"
              data-duration="0.7"
            ></animate>
          </image>
        </g>
      </svg>
      <svg
        data-type="clickPopup"
        width="390"
        height="520"
        data-name="场景探索"
        data-effect="zoom"
        data-button-effect="blink"
      >
        <g data-role="base" data-name="码头底图">
          <image
            href="https://svg-cdn.creatby.com/67e8dd5d4bf7cd7229097390/e0aaf2ba7d33fad7e0e6bd38278ba5d83af25d39.png_large"
            x="0"
            y="0"
            width="390"
            height="520"
            data-fit="cover"
          ></image>
          <rect
            x="20"
            y="20"
            width="300"
            height="44"
            fill="#21373D"
            opacity="0.9"
          ></rect>
          <text
            x="34"
            y="31"
            width="272"
            height="24"
            fill="#E8DFC8"
            font-size="14"
          >
            点亮航标，看两处码头细节 ›
          </text>
        </g>
        <g data-type="clickPopupGroup" data-name="旧码头">
          <image
            data-role="open"
            href="https://svg-cdn.creatby.com/87703fa265d63e51ace59bba88e0dfc1815254e0.png"
            x="48"
            y="246"
            width="72"
            height="72"
            data-fit="contain"
          ></image>
          <image
            data-role="close"
            href="https://svg-cdn.creatby.com/28498232ef90fc3f5a5e24097dd6c99469022319.png"
            x="308"
            y="50"
            width="50"
            height="50"
            data-fit="contain"
          ></image>
          <g data-role="content" data-name="旧码头卡片">
            <rect x="24" y="48" width="342" height="418" fill="#21373D"></rect>
            <image
              href="https://svg-cdn.creatby.com/67e8dd5d4bf7cd7229097390/93c19eefa547172bee902b6a8b0c7e5c25aa3566.png_large"
              x="40"
              y="82"
              width="310"
              height="200"
              data-fit="cover"
            ></image>
            <foreignObject x="40" y="306" width="292" height="120">
              <section
                style="color: #e8dfc8; font-size: 14px; line-height: 1.65"
              >
                <p style="margin: 0; font-weight: 700">旧码头</p>
                <p style="margin: 8px 0 0; color: #b8c7be">
                  潮痕留在石阶上，标出一天里江水抵达过的最高处。
                </p>
              </section>
            </foreignObject>
          </g>
        </g>
        <g data-type="clickPopupGroup" data-name="新渡口">
          <image
            data-role="open"
            href="https://svg-cdn.creatby.com/87703fa265d63e51ace59bba88e0dfc1815254e0.png"
            x="270"
            y="324"
            width="72"
            height="72"
            data-fit="contain"
          ></image>
          <image
            data-role="close"
            href="https://svg-cdn.creatby.com/28498232ef90fc3f5a5e24097dd6c99469022319.png"
            x="308"
            y="50"
            width="50"
            height="50"
            data-fit="contain"
          ></image>
          <g data-role="content" data-name="新渡口卡片">
            <rect x="24" y="48" width="342" height="418" fill="#21373D"></rect>
            <image
              href="https://svg-cdn.creatby.com/67e8dd5d4bf7cd7229097390/93c19eefa547172bee902b6a8b0c7e5c25aa3566.png_large"
              x="40"
              y="82"
              width="310"
              height="200"
              data-fit="cover"
            ></image>
            <foreignObject x="40" y="306" width="292" height="120">
              <section
                style="color: #e8dfc8; font-size: 14px; line-height: 1.65"
              >
                <p style="margin: 0; font-weight: 700">新渡口</p>
                <p style="margin: 8px 0 0; color: #b8c7be">
                  灯带贴着水线延伸，让夜归的人在转弯前先看见岸。
                </p>
              </section>
            </foreignObject>
          </g>
        </g>
      </svg>
    </section>
    <section data-name="背景内容层">
      <svg width="390" height="600" data-name="开场">
        <image
          href="https://svg-cdn.creatby.com/67e8dd5d4bf7cd7229097390/019ddbf3a1cfd4f8e48f1c6eec0442dd11f34bdf.png_large"
          x="150"
          y="92"
          width="220"
          height="220"
          data-fit="contain"
          opacity="0.72"
        ></image>
        <rect
          x="26"
          y="350"
          width="338"
          height="204"
          fill="#21373D"
          rx="0"
        ></rect>
        <rect x="26" y="350" width="72" height="4" fill="#C9664A"></rect>
        <foreignObject x="44" y="382" width="302" height="142">
          <section style="color: #e8dfc8; font-size: 15px; line-height: 1.7">
            <p
              style="
                margin: 0;
                font-size: 30px;
                font-weight: 800;
                line-height: 1.25;
              "
            >
              江岸夜巡
            </p>
            <p style="margin: 14px 0 0; color: #b8c7be">
              航标停在眼前，江面与窗棂跟着手指向夜色深处移动。
            </p>
          </section>
        </foreignObject>
      </svg>
      <svg width="390" height="520" data-name="场景探索占位">
        <rect
          x="0"
          y="0"
          width="390"
          height="520"
          fill="#17252B"
          opacity="0"
        ></rect>
      </svg>
      <section
        data-type="slideshow"
        data-name="沿途图集"
        data-effect="fade"
        data-duration="2"
        data-delay="1"
        height="520"
      >
        <img
          src="https://svg-cdn.creatby.com/67e8dd5d4bf7cd7229097390/e0aaf2ba7d33fad7e0e6bd38278ba5d83af25d39.png_large"
          data-title="沿江灯影"
        />
        <img
          src="https://svg-cdn.creatby.com/67e8dd5d4bf7cd7229097390/e0aaf2ba7d33fad7e0e6bd38278ba5d83af25d39.png_large"
          data-title="桥下潮声"
        />
        <img
          src="https://svg-cdn.creatby.com/67e8dd5d4bf7cd7229097390/e0aaf2ba7d33fad7e0e6bd38278ba5d83af25d39.png_large"
          data-title="渡口归帆"
        />
      </section>
      <svg width="390" height="72" data-name="沿途图注">
        <text
          x="24"
          y="22"
          width="342"
          height="24"
          fill="#B8C7BE"
          font-size="12"
          data-align="center"
        >
          同一条江岸，三处夜里的方向。
        </text>
      </svg>
      <svg width="390" height="220" data-name="带走">
        <image
          href="https://svg-cdn.creatby.com/67e8dd5d4bf7cd7229097390/019ddbf3a1cfd4f8e48f1c6eec0442dd11f34bdf.png_large"
          x="24"
          y="24"
          width="150"
          height="150"
          data-fit="contain"
          opacity="0.68"
        ></image>
        <foreignObject x="150" y="62" width="210" height="104">
          <section
            style="
              color: #e8dfc8;
              font-size: 24px;
              font-weight: 800;
              line-height: 1.35;
            "
          >
            把江声带回去。
          </section>
        </foreignObject>
      </svg>
      <svg width="390" height="40" data-name="AI声明">
        <text
          x="20"
          y="10"
          width="350"
          height="20"
          fill="#B8C7BE"
          font-size="12"
          data-align="center"
        >
          文章部分内容由AI辅助设计和制作
        </text>
      </svg>
    </section>
  </section>
</section>
