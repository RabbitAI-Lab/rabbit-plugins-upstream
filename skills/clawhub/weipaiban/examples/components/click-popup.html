<section data-name="月下团圆" data-background="#FAF8F2">
  <section data-type="richText" data-name="01 版首">
    <section style="padding: 32px 10px 8px; text-align: center">
      <span
        style="
          display: inline-block;
          font-size: 11px;
          letter-spacing: 4px;
          color: #4a5d52;
        "
        >节气 · 中秋特刊</span
      >
      <p
        style="
          margin: 8px 0 0;
          font-size: 12px;
          color: #7b8479;
          letter-spacing: 1px;
        "
      >
        约 400 字 · 2 分钟
      </p>
    </section>
  </section>
  <section data-type="richText" data-name="02 钩子">
    <section style="padding: 8px 10px 16px; text-align: center">
      <p
        style="
          margin: 0;
          font-size: 16px;
          line-height: 2;
          color: #4f5b52;
          letter-spacing: 0.5px;
        "
      >
        院子里两处亮着。点开才知道是谁还没睡。
      </p>
    </section>
  </section>
  <svg
    data-type="clickPopup"
    width="390"
    height="520"
    data-name="05 弹窗"
    data-effect="zoom"
    data-button-effect="blink"
  >
    <g data-role="base" data-name="底图">
      <image
        href="https://svg-cdn.creatby.com/67e8dd5d4bf7cd7229097390/e0aaf2ba7d33fad7e0e6bd38278ba5d83af25d39.png_large"
        x="0"
        y="0"
        width="390"
        height="520"
        data-fit="cover"
      ></image>
      <text x="24" y="24" width="342" height="24" fill="#FAF8F2" font-size="14">
        点击热点看细节 ›
      </text>
    </g>
    <g data-type="clickPopupGroup" data-name="热点-窗">
      <image
        data-role="open"
        href="https://svg-cdn.creatby.com/87703fa265d63e51ace59bba88e0dfc1815254e0.png"
        x="48"
        y="220"
        width="72"
        height="72"
        data-fit="contain"
      ></image>
      <image
        data-role="close"
        href="https://svg-cdn.creatby.com/28498232ef90fc3f5a5e24097dd6c99469022319.png"
        x="170"
        y="36"
        width="50"
        height="50"
        data-fit="contain"
      ></image>
      <g data-role="content" data-name="窗前">
        <rect x="24" y="80" width="342" height="360" rx="16" fill="#2C3330" />
        <image
          href="https://svg-cdn.creatby.com/67e8dd5d4bf7cd7229097390/e0aaf2ba7d33fad7e0e6bd38278ba5d83af25d39.png_large"
          x="40"
          y="96"
          width="310"
          height="200"
          data-fit="cover"
        ></image>
        <foreignObject x="40" y="308" width="310" height="112">
          <section style="color: #faf8f2; font-size: 14px; line-height: 1.7">
            <p style="margin: 0; font-weight: 700">窗还亮着</p>
            <p style="margin: 8px 0 0">灯没关的人，多半在等一桌晚到的饭。</p>
          </section>
        </foreignObject>
      </g>
    </g>
    <g data-type="clickPopupGroup" data-name="热点-桌">
      <image
        data-role="open"
        href="https://svg-cdn.creatby.com/87703fa265d63e51ace59bba88e0dfc1815254e0.png"
        x="270"
        y="300"
        width="72"
        height="72"
        data-fit="contain"
      ></image>
      <image
        data-role="close"
        href="https://svg-cdn.creatby.com/28498232ef90fc3f5a5e24097dd6c99469022319.png"
        x="170"
        y="36"
        width="50"
        height="50"
        data-fit="contain"
      ></image>
      <g data-role="content" data-name="饭桌">
        <image
          href="https://svg-cdn.creatby.com/67e8dd5d4bf7cd7229097390/e0aaf2ba7d33fad7e0e6bd38278ba5d83af25d39.png_large"
          x="0"
          y="0"
          width="390"
          height="520"
          data-fit="contain"
        ></image>
      </g>
    </g>
  </svg>
  <section data-type="richText" data-name="09 END">
    <section style="padding: 16px 10px 8px; text-align: center">
      <section
        style="
          width: 40px;
          height: 1px;
          background: #4a5d52;
          margin: 0 auto 16px;
        "
      ></section>
      <p
        style="
          margin: 0;
          font-size: 16px;
          line-height: 2;
          color: #4f5b52;
          letter-spacing: 0.5px;
        "
      >
        灯还亮着，路就还在。
      </p>
    </section>
  </section>
  <section data-type="richText" data-name="AI 声明">
    <section style="padding: 16px 10px 32px; text-align: center">
      <p style="margin: 0; font-size: 12px; color: #7b8479; line-height: 1.5">
        文章部分内容由AI辅助设计和制作
      </p>
    </section>
  </section>
</section>
