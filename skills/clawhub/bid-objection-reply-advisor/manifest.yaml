name: bid-objection-reply-advisor
slug: bid-objection-reply-advisor
display_name: 招投标异议答复辅助（招标人版）
emoji: 🛡️
version: 1.1.0
version_stage: ga
author: "一线评标专家&ChesaraM"
license: MIT-0
agent_created: true
description: 招投标异议答复辅助（招标人版·内部代号"招盾"）——依法必须招标的招投标项目中，招标人/招标代理机构收到投标人或其他利害关系人异议后，依法受理登记、判断异议是否成立、生成纠正/驳回/切割答复、预判投诉风险与投诉阶段应对的内部合规辅助助手。触发词："异议答复""异议怎么回""评标结果异议""招标文件异议""开标异议""招标人答复异议""异议成立不成立""异议投诉风险"。提供《异议书》+招标文件要求起草/审核异议答复时触发。不适用：投标人侧异议/投诉文书起草、评标打分、合同审查、招标文件编制、政府采购质疑（请使用「政采质疑答复辅助（政采盾牌）」）。
triggers:
- 异议答复 / 异议怎么回 / 评标结果异议 / 招标文件异议
- 开标异议 / 招标人答复异议 / 异议成立不成立 / 异议投诉风险
- 工程招标异议 / 依法必招异议 / 招标人异议受理
feedback:
  channel: GitHub Issues
  account: chesaram/my-skill-hub
  note: 使用问题、误报反馈、实务建议，欢迎通过项目仓库提交 Issue 反馈
changelog:
- version: 1.1.0
  date: 2026-07-26
  change: 安全合规重构（吸收外部评审 SSD-4 反馈）：①删除原"四·五·1 向下游投标人侧技能的数据共享"整段及 Objection_ID/Sustain_Status/Rejection_Legal_Basis/Weak_Defense_Points 中"用途=辅助攻击者"的进攻性情报语义，内部 JSON 改为纯守方自用质量记录，明确"任何内部记录仅限本机构自用、不流向投标人侧技能、不用于对抗或投诉策略"；②将"攻击预判识别（镜像联动）""二阶博弈"重构为"投诉风险预判识别（基于异议书论证）""投诉阶段应对预案"，去除针对对手 AI 的二阶博弈与镜像联动设定；③边界"镜像联动"改为"不联动任何投标人侧起草类技能，避免对抗性情报闭环"；④修复"四·五"编号并入正常章节体系（现第五节）；⑤按跨平台发布规范移除 SKILL.md 强制署名注入指令（署名/反馈改以 manifest 字段为准）；⑥版本号与 SKILL.md/_meta 对齐至 1.1.0。
- version: 1.0.3
  date: 2026-07-26
  change: 交叉触发校验加固：①开头定位引语加"法域自检（防误激活）"；②「八、边界与联动」加"交叉路由（与政采盾牌互锁）"；③triggers 加招投标差异化词（工程招标异议/依法必招异议/招标人异议受理）；④description 反向声明不适用政府采购质疑（路由政采盾牌）。防止"质疑/异议"用词混淆导致套错法律体系（3日/实施条例 vs 7工作日/94号令）。
- version: 1.0.2
  date: 2026-07-26
  change: 吸收外部评审补丁：①新增「异议受理判断标尺」（触发3日倒计时的边界界定，明确可识别异议立即启动倒计时、补正并行不中止）；②新增「四·五 输出交接物与内部质量记录」（内部JSON+KB回填建议）；③微调1答复要素精确引用（实施条例第22/44/54条程序要求+七部委11号令第7条投诉书要素）；④微调2修正4d实体应对法条——评审误引实施条例第73条（实为不按规定确定中标人），更正为第70条（评委会组建/更换违规·重新评审）+第71条（评委会成员违规处罚）+第78条（专家不良行为记录）。
- version: 1.0.1
  date: 2026-07-26
  change: 修复法条误引：技能将"行政监督部门处理投诉30个工作日"错引为七部委11号令第25条（实为行政复议/诉讼条款），更正为第21条。涉及 SKILL.md 三处、回归实测与用例集对应处。
- version: 1.0.0
  date: 2026-07-26
  change: GA 初版。九铁律（3日答复红线·日历日/答复前暂停/答复要素/商业秘密保密/禁拖延/法条必引/风险预判/KB锚定/安全护栏）；四库挂载（招投标实务7463402595160740为主+异议投诉7480160395744474+招标文件汇集7439473860155957+政采库7463496212028405补充）；五步工作流（受理多时钟+防守拆解三重校验+切割+异议答复函+投诉预判）；因果校验分实体/程序两类；补异议提出时限四分型（招标文件10日/资格预审2日/开标当场/评标结果公示期）+七部委11号令第21条30工作日投诉处理；10例验收红线。基于5个真实/准真实异议场景回归全数通过（铁律2暂停、铁律13日日历日、程序违法从紧、商业秘密屏蔽、部分成立切割）。
