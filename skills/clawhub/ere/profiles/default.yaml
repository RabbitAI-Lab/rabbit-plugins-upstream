# Editorial Refinement Engine — Perfis Editoriais
#
# Cada perfil define o comportamento dos motores de refinamento.
# O perfil "default" é usado quando nenhum é especificado.

default:
  style: journalistic        # journalistic | technical | corporate | academic | minimalist | creative
  tone: neutral              # neutral | formal | informal | enthusiastic | authoritative
  verbosity: medium          # low | medium | high
  humor: false               # true | false
  opinion_level: low         # none | low | medium | high
  paragraph_size: medium     # short | medium | long
  sentence_length: mixed     # short | medium | long | mixed
  seo: false                 # true | false (SEO optimization)
  language: pt-BR            # pt-BR | en | es
  refinement_level: 60       # 0-100: 0=minimal, 50=moderate, 100=deep rewrite
  engines:
    style: true
    structure: true
    rhythm: true
    lexical: true
    connectors: true
    context: true        # enrich with context (never fabricate)
    intro: true          # vary introductions
  fact_preservation:
    entity_lock: true    # freeze names, numbers, dates
    quote_protect: true  # preserve literal quotes
    claim_extract: false # extract verifiable claims (adds latency)

