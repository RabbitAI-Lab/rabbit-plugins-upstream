    name: "Bid-Contract Consistency Review"
    display_name: "Bid-Contract Consistency Review"
    description: "Reviews a draft contract against the tender documents and the winning bidder's bid response, detecting substantive deviations (yin-yang/black-white contracts, concealed concessions, wording games) and outputting an auditable compliance report. Cross-validates against IMA knowledge bases for legal-effectiveness, with built-in TC1–TC9 regression tests."
    version: "1.1.0"
    author: "ChesaraM"
    license: "MIT-0"
    emoji: "⚖️"
